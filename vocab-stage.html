<script>
"use strict";
window.__bootStage = function(){
const THREE = window.THREE;

/* ── 内置兼容层：颜色空间 / 轨道控制 / 标签投射（零插件依赖，任意 three 版本可用）── */
const SRGB = t => { if('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace;
  else t.encoding = THREE.sRGBEncoding; return t; };
function OrbitLite(camera, dom){
  const self = this;
  this.target = new THREE.Vector3();
  this.enabled = true; this.enablePan = false;
  this.enableDamping = true; this.dampingFactor = .08;
  this.minDistance = 1; this.maxDistance = 100;
  this.minPolarAngle = .05; this.maxPolarAngle = Math.PI - .05;
  this.minAzimuthAngle = -Infinity; this.maxAzimuthAngle = Infinity;
  this.autoRotate = false; this.autoRotateSpeed = .4;
  this.onStart = null; this.onEnd = null;
  let drag = false, pinching = false, px = 0, py = 0, pd = 0;
  let pdx = 0, pdy = 0, lz = 0;
  dom.addEventListener('pointerdown', e => { if(!self.enabled) return;
    drag = true; px = e.clientX; py = e.clientY; if(self.onStart) self.onStart(); });
  addEventListener('pointermove', e => { if(!drag || !self.enabled || pinching) return;
    pdx += e.clientX - px; pdy += e.clientY - py; px = e.clientX; py = e.clientY; });
  addEventListener('pointerup', () => { if(drag){ drag = false; if(self.onEnd) self.onEnd(); } });
  dom.addEventListener('wheel', e => { if(!self.enabled) return; e.preventDefault();
    lz += e.deltaY > 0 ? .25 : -.25; }, { passive:false });
  dom.addEventListener('touchstart', e => { if(e.touches.length === 2){ pinching = true;
    pd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); } }, { passive:true });
  dom.addEventListener('touchmove', e => { if(!self.enabled || !pinching) return;
    if(e.touches.length === 2){ e.preventDefault();
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if(pd) lz += (pd - d) * .01; pd = d; } }, { passive:false });
  dom.addEventListener('touchend', e => { if(e.touches.length < 2) pinching = false; }, { passive:true });
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  this.update = function(){
    if(!self.enabled) return;
    const o = camera.position.clone().sub(self.target);
    let r = o.length() || 1;
    let th = Math.atan2(o.x, o.z);
    let ph = Math.acos(clamp(o.y / r, -1, 1));
    if(self.autoRotate && !drag) th += self.autoRotateSpeed * .00175;
    const ux = pdx * .2, uy = pdy * .2, uz = lz * .18;
    pdx -= ux; pdy -= uy; lz -= uz;
    th -= ux * .005; ph -= uy * .005; r *= Math.exp(uz * .35);
    th = clamp(th, self.minAzimuthAngle, self.maxAzimuthAngle);
    ph = clamp(ph, self.minPolarAngle, self.maxPolarAngle);
    r = clamp(r, self.minDistance, self.maxDistance);
    camera.position.set(
      self.target.x + r * Math.sin(ph) * Math.sin(th),
      self.target.y + r * Math.cos(ph),
      self.target.z + r * Math.sin(ph) * Math.cos(th));
    camera.lookAt(self.target);
  };
}
function LabelLayer(container){
  const items = [], v = new THREE.Vector3();
  this.add = function(host, x, y, z, el){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;left:0;top:0;will-change:transform';
    wrap.appendChild(el); container.appendChild(wrap);
    items.push({ host, off:new THREE.Vector3(x, y, z), wrap });
    return wrap;
  };
  this.render = function(camera){
    for(const it of items){
      v.copy(it.off).applyMatrix4(it.host.matrixWorld).project(camera);
      if(v.z >= 1){ it.wrap.style.visibility = 'hidden'; continue; }
      it.wrap.style.visibility = 'visible';
      it.wrap.style.transform = 'translate(-50%,-50%) translate('
        + ((v.x * .5 + .5) * innerWidth).toFixed(1) + 'px,'
        + ((-v.y * .5 + .5) * innerHeight).toFixed(1) + 'px)';
    }
  };
}

/* ═══════════ 配置区（John 可改）═══════════

/* ═══════════ 程序化贴图（与城堡页同一套画笔）═══════════ */
function canvasTex(w, h, painter){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  painter(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  SRGB(t);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function jitter(base, amt){
  const [h,s,l] = base;
  return `hsl(${h + (Math.random()-.5)*amt*2},${s + (Math.random()-.5)*8}%,${l + (Math.random()-.5)*amt}%)`;
}
function speckle(ctx,w,h,n,col,a){
  ctx.globalAlpha = a;
  for(let i=0;i<n;i++){ ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(Math.random()*w, Math.random()*h, 1+Math.random()*2.5, 1+Math.random()*1.5, Math.random()*3, 0, 7);
    ctx.fill(); }
  ctx.globalAlpha = 1;
}
function stoneTexture(hsl=[42,38,82]){
  return canvasTex(256,256,(ctx,w,h)=>{
    ctx.fillStyle = `hsl(${hsl[0]},${hsl[1]}%,${hsl[2]}%)`; ctx.fillRect(0,0,w,h);
    const bh = 26;
    for(let row=0; row*bh<h+bh; row++){
      const off = row%2 ? 34 : 0;
      for(let x=-68+off; x<w; x+=68){
        const bw = 60 + Math.random()*8;
        ctx.fillStyle = jitter(hsl, 5);
        ctx.beginPath(); ctx.roundRect(x+2, row*bh+2, bw, bh-4, 4); ctx.fill();
        ctx.strokeStyle = `hsla(${hsl[0]},30%,40%,.28)`; ctx.lineWidth = 1.6; ctx.stroke();
      }
    }
    speckle(ctx,w,h,140,'#8a7448',.10);
    speckle(ctx,w,h,90,'#fffbe8',.14);
    const g = ctx.createLinearGradient(0,h*.55,0,h);
    g.addColorStop(0,'rgba(90,60,28,0)'); g.addColorStop(1,'rgba(90,60,28,.30)');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  });
}
function grassTexture(){
  return canvasTex(256,256,(ctx,w,h)=>{
    ctx.fillStyle = 'hsl(82,42%,56%)'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<46;i++){ ctx.globalAlpha=.16; ctx.fillStyle = jitter([82,46,52],14);
      ctx.beginPath(); ctx.ellipse(Math.random()*w,Math.random()*h,14+Math.random()*30,10+Math.random()*18,Math.random()*3,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    speckle(ctx,w,h,260,'hsl(75,55%,70%)',.30);
    speckle(ctx,w,h,140,'hsl(95,40%,38%)',.22);
  });
}
function woodTexture(){
  return canvasTex(256,256,(ctx,w,h)=>{
    ctx.fillStyle = 'hsl(28,42%,46%)'; ctx.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=32){
      ctx.fillStyle = jitter([28,42,44],6);
      ctx.fillRect(0,y+1,w,30);
      ctx.strokeStyle='rgba(70,40,14,.5)'; ctx.lineWidth=2;
      ctx.strokeRect(-2,y+1,w+4,30);
      for(let i=0;i<4;i++){ ctx.strokeStyle='rgba(70,40,14,.25)'; ctx.lineWidth=1;
        const yy=y+6+Math.random()*20; ctx.beginPath(); ctx.moveTo(0,yy);
        ctx.bezierCurveTo(w*.3,yy+3,w*.6,yy-3,w,yy); ctx.stroke(); }
    }
  });
}

/* ═══════════ 基础设施 ═══════════ */
const app = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias:true });
const isMobile = matchMedia('(max-width:680px)').matches || 'ontouchstart' in window;
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile?1.5:2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !isMobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
if('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
else renderer.outputEncoding = THREE.sRGBEncoding;
if('useLegacyLights' in renderer) renderer.useLegacyLights = false;
else if('physicallyCorrectLights' in renderer) renderer.physicallyCorrectLights = true;
app.appendChild(renderer.domElement);
const labelLayer = new LabelLayer(document.getElementById('labels'));

const scene = new THREE.Scene();
scene.background = new THREE.Color('#F5EDD8');
scene.fog = new THREE.Fog('#F5EDD8', 20, 44);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, .1, 100);
camera.position.set(0, 1.7, 14.5);                       // 起点：刚穿过城门

const controls = new OrbitLite(camera, renderer.domElement);
controls.target.set(0, 1.5, -.5);
controls.enableDamping = true; controls.dampingFactor = .07;
controls.enablePan = false;
controls.minDistance = 6.5; controls.maxDistance = 12.5;
controls.minPolarAngle = .95; controls.maxPolarAngle = 1.6;
controls.minAzimuthAngle = -.65; controls.maxAzimuthAngle = .65;
controls.enabled = false;                                 // 走入动画结束后启用
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// 黄昏光 + 灯笼暖光（第一视角的氛围核心）
scene.add(new THREE.HemisphereLight('#FFE8C0', '#C9A06A', .9));
const sun = new THREE.DirectionalLight('#FFD9A0', 1.5);
sun.position.set(10, 14, -12);
sun.castShadow = !isMobile;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-14; sun.shadow.camera.right=14;
sun.shadow.camera.top=14; sun.shadow.camera.bottom=-14;
scene.add(sun);

const mat = (c,r=.9)=>new THREE.MeshStandardMaterial({ color:c, roughness:r });
function texMat(tex, rx, ry){ const t=tex(); t.repeat.set(rx,ry);
  return new THREE.MeshStandardMaterial({ map:t, roughness:.95 }); }
function M(geo, m, x=0,y=0,z=0){
  const o = new THREE.Mesh(geo, m);
  o.position.set(x,y,z); o.castShadow = true; o.receiveShadow = true;

/* ═══════════ 交互 ═══════════ */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const clickables = [...charGroups, sign, board];
let hotG = null, downXY = null;
function pick(e){
  const x = e.clientX ?? e.changedTouches?.[0]?.clientX;
  const y = e.clientY ?? e.changedTouches?.[0]?.clientY;
  ptr.x = (x/innerWidth)*2-1; ptr.y = -(y/innerHeight)*2+1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(clickables, true)[0];
  if(!hit) return null;
  let o = hit.object;
  while(o && !o.userData.kind) o = o.parent;
  return o;
}
function setHot(g){
  if(hotG === g) return;
  if(hotG && hotG.userData.label) hotG.userData.label.classList.remove('hot');
  hotG = g;
  if(g && g.userData.label) g.userData.label.classList.add('hot');
  document.body.style.cursor = g ? 'pointer' : '';
}
if(matchMedia('(hover:hover)').matches)
  addEventListener('pointermove', e=>setHot(pick(e)));
addEventListener('pointerdown', e=>{ downXY=[e.clientX,e.clientY]; });
addEventListener('pointerup', e=>{
  if(!downXY) return;
  const moved = Math.hypot(e.clientX-downXY[0], e.clientY-downXY[1]);
  downXY = null;
  if(moved > 7) return;
  if(e.target.closest('.dlg-card,.quick-nav,.hud-top')) return;
  const g = pick(e);
  if(!g){ closeDialog(); return; }
  if(g.userData.kind==='char') openDialog(g);
  else toggleBoard();
});

// 云朵快捷按钮（保底导航）
const QN = [
  ...CHARS.map(c=>({ t:`${c.icon} ${c.label}`, f:()=>openDialog(charGroups[CHARS.indexOf(c)]) })),
  { t:'🏆 大神榜', f:toggleBoard },
  { t:'📖 直接进训练', f:()=>navigate('vocab.html') },
];
document.getElementById('quickNav').innerHTML = QN.map(q=>`<button class="qbtn">${q.t}</button>`).join('');
document.querySelectorAll('.qbtn').forEach((b,i)=>{
  b.style.animationDelay = (i*.28)+'s';
  b.addEventListener('click', ()=>QN[i].f());
});

/* ═══════════ 走入动画 + 渲染循环 ═══════════ */
const clock = new THREE.Clock();
const easeIO = t => t*t*(3-2*t);
let intro = { done:reduceMotion, t0:0 };
if(reduceMotion){ camera.position.set(0, 1.7, 9.2); controls.enabled = true; }
let fr = 0;
function loop(){
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  if(!intro.done){
    if(!intro.t0) intro.t0 = t;
    const k = Math.min((t-intro.t0)/1.9, 1);
    const e = easeIO(k);
    camera.position.set(Math.sin(t*5.6)*.04*(1-e), 1.7 + Math.sin(t*5.6)*.035*(1-e), 14.5 - 5.3*e);
    camera.lookAt(0, 1.5, -.5);
    if(k>=1){ intro.done = true; controls.enabled = true; }
  } else controls.update();
  // 角色：呼吸、上前、开心跳、挥手
  charGroups.forEach(g=>{
    const u = g.userData;
    const jump = Math.max(0, Math.sin(Math.min((t-u.jumpT)*5.5, Math.PI))) * .38;
    g.position.y = u.baseY + Math.sin(t*1.8+u.ph)*.03 + jump;
    g.position.z += (u.tz - g.position.z)*.1;
    const waving = (hotG===g || selChar===g);
    const target = waving ? (-2.3 + Math.sin(t*9)*.3) : -0.08;
    u.armR.rotation.z += (target - u.armR.rotation.z)*.18;
    u.armL.rotation.x = Math.sin(t*1.8+u.ph)*.07;
  });
  // 大神榜升降 + 悬挂摇摆
  if(lbState.mode==='drop'){
    const p = Math.min((t-lbState.t0)/1.15, 1);
    board.position.y = 14 - 14*easeBack(p);
    if(p>=1) lbState.mode='down';
  } else if(lbState.mode==='rise'){
    const p = Math.min((t-lbState.t0)/.8, 1);
    board.position.y = 14*easeIO(p);
    if(p>=1){ lbState.mode='up'; setCharLabels(true); }
  } else if(lbState.mode==='down'){
    board.position.y = Math.sin(t*.9)*.06;
    board.rotation.z = Math.sin(t*1.3)*.03;
  }
  // 灯笼烛光摇曳
  if(!reduceMotion) glowMats.forEach((m,i)=>{ m.emissiveIntensity = .95 + Math.sin(t*6.5+i*2)*.12; });
  if(isMobile && (fr++ & 1)) return;
  renderer.render(scene, camera);
  labelLayer.render(camera);
}
loop();
window.__stageReady = true;
setTimeout(()=>{
  const l = document.getElementById('loading');
  l.style.opacity = 0; setTimeout(()=>l.remove(), 500);
  const fx = document.getElementById('enterFx');           // 推门而入的光感渐显
  fx.style.opacity = 0; setTimeout(()=>fx.remove(), 1000);
}, 350);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
};
</script>

// ── 引擎加载器 v3：本地优先 → 实测验证过的 CDN；全程可视进度 + 逃生入口 ──
(function(){
  var urls = [
    'libs/three/three.min.js',
    'https://registry.npmmirror.com/three/0.149.0/files/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js',
    'https://cdn.bootcdn.net/ajax/libs/three.js/0.149.0/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js',
    'https://unpkg.com/three@0.149.0/build/three.min.js'
  ];
  var i = 0, st = document.querySelector('#loading .ls');
  function fail(){ location.replace('vocab.html'); }
  function boot(){ try{ window.__bootStage(); }catch(e){ console.error(e); fail(); } }
  function next(){
    if(window.THREE){ boot(); return; }
    if(i >= urls.length){ fail(); return; }
    var u = urls[i++];
    if(st) st.textContent = '正在搭建舞台 · 线路 ' + i + '/' + urls.length + ' · v3';
    var s = document.createElement('script'), done = false;
    var tm = setTimeout(function(){ if(done) return; done = true; next(); }, 4000);
    s.onload = function(){ if(done) return; done = true; clearTimeout(tm);
      window.THREE ? boot() : next(); };
    s.onerror = function(){ if(done) return; done = true; clearTimeout(tm); next(); };
    s.src = u; document.head.appendChild(s);
  }
  setTimeout(function(){
    if(!window.THREE && st && !document.getElementById('escGo')){
      var a = document.createElement('div'); a.style.marginTop = '10px';
      a.innerHTML = '<a id="escGo" href="vocab.html" style="color:#C85A2A;font-weight:600;font-size:12px;text-decoration:none">加载偏慢？点此直接进入 →</a>';
      st.parentNode.appendChild(a);
    }
  }, 6000);
  next();
})();
</script>
