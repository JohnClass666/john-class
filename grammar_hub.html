<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>语法提升 · John Class</title>
<style>
:root{
  --bg:#FBF6EC;--bg2:#F0E2C4;--bg3:#F6EEDC;
  --ink:#2A1D08;--soft:#8C6B35;--faint:#C2A26C;
  --hair:#E2D0A4;--accent:#AD7A1E;--accent-deep:#7A5414;--accent-soft:#F5E8C8;
  --warn:#C2491E;--warn-soft:#FAEEE8;
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-pill:999px;
  --shadow-sm:0 1px 2px rgba(40,24,5,.10);
  --shadow-md:0 3px 10px rgba(40,24,5,.12);
  --shadow-lg:0 10px 28px rgba(40,24,5,.16);
  --fnt:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --fnt-display:Georgia,"Songti SC","STSong",serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--fnt);color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

.photo{position:relative;width:100%;height:56vw;min-height:240px;max-height:380px;overflow:hidden;background:var(--bg2)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.photo::after{content:'';position:absolute;left:0;right:0;bottom:0;height:90px;
  background:linear-gradient(to bottom,transparent,var(--bg))}
.photo-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--accent-soft),var(--accent));color:#FFF8E8;
  font-family:var(--fnt-display);font-size:15px;letter-spacing:.04em}

.content{padding:22px 18px calc(48px + env(safe-area-inset-bottom));position:relative;max-width:560px;margin:0 auto}

.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.nav-brand{font-family:var(--fnt-display);font-size:16px;font-weight:600;letter-spacing:-.01em;
  color:var(--ink);text-decoration:none}
.nav-back{font-size:12px;color:var(--soft);text-decoration:none;display:flex;align-items:center;gap:4px;transition:color .2s}
.nav-back:active{opacity:.6}

.page-title{font-family:var(--fnt-display);font-size:clamp(24px,4vw,30px);font-weight:600;
  color:var(--ink);letter-spacing:-.01em;margin-bottom:6px}
.page-sub{font-size:13px;color:var(--soft);margin-bottom:28px}

.slbl{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--faint);
  text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid var(--hair);margin-bottom:16px}

/* ══════ 主入口：学习语法 — 唯一的强调色重点区域，跟大神榜同款语言 ══════ */
.hub-main{display:flex;align-items:center;gap:14px;padding:18px 18px 18px 16px;margin-bottom:14px;
  border-radius:var(--r-lg);text-decoration:none;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%);
  box-shadow:0 2px 4px rgba(40,20,5,.14),0 10px 22px rgba(122,84,20,.28),0 22px 44px rgba(122,84,20,.16);
  transition:transform .18s,box-shadow .18s}
.hub-main::after{content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);
  background-size:220% 100%;background-position:130% 0;animation:shimmer 3.6s ease-in-out infinite}
@keyframes shimmer{0%,55%{background-position:130% 0}100%{background-position:-50% 0}}
.hub-main:active{transform:scale(.98)}
.hub-main-ic{flex:0 0 auto;width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);position:relative;z-index:1}
.hub-main-ic svg{width:23px;height:23px}
.hub-main-tx{flex:1;min-width:0;position:relative;z-index:1}
.hub-main-tx b{display:block;font-family:var(--fnt-display);font-size:18px;font-weight:600;color:#FFF8E8;letter-spacing:-.01em}
.hub-main-tx span{display:block;font-size:11.5px;color:rgba(255,248,232,.82);margin-top:3px;line-height:1.5}
.hub-main-arrow{flex:0 0 auto;width:28px;height:28px;border-radius:50%;position:relative;z-index:1;
  background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.hub-main-arrow svg{width:14px;height:14px}

#overlay{position:fixed;inset:0;background:var(--bg);z-index:999;opacity:0;pointer-events:none;transition:opacity .26s ease}
#overlay.show{opacity:1;pointer-events:all}

html[data-incoming-slide="1"] .page-wrap{transform:translateY(100%)}
.page-wrap.enter{transition:transform .28s cubic-bezier(.32,.72,0,1);transform:translateY(0)}

.foot{margin-top:36px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:center}

@media (min-width:680px){
  .photo{position:fixed;top:0;left:0;width:42%;height:100vh;min-height:0;max-height:none}
  .photo::after{top:0;bottom:0;left:auto;right:0;width:110px;height:auto;
    background:linear-gradient(to right,transparent,var(--bg))}
  .content{margin-left:42%;max-width:560px;padding:48px 48px calc(60px + env(safe-area-inset-bottom)) 36px}
}
</style>
</head>
<body>

<script>
(function(){
  try{
    if(sessionStorage.getItem('jc_transition')==='slide-up'){
      sessionStorage.removeItem('jc_transition');
      document.documentElement.setAttribute('data-incoming-slide','1');
    }
  }catch(e){}
})();
</script>

<div id="overlay"></div>

<div class="page-wrap" id="pageWrap">
<div class="photo">
  <img src="bg.png" alt="John" onerror="this.style.display='none';this.parentElement.innerHTML+='&lt;div class=&quot;photo-ph&quot;&gt;替换为 bg.png&lt;/div&gt;'">
</div>

<div class="content">
  <div class="nav">
    <a class="nav-brand" href="index.html">John Class</a>
    <a class="nav-back" href="study.html" onclick="go(event,'study.html')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回
    </a>
  </div>

  <div class="page-title">语法提升</div>
  <div class="page-sub">系统学习语法知识，突破应试难关。</div>

  <div class="slbl">选择方向</div>

  <a class="hub-main" href="grammar_adventure.html" onclick="go(event,'grammar_adventure.html')">
    <div class="hub-main-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#FFF8E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></div>
    <div class="hub-main-tx">
      <b>学习语法</b>
      <span>32关闯关地图 · 普通 / 迷雾森林双模式</span>
    </div>
    <div class="hub-main-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#FFF8E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
  </a>

  <a class="hub-main" href="grammar_stage.html" onclick="go(event,'grammar_stage.html')">
    <div class="hub-main-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#FFF8E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
    <div class="hub-main-tx">
      <b>语法应试</b>
      <span>历年期末真题 · 语境填词专项训练</span>
    </div>
    <div class="hub-main-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#FFF8E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
  </a>

  <div class="foot">Growing Skills · Shaping Futures</div>
</div>
</div>

<script>
function go(e, href) {
  if(e)e.preventDefault();
  var ov = document.getElementById('overlay');
  ov.classList.add('show');
  setTimeout(function(){ window.location.href = href; }, 260);
}

(function(){
  if(document.documentElement.getAttribute('data-incoming-slide')!=='1') return;
  const wrap = document.getElementById('pageWrap');
  if(!wrap){
    document.documentElement.removeAttribute('data-incoming-slide');
    return;
  }
  var cleaned = false;
  function cleanup(){
    if(cleaned) return;
    cleaned = true;
    document.documentElement.removeAttribute('data-incoming-slide');
  }
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      wrap.classList.add('enter');
    });
  });
  wrap.addEventListener('transitionend', function onEnd(e){
    if(e.propertyName==='transform'){
      cleanup();
      wrap.removeEventListener('transitionend', onEnd);
    }
  });
  setTimeout(cleanup, 420);
})();
</script>
  <script src="audio.js"></script>
  <script src="bgm-cross.js"></script>
</body>
</html>
