<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>英语训练之路</title>
<style>
:root{
  /* 暖光书房配色 — 精致化：整体加深一档、降一点饱和度，少一点"嫩"，多一点陈年质感 */
  --bg:#FBF6EC;          /* was #FDF8F0 */
  --bg2:#F0E2C4;         /* was #F5EED8 */
  --bg3:#F6EEDC;         /* was #FAF3E0 */
  --ink:#2A1D08;         /* was #3A2A10 */
  --ink2:#2A1D08;
  --soft:#8C6B35;        /* was #A08040 */
  --faint:#C2A26C;       /* was #C8A870 */
  --hair:#E2D0A4;        /* was #E8DBBD */
  --hair2:#F0E8D0;
  --accent:#AD7A1E;      /* was #C89030 — 古铜/蜂蜡感，少一点亮黄金 */
  --accent-deep:#7A5414; /* 新增：强调色上的文字/按压态 */
  --accent-soft:#F5E8C8; /* was #FAF0D0 */
  --warn:#C2491E;        /* was #D05020 */
  --warn-soft:#FAEEE8;
  --ok:#4E7A28;          /* was #5A8A30 */
  --fnt:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --fnt-display:Georgia,"Songti SC","STSong",serif; /* 英文单词/数字/等级名专用衬线体；不用网络字体，国内访问更稳 */
  /* 圆角系统：收敛成 4 档，替代之前散落的 10 种数值 */
  --r-sm:10px;
  --r-md:16px;
  --r-lg:22px;
  --r-pill:999px;
  /* 阴影系统：收敛成 3 档 */
  --shadow-sm:0 1px 2px rgba(40,24,5,.10);
  --shadow-md:0 3px 10px rgba(40,24,5,.12);
  --shadow-lg:0 10px 28px rgba(40,24,5,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--fnt);color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;user-select:none;letter-spacing:-0.01em}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;
  padding:calc(env(safe-area-inset-top) + 18px) 26px calc(env(safe-area-inset-bottom) + 26px)}
.screen{display:none}
.screen.active{display:block;animation:fade .45s cubic-bezier(.22,1,.36,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* typography */
.kicker{font-size:12px;font-weight:600;letter-spacing:.34em;color:var(--faint);text-transform:uppercase}
.huge{font-weight:200;letter-spacing:-.04em;line-height:1}
.title-lg{font-size:32px;font-weight:600;letter-spacing:-.03em}
.muted{color:var(--soft)}

/* avatar */
.ava{border-radius:50%;background-image:var(--avatar);background-size:cover;background-position:center top;
  box-shadow:0 4px 16px rgba(160,100,20,.18)}

/* buttons — 暖棕系 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;cursor:pointer;
  font-family:var(--fnt);font-size:17px;font-weight:600;letter-spacing:-.01em;padding:17px;border-radius:16px;
  background:var(--ink);color:#FDF8F0;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.985);opacity:.9}
.btn.line{background:var(--bg3);color:var(--ink);border:1.5px solid var(--hair)}
.btn.line:active{background:var(--hair)}
.btn.accent{background:var(--accent);color:#FDF8F0}
.btn.ghost{background:transparent;color:var(--soft);font-weight:500}

/* grade select */
.gradewrap{padding:28px 20px 32px;text-align:center}
.ava.sm2{width:64px;height:64px;margin:0 auto}
.q2{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.4;margin-bottom:28px;color:var(--ink)}
/* ── 阶段选择卡片 ── */
.stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0 10px}
.stage-card{
  position:relative;overflow:hidden;border-radius:22px;padding:28px 12px 22px;
  cursor:pointer;user-select:none;border:1.5px solid var(--hair);background:var(--bg3);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,border-color .18s;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.stage-card:active{transform:scale(.93)}
.stage-card.s-primary{background:linear-gradient(145deg,#FFF8E7,#FAF0D0);border-color:#E0CC8A}
.stage-card.s-middle{background:linear-gradient(145deg,#EEF6FF,#DFF0FF);border-color:#A8CCEC}
.stage-card.s-high{background:linear-gradient(145deg,#F2F0FF,#E6E0FF);border-color:#C0B4F0}
.stage-card.s-college{background:linear-gradient(145deg,#EDFAF0,#D8F4DE);border-color:#9ED8AC}
.stage-card .s-icon{font-size:38px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.10))}
.stage-card .s-name{font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.stage-card .s-sub{font-size:11px;color:var(--soft);font-weight:500;letter-spacing:.04em;opacity:.8}
.stage-card::after{content:'';position:absolute;inset:0;border-radius:22px;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.45) 0%,transparent 55%);pointer-events:none}
/* ── 年级列表 ── */
.gradewrap-inner{padding:0 0 16px}
.glist{display:flex;flex-direction:column;gap:10px;padding:16px 0 4px}
.grow{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
  border-radius:16px;cursor:pointer;border:1.5px solid var(--hair);background:var(--bg3);
  transition:transform .14s cubic-bezier(.34,1.56,.64,1),border-color .15s,background .15s}
.grow:active{transform:scale(.97);background:var(--accent-soft);border-color:var(--accent)}
.grow.glock{opacity:.4;cursor:default}
.grow.glock:active{transform:none;background:var(--bg3);border-color:var(--hair)}
.grow .gl{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.newtag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;background:#FF3B30;color:#fff;margin-left:6px;vertical-align:middle;position:relative;top:-1px}.grow.glock .gl{color:var(--soft)}
.grow .chev{color:var(--accent);font-size:22px;font-weight:300}
.grow .gtag{font-size:15px;opacity:.35}
.gradewrap .foot{margin-top:20px;font-size:12px;color:var(--faint)}

/* grade chip on home */
.gradechip{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);
  padding:5px 14px;border-radius:99px;margin:-26px 0 26px;cursor:pointer;border:1px solid var(--hair)}
.gradechip:active{opacity:.7}
.streak{font-size:13px;font-weight:700;color:#8A4010;background:#F5D08A;padding:4px 10px;border-radius:99px;letter-spacing:.02em}
.resumetip{text-align:center;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:8px 14px;border-radius:10px;margin:-4px 0 8px;font-weight:500;border:1px solid var(--hair)}
/* 复仇成功飘字 */
.revenge-tip{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);
  font-size:28px;font-weight:800;color:var(--warn);background:var(--bg);border-radius:18px;padding:18px 34px;
  border:2px solid var(--hair);z-index:200;animation:rtpop .4s cubic-bezier(.18,1.1,.3,1) forwards,rtfade .8s .4s forwards;pointer-events:none}
@keyframes rtpop{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes rtfade{from{opacity:1}to{opacity:0}}

/* 首页双按钮行 */
.homebtn-row{display:flex;gap:10px;margin-top:20px}

/* ===== 连续登录横幅 ===== */
.streak-banner{display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:linear-gradient(135deg,#FFF8E0,#FDF0CC);border:1.5px solid #E8CC8A;
  border-radius:14px;margin-bottom:14px}
.streak-fire{font-size:22px;line-height:1;flex:0 0 auto}
.streak-text{flex:1}
.streak-text b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.streak-text span{font-size:11px;color:var(--soft);margin-top:1px;display:block}
.streak-bonus-tag{font-size:10px;font-weight:700;color:var(--ok);background:#EEF8E2;
  border-radius:8px;padding:2px 7px;flex:0 0 auto}

/* ===== 拼写挑战模式（二刷专属） ===== */
.spell-toggle-row{display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;background:var(--bg3);border:1.5px solid var(--hair);border-radius:16px;margin:0 0 14px}
.spell-toggle-label{font-size:14px;font-weight:600;color:var(--ink);line-height:1.3}
.spell-toggle-label span{display:block;font-size:11px;font-weight:400;color:var(--soft);margin-top:2px}
.spell-toggle-pts{font-size:11px;font-weight:700;color:var(--ok);background:#EEF8E2;
  border-radius:8px;padding:2px 8px;margin-top:4px;display:inline-block}
.spell-switch{position:relative;width:46px;height:26px;flex:0 0 auto}
.spell-switch input{opacity:0;width:0;height:0}
.spell-track{position:absolute;inset:0;border-radius:13px;background:var(--hair);
  cursor:pointer;transition:background .25s}
.spell-track::before{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.spell-switch input:checked+.spell-track{background:var(--ok)}
.spell-switch input:checked+.spell-track::before{transform:translateX(20px)}
.spell-input-wrap{position:relative;margin-bottom:8px}
.spell-input{width:100%;padding:14px 16px;border:2px solid var(--hair);border-radius:14px;
  font-size:18px;font-family:var(--fnt);color:var(--ink);background:var(--bg3);
  outline:none;transition:border-color .2s;-webkit-appearance:none}
.spell-input:focus{border-color:var(--accent)}
.spell-input.correct{border-color:var(--ok);background:#EEF8E2}
.spell-input.wrong{border-color:var(--warn);background:var(--warn-soft)}
.spell-answer{font-size:15px;color:var(--warn);text-align:center;margin:4px 0;font-weight:600;min-height:22px}
.spell-submit{width:100%;padding:13px;border:none;border-radius:14px;
  background:var(--accent);color:#FDF8F0;font-size:16px;font-weight:600;cursor:pointer;
  font-family:var(--fnt);transition:transform .1s}
.spell-submit:active{transform:scale(.97)}
.spell-submit:disabled{opacity:.5;cursor:default}
.spell-pts-badge{position:absolute;top:-6px;right:-6px;background:var(--ok);color:#fff;
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px}

/* ===== 二刷模式横幅 ===== */
.pass2-banner{display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:linear-gradient(135deg,#E8F0FF,#D8E8FF);border:1.5px solid #8AAAE0;
  border-radius:14px;margin:0 0 14px;font-size:13px;font-weight:500;color:#2A4A9A}
.pass2-banner b{font-size:14px}

/* ===== 速度挑战·鲨鱼游戏 ===== */
.sg-hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sg-timer-box,.sg-score-box{text-align:center;min-width:48px}
.sg-timer-num,.sg-score-num{font-size:36px;font-weight:200;letter-spacing:-.04em;color:var(--ink);line-height:1}
.sg-timer-num.warn{color:var(--warn)!important;animation:sgBlink .4s infinite}
.sg-lbl{font-size:11px;color:var(--soft);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.sg-title{font-size:13px;font-weight:600;color:var(--soft);letter-spacing:.05em}
.sg-qa{padding:4px 0 0}
.sg-q{font-size:13px;color:var(--soft);margin-bottom:8px;min-height:18px;text-align:center}
.sg-qword{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.sg-qcn{font-size:14px;font-weight:500;color:var(--ink);line-height:1.4}
.sg-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sg-opt{padding:10px 6px;border:1.5px solid var(--hair);border-radius:12px;
  background:var(--bg3);color:var(--ink);font-size:13px;font-weight:500;font-family:var(--fnt);
  cursor:pointer;text-align:center;transition:transform .08s;line-height:1.3;
  min-height:44px;display:flex;align-items:center;justify-content:center}
.sg-opt:active{transform:scale(.96)}
.sg-right{border-color:var(--ok)!important;background:#EEF8E2!important;color:var(--ok)!important}
.sg-wrong{border-color:var(--warn)!important;background:var(--warn-soft)!important;color:var(--warn)!important}
.sg-dim{opacity:.28!important;pointer-events:none}
@keyframes sgBlink{0%,100%{opacity:1}50%{opacity:.35}}
.speed-lb{margin-top:18px}
.speed-lb-title{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--soft);
  text-transform:uppercase;margin-bottom:10px}
.speed-lb-row{display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--hair2)}
.speed-lb-rank{width:28px;height:28px;border-radius:50%;background:var(--hair);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 auto}
.speed-lb-rank.r1{background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff}
.speed-lb-rank.r2{background:linear-gradient(135deg,#C0C0C0,#A0A0A0);color:#fff}
.speed-lb-rank.r3{background:linear-gradient(135deg,#CD7F32,#A05010);color:#fff}
.speed-lb-name{flex:1;font-size:15px;font-weight:500;color:var(--ink)}
.speed-lb-score{font-size:18px;font-weight:300;color:var(--accent)}
.speed-result-num{font-size:64px;font-weight:200;letter-spacing:-.05em;line-height:1;text-align:center;margin:12px 0 4px}

/* 我的目标 / 里程碑 */
.ms-cur{display:flex;align-items:center;gap:16px;background:var(--accent-soft);border-radius:20px;padding:20px 18px;margin-top:10px;border:1.5px solid var(--hair)}
.ms-cur-icon{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.ms-cur-tx b{font-size:22px;font-weight:700;display:block;color:var(--ink)}
.ms-cur-tx .ms-cur-label{font-size:12px;color:var(--soft);font-weight:600;letter-spacing:.06em;margin-bottom:2px}
.ms-cur-next{margin-left:auto;text-align:right;font-size:14px;font-weight:600;color:var(--accent);line-height:1.5}
.ms-cur-next span{font-size:12px;color:var(--soft);font-weight:400}
.ms-lvlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ms-lv{display:flex;align-items:center;gap:14px;padding:14px 14px;border:1.5px solid var(--hair);border-radius:16px;background:var(--bg3)}
.ms-lv.reached{background:var(--accent-soft);border-color:var(--accent)}
.ms-lv.god{border-color:var(--accent);border-style:dashed}
.ms-lv.god.reached{background:var(--accent-soft);border-style:solid}
.ms-icon{flex:0 0 auto;width:40px;display:flex;align-items:center;justify-content:center}
.ms-tx{flex:1}
.ms-tx b{font-size:16px;font-weight:600;color:var(--ink)}
.ms-tx span{display:block;font-size:12px;color:var(--soft);margin-top:1px}
.ms-ck{font-size:16px;font-weight:700;color:var(--accent)}
.ms-prog{font-size:13px;font-weight:600;color:var(--faint)}
.ms-milestones{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ms-row{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1.5px solid var(--hair);border-radius:16px;background:var(--bg3)}
.ms-row.ms-done{background:var(--accent-soft);border-color:var(--accent)}
.ms-dot{width:28px;height:28px;flex:0 0 auto;border-radius:50%;border:2px solid var(--hair);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--faint)}
.ms-dot.dot-on{background:var(--accent);border-color:var(--accent);color:#FDF8F0}
.ms-detail b{font-size:16px;font-weight:600;display:block;color:var(--ink)}
.ms-detail span{font-size:13px;color:var(--soft);margin-top:3px;display:block}

/* 得分逻辑说明卡 */
.ms-rule{background:var(--bg3);border:1.5px solid var(--hair);border-radius:18px;padding:14px 16px;margin-top:10px}
.ms-rule-line{font-size:12.5px;color:var(--soft);text-align:center;line-height:1.6}
.ms-rule-line b{color:var(--ink);font-weight:700}
.ms-rule-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.ms-rule-stat{text-align:center;background:var(--bg2);border-radius:14px;padding:10px 6px}
.ms-rule-num{font-size:24px;font-weight:800;color:var(--accent)}
.ms-rule-num.ok{color:var(--ok)}
.ms-rule-num.warn{color:var(--warn)}
.ms-rule-lbl{font-size:12px;font-weight:700;color:var(--ink);margin-top:2px}
.ms-rule-sub{font-size:10.5px;color:var(--faint);margin-top:2px;line-height:1.4}
.ms-rule-foot{font-size:11px;color:var(--faint);text-align:center;margin-top:10px;line-height:1.6}

/* brag wechat copy row */
.brag-wechat-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1.5px solid var(--hair);border-radius:12px;padding:12px 16px;margin:0 0 12px}
.brag-wechat-label{font-size:13px;color:var(--soft);font-weight:500}
.brag-wechat-id{flex:1;font-size:17px;font-weight:700;color:var(--ink);letter-spacing:.02em;user-select:all}
.brag-copy-btn{border:none;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--hair);transition:background .15s,color .15s}
.brag-copy-btn:active{opacity:.8}
.noperm{text-align:center;padding-top:50px}
.lockring{width:110px;height:110px;margin:0 auto 26px;border-radius:50%;border:2px solid var(--hair);background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-size:42px}
.np-t{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px;color:var(--ink)}
.np-p{font-size:16px;color:var(--soft);line-height:1.7;margin-bottom:34px}
.np-p b{color:var(--ink)}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;margin-bottom:30px}
.bar .back{width:40px;height:40px;margin-left:-8px;border:none;background:transparent;font-size:26px;color:var(--ink);cursor:pointer;display:flex;align-items:center}
.bar .htitle{font-size:18px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.bar .sp{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--hair);background:var(--bg3);cursor:pointer;
  font-size:15px;color:var(--soft);display:flex;align-items:center;justify-content:center}
.iconbtn:active{background:var(--hair)}

/* home head */
.hhead{display:flex;align-items:center;gap:14px;margin-bottom:42px}
.hhead .ava{width:52px;height:52px;flex:0 0 auto}
.hhead .greet{font-size:14px;color:var(--soft);font-weight:500}
.hhead .greet b{display:block;font-size:22px;color:var(--ink);font-weight:700;letter-spacing:-.02em;margin-top:1px}

/* score block */
.scoreblk{margin-bottom:8px}
.scoreblk .num{font-size:72px;color:var(--ink)}
.scoreblk .num small{font-size:20px;font-weight:400;color:var(--soft);margin-left:8px;letter-spacing:0}
.tier{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:14px;font-weight:600;color:var(--ink)}
.tier .line{flex:1;height:1.5px;background:var(--hair)}
.tier .nx{color:var(--soft);font-weight:400}
.track{height:5px;background:var(--hair);border-radius:3px;margin-top:14px;overflow:hidden}
.track>i{display:block;height:100%;background:var(--accent);width:0;transition:width .7s cubic-bezier(.22,1,.36,1)}

/* section label */
.slabel{font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;margin:42px 0 6px}

/* list rows — 暖色卡片风格 */
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.row{display:flex;align-items:center;padding:16px 18px;background:var(--bg3);border:1.5px solid var(--hair);border-radius:16px;cursor:pointer;transition:opacity .15s}
.row:active{opacity:.7}
.row .rt{flex:1;min-width:0}
.row .rt b{font-size:17px;font-weight:600;letter-spacing:-.02em;display:block;color:var(--ink)}
.row .rt span{font-size:13px;color:var(--soft);font-weight:400;margin-top:3px;display:block}
.row .meta{font-size:14px;color:var(--soft);margin-right:10px}
.row .chev{color:var(--faint);font-size:20px;font-weight:300}
.row.lock{cursor:default;opacity:.5}.row.lock:active{opacity:.5}
.row.done{background:var(--accent-soft);border-color:var(--accent)}
.row.done .meta{color:var(--accent);font-weight:600}

/* errorbook / 功能入口 — 比单元卡片小一档 */
.ebook{display:flex;align-items:center;margin-top:10px;padding:13px 16px;
  border:1px solid var(--hair);border-radius:13px;cursor:pointer;background:var(--bg)}
.ebook:active{background:var(--bg2)}
.ebook.empty{cursor:default}.ebook.empty:active{background:var(--bg)}
.ebook .rt{flex:1}
.ebook .rt b{font-size:14px;font-weight:600;color:var(--ink)}
.ebook .rt span{display:block;font-size:11px;color:var(--soft);margin-top:1px}
.dot{min-width:20px;height:20px;border-radius:10px;background:var(--warn);color:#FDF8F0;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 6px}

.cardlink{margin-top:30px}

/* mode rows (unit page) */
.mode{display:flex;align-items:flex-start;padding:16px 18px;background:var(--bg3);border:1.5px solid var(--hair);border-radius:16px;cursor:pointer;margin-bottom:10px}
.mode:active{opacity:.7}
.mode .mi{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;width:54px;flex:0 0 auto;padding-top:3px}
.mode .mt{flex:1}
.mode .mt b{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.mode .mt p{font-size:13px;color:var(--soft);margin-top:5px;line-height:1.5}
.mode .chev{color:var(--faint);font-size:22px;font-weight:300;align-self:center}

/* coverage */
.cov{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.cell{width:14px;height:14px;border-radius:4px;background:var(--hair)}
.cell.known{background:var(--accent)}
.cell.review{background:var(--warn)}
.leg{display:flex;gap:20px;margin-top:18px;font-size:12px;color:var(--soft)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* quiz hud */
.qhud{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.qhud .tk{flex:1;height:4px;background:var(--hair);border-radius:2px;overflow:hidden}
.qhud .tk>i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s cubic-bezier(.22,1,.36,1)}
.qhud .ct{font-size:13px;color:var(--soft);font-weight:500;font-variant-numeric:tabular-nums}

/* flip card — 暖白纸感 */
.flip-wrap{perspective:1400px;margin-top:8px;position:relative}
.flip{position:relative;width:100%;height:330px;transition:transform .6s cubic-bezier(.4,.15,.18,1);transform-style:preserve-3d;cursor:pointer}
.flip.flipped{transform:rotateY(180deg)}
.face{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:2px solid var(--hair);border-radius:28px;background:var(--bg3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--bg2)}
.face .ftag{position:absolute;top:22px;left:0;right:0;font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.en{font-size:42px;font-weight:600;letter-spacing:-.03em;line-height:1.1;color:var(--ink)}
.ph{font-size:17px;color:var(--soft);margin-top:14px;font-weight:400}
.sense{font-size:22px;font-weight:400;margin-top:8px;line-height:1.5;color:var(--ink)}
.sense .pos{font-style:italic;color:var(--accent);font-weight:600;margin-right:7px;font-size:18px}
.hint{text-align:center;color:var(--faint);font-size:13px;margin-top:20px;font-weight:400}
.spk{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--hair);background:var(--bg3);cursor:pointer;
  font-size:19px;display:inline-flex;align-items:center;justify-content:center;transition:transform .1s,background .15s;padding:0}
.spk:active{transform:scale(.9);background:var(--accent-soft)}
.q-spk{display:flex;justify-content:center;margin-top:18px}

/* 闯关路径 — 暖色 */
.stage-head{text-align:center;margin:8px 0 24px}
.stage-stars{display:flex;justify-content:center;gap:14px;margin-bottom:10px}
.stage-stars .star{font-size:20px;color:var(--hair);transition:color .5s,transform .5s}
.stage-stars .star.lit{color:var(--accent);transform:scale(1.2)}
.stage-cap{font-size:14px;color:var(--soft);font-weight:600}
.lvls{display:flex;flex-direction:column}
.lvl{display:flex;align-items:center;gap:16px;padding:18px 18px;border:1.5px solid var(--hair);border-radius:20px;cursor:pointer;transition:transform .1s,border-color .2s,background .2s}
.lvl:active{transform:scale(.98)}
.lvl-dot{width:44px;height:44px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.lvl-tx{flex:1;min-width:0}
.lvl-no{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.lvl-tx b{display:block;font-size:18px;font-weight:600;letter-spacing:-.01em;margin-top:1px;color:var(--ink)}
.lvl-tx p{font-size:13px;color:var(--soft);margin-top:3px;line-height:1.45}
.lvl-tag{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:99px;border:1px solid var(--hair)}
.lvl-tag.locktag{color:var(--faint);background:var(--bg2);border-color:var(--hair)}
.lvl .chev{color:var(--faint);font-size:20px;font-weight:300}
.lvl-link{width:2px;height:18px;background:var(--hair);margin:2px 0 2px 36px;transition:background .5s}
.lvl-link.lit{background:var(--accent)}
.lvl-open{background:var(--bg3)}
.lvl-open .lvl-dot{background:var(--accent);color:#FDF8F0}
.lvl-done{background:var(--accent-soft);border-color:var(--accent)}
.lvl-done .lvl-dot{background:var(--accent);color:#FDF8F0;animation:pop .4s}
.lvl-lock{background:var(--bg2);cursor:not-allowed;opacity:.6}
.lvl-lock .lvl-dot{background:var(--bg3);color:var(--faint)}
.lvl-lock .lvl-no{color:var(--faint)}.lvl-lock .lvl-tx b{color:var(--soft)}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shakex{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 关卡结算 */
.stagebadge{width:90px;height:90px;border-radius:50%;margin:6px auto 18px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700}
.stagebadge.pass{background:var(--accent-soft);color:var(--accent);animation:pop .5s}
.stagebadge.fail{background:var(--warn-soft);color:var(--warn)}
.passmsg{font-size:15px;font-weight:600;color:var(--accent);margin-top:20px}
.passmsg.warn{color:var(--warn);font-weight:500}
.en-q{font-family:-apple-system,sans-serif;color:var(--ink)}
.q-ph{font-size:16px;color:var(--soft);margin-top:8px}

/* listening */
.listen-box{text-align:center;padding:30px 12px 6px}
.bigspk{width:96px;height:96px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);
  cursor:pointer;font-size:40px;display:inline-flex;align-items:center;justify-content:center;
  transition:transform .12s;animation:ringpulse 1.6s ease-in-out infinite}
.bigspk:active{transform:scale(.92)}
.replay{font-size:13px;color:var(--soft);margin-top:16px}
.opts.cn{grid-template-columns:1fr;gap:10px;margin-top:24px}
.opts.cn .opt{min-height:54px;font-size:18px;font-weight:500;padding:16px 14px}
/* 终极试炼8选项：两列，字稍小 */
.opts.cn8{grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}
.opts.cn8 .opt{min-height:48px;font-size:15px;padding:12px 8px}
.opts.en8{grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}
.opts.en8 .opt{min-height:48px;font-size:15px;padding:12px 8px}
.knrow{display:flex;gap:12px;margin-top:18px}
.knrow .btn{margin-top:0}

/* writing */
.qcn{text-align:center;padding:34px 12px 8px}
.qcn .ql{font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;margin-bottom:18px}
.qcn .qt{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.4;color:var(--ink)}
.qcn .qp{font-style:italic;color:var(--accent);font-size:21px;margin-right:7px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:30px}
.opt{border:1.5px solid var(--hair);border-radius:16px;background:var(--bg3);padding:18px 10px;font-family:var(--fnt);
  font-size:18px;font-weight:500;letter-spacing:-.01em;cursor:pointer;min-height:60px;color:var(--ink);
  display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-word;
  transition:transform .1s,border-color .2s,background .2s,color .2s}
.opt:active{transform:scale(.97)}
.opt.right{background:var(--accent);border-color:var(--accent);color:#FDF8F0;animation:scaleIn .25s}
.opt.wrong{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.opt.dim{opacity:.3}

/* combo */
.combo{position:fixed;top:calc(env(safe-area-inset-top) + 18px);left:50%;transform:translateX(-50%) translateY(-20px);
  opacity:0;z-index:50;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em;
  background:var(--accent-soft);padding:6px 16px;border-radius:99px;border:1px solid var(--hair);
  transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .35s}
.combo.show{transform:translateX(-50%) translateY(0);opacity:1}

/* result */
.res{text-align:center;padding-top:30px}
.res .ava{width:72px;height:72px;margin:0 auto 26px}
.res .rk{font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-bottom:10px}
.res .big{font-size:80px;color:var(--accent)}
.res .rl{font-size:15px;color:var(--soft);margin-top:6px}
.res .stats{display:flex;justify-content:center;gap:0;margin:38px 0 8px;border-top:1.5px solid var(--hair);border-bottom:1.5px solid var(--hair)}
.res .st{flex:1;padding:20px 0}
.res .st+.st{border-left:1.5px solid var(--hair)}
.res .st b{font-size:24px;font-weight:600;display:block;letter-spacing:-.02em;color:var(--ink)}
.res .st span{font-size:12px;color:var(--soft);margin-top:4px;display:block}
.res .btn{margin-top:34px}

/* scorecard */
.sc-card{border:2px solid var(--hair);border-radius:24px;padding:28px;margin-top:6px;background:var(--bg3)}
.sc-head{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.sc-head .ava{width:54px;height:54px;flex:0 0 auto}
.sc-head .nm{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.sc-head .dt{font-size:12px;color:var(--soft);margin-top:2px}
.sc-score{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.sc-score .n{font-size:60px;color:var(--accent)}
.sc-score .t{font-size:18px;font-weight:600;color:var(--ink)}
.sc-row{display:flex;justify-content:space-between;padding:14px 0;border-top:1.5px solid var(--hair);font-size:15px;color:var(--ink)}
.sc-row:first-of-type{margin-top:24px}
.sc-row b{font-weight:600}
.sc-row .v{color:var(--accent);font-weight:600}
.sc-row .vr{color:var(--warn);font-weight:600}

/* modal — 暖色毛玻璃 */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:30px;
  background:rgba(253,248,240,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.modal.show{display:flex;animation:fade .3s}
.modal .box{text-align:center;max-width:300px;animation:scaleIn .5s cubic-bezier(.22,1,.36,1);background:var(--bg);border:1.5px solid var(--hair);border-radius:28px;padding:32px 24px}
.modal .rk{font-size:12px;font-weight:600;letter-spacing:.24em;color:var(--faint);text-transform:uppercase;margin-bottom:18px}
.modal .ring{width:120px;height:120px;margin:0 auto 26px;border-radius:50%;border:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--ink);
  animation:ringpulse 1.4s ease-in-out infinite}
@keyframes ringpulse{0%,100%{box-shadow:0 0 0 0 rgba(200,144,48,.2)}50%{box-shadow:0 0 0 14px rgba(200,144,48,0)}}
.modal h2{font-size:15px;font-weight:500;color:var(--soft);margin-bottom:6px}
.modal .btn{margin-top:30px}

.foot{text-align:center;font-size:11px;color:var(--faint);margin-top:40px;letter-spacing:.02em}

/* hype (激励语) — 暖白 */
.hype{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px;cursor:pointer}
.hype .hk{font-size:12px;font-weight:600;letter-spacing:.34em;color:var(--faint);text-transform:uppercase;
  opacity:0;animation:hypek .6s .1s cubic-bezier(.22,1,.36,1) forwards}
.hype .ht{font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.2;margin:24px 0;max-width:340px;color:var(--ink)}
.hype .ht .w1{display:inline-block;opacity:0;transform:translateY(24px);animation:hypew .7s cubic-bezier(.18,1.1,.3,1) forwards}
.hype .tap{font-size:13px;color:var(--faint);opacity:0;animation:hypek .6s 1.5s forwards}
@keyframes hypek{to{opacity:1}}
@keyframes hypew{to{opacity:1;transform:none}}

/* brag (炫耀) — 暖金卡片 */
.brag-card{border:2px solid var(--hair);border-radius:24px;padding:34px 26px;text-align:center;margin-top:6px;
  background:var(--accent-soft)}
.brag-card .ava{width:80px;height:80px;margin:0 auto 22px}
.brag-card .bk{font-size:12px;font-weight:600;letter-spacing:.24em;color:var(--accent);text-transform:uppercase;margin-bottom:14px}
.brag-card .bt{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.3;color:var(--ink)}
.brag-card .bs{font-size:15px;color:var(--soft);margin-top:12px}
.brag-card .bn{font-size:46px;font-weight:200;color:var(--accent);margin-top:18px;letter-spacing:-.03em}
.brag-tip{text-align:center;font-size:13px;color:var(--soft);margin-top:22px;line-height:1.6}

/* ═══════════════════════════════════════════
   复习中心 · Review Center
═══════════════════════════════════════════ */
.rc-hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1.5px solid var(--hair);border-radius:20px;padding:18px 20px;margin-top:6px}
.rc-hero-l{flex:0 0 auto;text-align:center;padding-right:16px;border-right:1.5px solid var(--hair)}
.rc-bignum{font-size:34px;font-weight:800;color:var(--accent);line-height:1}
.rc-bigsub{font-size:11.5px;color:var(--soft);margin-top:3px;white-space:nowrap}
.rc-hero-stats{flex:1;display:flex;gap:10px}
.rc-stat{flex:1;text-align:center}
.rc-stat b{display:block;font-size:20px;font-weight:700;color:var(--ink)}
.rc-stat span{font-size:11px;color:var(--soft)}
.rc-go{width:100%;margin-top:14px;font-size:16px;padding:14px}
.rc-rest{margin-top:14px;text-align:center;font-size:13px;color:var(--soft);background:var(--bg2);border:1.5px dashed var(--hair);border-radius:14px;padding:14px}
.rc-tabs{display:flex;gap:8px;margin:20px 0 14px}
.rc-tab{flex:1;padding:10px 6px;border-radius:14px;border:1.5px solid var(--hair);background:var(--bg3);font-size:13px;font-weight:600;color:var(--soft);cursor:pointer;text-align:center;transition:all .18s}
.rc-tab.active{background:var(--accent);border-color:var(--accent);color:#FDF8F0}
.rc-card{border:1.5px solid var(--hair);border-radius:18px;background:var(--bg3);padding:16px 16px 14px;margin-bottom:14px}
.rc-card-t{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:4px}
.rc-card-s{font-size:12px;color:var(--soft);line-height:1.7;margin-bottom:10px}
.rc-legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:11.5px;color:var(--soft)}
.rc-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rc-stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rc-stage{background:var(--bg3);border:1.5px solid var(--hair);border-radius:12px;padding:10px 4px;text-align:center}
.rc-stage-n{font-size:17px;font-weight:800;color:var(--accent)}
.rc-stage-l{font-size:10px;color:var(--soft);margin-top:2px;display:flex;flex-direction:column}
.rc-stage-l span{font-size:9px;color:var(--faint)}
.rc-grp-t{font-size:12.5px;font-weight:700;color:var(--accent);margin:16px 0 8px;display:flex;justify-content:space-between;border-left:3px solid var(--accent);padding-left:9px}
.rc-grp-t span{font-weight:500;color:var(--faint)}
.rc-word{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border:1.5px solid var(--hair);border-radius:14px;background:var(--bg3);margin-bottom:7px;cursor:pointer;transition:transform .12s}
.rc-word:active{transform:scale(.98)}
.rc-word-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rc-word-l b{font-size:15px;color:var(--ink)}
.rc-ph{font-size:11px;color:var(--faint)}
.rc-cn{font-size:12.5px;color:var(--soft)}
.rc-word-tag{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--soft);background:var(--bg2);border:1px solid var(--hair);padding:4px 9px;border-radius:99px;white-space:nowrap}
.rc-word-tag.due{color:#fff;background:var(--warn);border-color:var(--warn)}
.rc-word-tag.grad{color:var(--ok);background:rgba(90,138,48,.12);border-color:var(--ok)}
.rc-empty{text-align:center;padding:40px 20px;color:var(--faint);font-size:14px;line-height:1.8}
.rc-more{text-align:center;font-size:12px;color:var(--faint);margin-top:8px}

/* ═══════════════════════════════════════════
   进步可视化 · Progress Visualization
═══════════════════════════════════════════ */
.pg-cur{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1.5px solid var(--hair);border-radius:20px;padding:16px 18px;margin-top:6px}
.pg-cur-medal{flex:0 0 auto}
.pg-cur-tx{flex:1;min-width:0}
.pg-cur-lbl{font-size:11px;color:var(--faint);letter-spacing:.08em}
.pg-cur-tx b{font-size:21px;color:var(--ink);display:block;margin-top:1px}
.pg-cur-sub{font-size:12.5px;color:var(--soft);margin-top:4px}
.pg-week{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.pg-wk{background:var(--bg3);border:1.5px solid var(--hair);border-radius:14px;padding:12px 4px;text-align:center}
.pg-wk b{display:block;font-size:18px;font-weight:800;color:var(--accent)}
.pg-wk span{font-size:10px;color:var(--soft);margin-top:2px;display:block}
.pg-card{border:1.5px solid var(--hair);border-radius:18px;background:var(--bg3);padding:16px 16px 12px;margin-top:14px}
.pg-card-t{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px}
.pg-card-s{font-size:12px;color:var(--soft);margin-top:8px;line-height:1.7;text-align:center}
.pg-card-s2{font-size:12px;color:var(--soft);margin:2px 0 12px;line-height:1.6}
.pg-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pg-medal{background:var(--bg3);border:1.5px solid var(--hair);border-radius:16px;padding:12px 6px 10px;text-align:center;position:relative;transition:transform .15s}
.pg-medal.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(200,144,48,.18)}
.pg-medal.lock{opacity:.92}
.pg-medal-svg{display:flex;justify-content:center}
.pg-medal-name{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:4px}
.pg-medal-req{font-size:10px;color:var(--faint);margin-top:1px}
.pg-medal-cur{position:absolute;top:6px;right:6px;font-size:9px;font-weight:700;color:#fff;background:var(--accent);padding:2px 6px;border-radius:99px}

/* ═══════════════════════════════════════════
   JC 设计系统 v2 · 书房暖色 + 3D 按键体系
═══════════════════════════════════════════ */

/* 3D 按键基础 */
.jk{display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--fnt);cursor:pointer;font-size:11.5px;font-weight:600;
  letter-spacing:-.01em;white-space:nowrap;-webkit-user-select:none;user-select:none;
  background:var(--bg3);
  border:1px solid var(--hair);border-bottom:2px solid var(--faint);border-radius:var(--r-sm);
  box-shadow:0 1px 2px rgba(40,20,5,.06);
  color:var(--ink);transition:transform .08s,box-shadow .08s,border-bottom-width .08s,background .1s}
.jk:active{transform:translateY(1px);border-bottom-width:1px;
  box-shadow:inset 0 1px 2px rgba(40,20,5,.08);
  background:var(--bg2)}

/* JC Header */
.jc-hd{position:sticky;top:0;z-index:100;
  padding:14px 0 2px;
  padding-top:calc(14px + env(safe-area-inset-top));
  background:var(--bg);
  box-shadow:0 1px 0 var(--hair)}
.jc-hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding:0 20px}
.jc-logo{font-family:var(--fnt-display);font-size:21px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.jc-chips{display:flex;gap:8px;padding:0 20px}
/* 勋章 + 积分徽章：放在右上角，点开就是「我的目标」 */
.jc-medalbadge{display:flex;align-items:center;gap:6px;flex:0 0 auto;cursor:pointer;
  background:rgba(255,252,244,.7);border:1.5px solid var(--hair);border-radius:var(--r-pill);
  padding:3px 13px 3px 3px;box-shadow:var(--shadow-sm);transition:transform .12s}
.jc-medalbadge:active{transform:scale(.95)}
.jc-medalbadge-ic{flex:0 0 auto;display:flex;align-items:center;justify-content:center;height:34px;overflow:visible}
.jc-medalbadge-num{font-family:var(--fnt-display);font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.jc-medalbadge-u{font-size:11px;color:var(--soft);margin-left:1px}

/* Score Block：等级名 + 健康度小标签 + 升级进度条 */
.jc-score{padding:4px 20px 4px;display:flex;align-items:center;gap:8px}
.jc-score-lv{font-family:var(--fnt-display);font-size:16px;font-weight:600;color:var(--ink)}
.jc-score-cap{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);
  padding:2px 8px;border-radius:var(--r-sm);margin-left:2px}
.jc-score-next{margin-left:auto;font-size:11.5px;color:var(--soft);text-align:right}
.jc-pw{padding:8px 20px 14px}
.jc-pt{height:4px;background:rgba(42,29,8,.10);border-radius:var(--r-pill);overflow:hidden}
.jc-pf{height:100%;background:linear-gradient(90deg,var(--accent),#C8943C);border-radius:var(--r-pill)}

/* Dots */
.jc-dots{display:flex;gap:7px;padding:0 20px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
.jc-d{width:8px;height:8px;border-radius:50%;background:rgba(42,29,8,.12);
  cursor:pointer;transition:transform .12s;flex:0 0 auto}
.jc-d:active{transform:scale(1.5)}
.jcd-done{background:var(--accent)}
.jcd-prog{background:var(--accent);opacity:.5}
.jc-dlbl{font-size:9.5px;font-weight:700;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-left:4px}

/* Shelf */
.jc-shelf{margin-bottom:0}
.jc-slbl{padding:0 20px 10px;font-size:9.5px;font-weight:700;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.jc-sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 20px}
.jc-sbar{height:14px;background:linear-gradient(180deg,#B07030 0%,#8A4E18 100%);
  box-shadow:0 5px 16px rgba(80,40,10,.25),0 2px 4px rgba(80,40,10,.15);position:relative}
.jc-sbar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,220,120,.55) 30%,rgba(255,220,120,.7) 50%,rgba(255,220,120,.55) 70%,transparent)}
.jc-sgap{height:28px}

/* Cards — "一本本立着的书"，封面/书页/封底/文字 全部是一张完整的SVG插画，没有HTML文字叠层 */
.jc-card{border-radius:var(--r-md);overflow:hidden;aspect-ratio:3/4.5;position:relative;cursor:pointer;
  box-shadow:0 1px 2px rgba(40,20,5,.08),0 3px 8px rgba(40,20,5,.10),
    0 9px 20px rgba(40,20,5,.08),0 16px 32px rgba(40,20,5,.05);
  transition:transform .18s cubic-bezier(.34,1.4,.64,1),box-shadow .18s}
.jc-card:active{transform:scale(.96) translateY(2px);
  box-shadow:0 2px 6px rgba(40,20,5,.12),0 5px 14px rgba(40,20,5,.1)}
.jc-bookbg{position:absolute;inset:0;z-index:3;pointer-events:none}
.jc-bookbg svg{width:100%;height:100%;display:block}

/* Bottom Bar */
.jc-btm{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--bg);
  border-top:1px solid var(--hair);padding:12px 20px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.jc-keys{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding-bottom:1px}
.jc-keys::-webkit-scrollbar{display:none}
.jc-key{flex:0 0 auto;font-family:var(--fnt);cursor:pointer;padding:9px 15px;border-radius:var(--r-sm);
  font-size:11.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;position:relative;
  background:linear-gradient(180deg,#FFFFFF 0%,#F5EDD8 100%);
  border:1px solid #D8C090;border-bottom:3px solid #B09050;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 5px rgba(40,20,5,.08);
  color:var(--ink);transition:transform .08s,box-shadow .08s,border-bottom-width .08s}
.jc-key:active{transform:translateY(2px);border-bottom-width:1px;box-shadow:inset 0 1px 3px rgba(40,20,5,.1)}
/* 统一：所有功能按钮用同一种颜色，不再用金/红/蓝区分功能 — 紧急提示靠右上角小红点（jc-key-badge）传达 */
.jc-key-trophy,.jc-key-amber,.jc-key-red,.jc-key-blue{
  background:linear-gradient(180deg,#FFFFFF 0%,#F5EDD8 100%);
  border:1px solid #D8C090;border-bottom:3px solid #B09050;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 5px rgba(40,20,5,.08);
  color:var(--ink);font-weight:600}
.jc-key-trophy:active,.jc-key-amber:active,.jc-key-red:active,.jc-key-blue:active{
  background:linear-gradient(180deg,#F5EDD8 0%,#E8D8B4 100%)}
.jc-key-dim{background:linear-gradient(180deg,#EEE2C4 0%,#D8C8A0 100%);border-color:#C0A870;
  border-bottom-color:#C0A870;color:rgba(42,29,8,.28);cursor:not-allowed;pointer-events:none;
  box-shadow:inset 0 1px 2px rgba(40,20,5,.05)}
.jc-key-badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;
  background:var(--warn);color:#FDF8F0;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:1.5px solid #FDF8F0}

/* ═══ 全站 UI 统一覆盖 ═══ */
/* 顶栏 */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:0;
  padding:10px 16px;min-height:52px;
  background:var(--bg);box-shadow:0 1px 0 var(--hair)}
.back{width:36px;height:36px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(180deg,#FDF8F0 0%,#E8D8B4 100%);
  border:1px solid #C8A860;border-bottom:3px solid #9A7830;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 2px 5px rgba(40,20,5,.12);
  font-size:20px;color:#3A2A10;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .08s,box-shadow .08s,border-bottom-width .08s}
.back:active{transform:translateY(2px);border-bottom-width:1px;
  box-shadow:inset 0 1px 3px rgba(40,20,5,.12)}
.htitle{flex:1;text-align:center;font-size:15px;font-weight:600;
  color:#3A2A10;letter-spacing:-.02em;margin:0 8px;
  text-shadow:0 1px 3px rgba(40,20,5,.1)}
.iconbtn{width:34px;height:34px;border-radius:50%;
  background:linear-gradient(180deg,#FDF8F0 0%,#E8D8B4 100%);
  border:1px solid #C8A860;border-bottom:2.5px solid #9A7830;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 4px rgba(40,20,5,.1);
  color:#A08040;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .08s,box-shadow .08s,border-bottom-width .08s}
.iconbtn:active{transform:translateY(2px);border-bottom-width:1px}
.sp{flex:1}
/* 进度条 HUD */
.qhud{display:flex;align-items:center;gap:12px;padding:10px 20px;
  border-bottom:.5px solid #E8DBBD;background:rgba(253,248,240,.5)}
.qhud .tk{flex:1;height:3px;background:rgba(58,42,16,.1);border-radius:99px;overflow:hidden}
.qhud .tk i{display:block;height:100%;background:linear-gradient(90deg,#C89030,#E8A830);
  border-radius:99px;transition:width .3s}
.qhud .ct{font-size:11px;font-weight:700;color:#A08040;letter-spacing:.04em;white-space:nowrap}
/* 题目 */
.qcn{padding:22px 20px 14px}
.ql{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:#C8A870;
  text-transform:uppercase;margin-bottom:12px}
.qt{font-size:26px;font-weight:700;color:#3A2A10;letter-spacing:-.04em;line-height:1.22}
.en-q{font-size:30px;letter-spacing:-.06em}
.q-ph{font-size:15px;color:#A08040;margin-top:6px;letter-spacing:.04em}
.qp{font-size:12px;font-weight:500;color:#A08040;margin-right:4px}
.q-spk{margin-top:12px}
/* 选项 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 20px 20px}
.opt{padding:14px 12px;font-size:13.5px;font-weight:600;color:#3A2A10;
  background:linear-gradient(180deg,#FFFFFF 0%,#F8F0E0 100%);
  border:1px solid #D8C090;border-bottom:3px solid #B09050;border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 6px rgba(40,20,5,.07);
  font-family:var(--fnt);cursor:pointer;text-align:center;line-height:1.35;
  transition:transform .08s,box-shadow .08s,border-bottom-width .08s;
  min-height:52px;display:flex;align-items:center;justify-content:center}
.opt:active{transform:translateY(2px);border-bottom-width:1px;
  box-shadow:inset 0 1px 3px rgba(40,20,5,.1)}
.opt.right{background:linear-gradient(180deg,#EED870 0%,#E8C428 100%);
  border-color:#C89010;border-bottom-color:#986808;color:#4A3000;
  box-shadow:inset 0 1px 0 rgba(255,255,200,.6),0 2px 6px rgba(40,20,5,.10)}
.opt.wrong{background:linear-gradient(180deg,#CC5A28 0%,#9A3A10 100%);
  border-color:#7A2808;border-bottom-color:#4A1000;color:#FDF8F0;
  box-shadow:inset 0 1px 0 rgba(255,200,150,.18),0 2px 6px rgba(40,20,5,.14)}
.opt.dim{opacity:.22;pointer-events:none}
/* TTS 大按钮 */
.listen-box{text-align:center;padding:28px 20px 18px}
.bigspk{width:84px;height:84px;border-radius:50%;
  background:linear-gradient(180deg,#FDF8F0 0%,#E8D8B4 100%);
  border:1px solid #C8A860;border-bottom:5px solid #9A7830;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 4px 12px rgba(40,20,5,.14),
    0 8px 24px rgba(40,20,5,.08);
  font-size:30px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,box-shadow .1s,border-bottom-width .1s;margin:0 auto}
.bigspk:active{transform:scale(.93) translateY(3px);border-bottom-width:2px;
  box-shadow:inset 0 2px 4px rgba(40,20,5,.12),0 2px 6px rgba(40,20,5,.1)}
.replay{font-size:11px;color:#A08040;margin-top:10px;letter-spacing:.04em}
/* 行内 TTS */
.spk,.spk-btn{padding:6px 16px;border-radius:99px;font-size:12px;font-weight:600;
  background:linear-gradient(180deg,#FDF8F0 0%,#E8D8B4 100%);
  border:1px solid #C8A860;border-bottom:2.5px solid #9A7830;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 4px rgba(40,20,5,.1);
  color:#A08040;cursor:pointer;font-family:var(--fnt);
  transition:transform .08s,box-shadow .08s,border-bottom-width .08s}
.spk:active,.spk-btn:active{transform:translateY(1px);border-bottom-width:1px}
/* 单元三关卡 */
.lvls{display:flex;flex-direction:column;gap:10px;margin:10px 0 16px}
.lvl-link{height:14px;width:2px;background:rgba(58,42,16,.12);margin:0 auto;border-radius:2px}
.lvl-link.lit{background:linear-gradient(180deg,#C89030,#9A7020)}
.lvl{display:flex;align-items:center;gap:16px;padding:18px 16px;border-radius:18px;cursor:pointer;
  background:linear-gradient(180deg,#FFFFFF 0%,#F8F0E0 100%);
  border:1px solid #D8C090;border-bottom:3px solid #B09050;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 6px rgba(40,20,5,.08),
    0 6px 18px rgba(40,20,5,.04);
  transition:transform .1s,box-shadow .1s,border-bottom-width .1s}
.lvl:active{transform:translateY(2px);border-bottom-width:1px;
  box-shadow:inset 0 1px 3px rgba(40,20,5,.1)}
.lvl-open{}
.lvl-done{background:linear-gradient(180deg,#FDF4E0 0%,#F0E0B0 100%);
  border-color:#D4B060;border-bottom-color:#A88030;
  box-shadow:inset 0 1px 0 rgba(255,255,220,.7),0 2px 6px rgba(40,30,5,.08)}
.lvl-lock{opacity:.38;cursor:not-allowed;border-bottom-width:1px}
.lvl-lock:active{transform:none}
.lvl-dot{width:42px;height:42px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(145deg,#D4A030,#9A6810);
  border:1px solid #B88020;border-bottom:2px solid #7A4808;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#FDF8F0;
  box-shadow:0 2px 6px rgba(40,20,5,.18),inset 0 1px 0 rgba(255,240,160,.35)}
.lvl-done .lvl-dot{background:linear-gradient(145deg,#F0B830,#C08818);
  border-color:#C89828;border-bottom-color:#906808;
  box-shadow:0 2px 6px rgba(40,20,5,.16),inset 0 1px 0 rgba(255,248,180,.5)}
.lvl-lock .lvl-dot{background:linear-gradient(145deg,#C8A870,#A08040);
  border-color:#906828;border-bottom-color:#706028}
.lvl-tx{flex:1;min-width:0}
.lvl-no{font-size:10px;font-weight:700;letter-spacing:.14em;color:#A08040;
  text-transform:uppercase;display:block;margin-bottom:3px}
.lvl-tx b{font-size:16px;font-weight:600;color:#3A2A10;letter-spacing:-.02em;display:block}
.lvl-tx p{font-size:12px;color:#A08040;margin-top:3px;line-height:1.4}
.lvl-tag{font-size:10px;font-weight:700;color:#7A5010;
  background:linear-gradient(180deg,#FDF4E0,#F0E0B0);
  border:1px solid #D4B060;border-bottom:2px solid #A88030;
  padding:4px 10px;border-radius:8px;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,220,.7)}
.locktag{color:#A08040;background:linear-gradient(180deg,#F0E8CC,#D8C8A0);
  border-color:#B09850;border-bottom-color:#907830}
.stage-head{padding:14px 20px;display:flex;flex-direction:column;align-items:center;
  gap:6px;border-bottom:.5px solid #E8DBBD;margin-bottom:4px}
.stage-stars{display:flex;gap:10px}
.star{font-size:24px;color:rgba(58,42,16,.12);transition:color .3s}
.star.lit{color:#C89030;text-shadow:0 2px 8px rgba(200,144,48,.45),0 0 12px rgba(200,144,48,.2)}
.stage-cap{font-size:12px;color:#A08040;font-weight:600;letter-spacing:.04em}
/* 通用按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--fnt);cursor:pointer;font-size:15px;font-weight:600;
  padding:14px 20px;border-radius:14px;width:100%;
  transition:transform .08s,box-shadow .08s,border-bottom-width .08s;margin-bottom:8px}
.btn.accent{background:linear-gradient(180deg,#EED068 0%,#EEAA28 100%);
  border:1px solid #C88808;border-bottom:3px solid #986008;color:#4A3000;
  box-shadow:inset 0 1px 0 rgba(255,255,200,.5),0 2px 6px rgba(40,20,5,.12)}
.btn.accent:active{transform:translateY(2px);border-bottom-width:1px}
.btn.line{background:linear-gradient(180deg,#FFFFFF 0%,#F5EDD8 100%);
  border:1px solid #D8C090;border-bottom:3px solid #B09050;color:#3A2A10;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 5px rgba(40,20,5,.07)}
.btn.line:active{transform:translateY(2px);border-bottom-width:1px}
.btn.ghost{background:none;border:1px solid #D8C8A0;border-bottom-width:1px;
  color:#A08040;box-shadow:none}
.btn.ghost:active{background:rgba(58,42,16,.05)}
/* 脚注 */
.foot{font-size:11px;color:#C8A870;text-align:center;padding:12px 20px 20px;letter-spacing:.04em}
.resumetip{font-size:11px;color:#A08040;background:#F5EDD8;
  border:1px solid #E8DBBD;border-radius:8px;
  padding:6px 12px;margin:0 20px 8px;text-align:center}
/* 结算页 */
.res{padding:28px 20px}
.stagebadge{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:700;color:#FDF8F0;
  animation:ringPop .5s cubic-bezier(.34,1.4,.64,1)}
.stagebadge.pass{background:linear-gradient(145deg,#EED068,#EEAA28);
  border:1px solid #C88808;border-bottom:4px solid #986008;
  box-shadow:0 4px 14px rgba(40,20,5,.14),inset 0 1px 0 rgba(255,255,200,.6)}
.stagebadge.fail{background:linear-gradient(145deg,#CC5A28,#9A3A10);
  border:1px solid #7A2808;border-bottom:4px solid #4A1000;
  box-shadow:0 4px 14px rgba(80,20,5,.18),inset 0 1px 0 rgba(255,200,150,.2)}
@keyframes ringPop{from{transform:scale(.6) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.huge.big{font-size:52px;font-weight:200;letter-spacing:-.07em;color:#3A2A10;
  text-align:center;text-shadow:0 3px 8px rgba(40,20,5,.12);line-height:1;margin:8px 0 2px}
.rl{font-size:11px;color:#A08040;text-align:center;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.st{text-align:center;padding:12px 6px;
  background:linear-gradient(180deg,#FDF8F0,#EEE2C4);
  border:1px solid #C8A860;border-bottom:2px solid #9A7830;border-radius:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 4px rgba(40,20,5,.08)}
.st b{display:block;font-size:22px;font-weight:300;letter-spacing:-.05em;color:#3A2A10}
.st span{font-size:9px;color:#A08040;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;margin-top:3px;display:block}
.passmsg{font-size:13px;font-weight:600;color:#7A5010;text-align:center;
  padding:10px 14px;border-radius:12px;margin-bottom:14px;
  background:linear-gradient(180deg,#F5EEC8,#EED868);
  border:1px solid #C89010;border-bottom:2px solid #A07008;
  box-shadow:inset 0 1px 0 rgba(255,255,220,.8)}
.passmsg.warn{color:#9A3A10;
  background:linear-gradient(180deg,#FAF0E8,#EEDAD8);
  border-color:#D0A090;border-bottom-color:#A07060}
/* ── 排行榜：完全套用 design_spec 体系，复用 weekly_stars.html 验证过的
   条幅式排行榜手法——TOP 6 装在强调色卡片里，条幅长度按分数占最高分比例缩放，
   不接背景轨道（不暗示"未填满"），姓名固定在条幅上方不受宽度影响；
   第 7 名往后跳出卡片，变成中性样式的普通列表行，可以一直往下翻 ── */
.lb-wrap{padding:0 20px 20px}
.lb-tabs{display:flex;gap:6px;margin-bottom:16px}
.lb-tab{flex:1;padding:10px 12px;text-align:center;font-size:13px;font-weight:600;
  background:var(--bg3);color:var(--soft);border:1.5px solid var(--hair);border-radius:var(--r-md);
  cursor:pointer;transition:transform .12s,background .15s,color .15s,border-color .15s}
.lb-tab:active{transform:scale(.96)}
.lb-tab.active{background:var(--accent);color:#FFF8E8;border-color:var(--accent)}
.lb-sub{font-size:12px;color:var(--soft);text-align:center;margin-bottom:14px;font-weight:500}
.lb-note{font-size:11px;color:var(--warn);text-align:center;margin-top:12px}

/* TOP 6 卡片容器：唯一的强调色重点区域 */
.lb-card{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px 18px 16px;
  margin-bottom:14px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%);
  box-shadow:0 2px 4px rgba(40,20,5,.14),0 10px 22px rgba(122,84,20,.28),0 22px 44px rgba(122,84,20,.16)}
.lb-card::after{content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.16) 45%,transparent 60%);
  background-size:220% 100%;background-position:130% 0;animation:shimmer 4.2s ease-in-out infinite;pointer-events:none}
@keyframes shimmer{0%,55%{background-position:130% 0}100%{background-position:-50% 0}}
.lb-card-cap{position:relative;z-index:1;font-size:10.5px;font-weight:700;letter-spacing:.14em;
  color:rgba(255,248,232,.7);text-transform:uppercase;margin-bottom:14px}

/* 条幅行：长度按分数占最高分比例缩放，第一名最长；不接背景轨道；
   姓名/分数固定在条幅上方，不受条幅宽度影响 */
.lb-bar-row{position:relative;z-index:1;margin-bottom:14px}
.lb-bar-row:last-child{margin-bottom:0}
.lb-bar-meta{display:flex;align-items:baseline;gap:7px;margin-bottom:6px;padding:0 2px}
.lb-bar-rank{font-family:var(--fnt-display);font-size:13.5px;font-weight:600;color:rgba(255,248,232,.55);
  flex-shrink:0;width:16px;text-align:center}
.lb-bar-row.first .lb-bar-rank{color:#FFF8E8;font-size:16px}
.lb-bar-name{flex:1;font-size:13.5px;font-weight:600;color:#FFF8E8;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-bar-tag{font-size:9.5px;font-weight:700;color:var(--accent-deep);background:rgba(255,248,232,.85);
  border-radius:var(--r-sm);padding:1px 6px;flex-shrink:0}
.lb-bar-grade{font-size:10px;color:rgba(255,248,232,.55);flex-shrink:0}
.lb-bar-score{font-family:var(--fnt-display);font-size:13px;font-weight:600;color:#FFF8E8;flex-shrink:0}
.lb-bar-score-u{font-size:9.5px;color:rgba(255,248,232,.6);font-weight:400;margin-left:1px;font-family:var(--fnt)}
.lb-bar-fill{height:30px;border-radius:var(--r-sm);min-width:24px;
  background:#FFF8E8;transition:width .5s cubic-bezier(.22,1,.36,1)}
.lb-card-empty{position:relative;z-index:1;text-align:center;padding:18px 0;font-size:13px;color:rgba(255,248,232,.7)}

/* 第 7 名往后：跳出卡片，中性列表行，可以一直往下翻 */
.lb-plain-row{display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--bg3);border:1px solid var(--hair);border-radius:var(--r-md);margin-bottom:7px}
.lb-plain-row.me{background:var(--accent-soft);border-color:var(--accent)}
.lb-plain-rank{font-family:var(--fnt-display);font-size:13.5px;font-weight:600;color:var(--faint);
  width:24px;flex-shrink:0;text-align:center}
.lb-plain-name{flex:1;font-size:14px;font-weight:500;color:var(--ink);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:baseline;gap:6px}
.lb-plain-grade{font-size:10.5px;color:var(--faint);flex-shrink:0}
.lb-plain-score{font-family:var(--fnt-display);font-size:14px;font-weight:600;color:var(--ink);flex-shrink:0}
.lb-plain-score-u{font-size:10.5px;color:var(--faint);font-weight:400;margin-left:1px;font-family:var(--fnt)}
.lb-plain-tag{font-size:9.5px;font-weight:700;color:#FFF8E8;background:var(--accent);
  border-radius:var(--r-sm);padding:1px 6px;flex-shrink:0}

/* 年级分区标题 */
.lb-grade-section{margin-bottom:24px}
.lb-grade-section:last-child{margin-bottom:0}
.lb-grade-title{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--faint);
  text-transform:uppercase;margin-bottom:10px;padding:0 4px}
.lb-empty{text-align:center;padding:40px 0;font-size:13px;color:var(--soft);line-height:1.7}
/* 里程碑 */
.ms-card{display:flex;align-items:center;gap:14px;padding:16px;
  background:linear-gradient(180deg,#FDF8F0,#EEE2C4);
  border:1px solid #C8A860;border-bottom:3px solid #9A7830;border-radius:16px;
  margin-bottom:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 2px 6px rgba(40,20,5,.10)}
.ms-card.done{background:linear-gradient(180deg,#EAF4D8,#C8E0A0);
  border-color:#8AB050;border-bottom-color:#5A8020}
.ms-card.cur{background:linear-gradient(180deg,#F5F0D8,#E8D8A0);
  border-color:#C8A860;border-bottom-color:#9A7830}
.ms-tx b{font-size:16px;font-weight:600;color:#3A2A10;display:block;margin-bottom:3px}
.ms-tx span{font-size:12px;color:#A08040}
/* 错词本 / ebook卡片 */
.ebook{display:flex;align-items:center;gap:14px;padding:16px 18px;
  background:linear-gradient(180deg,#FFFFFF 0%,#F8F0E0 100%);
  border:1px solid #D8C090;border-bottom:3px solid #B09050;border-radius:18px;
  margin-bottom:12px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 2px 6px rgba(40,20,5,.10),
    0 6px 18px rgba(40,20,5,.06);
  transition:transform .1s,box-shadow .1s,border-bottom-width .1s}
.ebook:active{transform:translateY(2px);border-bottom-width:1px}
.ebook.empty{opacity:.45;cursor:default;border-bottom-width:1px}
.ebook .rt b{font-size:16px;font-weight:600;color:#3A2A10;display:block;margin-bottom:3px}
.ebook .rt span{font-size:12px;color:#A08040}
.ebook .dot{width:30px;height:30px;border-radius:50%;
  background:linear-gradient(145deg,#CC5A28,#9A3A10);
  border:1px solid #7A2808;border-bottom:2px solid #4A1000;
  color:#FDF8F0;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(40,20,5,.14),inset 0 1px 0 rgba(255,200,150,.2)}
/* 弹窗 ring */
.ring{width:72px;height:72px;border-radius:50%;margin:0 auto 14px;
  background:linear-gradient(145deg,#F0B830,#C08818);
  border:1px solid #C89828;border-bottom:4px solid #906808;
  box-shadow:0 4px 14px rgba(40,20,5,.18),inset 0 1px 0 rgba(255,248,180,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;animation:ringPop .5s cubic-bezier(.34,1.4,.64,1)}
.rk{font-size:9.5px;font-weight:700;letter-spacing:.2em;color:#C8A870;
  text-transform:uppercase;text-align:center;margin-bottom:10px}
/* 拼写挑战 */
.spell-toggle-row{border:1px solid #C8A860;border-bottom:3px solid #9A7830;
  background:linear-gradient(180deg,#FDF8F0 0%,#EEE2C4 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 2px 5px rgba(40,20,5,.08)}
.spell-toggle-pts{color:#A07018;background:linear-gradient(180deg,#F5F0D8,#E8D8A0);
  border:1px solid #C8A860;border-bottom:1.5px solid #9A7830;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.spell-submit{background:linear-gradient(180deg,#D4A030 0%,#A87818 100%);
  border:1px solid #906010;border-bottom:3px solid #5A3808;
  box-shadow:inset 0 1px 0 rgba(255,240,160,.4),0 2px 6px rgba(40,20,5,.14);color:#FDF8F0}
.spell-submit:active{transform:translateY(2px);border-bottom-width:1px}
.spell-input:focus{border-color:#C89030;box-shadow:0 0 0 3px rgba(200,144,48,.15)}
/* Pass2 横幅 */
.pass2-banner{background:linear-gradient(135deg,#E8F0FF,#D8E8FF);
  border:1px solid #8AAAE0;border-bottom:2px solid #5A8ACA;
  border-radius:14px;box-shadow:0 2px 6px rgba(40,60,120,.1)}

/* ── 年级选择卡片：复用单元卡片同款"立体精装书"SVG插画（stageBookSVG），
   颜色和文字全部画在SVG内部，外层卡片只负责圆角阴影容器 + 点击反馈 ── */
.grd-sgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 20px}
.grd-card{border-radius:20px;overflow:hidden;aspect-ratio:162/228;position:relative;cursor:pointer;
  box-shadow:0 1px 2px rgba(40,20,5,.08),0 4px 10px rgba(40,20,5,.10),
    0 12px 26px rgba(40,20,5,.08),0 20px 40px rgba(40,20,5,.05);
  transition:transform .18s cubic-bezier(.34,1.4,.64,1),box-shadow .18s}
.grd-card svg{position:absolute;inset:0;width:100%;height:100%}
.grd-card:active{transform:scale(.96) translateY(2px);box-shadow:0 2px 6px rgba(40,20,5,.12)}

/* ── 年级内列表 3D 按钮 ── */
.grd-btn{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;cursor:pointer;
  background:linear-gradient(180deg,#FFFFFF 0%,#F8F0E0 100%);
  border:1px solid #D8C090;border-bottom:3px solid #B09050;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 6px rgba(40,20,5,.08),
    0 6px 18px rgba(40,20,5,.04);
  transition:transform .1s,box-shadow .1s,border-bottom-width .1s}
.grd-btn:active{transform:translateY(2px);border-bottom-width:1px}
.grd-btn.glock{opacity:.35;cursor:not-allowed;border-bottom-width:1px}
.grd-btn.glock:active{transform:none}
.grd-btn-label{font-size:17px;font-weight:600;color:#3A2A10;letter-spacing:-.02em;flex:1}

/* ── 答题区精简（全部6选项一屏可见）── */
.bar{padding:8px 16px;min-height:48px}
.qcn{padding:14px 20px 8px}
.qt{font-size:22px}
.en-q{font-size:24px}
.opts{gap:8px;padding:4px 16px 12px}
.opt{min-height:44px;padding:9px 10px;font-size:13px}

/* ── 标题居中阴影 3D ── */
.htitle{text-align:center;font-size:16px;font-weight:700;color:#3A2A10;
  text-shadow:0 1px 2px rgba(40,20,5,.14),0 3px 8px rgba(40,20,5,.08);
  letter-spacing:-.02em}
</style>
</head>

function load(){

 if(!S.gd)S.gd={};
 migrateLevelCaps();
 if(unified) S.name = unified;
 if(unified){
  try{
   const nr=lsGet(KEY+'_'+unified);
   if(nr){S=Object.assign(S,JSON.parse(nr));S.name=unified;if(!S.gd)S.gd={};migrateLevelCaps();}

// ★ 老用户升级兼容：以前没有"错词健康度"这套机制，不能让新规则一上线就把老用户打回起点。
// 给每个年级补一次性的 capLv 记录——健康达标的年级不用管（升级逻辑会正常按分数走），
// 不达标的年级先把"当前分数对应的等级"保底记下来，新规则只管"以后"，不倒退"以前"。
function migrateLevelCaps(){
 for(const gid in S.gd){
   const g=S.gd[gid];if(g.capLv)continue;
   const p=g.points||0;const P=g.prog||{};let inBox=0,overdue=0;
   for(const id in P){const r=P[id];if(r.box>=0&&r.box<INTERVALS.length){inBox++;if(Date.now()-r.due>OVERDUE_GRACE)overdue++;}}
   const hp=inBox===0?100:Math.round((1-overdue/inBox)*100);
   if(hp<HEALTH_PASS)g.capLv=levelOf(p).name;
 }
}
function save(){try{const raw=JSON.stringify(S);lsSet(KEY,raw);if(S.name)lsSet(KEY+'_'+S.name,raw);}catch(e){}cloudProgressUpdate();}
function parseMaybeJSON(v){if(!v)return null;if(typeof v==="string"){try{return JSON.parse(v);}catch(e){return null;}}return v;}
function cloudGdFrom(raw){
 raw=parseMaybeJSON(raw);
 if(!raw)return null;
 if(raw.vocab)return cloudGdFrom(raw.vocab);
 if(raw.gd&&typeof raw.gd==="object")return raw.gd;
 if(raw.progress_data)return cloudGdFrom(raw.progress_data);
 for(const gid in raw){if(gradeById(gid)&&raw[gid]&&typeof raw[gid]==="object")return raw;}
 return null;
}
function progressWeight(g){
 if(!g)return 0;
 let n=(g.points||0)*2;
 const P=g.prog||{};
 for(const id in P){
  const r=P[id]||{};
  n+=1+(r.seenR?2:0)+(r.seenW?2:0)+(r.grad?8:0)+(r.box>=0?Math.min(5,r.box+1):0);
 }
 const st=g.stages||{};
 for(const u in st){
  const s=st[u]||{};
  n+=(s.R?20:0)+(s.W?20:0)+(s.L?20:0)+(s.Rn||0)+(s.Wn||0)+(s.Ln||0);
 }
 n+=(g.pass||0)*100+(g.pass2?80:0)+(g.monsterCount||0)*10+(g.dailyCount||0)*10+(g.exemptGiven||0)*5;
 return n;
}
function recWeight(r){
 if(!r)return 0;
 return (r.grad?100:0)+(r.seenR?10:0)+(r.seenW?10:0)+(r.box>=0?Math.min(20,(r.box+1)*3):0)+(r.last==="good"?5:0)+(r.due?1:0);
}
function mergeProg(a,b){
 const out=Object.assign({},a||{});
 for(const id in (b||{})){
  const old=out[id]||{}, cur=b[id]||{};
  out[id]=recWeight(cur)>recWeight(old)?Object.assign({},old,cur):Object.assign({},cur,old);
  if(old.grad||cur.grad)out[id].grad=1;
  if(old.seenR||cur.seenR)out[id].seenR=1;
  if(old.seenW||cur.seenW)out[id].seenW=1;
  if(old.last==="bad"||cur.last==="bad")out[id].last="bad";
 }
 return out;
}
function mergeStages(a,b){
 const out=Object.assign({},a||{});
 for(const u in (b||{})){
  const old=out[u]||{}, cur=b[u]||{};
  out[u]=Object.assign({},old,cur);
  out[u].R=!!(old.R||cur.R);out[u].W=!!(old.W||cur.W);out[u].L=!!(old.L||cur.L);
  out[u].Rn=Math.max(old.Rn||0,cur.Rn||0);out[u].Wn=Math.max(old.Wn||0,cur.Wn||0);out[u].Ln=Math.max(old.Ln||0,cur.Ln||0);
 }
 return out;
}
function mergeGradeData(local,cloud){
 local=local||{};cloud=cloud||{};
 const out=Object.assign({},local,cloud);
 out.points=Math.max(local.points||0,cloud.points||0);
 out.prog=mergeProg(local.prog,cloud.prog);
 out.stages=mergeStages(local.stages,cloud.stages);
 ["pass","monsterCount","dailyCount","exemptGiven"].forEach(k=>{out[k]=Math.max(local[k]||0,cloud[k]||0);});
 out.pass2=!!(local.pass2||cloud.pass2);
 out.act=Object.assign({},cloud.act||{},local.act||{});
 out.qp=Object.assign({},cloud.qp||{},local.qp||{});
 return out;
}
function mergeCloudGd(raw){
 const cg=cloudGdFrom(raw);
 if(!cg)return false;
 let changed=false;
 if(!S.gd)S.gd={};
 for(const gid in cg){
  if(!gradeById(gid)||!cg[gid])continue;
  const localReset=(S.gd[gid]&&S.gd[gid].resetAt)||0;
  const cloudReset=cg[gid].resetAt||0;
  if(localReset&&cloudReset<=localReset)continue;
  if(cloudReset&&cloudReset>localReset&&progressWeight(cg[gid])<progressWeight(S.gd[gid])){
   S.gd[gid]=Object.assign({points:0,prog:{}},cg[gid]);
   changed=true;
   continue;
  }
  const before=progressWeight(S.gd[gid]);
  const merged=mergeGradeData(S.gd[gid],cg[gid]);
  const after=progressWeight(merged);
  if(!S.gd[gid]||after>before){
   S.gd[gid]=merged;
   changed=true;
  }
 }
 return changed;
}

function beep(f,d,t,v,dl){if(S.muted)return;const c=actx();if(!c)return;const tm=c.currentTime+(dl||0);
 const o=c.createOscillator(),g=c.createGain();o.type=t||"sine";o.frequency.value=f;o.connect(g);g.connect(c.destination);
 g.gain.setValueAtTime(0,tm);g.gain.linearRampToValueAtTime(v||.14,tm+.012);g.gain.exponentialRampToValueAtTime(.0001,tm+d);
 o.start(tm);o.stop(tm+d+.02);}

/* ============ TTS 语音（自然音色优先） ============ */
const TTS={ok:false,voice:null};
// 优先级最高的高质量声音（按优先级排序）
const PREFERRED_VOICES=[
 // iOS/macOS 高质量
 'Samantha','Alex','Fred','Victoria','Daniel','Karen','Moira','Tessa',
 // Google 高质量
 'Google US English','Google UK English Female','Google UK English Male',
 // Windows 10/11 高质量
 'Microsoft Aria Online','Microsoft Guy Online','Microsoft Jenny Online',
 'Microsoft Zira','Microsoft David','Microsoft Mark',
 // Android
 'en-us-x-sfg','en-us-x-tpd','en-us-x-tpf',
];
// 绝对避免的机械声音（关键词黑名单）
const BAD_VOICE_KEYWORDS=['espeak','festival','mbrola','pico','flite'];

function pickBestVoice(vs){
 // 过滤掉明确机械的声音
 const filtered=vs.filter(v=>{
  const n=v.name.toLowerCase();
  return !BAD_VOICE_KEYWORDS.some(bad=>n.includes(bad));
 });
 if(!filtered.length)return vs[0];
 
 // 按优先级列表找
 for(const name of PREFERRED_VOICES){
  const found=filtered.find(v=>v.name.toLowerCase().includes(name.toLowerCase()));
  if(found)return found;
 }
 
 // 次选：localService=true 的声音（本地高质量）
 const local=filtered.filter(v=>v.localService);
 if(local.length){
  // 优先美式英语
  const usLocal=local.find(v=>/en[-_]US/i.test(v.lang));
  if(usLocal)return usLocal;
  return local[0];
 }
 
 // 最后：任何英语声音
 const usVoice=filtered.find(v=>/en[-_]US/i.test(v.lang));
 return usVoice||filtered[0];
}

 if(!("speechSynthesis"in window))return;
 const pick=()=>{
  const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_|$)/i.test(v.lang));
  if(!vs.length)return;
  TTS.voice=pickBestVoice(vs);
  TTS.ok=true;
 };
 pick();
 if(!TTS.ok)speechSynthesis.onvoiceschanged=pick;
 // 部分浏览器需要延迟
 setTimeout(()=>{if(!TTS.ok){const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_|$)/i.test(v.lang));if(vs.length){TTS.voice=pickBestVoice(vs);TTS.ok=true;}}},500);
}
function toggleVoice(){

 const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_|$)/i.test(v.lang));
 if(!vs.length)return;
 const cur=TTS.voice;
 const idx=vs.findIndex(v=>v===cur);

function speak(text){
 if(!TTS.ok||S.muted||!text)return;
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(TTS.voice)u.voice=TTS.voice;
  u.lang=(TTS.voice&&TTS.voice.lang)||"en-US";
  u.rate=0.85;   // 稍慢，更清晰
  u.pitch=1.0;   // 自然音调（不调高，避免机械感）
  u.volume=1.0;
  u.onerror=()=>{};
  speechSynthesis.speak(u);
 }catch(e){}
}

// 重刷积分衰减：第1次满分，第2次30%，第3次起10%（最少1分）
function repeatMult(unitN,key){
  const st=unitStage(unitN);
  const countKey=key+"n"; // Rn / Wn / Ln
  const n=st[countKey]||0;
  if(n===0)return 1;
  if(n===1)return 0.3;
  return 0.1;
} // 无语音时听力关不计

function seededRand(seed){let s=seed;return()=>{s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;};}

 // 用日期+年级做种子，保证同一天同一年级题目相同

 const rng=seededRand(seed);
 const allWords=WORDS.filter(w=>w.type==="word");
 const shuffled=allWords.slice().sort(()=>rng()-0.5);

// 字符集重叠率（中文模糊匹配）
function _charOverlap(a,b){if(!a||!b)return 0;const sa=new Set(a),sb=new Set(b);let c=0;for(const x of sa)if(sb.has(x))c++;return c/Math.min(sa.size,sb.size);}
// 编辑距离
function _levenshtein(a,b){const m=a.length,n=b.length,dp=[];for(let i=0;i<=m;i++){dp[i]=new Array(n+1);for(let j=0;j<=n;j++)dp[i][j]=i?j?0:i:j;}for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n];}

// ===== 拼写题答案匹配（runSpellingQuiz 和 复习中心拼写复习 共用）=====
const normalizeSpell=(s)=>s.toLowerCase().trim().replace(/[·\s\-_]/g,'');
function checkSpellAnswer(val,w,isEn){
 const v=normalizeSpell(val);if(!v)return false;
 if(isEn){const norm=normalizeSpell(w.en);if(norm===v)return true;if(norm.length>=5&&_levenshtein(norm,v)<=1)return true;return false;}
 const cleanV=val.trim().replace(/\s+/g,'');if(!cleanV)return false;
 // 单个短语匹配（去括号后的 core 与原始 raw 都试）
 const matchPhrase=(phrase)=>{
   if(!phrase)return false;
   const core=phrase.replace(/[（(][^）)]*[）)]/g,'').replace(/[；;]\s*$/,'').trim();
   const nCore=normalizeSpell(core),nPh=normalizeSpell(phrase);
   if(nCore===v||nPh===v)return true;
   if(cleanV.length>=1&&(core===cleanV||phrase===cleanV))return true;
   if(cleanV.length>=2&&(core.includes(cleanV)||phrase.includes(cleanV)))return true;
   if(core.length>=2&&cleanV.includes(core))return true;
   if(cleanV.length>=2&&core.length>=2&&_charOverlap(cleanV,core)>=0.60)return true;
   if(nCore.length>=2&&nCore.length<=4&&_levenshtein(nCore,v)<=1)return true;
   return false;
 };
 // 第一关：比对数据库里存的所有释义（含逗号拆分后的分段）
 if(w.s.some(x=>{
   const raw=x[1].trim();
   if(matchPhrase(raw))return true;
   const segs=raw.split(/[，,；;\/、]/);
   return segs.length>1&&segs.some(seg=>matchPhrase(seg.trim()));
 }))return true;
 // 第二关：多义词扩展表（同一英文单词的其他常见中文义项）
 const enKey=w.en.toLowerCase().replace(/[^a-z]/g,'');
 const alts=ZH_MULTI[enKey];
 if(alts&&alts.some(alt=>cleanV===alt||(cleanV.length>=2&&alt.includes(cleanV))||(alt.length>=2&&cleanV.includes(alt))))return true;
 // 第三关：中文近义词组（学生写了与标准答案等价的近义词）
 const storedSegs=w.s.flatMap(x=>x[1].split(/[，,；;\/、]/)).map(s=>s.trim()).filter(Boolean);
 for(const seg of storedSegs){
   const grp=ZH_SYN.find(g=>g.some(syn=>seg===syn||seg.includes(syn)||(syn.length>=2&&seg.includes(syn))));
   if(grp&&grp.some(syn=>cleanV===syn||(cleanV.length>=2&&syn.includes(cleanV))||(syn.length>=2&&cleanV.includes(syn))))return true;
 }
 return false;
}

 d.innerHTML=`
  <div class="bar"><button class="back" id="bk">‹</button><div class="htitle">${modeLabel}</div></div>
  <div class="qhud"><div class="tk"><i style="width:${i/pool.length*100}%"></i></div><div class="ct">${i+1} / ${pool.length}</div></div>

  <div class="spell-input-wrap" style="margin:14px 0 10px">

    <div class="spell-pts-badge">+${PT_SPELL[mode]}</div>

 app.appendChild(d);
 if(mode==="L"){const play=()=>speak(w.en);d.querySelector("#bigspk").onclick=play;setTimeout(()=>{if(!_stageAborted)play();},300);}
 d.querySelector("#bk").onclick=()=>{sfx.tap();_stageAborted=true;go({name:"unit",arg:u.n});};
 const inp=d.querySelector("#sinput");
 const answerEl=d.querySelector("#sanswer");
 const submitBtn=d.querySelector("#ssubmit");
 let answered=false;
 const checkAnswer=(val)=>checkSpellAnswer(val,w,isEn);
 const doSubmit=()=>{
   if(answered)return;const val=inp.value;if(!val.trim()){inp.focus();return;}
   answered=true;inp.disabled=true;submitBtn.disabled=true;speak(w.en);
   const correct=checkAnswer(val);
   if(correct){
     inp.classList.add('correct');answerEl.style.color='var(--ok)';answerEl.textContent='✓ 正确！';
     markResult(w,true,mode);acc.got++;acc.combo++;acc.maxCombo=Math.max(acc.maxCombo||0,acc.combo);
     const base=PT_SPELL[mode]+(acc.combo>=PT.comboFrom?PT.comboStep:0);
     acc.gain+=base;addPoints(base);
     if(acc.combo>=PT.comboFrom){showCombo(acc.combo);sfx.combo(acc.combo);}else sfx.correct();
     afterPoint(()=>setTimeout(()=>{if(!_stageAborted)runSpellingQuiz(u,pool,i+1,acc,mode);},700));
   }else{
     inp.classList.add('wrong');
     const correctStr=isEn?w.en:w.s.map(x=>`${x[0]?x[0]+" ":""}${x[1]}`).join("；");
     answerEl.style.color='var(--warn)';answerEl.textContent=`✗ 正确答案：${correctStr}`;
     markResult(w,false,mode);acc.combo=0;acc.wrong++;sfx.wrong();
     setTimeout(()=>{if(!_stageAborted)runSpellingQuiz(u,pool,i+1,acc,mode);},1200);
   }
 };
 submitBtn.onclick=doSubmit;inp.addEventListener('keydown',e=>{if(e.key==='Enter')doSubmit();});
 setTimeout(()=>inp.focus(),300);
}

function build4cnFast(w){
 const pos=w.s[0][0];const pool=WORDS.filter(x=>x.type!=='name'&&x.id!==w.id);
 const same=shuffle(pool.filter(x=>x.s[0][0]===pos));const rest=shuffle(pool.filter(x=>x.s[0][0]!==pos));
 const dis=[...same.slice(0,2),...rest.slice(0,1)].slice(0,3).map(x=>({cn:cnTextClean(x),correct:false}));
 const extra=shuffle(pool.filter(x=>!dis.find(d=>d.cn===cnTextClean(x))));
 while(dis.length<3&&extra.length)dis.push({cn:cnTextClean(extra.shift()),correct:false});
 dis.push({cn:cnTextClean(w),correct:true});return shuffle(dis);
}
function build4enFast(w){
 const pos=w.s[0][0];const pool=WORDS.filter(x=>x.type==='word'&&x.id!==w.id);
 const same=shuffle(pool.filter(x=>x.s[0][0]===pos));const rest=shuffle(pool.filter(x=>x.s[0][0]!==pos));
 const dis=[...same.slice(0,2),...rest.slice(0,1)].slice(0,3).map(x=>({en:x.en,correct:false}));
 const extra=shuffle(pool.filter(x=>!dis.find(d=>d.en===x.en)));
 while(dis.length<3&&extra.length)dis.push({en:extra.shift().en,correct:false});
 dis.push({en:w.en,correct:true});return shuffle(dis);
}

     {headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});

 }catch(e){return[];}
