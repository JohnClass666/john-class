// ===== 拼写题答案匹配（runSpellingQuiz 和 复习中心拼写复习 共用）=====
const normalizeSpell=(s)=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
/* 英文答案的所有可接受写法：
   - 去掉标点、省略号、括号注释：not … at all → not at all；What about …? → what about
   - 括号里的可选部分可写可不写：drop out (of sth) / keep (…) in mind
   - 斜杠表示二选一：a lot of / lots of；be / get used to；make sb's/the bed
   - sb / sth / one's 这类占位词可写可不写 */
function enAnswerVariants(en){
 let base=String(en||'').replace(/\(\s*=[^)]*\)/g,' ').replace(/\s+(n|v|adj|adv)\.\s*$/,'').replace(/[…]|\.\.\.+/g,' ');
 const withOpt=[base.replace(/[()]/g,' '),base.replace(/\([^)]*\)/g,' ')];
 let outs=[];
 withOpt.forEach(v=>{
   if(/\s\/\s/.test(v)){
     const parts=v.split(/\s\/\s/);
     if(parts.every(x=>x.trim().split(/\s+/).length>=2)){parts.forEach(x=>outs.push(x));return;}
     v=v.replace(/\s\/\s/g,'/');
   }
   // 词内斜杠：逐词二选一
   let seqs=[[]];
   v.trim().split(/\s+/).forEach(tok=>{const alts=tok.split('/').filter(Boolean);const nx=[];seqs.forEach(q=>alts.forEach(al=>nx.push(q.concat(al))));seqs=nx.slice(0,16);});
   seqs.forEach(q=>outs.push(q.join(' ')));
 });
 const res=new Set();
 outs.forEach(o=>{res.add(normalizeSpell(o));
   const noPh=o.split(/\s+/).filter(t=>!/^(sb|sth|sb's|one's|someone|something)$/i.test(t.replace(/[^a-z']/gi,''))).join(' ');
   res.add(normalizeSpell(noPh));});
 res.delete('');return [...res];
}
/* 中文作答的否定一致性：答案里有"不/没/无/非/未"而标准义项没有（或反过来），一律不算对。
   防止 unhappy 答"快乐的"、impossible 答"可能的"被判对 */
function _hasNeg(t){return /不|没|无|非|未/.test(String(t).replace(/不过|不错|不管|无论|非常|非洲|未来|不得不/g,''));}
function _stripZh(t){return String(t||'').replace(/[（(][^）)]*[）)]/g,'').replace(/[……\s]/g,'').replace(/[；;。，,]+$/,'').trim();}
function _core(t){return _stripZh(t).replace(/[的地]$/,'');}
/* 看中文写英文时，中文可能对应本册里另一个同义词条（如"工厂"= plant / factory，"比赛；竞赛"= match / race）。
   学生写出的是另一个词条，且词性相同、那个词条的意思完全覆盖题干意思，也判为正确。 */
function sameMeaningAlt(v,w){
 const tk=meaningKeys(w);if(!tk.size)return null;const pos=String(w.s[0][0]||"").replace(/\([^)]*\)/g,"").trim();
 for(const x of WORDS){if(x.id===w.id||x.type==="name")continue;
   if(!enAnswerVariants(x.en).includes(v))continue;
   const xp=String(x.s[0][0]||"").replace(/\([^)]*\)/g,"").trim();if(xp!==pos)continue;
   const xk=meaningKeys(x);if([...tk].every(k=>xk.has(k)))return x;}
 return null;}
function checkSpellAnswer(val,w,isEn){
 const v=normalizeSpell(val);
 if(isEn){
   if(!v)return false;
   const vars=enAnswerVariants(w.en);
   if(vars.includes(v))return true;
   const main=normalizeSpell(w.en);
   if(main.length>=5&&_levenshtein(main,v)<=1)return true; // 长词允许 1 个字母的笔误
   if(vars.some(x=>x.length>=6&&_levenshtein(x,v)<=1))return true;
   return !!sameMeaningAlt(v,w);
 }
 const cleanV=_stripZh(val);if(!cleanV)return false;
 const ansCore=cleanV.replace(/[的地]$/,'');
 const negA=_hasNeg(cleanV);
 // 标准义项拆成独立的意思段
 const segs=[];w.s.forEach(x=>{const raw=cleanMeaning(x[1]);segs.push(raw);raw.split(/[，,；;\/、]/).forEach(z=>{if(z.trim())segs.push(z.trim());});});
 const okSeg=(seg)=>{
   const sc=_core(seg);if(!sc)return false;
   if(_hasNeg(seg)!==negA)return false;
   if(sc===ansCore)return true;
   // 学生写得更完整：包含整个标准义项（"非常友好的" 含 "友好"）
   if(sc.length>=2&&ansCore.includes(sc)&&ansCore.length<=sc.length+3)return true;
   // 学生写得略短：至少覆盖标准义项的一半，且不少于 2 个字（"爱好"≈"业余爱好"）
   if(ansCore.length>=2&&sc.includes(ansCore)&&ansCore.length*2>=sc.length)return true;
   return false;
 };
 if(segs.some(okSeg))return true;
 // 多义词扩展表（同一英文单词的其他常见义项，只接受整词相等）
 const enKey=w.en.toLowerCase().replace(/[^a-z]/g,'');
 const alts=ZH_MULTI[enKey];
 if(alts&&alts.some(alt=>_core(alt)===ansCore))return true;
 // 近义词组：标准义项本身（去掉"的/地"）必须正好是组内的某个词，学生答案也必须正好是组内的某个词
 for(const seg of segs){
   const sc=_core(seg);if(_hasNeg(seg)!==negA)continue;
   const grp=ZH_SYN.find(g=>g.includes(sc));
   if(grp&&grp.includes(ansCore))return true;
   // 同为"不+X"的否定形式：比较去掉"不"之后的部分（"不快乐"≈"不开心"）
   if(negA&&/^不/.test(sc)&&/^不/.test(ansCore)){const g2=ZH_SYN.find(g=>g.includes(sc.slice(1)));if(g2&&g2.includes(ansCore.slice(1)))return true;}
 }
 return false;
}

function build4cnFast(w){

function build4enFast(w){

async function speedGetLBRemote(grade){

   const r=await fetch(`${SUPABASE_URL}/rest/v1/speed_scores?grade=eq.${encodeURIComponent(grade)}&select=name,score&order=score.desc&limit=200`,

function runSpeedChallenge(){
 if(_sgRAF){cancelAnimationFrame(_sgRAF);_sgRAF=null;}
 if(_sgTimer){clearInterval(_sgTimer);_sgTimer=null;}
 clear();
 // 高中：速度挑战统一用前两个难度区（第 1–22 组，最常用的 1100 词），排行榜才公平
 const words=(isTiered()?UNITS.filter(u=>u.tier<=1).flatMap(u=>u.words):WORDS).filter(w=>w.type==='word'||w.type==='phrase');
 if(words.length<4){go('home');return;}
 const TOTAL_SECS=60,cW=428,cH=180;
 let score=0,secsLeft=TOTAL_SECS,gap=155,visualSX=310;
 let gameOver=false,escaped=false,answered=false;
 const SWIMMER_Y=cH/2+5,SHARK_Y=cH/2+10;
 const bubbles=Array.from({length:14},()=>({x:Math.random()*cW,y:cH*0.3+Math.random()*cH*0.7,r:Math.random()*1.8+0.6,speed:Math.random()*0.25+0.15}));

 let curQ=getCurQ();
 const d=document.createElement('div');d.className='screen active';
 d.innerHTML=`
  <div class="sg-hud">

  </div>
  <canvas id="sgc" width="${cW}" height="${cH}" style="display:block;width:100%;border-radius:14px;margin-bottom:10px"></canvas>
  <div class="sg-qa"><div class="sg-q" id="sgq"></div><div class="sg-opts" id="sgopts"></div></div>`;
 app.appendChild(d);
 const canvas=d.querySelector('#sgc');const ctx=canvas.getContext('2d');
 const drawOcean=(t)=>{
   const g=ctx.createLinearGradient(0,0,0,cH);g.addColorStop(0,'#0880A8');g.addColorStop(.35,'#045E82');g.addColorStop(1,'#012040');
   ctx.fillStyle=g;ctx.fillRect(0,0,cW,cH);
   ctx.save();ctx.fillStyle='rgba(20,150,210,.38)';ctx.beginPath();ctx.moveTo(0,0);
   for(let x=0;x<=cW;x++)ctx.lineTo(x,13+Math.sin(x*.032+t*.0018)*4+Math.sin(x*.068-t*.0011)*2);
   ctx.lineTo(cW,0);ctx.closePath();ctx.fill();ctx.restore();
   bubbles.forEach(b=>{b.y-=b.speed;if(b.y<0){b.y=cH;b.x=Math.random()*cW;}ctx.fillStyle='rgba(180,230,255,.30)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();});
 };
 const drawShark=(cx,cy,t,angry)=>{
   ctx.save();const tw=Math.sin(t*.004)*10;
   ctx.fillStyle=angry?'#7A8898':'#6A7888';ctx.beginPath();ctx.ellipse(cx,cy,62,17,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#B0C4D4';ctx.beginPath();ctx.ellipse(cx+8,cy+6,50,9,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#586878';ctx.beginPath();ctx.moveTo(cx-8,cy-17);ctx.lineTo(cx+12,cy-38);ctx.lineTo(cx+24,cy-17);ctx.closePath();ctx.fill();
   ctx.beginPath();ctx.moveTo(cx+8,cy+6);ctx.lineTo(cx+22,cy+26);ctx.lineTo(cx-4,cy+10);ctx.closePath();ctx.fill();
   ctx.beginPath();ctx.moveTo(cx-62,cy+tw*.4);ctx.lineTo(cx-84,cy-22+tw);ctx.lineTo(cx-70,cy+tw*.3);ctx.lineTo(cx-84,cy+22+tw);ctx.closePath();ctx.fill();
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+42,cy-6,6.5,0,Math.PI*2);ctx.fill();

   if(angry){ctx.strokeStyle='#800';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx+36,cy-13);ctx.lineTo(cx+48,cy-9);ctx.stroke();}
   ctx.fillStyle='#E06060';ctx.beginPath();ctx.moveTo(cx+52,cy+2);ctx.bezierCurveTo(cx+64,cy-2,cx+68,cy+10,cx+56,cy+14);ctx.closePath();ctx.fill();
   ctx.fillStyle='#fff';for(let i=0;i<5;i++){const tx=cx+52+i*3.5;ctx.beginPath();ctx.moveTo(tx,cy+2);ctx.lineTo(tx+1.6,cy+7);ctx.lineTo(tx+3.2,cy+2);ctx.fill();}
   ctx.restore();
 };
 const drawSwimmer=(sx,sy,t,esc)=>{
   const sp=Math.sin(t*.005);ctx.strokeStyle='#FDF8F0';ctx.lineWidth=2.5;ctx.lineCap='round';
   ctx.fillStyle='#FDF8F0';ctx.beginPath();ctx.arc(sx+18,sy-2,8,0,Math.PI*2);ctx.fill();
   ctx.beginPath();ctx.moveTo(sx+10,sy);ctx.lineTo(sx-14,sy+2);ctx.stroke();
   ctx.beginPath();ctx.moveTo(sx+6,sy-2);ctx.lineTo(sx+26+sp*8,sy-7+sp*8);ctx.stroke();
   ctx.beginPath();ctx.moveTo(sx+4,sy+2);ctx.lineTo(sx-16,sy+4+(1-sp)*6);ctx.stroke();
   const kick=Math.sin(t*.007)*11;
   ctx.beginPath();ctx.moveTo(sx-14,sy+2);ctx.lineTo(sx-30,sy-kick);ctx.stroke();
   ctx.beginPath();ctx.moveTo(sx-14,sy+2);ctx.lineTo(sx-28,sy+kick);ctx.stroke();
   if(esc){ctx.strokeStyle='rgba(253,248,240,.3)';ctx.lineWidth=1;for(let i=0;i<4;i++){const dy=i*7-10;ctx.beginPath();ctx.moveTo(sx-20,sy+dy);ctx.lineTo(sx-40-i*5,sy+dy);ctx.stroke();}}
 };
 let lastTS=null;
 const loop=(ts)=>{
   if(!lastTS)lastTS=ts;const dt=Math.min((ts-lastTS)/1000,.05);lastTS=ts;

     ctx.fillText('⚠️ 快回答！',cW/2,cH-10);
   }

 _sgRAF=requestAnimationFrame(loop);
 const timeEl=d.querySelector('#sgtime');
 _sgTimer=setInterval(()=>{
   if(gameOver)return;secsLeft--;

// 本地"某天 0 点"的时间戳：复习按"天"排期，避免"今天应复习"却要等到晚上几点才出现
function dueAfterDays(n){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d.getTime();}
/* 艾宾浩斯排期：答错的那天记为第 0 天，之后在第 1、2、4、7、15 天各复习一次（INTERVALS 是"距答错那天的天数"）。
   box = 当前等待的是第几轮复习（0~4）。到期后答对 → 进入下一轮，间隔 = 两轮节点之差（1,2,3,8 天）；第 5 轮答对即毕业。
   还没到期的词（提前练习、在单元关卡里又碰到）答对只记"答对"，不推进轮次，防止一天之内刷完 5 轮。 */
function markResult(w,good,mode){const r=rec(w.id);
 const wasNew=(!r.seenR&&!r.seenW);
 if(mode==="R")r.seenR=1;else r.seenW=1;
 let graduated=false;
 if(good){
   if(r.box>=0){
     if(r.due<=now()){
       const nb=r.box+1;
       if(nb>=INTERVALS.length){r.box=-1;r.due=0;if(!r.grad){r.grad=1;graduated=true;addPoints(PT.graduate);}}
       else{r.box=nb;r.due=dueAfterDays(INTERVALS[nb]-INTERVALS[nb-1]);}
     }
   }
   else if(r.box===-1&&!r.grad){r.grad=1;} // 第一次就答对：计入"掌握深度"统计，但毕业奖励分留给真正走完错词复习周期的词，避免一次蒙对就拿满分
   r.last="good";
 }
 else{r.box=0;r.due=dueAfterDays(INTERVALS[0]);r.last="bad";if(r.grad){r.grad=0;}} // 答错：从第 1 轮重新排期（明天复习）；"已掌握"状态作废
 logActivity(wasNew,good,graduated);updateLevelCap();checkGodMaintained();save();return graduated;}
/* ===== 进步可视化：每日学习活动记录 gd().act[YYYY-MM-DD]={n,c,w,nw,gr} ===== */
function logActivity(isNew,correct,graduated){const g=gd();if(!g.act)g.act={};const d=todayStr();
 if(!g.act[d])g.act[d]={n:0,c:0,w:0,nw:0,gr:0};
 g.act[d].n++; if(correct)g.act[d].c++; else g.act[d].w++; if(isNew)g.act[d].nw++; if(graduated)g.act[d].gr++;}
function weekStartStr(){var d=new Date();d.setDate(d.getDate()-d.getDay());return localDateStr(d);}
function weekActivity(){const g=gd();const ws=weekStartStr();let nw=0,c=0,w=0,n=0,gr=0,days=0;
 if(g.act){for(const d in g.act){if(d>=ws){const a=g.act[d];nw+=a.nw||0;c+=a.c||0;w+=a.w||0;n+=a.n||0;gr+=a.gr||0;days++;}}}
 return {newWords:nw,correct:c,wrong:w,total:n,graduated:gr,activeDays:days};}
// 最近7天每日新学单词（用于柱状图）
function last7Activity(){const g=gd();const out=[];for(let i=6;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);const ds=localDateStr(dt);
  const a=(g.act&&g.act[ds])||{nw:0,n:0,c:0};out.push({date:ds,day:'日一二三四五六'[dt.getDay()],nw:a.nw||0,n:a.n||0,c:a.c||0});}return out;}
// 已掌握(毕业)单词数：包含"一次就答对"和"错词复习5轮通过"两类
function masteredCount(){const P=gd().prog;let m=0;for(const id in P){if(P[id].grad)m++;}return m;}
// 等级勋章数：达到的普通等级数 + 学神
function earnedMedals(){const idx=LEVELS.indexOf(realLevelOf(points()));return idx+1+(isGodLevel()?1:0);}

/* ════════════════════════════════════════════════════════
   ★ 得分系统核心：错词健康度 + 掌握深度（状态量，不按天打卡）
   ════════════════════════════════════════════════════════ */
const HEALTH_PASS=70;      // 升级所需的最低错词健康度
const GOD_HEALTH=100;      // 学神要求错词本零逾期
const GOD_MASTERY=85;      // 学神要求的最低掌握深度
const OVERDUE_GRACE=DAY;   // 到期后留 1 天缓冲期，刚答错的词不会立刻被算作"逾期"
// 接触过的词总数（曾经答过一次的词，无论对错）
function encounteredCount(){const P=gd().prog;let n=0;for(const id in P){if(P[id].seenR||P[id].seenW)n++;}return n;}
// 错词健康度：错词本里"真正被放置太久"（逾期超过缓冲期）的比例。错词本是空的时候视为 100%（没有欠账）
function healthScore(){const P=gd().prog;let inBox=0,overdue=0;const ok=new Set(WORDS.filter(w=>w.type!=="name").map(w=>String(w.id)));
 for(const id in P){const r=P[id];if(r.box>=0&&r.box<INTERVALS.length&&(!WORDS.length||ok.has(String(id)))){inBox++;if(now()-r.due>OVERDUE_GRACE)overdue++;}}
 if(inBox===0)return 100;
 return Math.round((1-overdue/inBox)*100);}
// 掌握深度：接触过的词里，真正记住（已掌握）的比例
function masteryScore(){const enc=encounteredCount();if(enc===0)return 0;return Math.round(masteredCount()/enc*100);}
// 普通等级是否真正"解锁"：分数够 + 健康度过线，两个条件都满足才算
function levelUnlocked(lv){return points()>=lv.min&&healthScore()>=HEALTH_PASS;}
// 当前真实等级：按分数本该到哪一级，但健康度不够时，封顶在"健康度刚好达标那一刻"已经解锁的最高等级
function realLevelOf(p){
 if(healthScore()>=HEALTH_PASS)return levelOf(p); // 健康达标，正常按分数算
 // 健康度不达标：找到当前 gd().capLv 记录的"最后一次健康达标时解锁的等级"，没有记录就回到起点
 const capName=gd().capLv;const cap=capName?LEVELS.find(l=>l.name===capName):null;
 return cap||LEVELS[0];
}
function realNextLevel(p){const cur=realLevelOf(p);const i=LEVELS.indexOf(cur);return LEVELS[i+1]||null;}
// 健康达标时，把"按分数本该到达的等级"记录为已解锁的上限；健康不达标时这个记录保持不变（不会倒退记录，但也不会再往前涨）
function updateLevelCap(){if(healthScore()>=HEALTH_PASS){const g=gd();const lv=levelOf(points());g.capLv=lv.name;}}

/* 通用：6 个中文意思选项（阅读、听力共用） */
function cnText(w){return w.s.map(x=>`${x[0]?x[0]+" ":""}${x[1]}`).join("；");}
/* 题干里的中文：去掉括号里的英文提示（如 (pl. wolves)、(taught)、(= doctor)），否则等于把答案写在题目上 */
function cleanMeaning(m){return String(m||'').replace(/\([^）)]*[a-zA-Z][^）)]*\)/g,'').replace(/（[^）)]*[a-zA-Z][^）)]*）/g,'').replace(/[；;]\s*$/,'').trim();}
function cnPromptHTML(w){return w.s.map(x=>{const pos=String(x[0]||"").replace(/\([^)]*\)/g,"").trim();return `${pos?`<span class="qp">${pos}</span>`:""}${cleanMeaning(x[1])}`;}).join("　");}
/* 干扰项过滤：意思有重叠（如 plant/factory 都是"工厂"）或拼写相同的词不能当干扰项，否则会出现"两个都对"的题 */
function meaningKeys(w){const out=new Set();(w.s||[]).forEach(x=>cleanMeaning(x[1]).replace(/（[^）]*）|\([^)]*\)/g,'').split(/[；;，,、\/]/).forEach(k=>{k=k.replace(/[的地]$/,'').replace(/\s+/g,'').trim();if(k.length>=1)out.add(k);}));return out;}
function meaningConflict(a,b){if(!a||!b)return false;if(String(a.en).toLowerCase()===String(b.en).toLowerCase())return true;const ka=meaningKeys(a);for(const k of meaningKeys(b))if(ka.has(k))return true;return false;}
function pickDistractors(t,pool,n,keyOf){const pos=t.s[0][0];pool=pool.filter(x=>x.id!==t.id&&!meaningConflict(t,x));
 const same=shuffle(pool.filter(x=>x.s[0][0]===pos)),rest=shuffle(pool.filter(x=>x.s[0][0]!==pos));
 const out=[],seen=new Set([keyOf(t)]),picked=[];
 for(const x of same.concat(rest)){if(out.length>=n)break;const k=keyOf(x);if(seen.has(k)||picked.some(p=>meaningConflict(p,x)))continue;seen.add(k);picked.push(x);out.push(x);}
 return out;}
/* 用于选项显示的中文：去除括号中的英文缩写/拼写提示，避免泄露答案 */
function cnTextClean(w){
 return w.s.map(x=>{
  let pos=x[0]?x[0]+" ":"";
  // 去除类似 (= programme)、(pl. manners)、(AmE gray)、(= ad /æd/) 等括号内英文
  let meaning=x[1].replace(/\([^）]*[a-zA-Z][^）]*\)/g,'').replace(/（[^）]*[a-zA-Z][^）]*）/g,'').trim();
  // 去除末尾多余分号或空格
  meaning=meaning.replace(/[；;]\s*$/,'').trim();
  return pos+meaning;
 }).join("；").trim();
}
/* 检查中文意思是否包含英文单词（可能泄露答案） */
function cnHasEnglish(w){
 return w.s.some(x=>/[a-zA-Z]/.test(x[1]));
}
function build6cn(u,t){
 let pool=u.words.filter(w=>w.type!=="name");
 if(pool.length<8)pool=WORDS.filter(w=>w.type!=="name"); // 小单元词太少时从全册补干扰项
 const dis=pickDistractors(t,pool,5,cnTextClean).map(w=>({cn:cnTextClean(w),correct:false}));
 dis.push({cn:cnTextClean(t),correct:true});return shuffle(dis);
}
/* 6 个英文选项（写作用），优先同词性干扰 */
function buildOptions(u,t){let pool=writePool(u);if(pool.length<8)pool=WORDS.filter(w=>w.type==="word");
 const dis=pickDistractors(t,pool,5,w=>w.en.toLowerCase()).map(w=>({en:w.en,correct:false}));dis.push({en:t.en,correct:true});return shuffle(dis);}
function unitOf(w){return UNITS.find(u=>w.id>=u.lo&&w.id<=u.hi);}

SCREENS.review=function(){
 const all=dueWords();if(!all.length)return go("home");
 // 有今天到期的词 → 正式复习（推进艾宾浩斯轮次、计分）；没有 → 提前练习（不计分、不改变排期，答错仍会重新排期）
 const today=dueWordsToday();
 const early=today.length===0;
 const pool=shuffle((early?all:today).slice());
 const isRevenge=!early&&allUnitsClearedForRevenge();
 runReview(pool,0,{got:0,gain:0,combo:0,early},isRevenge);
};
function runReview(pool,i,acc,revenge){
 if(i>=pool.length){const fin=()=>showResult(acc.early?"提前练习完成 · 到期那天记得正式复习":revenge?"⚔️ 复仇完成！错词已被你征服":"复习完成 · 又记牢了一些",acc,()=>go("home"));return afterPoint(fin);}
 _stageAborted=false;
 clear();const w=pool[i];const d=document.createElement("div");d.className="screen active";
 const title=acc.early?"错词练习（提前）":revenge?"⚔️ 错词复仇":"错词复习";
 const r=rec(w.id);
 const boxLabel=["第1天","第2天","第4天","第7天","第15天"];
 let ebHint="";
 if(r.box>=0&&r.box<INTERVALS.length){
  const daysLeft=r.due>0?Math.ceil((r.due-now())/86400000):0;
  const stageText=boxLabel[r.box]||"";
  if(daysLeft<=0)ebHint=`<div style="font-size:11px;color:var(--warn);text-align:center;margin-top:6px">⏰ 今天应复习 · 艾宾浩斯第${r.box+1}轮 (${stageText})</div>`;
  else ebHint=`<div style="font-size:11px;color:var(--soft);text-align:center;margin-top:6px">📅 ${daysLeft} 天后正式复习 · 提前练习不计分、不推进轮次</div>`;
 }
 const pts=acc.early?0:PT_SPELL.W;
 d.innerHTML=`
  <div class="bar"><button class="back" id="bk">‹</button><div class="htitle">${title}</div></div>
  <div class="qhud"><div class="tk"><i style="width:${i/pool.length*100}%"></i></div><div class="ct">${i+1} / ${pool.length}</div></div>
  <div class="qcn"><div class="ql">看中文，拼出这个${w.type==="phrase"?"短语":"单词"}</div><div class="qt">${cnPromptHTML(w)}</div></div>
  ${ebHint}
  <div class="spell-input-wrap" style="margin:14px 0 10px">
    <input class="spell-input" id="sinput" type="text" placeholder="输入英文${w.type==="phrase"?"短语":"单词"}…"
      autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    ${pts?`<div class="spell-pts-badge">+${pts}</div>`:""}
  </div>
  <div class="spell-answer" id="sanswer"></div>
  <button class="spell-submit" id="ssubmit">确认</button>`;
 app.appendChild(d);
 d.querySelector("#bk").onclick=()=>{sfx.tap();_stageAborted=true;go("home");};
 const inp=d.querySelector("#sinput");
 const answerEl=d.querySelector("#sanswer");
 const submitBtn=d.querySelector("#ssubmit");
 let answered=false;
 const doSubmit=()=>{
  if(answered)return;const val=inp.value;if(!val.trim()){inp.focus();return;}
  answered=true;inp.disabled=true;submitBtn.disabled=true;speak(w.en);
  const correct=checkSpellAnswer(val,w,true);
  if(correct){
    inp.classList.add('correct');answerEl.style.color='var(--ok)';answerEl.textContent=normalizeSpell(val)===normalizeSpell(w.en)?'✓ 正确！':`✓ 正确！课本词条：${w.en}`;
    if(revenge){
      const tip=document.createElement("div");tip.className="revenge-tip";tip.textContent="⚔️ 复仇成功！";document.body.appendChild(tip);
      setTimeout(()=>tip.remove(),1200);
    }
    const grad=markResult(w,true,"W");acc.got++;if(grad)acc.gain+=PT.graduate;
    if(pts){acc.gain+=pts;addPoints(pts);}sfx.correct();
    setTimeout(()=>{if(!_stageAborted)runReview(pool,i+1,acc,revenge);},900);
  }else{
    inp.classList.add('wrong');
    answerEl.style.color='var(--warn)';answerEl.textContent=`✗ 正确答案：${w.en}`;
    markResult(w,false,"W");sfx.wrong();
    setTimeout(()=>{if(!_stageAborted)runReview(pool,i+1,acc,revenge);},1600);
  }
 };
 submitBtn.onclick=doSubmit;inp.addEventListener('keydown',e=>{if(e.key==='Enter')doSubmit();});
 setTimeout(()=>inp.focus(),300);
}

 const curLv=god?GOD_LEVEL:realLevelOf(points());
 const curIdx=god?6:LEVELS.indexOf(curLv);
 const nx=god?null:realNextLevel(points());
 const hp=healthScore(),mp=masteryScore();
 // 普通等级列表：reached 跟首页的"当前等级"保持同一套判定（realLevelOf），不会互相矛盾
 let lvRows="";
 LEVELS.forEach((lv,i)=>{
   const reached=i<=curIdx||god;
   lvRows+=`<div class="ms-lv ${reached?'reached':''}">
     <div class="ms-icon">${medalSVG(i,40,reached)}</div>
     <div class="ms-tx"><b>${lv.name}</b><span>${lv.min===0?'起点':`${lv.min} 分`}</span></div>
     ${reached?'<div class="ms-ck">✓</div>':''}
   </div>`;
 });
 // 学神里程碑：3 项玩法成就（累计次数，不要求连续）+ 2 项记忆状态（健康度 / 掌握深度）
 const ms=[
   {label:isTiered()?`全部 ${UNITS.length} 组三关全通`:"全部单元三关全通",done:msAllCleared(),tip:isTiered()?`已通关 ${UNITS.filter(u=>unitCleared(u)).length} / ${UNITS.length} 组`:"每个单元的阅读、写作、听力都通关"},
   {label:"怪物副本累计 3 次",done:msMonsterCount()>=3,tip:`已通关 ${msMonsterCount()} / 3 次`},
   {label:"今日挑战累计 5 次",done:msDailyCount()>=5,tip:`已完成 ${msDailyCount()} / 5 次`},
   {label:`错词健康度 ${GOD_HEALTH}%`,done:hp>=GOD_HEALTH,tip:`当前 ${hp}% · 错词本零逾期`},
   {label:`掌握深度 ≥ ${GOD_MASTERY}%`,done:mp>=GOD_MASTERY,tip:`当前 ${mp}% · 学过的词里真正记住的比例`},
 ];
 const msRows=ms.map(m=>`
   <div class="ms-row ${m.done?'ms-done':''}">
     <div class="ms-dot ${m.done?'dot-on':''}">${m.done?'✓':'○'}</div>
     <div class="ms-detail"><b>${m.label}</b><span>${m.tip}</span></div>
   </div>`).join("");
 const doneCount=ms.filter(m=>m.done).length;
 const d=document.createElement("div");d.className="screen active";
 d.innerHTML=`
  <div class="bar"><button class="back" id="bk">‹</button><div class="htitle">我的目标</div></div>
  <div class="ms-cur">
    <div class="ms-cur-icon">${medalSVG(curIdx,56,true)}</div>
    <div class="ms-cur-tx"><div class="ms-cur-label">当前等级</div><b>${curLv.name}</b></div>
    ${nx?`<div class="ms-cur-next">→ ${nx.name}<br><span>${nx.min-points()} 分后升级</span></div>`:''}
  </div>

  <div class="slabel" style="margin-top:26px">得分逻辑</div>
  <div class="ms-rule">
    <div class="ms-rule-line">积分靠做题积累，但<b>升级还要看错词健康度</b></div>
    <div class="ms-rule-stats">
      <div class="ms-rule-stat">
        <div class="ms-rule-num ${hp>=HEALTH_PASS?'ok':'warn'}">${hp}%</div>
        <div class="ms-rule-lbl">错词健康度</div>
        <div class="ms-rule-sub">错词本里没有逾期未复习的比例</div>
      </div>
      <div class="ms-rule-stat">
        <div class="ms-rule-num">${mp}%</div>
        <div class="ms-rule-lbl">掌握深度</div>
        <div class="ms-rule-sub">学过的词里真正记住的比例</div>
      </div>
    </div>
    <div class="ms-rule-line">升级：积分够 + 健康度 ≥ ${HEALTH_PASS}%　·　学神：健康度 ${GOD_HEALTH}% + 掌握深度 ≥ ${GOD_MASTERY}%</div>
    <div class="ms-rule-foot">两个数字都只看现在的状态，不按天打卡，去复习中心清完错词就能马上回正</div>
  </div>

  <div class="slabel" style="margin-top:26px">等级路线</div>
  <div class="ms-lvlist">${lvRows}

 app.appendChild(d);
 d.querySelector("#bk").onclick=()=>{sfx.tap();go("home");};
};

/* 成绩卡的每一行：[标题, 状态, 是否通关]。普通年级逐单元列出；高中按难度区汇总 */
function cardRows(){
 if(isTiered()){const T=tiersOf();let last=0;T.forEach((t,ti)=>{if(tierUnits(ti).some(u=>stageCount(u)>0))last=ti;});
  return T.slice(0,last+1).map((t,ti)=>{const us=tierUnits(ti);const dn=us.filter(u=>unitCleared(u)).length;
   return[`${t.name} · 第 ${t.from}–${t.to} 组`,dn===us.length?'全部通关':`${dn}/${us.length} 组通关`,dn===us.length];});}
 return UNITS.filter(u=>u.ready).map(u=>{const sc=stageCount(u);const tot=stageTotal();return[unitLabel(u),sc===tot?'通关':sc+'/'+tot+' 关',sc===tot];});
}

SCREENS.customPractice=function(){
 const pool=shuffle(customWords().slice());
 if(!pool.length)return go("customBook");
 runCustomPractice(pool,0,{got:0,gain:0});
};
function runCustomPractice(pool,i,acc){
 if(i>=pool.length)return showResult("我的词库练习完成",acc,()=>go("customBook"));
 clear();const w=pool[i];
 const d=document.createElement("div");d.className="screen active";
 d.innerHTML=`
  <div class="bar"><button class="back" id="bk">‹</button><div class="htitle">我的词库练习</div></div>
  <div class="qhud"><div class="tk"><i style="width:${i/pool.length*100}%"></i></div><div class="ct">${i+1} / ${pool.length}</div></div>
  <div class="qcn"><div class="ql">看中文，拼出这个词</div><div class="qt">${esc(w.cn)}</div>${w.note?`<div class="cw-note">${esc(w.note).replace(/\n/g,'<br>')}</div>`:''}</div>
  <div class="spell-input-wrap" style="margin:14px 0 10px">
    <input class="spell-input" id="sinput" type="text" placeholder="输入英文…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    <div class="spell-pts-badge">+2</div>
  </div>
  <div class="spell-answer" id="sanswer"></div>
  <button class="spell-submit" id="ssubmit">确认</button>`;
 app.appendChild(d);
 d.querySelector("#bk").onclick=()=>{sfx.tap();go("customBook");};
 const inp=d.querySelector("#sinput"),ans=d.querySelector("#sanswer"),btn=d.querySelector("#ssubmit");
 const submit=()=>{
  if(!inp.value.trim())return inp.focus();
  inp.disabled=true;btn.disabled=true;speak(w.en);
  const ok=inp.value.trim().toLowerCase()===w.en.trim().toLowerCase();
  if(ok){inp.classList.add("correct");const add=awardCustomWord(w.id);acc.got++;acc.gain+=add;ans.style.color="var(--ok)";ans.textContent=add?`✓ 正确！+${add} 分`:"✓ 正确！这个词已经得过分";sfx.correct();setTimeout(()=>runCustomPractice(pool,i+1,acc),800);}
  else{inp.classList.add("wrong");ans.style.color="var(--warn)";ans.textContent=`✗ 正确答案：${w.en}`;sfx.wrong();setTimeout(()=>runCustomPractice(pool,i+1,acc),1400);}
 };
 btn.onclick=submit;inp.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
 setTimeout(()=>inp.focus(),180);
}

function drawCard(lv,due,ds){const W=750,H=1000,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
 x.fillStyle="#fff";x.fillRect(0,0,W,H);
 const img=new Image();img.onload=()=>{
  // avatar circle
  const av=72,ax=56,ay=70;x.save();x.beginPath();x.arc(ax+av/2,ay+av/2,av/2,0,7);x.clip();x.drawImage(img,ax,ay,av,av);x.restore();
  x.fillStyle="#111113";x.textBaseline="alphabetic";
  x.font="600 36px -apple-system,sans-serif";x.fillText(S.name,ax+av+22,ay+34);
  x.fillStyle="#86868b";x.font="400 19px -apple-system,sans-serif";x.fillText("English Adventure · "+ds,ax+av+22,ay+62);
  // big score
  x.fillStyle="#0a84ff";x.font="200 100px -apple-system,sans-serif";x.fillText(points(),52,260);
  const sw=x.measureText(points()).width;
  x.fillStyle="#111113";x.font="600 30px -apple-system,sans-serif";x.fillText(lv.name,52+sw+22,260);
  // rows
  let y=340;x.strokeStyle="#ececee";x.lineWidth=1;
  const rows=cardRows().map(r=>[r[0],r[1],"#0a84ff"]);
  rows.push(["错词本待复习",due+" 个","#ff453a"]);
  rows.forEach(r=>{x.beginPath();x.moveTo(52,y);x.lineTo(W-52,y);x.stroke();
   x.fillStyle="#111113";x.font="500 24px -apple-system,sans-serif";x.textAlign="left";x.fillText(r[0],52,y+42);
   x.fillStyle=r[2];x.font="600 24px -apple-system,sans-serif";x.textAlign="right";x.fillText(r[1],W-52,y+42);y+=66;});
  x.textAlign="left";x.fillStyle="#b0b0b5";x.font="400 18px -apple-system,sans-serif";
  x.fillText("把成绩卡截图发给老师就可以啦",52,H-70);
  const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download=`${S.name}_英语成绩卡.png`;a.click();
 };img.src=AVATAR;}

/* ────────────────────────────────────────────────────────
   复习中心：艾宾浩斯遗忘曲线 + 复习计划 + 对词/错词
   ──────────────────────────────────────────────────────── */
// 艾宾浩斯遗忘曲线 SVG（含 5 个复习节点）
function ebbinghausCurveSVG(){
 const W=320,H=150,pad=26;
 const x0=pad,x1=W-12,y0=12,y1=H-22;
 const days=15;
 // 不复习的遗忘曲线 R=exp(-t/S)
 const fx=t=>x0+(t/days)*(x1-x0);
 const fy=r=>y1-(r)*(y1-y0);
 let forget="";
 for(let t=0;t<=days;t+=0.5){const r=Math.exp(-t/2.4);forget+=(t===0?"M":"L")+fx(t).toFixed(1)+" "+fy(r).toFixed(1)+" ";}
 // 间隔复习后的记忆保持（锯齿回升）
 const marks=[1,2,4,7,15];
 let rev="M"+fx(0)+" "+fy(1)+" ";let cur=1;let last=0;
 marks.forEach((mk,i)=>{
   // 从 last 衰减到 mk，再回升到接近 1
   const seg=Math.exp(-(mk-last)/(2.4+i*1.6));
   rev+="L"+fx(mk).toFixed(1)+" "+fy(seg).toFixed(1)+" ";
   rev+="L"+fx(mk).toFixed(1)+" "+fy(Math.min(1,seg+0.62)).toFixed(1)+" ";
   last=mk;
 });
 let dots="";marks.forEach((mk,i)=>{const xx=fx(mk),yy=fy(Math.min(1,Math.exp(-(mk-(i?marks[i-1]:0))/(2.4+i*1.6))+0.62));
   dots+=`<circle cx="${xx.toFixed(1)}" cy="${yy.toFixed(1)}" r="4" fill="var(--accent)" stroke="#fff" stroke-width="1.5"/>
   <text x="${xx.toFixed(1)}" y="${(y1+14).toFixed(1)}" font-size="9" fill="var(--soft)" text-anchor="middle">第${mk}天</text>`;});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg">
   <line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="var(--hair)" stroke-width="1"/>
   <line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="var(--hair)" stroke-width="1"/>
   <text x="${x0-4}" y="${y0+4}" font-size="8.5" fill="var(--faint)" text-anchor="end">100%</text>
   <text x="${x0-4}" y="${y1}" font-size="8.5" fill="var(--faint)" text-anchor="end">0</text>
   <path d="${forget}" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3" opacity=".75"/>
   <path d="${rev}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>
   ${dots}
 </svg>`;
}
// 复习计划：未来 16 天每天到期词数
function reviewForecast(){
 const P=gd().prog;const buckets=new Array(16).fill(0);
 for(const id in P){const r=P[id];if(r.box>=0&&r.box<INTERVALS.length){
   const d=Math.max(0,Math.ceil((r.due-now())/86400000));if(d<=15)buckets[d]++;}}
 return buckets;
}
function reviewForecastSVG(){
 const b=reviewForecast();const max=Math.max(1,...b);
 const W=320,H=120,pad=18,bw=(W-pad*2)/16-2;
 let bars="";
 b.forEach((v,i)=>{const h=v?Math.max(4,(v/max)*(H-34)):2;const x=pad+i*((W-pad*2)/16);const y=H-22-h;
   const col=i===0?"var(--warn)":"var(--accent)";
   bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${col}" opacity="${v?(i===0?'1':'.85'):'.18'}"/>`;
   if(v)bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" font-size="8" fill="var(--soft)" text-anchor="middle">${v}</text>`;
   if(i%3===0||i===0)bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" font-size="8" fill="var(--faint)" text-anchor="middle">${i===0?'今天':'+'+i}</text>`;
 });
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg">
   <line x1="${pad}" y1="${H-22}" x2="${W-pad}" y2="${H-22}" stroke="var(--hair)" stroke-width="1"/>
   ${bars}</svg>`;
}

        <div class="rc-stage-n">${byStage[i].length}</div>
        <div class="rc-stage-l">${lb}<span>第${i+1}轮</span></div>
      </div>`).join("")}
    </div>`;
 };
 const wordRow=(w,tag,tagcls)=>{
   const cn=w.s.map(x=>`${x[0]?`<i>${x[0]}</i>`:""}${x[1]}`).join("；");
   return `<div class="rc-word" data-en="${w.en}">
     <div class="rc-word-l"><b>${w.en}</b>${w.ph?`<span class="rc-ph">${w.ph}</span>`:""}<span class="rc-cn">${cn}</span></div>
     <div class="rc-word-tag ${tagcls}">${tag}</div></div>`;
 };
 const renderWrong=()=>{
   if(!due.length){body.innerHTML=`<div class="rc-empty">还没有错词，太棒了！</div>`;return;}
   let h="";
   for(let i=0;i<5;i++){if(!byStage[i].length)continue;
     h+=`<div class="rc-grp-t">艾宾浩斯第${i+1}轮 · ${stageLabel[i]} <span>${byStage[i].length}词</span></div>`;
     byStage[i].forEach(w=>{const r=P[w.id];const dl=Math.ceil((r.due-now())/86400000);
       const tag=dl<=0?"今日复习":dl+"天后";const tc=dl<=0?"due":"";
       h+=wordRow(w,tag,tc);});
   }
   body.innerHTML=h;bindSpeakRows(body);
 };
 const renderRight=()=>{
   if(!mastered.length){body.innerHTML=`<div class="rc-empty">还没有毕业的词。<br>错词复习满 5 轮即可毕业到这里。</div>`;return;}
   let h=`<div class="rc-grp-t">已掌握 · 完成全部 5 轮复习 <span>${mastered.length}词</span></div>`;
   mastered.slice(0,60).forEach(w=>{h+=wordRow(w,"已毕业","grad");});
   if(mastered.length>60)h+=`<div class="rc-more">仅显示前 60 个，共 ${mastered.length} 个已掌握</div>`;
   body.innerHTML=h;bindSpeakRows(body);
 };
 const draw=()=>{curTab==="plan"?renderPlan():curTab==="wrong"?renderWrong():renderRight();};
 d.querySelectorAll(".rc-tab").forEach(t=>t.onclick=()=>{
   sfx.tap();curTab=t.dataset.t;
   d.querySelectorAll(".rc-tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");draw();});
 draw();
};
function bindSpeakRows(scope){scope.querySelectorAll(".rc-word[data-en]").forEach(el=>{el.onclick=()=>{speak(el.dataset.en);};});}

/* ============ 班级排行榜界面 ============ */
function lbGetRanking(){ return lbCacheLoad(); }

// 年级分组配置
const LB_GRADES=[
 {key:"初一", labels:["初一","七年级","Grade 7","7年级"]},
 {key:"初二", labels:["初二","八年级","Grade 8","8年级"]},
 {key:"初三", labels:["初三","九年级","Grade 9","9年级"]},
 {key:"小四", labels:["小四","四年级","Grade 4","4年级"]},
 {key:"小五", labels:["小五","五年级","Grade 5","5年级"]},
 {key:"小六", labels:["小六","六年级","Grade 6","6年级"]},
 {key:"高中", labels:["高中","高一","高二","高三"]},
];
function gradeGroup(grade){
 if(!grade)return "其他";
 const g=grade.trim();
 for(const lg of LB_GRADES){if(lg.labels.some(l=>g.includes(l)||l.includes(g)))return lg.key;}
 return g||"其他";
}

// 骨架屏 HTML（用新的中性列表样式，不再依赖旧的金色 .lb-rank/.lb-info/.lb-score）
function lbSkeleton(){
 return [1,2,3,4,5].map(()=>`
  <div class="lb-plain-row" style="opacity:.25">
   <div class="lb-plain-rank" style="background:var(--hair);border-radius:4px;color:transparent">99</div>
   <div class="lb-plain-name" style="background:var(--hair);color:transparent;border-radius:4px">加载中加载中加</div>
   <div class="lb-plain-score" style="background:var(--hair);color:transparent;border-radius:4px">999</div>
  </div>`).join("");
}

/* 共享渲染：TOP 6 装进强调色卡片，做成条幅式（长度按分数占最高分比例缩放，不接背景轨道）；
   第 7 名往后跳出卡片，变成中性列表行，可以一直往下翻。
   list: 该范围内完整排序后的数组；myName: 用于标记"我"；gradeShown: 是否在条幅/列表行里显示年级标签 */
function renderRankedList(list, myName, gradeShown){
 if(!list.length) return `<div class="lb-card-empty">暂无数据，完成练习后自动上榜</div>`;
 const top6=list.slice(0,6);
 const rest=list.slice(6);
 const maxScore=top6[0].score||1;

 const cardHtml=top6.map((r,i)=>{
  const isMe=r.name===myName;
  const pct=Math.max(6,Math.round((r.score||0)/maxScore*100));
  const gradeStr=gradeShown&&r.grade?`<span class="lb-bar-grade">${r.grade}</span>`:"";
  const meTag=isMe?`<span class="lb-bar-tag">我</span>`:"";
  return `<div class="lb-bar-row ${i===0?'first':''}">
   <div class="lb-bar-meta">
    <div class="lb-bar-rank">${i+1}</div>
    <div class="lb-bar-name">${r.name}</div>
    ${gradeStr}${meTag}
    <div class="lb-bar-score">${r.score}<span class="lb-bar-score-u">分</span></div>
   </div>
   <div class="lb-bar-fill" style="width:${pct}%"></div>
  </div>`;
 }).join("");

 const restHtml=rest.map((r,i)=>{
  const isMe=r.name===myName;
  const gradeStr=gradeShown&&r.grade?`<span class="lb-plain-grade">${r.grade}</span>`:"";
  const meTag=isMe?`<span class="lb-plain-tag">我</span>`:"";
  return `<div class="lb-plain-row ${isMe?'me':''}">
   <div class="lb-plain-rank">${i+7}</div>
   <div class="lb-plain-name">${r.name}${gradeStr}${meTag}</div>
   <div class="lb-plain-score">${r.score}<span class="lb-plain-score-u">分</span></div>
  </div>`;
 }).join("");

 return `<div class="lb-card">
  <div class="lb-card-cap">TOP 6</div>
  ${cardHtml}
 </div>${restHtml}`;
}

// 渲染总榜：TOP 6 条幅 + 第7名往后中性列表
function renderTotal(ranking, myName){
 if(!ranking.length) return `<div class="lb-empty">暂无数据<br><small>完成练习后自动上榜</small></div>`;
 return renderRankedList(ranking, myName, true);
}

// 渲染年级榜：各年级分区，每个分区内部各自一套 TOP 6 条幅 + 第7名往后中性列表
function renderGrade(ranking, myName){
 if(!ranking.length) return `<div class="lb-empty">暂无数据<br><small>完成练习后自动上榜</small></div>`;
 // 按年级分组
 const groups={};
 ranking.forEach(r=>{
  const g=gradeGroup(r.grade);
  if(!groups[g])groups[g]=[];
  groups[g].push(r);
 });
 // 按配置顺序排列，其他放最后
 const order=[...LB_GRADES.map(g=>g.key),"其他"];
 let html="";
 order.forEach(key=>{
  const list=groups[key];
  if(!list||!list.length)return;
  html+=`<div class="lb-grade-section">
   <div class="lb-grade-title">${key} · ${list.length}人</div>
   ${renderRankedList(list, myName, false)}
  </div>`;
 });
 return html;
}

SCREENS.leaderboard=function(){
 clear();
 const myName=S.name;
 let curTab="total"; // total | grade

 const d=document.createElement("div");d.className="screen active";
 d.innerHTML=`

 const renderView=()=>{

   list.innerHTML=renderGrade(_ranking,myName);

 };

 const render=async()=>{

  sub.textContent="加载中…";
  list.innerHTML=lbSkeleton();

  // 上传自己（用跨年级累计总分）
  if(S.name){
   const myScore=totalPoints();
   const myGrade=S.grade?((gradeById(S.grade)||{}).label||S.grade):"";
   await _sb.upsert(S.name,myScore,myGrade,S.weekPoints||0);
  }

  let ranking=null;
  if(LB_ONLINE)ranking=await _sb.getTop(200);
  if(!ranking){
   ranking=lbGetRanking();
   if(!ranking.length){sub.textContent="暂无数据，完成练习后自动上榜";list.innerHTML=`<div class="lb-empty">暂无数据<br><small>完成练习后自动上榜</small></div>`;return;}
   sub.textContent="⚠️ 网络不可用，显示缓存数据";
  } else {
   lbCacheSave(ranking);
  }
  _ranking=ranking;
  renderView();
 };

 // tab 切换
 d.querySelector("#tab-total").onclick=()=>{
  sfx.tap();curTab="total";
  d.querySelector("#tab-total").classList.add("active");
  d.querySelector("#tab-grade").classList.remove("active");
  renderView();
 };
 d.querySelector("#tab-grade").onclick=()=>{

 };

 render();
 d.querySelector("#refresh").onclick=()=>{sfx.tap();render();};
};
load();initTTS();
try{
 const pulled=lsGet('jc_vocab_progress_sync');
 if(pulled&&mergeCloudGd(pulled)){
  migrateLevelCaps();
  lsRemove('jc_vocab_progress_sync');
  save();
 }
}catch(e){}
// ★ 词汇舞台(vocab-stage.html)直达：接收 ?grade= 参数，仅在年级有效且已上线时生效
(function(){try{var _g=new URLSearchParams(location.search).get('grade');
 if(_g&&gradeById(_g)&&gradeById(_g).ready){S.grade=_g;save();}}catch(e){}})();
// 恢复年级
if(S.grade&&gradeById(S.grade)&&gradeById(S.grade).ready){applyGrade(S.grade);}
_prevLv=realLevelOf(points()).name;
if(!S.name){
  // 没有名字（极端情况：清缓存或跳过 index.html 直链打开），统一交给 start.html 收集名字，
  // 走完流程后 start.html 会跳回 index.html 主页
  window.location.href="start.html";
} else {
  // ★ 性能关键：先用本地存档（localStorage）立即渲染首屏，不等待任何网络请求。
  // 云端同步改为后台静默任务，完成后如果数据确实有更新，才重新渲染一次当前页面
  // （SCREENS.* 都是"读取 S 最新状态来重建 DOM"的纯函数式写法，重新调用 go() 等价于局部刷新）。
  const _route=()=>{
    if(location.hash&&location.hash.length>1){_handleHash();}
    else if(!S.grade||!gradeById(S.grade)||!gradeById(S.grade).ready){go("grade");}
    else{go("home");}
  };
  // 当前年级是按需加载的大词库（高中）：先下载词库再进页面；其他年级照旧立即渲染
  if(S.grade&&gradeById(S.grade)&&gradeById(S.grade).ready&&!gradeLoaded(S.grade)){withGradeReady(S.grade,_route);}
  else _route();

  // 后台静默云端同步：不阻塞、不显示加载态，完成后悄悄刷新
  (async()=>{
    try{
      const cloud=await _sb.fetchMine(S.name);
      const progress=await _sb.fetchProgress(S.name);
      let changed=false;
      if(cloud&&cloud.data)changed=mergeCloudGd(cloud.data)||changed;
      if(progress)changed=mergeCloudGd(progress)||changed;
      // ★ 新手机/清过缓存：本机没有"当前年级"，但云端有进度 → 自动回到上次的年级，
      //   不然学生停在选年级页，选错年级会以为进度全没了
      if(!S.grade||!gradeById(S.grade)||!gradeById(S.grade).ready){
        const pv=parseMaybeJSON(progress);const cgid=pv&&pv.vocab&&parseMaybeJSON(pv.vocab)&&parseMaybeJSON(pv.vocab).grade;
        let pick=(cgid&&gradeById(cgid)&&gradeById(cgid).ready&&S.gd&&S.gd[cgid])?cgid:'';
        if(!pick){let bw=0;for(const gid in (S.gd||{})){const g=gradeById(gid);if(!g||!g.ready)continue;const w=progressWeight(S.gd[gid]);if(w>bw){bw=w;pick=gid;}}}
        if(pick){S.grade=pick;applyGrade(pick);_prevLv=realLevelOf(points()).name;changed=true;}
      }
      if(changed){
        migrateLevelCaps(); // 云端数据可能也是老版本存的，同样要补一次 capLv
        save();
        // 数据确实有更新才考虑重新渲染；且只在用户仍停留在 home/grade 这类安全页面时才刷新，
        // 避免打断正在答题等进行中的活动——数据已经存进 localStorage，下次进首页自然生效
        if((_curScreenName==="home"||_curScreenName==="grade")&&(!S.grade||gradeLoaded(S.grade))){
          const cur=S.grade&&gradeById(S.grade)&&gradeById(S.grade).ready?"home":"grade";
          go(cur);
        }
      }
      _cloudSyncReady=true;
      cloudProgressUpdate(500);
    }catch(e){
      _cloudSyncReady=true;
    }
  })();
}
