<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>口语 · 码神训练营</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#F5EDD8;color:#2A1E08;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px}
.pane{display:none;flex-direction:column;align-items:center;width:100%;max-width:480px;text-align:center}
.pane.on{display:flex}
.logo{font-size:11px;letter-spacing:.18em;color:#B5A080;font-weight:600;margin-bottom:28px}
.back-link{font-size:12px;color:#B5A080;text-decoration:none;align-self:flex-start;margin-bottom:20px}
.btn{display:block;width:100%;padding:15px;background:#2A1E08;color:#F5EDD8;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;-webkit-appearance:none;margin-bottom:10px}
.btn:active{opacity:.8}
.btn:disabled{opacity:.35;cursor:default}
.btn-ghost{display:block;width:100%;padding:14px;background:transparent;color:#7A6040;border:1.5px solid rgba(42,30,8,.2);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;-webkit-appearance:none;margin-bottom:10px}
.btn-ghost:active{opacity:.7}
.prog-row{display:flex;justify-content:space-between;font-size:11px;color:#B5A080;margin-bottom:5px;width:100%}
.prog-track{width:100%;height:4px;background:rgba(42,30,8,.08);border-radius:2px;overflow:hidden;margin-bottom:16px}
.prog-fill{height:4px;background:#2A1E08;border-radius:2px;transition:width .4s}
/* sentence card */
.sent-card{width:100%;background:rgba(255,252,245,.92);border:1.5px solid rgba(184,149,106,.2);border-radius:16px;padding:20px 18px;margin-bottom:14px;text-align:left}
.sent-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sent-num{font-size:11px;color:#B5A080;font-weight:600}
.sent-scene{font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:10px}
.scene-meeting{background:rgba(74,124,184,.1);color:#1A3A7A}
.scene-bug{background:rgba(200,70,60,.1);color:#7A1A10}
.scene-dev{background:rgba(200,140,50,.12);color:#5A3000}
.scene-qa{background:rgba(60,150,90,.1);color:#1A4A28}
.scene-product{background:rgba(140,80,200,.1);color:#4A1A7A}
.scene-sprint{background:rgba(42,30,8,.07);color:#5A4A30}
.scene-opinion{background:rgba(212,136,42,.12);color:#5A3000}
.scene-deadline{background:rgba(184,149,106,.15);color:#7A5A30}
.scene-everymatrix{background:rgba(42,30,8,.1);color:#2A1E08}
/* Chinese prompt */
.cn-text{font-size:17px;font-weight:600;color:#2A1E08;line-height:1.6;margin-bottom:12px}
/* blanked sentence */
.blank-text{font-family:Georgia,serif;font-size:16px;line-height:2;color:#6A5040;word-break:break-word}
.blank-slot{display:inline-block;border-bottom:2px solid rgba(184,149,106,.5);min-width:32px;height:1.1em;vertical-align:bottom;margin:0 2px}
/* attempt dots */
.attempt-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.attempt-dot{width:10px;height:10px;border-radius:50%;background:rgba(184,149,106,.2);border:1.5px solid rgba(184,149,106,.3);transition:all .2s}
.attempt-dot.used-pass{background:rgba(60,150,90,.5);border-color:rgba(60,150,90,.7)}
.attempt-dot.used-fail{background:rgba(200,70,60,.4);border-color:rgba(200,70,60,.6)}
.attempt-dot.current{background:#2A1E08;border-color:#2A1E08;transform:scale(1.2)}
.attempt-label{font-size:11px;color:#B5A080}
/* transcript */
.transcript-box{width:100%;background:rgba(255,252,245,.85);border:1.5px solid rgba(184,149,106,.18);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.8;min-height:52px;text-align:left;margin-bottom:12px;font-family:Georgia,serif;color:#2A1E08}
.transcript-box.empty{color:#B5A080;font-family:inherit;font-size:13px;text-align:center;padding:16px}
.transcript-box.listening{border-color:rgba(200,70,60,.4)}
/* score */
.score-wrap{display:flex;align-items:center;gap:12px;margin-bottom:10px;width:100%}
.score-circle{width:68px;height:68px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;border:2px solid;flex-shrink:0}
.score-A{background:rgba(60,150,90,.12);border-color:rgba(60,150,90,.4);color:#1A4A28}
.score-B{background:rgba(74,124,184,.12);border-color:rgba(74,124,184,.35);color:#1A3A7A}
.score-C{background:rgba(200,140,50,.12);border-color:rgba(200,140,50,.35);color:#5A3000}
.score-D{background:rgba(200,70,60,.1);border-color:rgba(200,70,60,.3);color:#7A1A10}
.score-num{font-size:20px;line-height:1}
.score-lbl{font-size:10px;margin-top:2px}
.score-msg{font-size:14px;font-weight:600;color:#2A1E08;line-height:1.4;text-align:left;flex:1}
/* diff */
.diff-box{width:100%;background:rgba(255,252,245,.85);border:1.5px solid rgba(184,149,106,.15);border-radius:12px;padding:12px 14px;font-family:Georgia,serif;font-size:14px;line-height:1.9;text-align:left;margin-bottom:8px}
.w-correct{color:#1A5C28}
.w-wrong{color:#A03020;text-decoration:underline wavy rgba(200,70,60,.5);text-underline-offset:3px}
.w-missing{color:#A03020;font-style:italic;opacity:.6}
/* reference answer */
.ref-box{width:100%;background:rgba(61,107,46,.06);border:1.5px solid rgba(61,107,46,.18);border-radius:12px;padding:12px 14px;margin-bottom:12px;text-align:left}
.ref-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:#5A8040;text-transform:uppercase;margin-bottom:6px}
.ref-text{font-family:Georgia,serif;font-size:14px;line-height:1.7;color:#1A3A14}
/* rec btn */
.rec-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:#2A1E08;color:#F5EDD8;border:none;border-radius:14px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;-webkit-appearance:none;margin-bottom:12px;transition:background .2s}
.rec-btn.recording{background:#A03020}
.rec-btn:disabled{opacity:.35;cursor:default}
.rec-dot{width:9px;height:9px;border-radius:50%;background:#F5EDD8;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.pts-toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:#2A1E08;color:#F5EDD8;padding:10px 22px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:99;white-space:nowrap}
.pts-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.done-emoji{font-size:48px;margin-bottom:14px}
.done-title{font-size:22px;font-weight:700;margin-bottom:8px}
.done-sub{font-size:13px;color:#8A7050;line-height:1.7;margin-bottom:24px}
.stat-row{display:flex;gap:10px;width:100%;margin-bottom:24px}
.stat-item{flex:1;padding:14px 10px;background:rgba(255,252,245,.9);border:1.5px solid rgba(184,149,106,.2);border-radius:12px;text-align:center}
.stat-num{font-size:24px;font-weight:700;color:#2A1E08;line-height:1}
.stat-lbl{font-size:11px;color:#8A7050;margin-top:4px}
</style>
</head>
<body>

<!-- ENTRY -->
<div id="p-entry" class="pane on">
  <a class="back-link" href="programmer.html">← 程序员专区</a>
  <div class="logo">JOHN CLASS · 口语 <span style="font-size:10px">(请用Safari打开)</span></div>
  <div style="font-size:44px;margin-bottom:16px">💬</div>
  <div style="font-size:22px;font-weight:700;margin-bottom:8px">口语训练</div>
  <div style="font-size:13px;color:#8A7050;line-height:1.7;margin-bottom:28px;text-align:center">看中文提示，说出对应英文<br>挖空 70%+，朗读后对比答案<br>每句 <strong>25 分</strong> · 共 100 句 · 满分 2500</div>
  <div style="width:100%;background:rgba(255,252,245,.9);border:1.5px solid rgba(184,149,106,.2);border-radius:14px;padding:16px 18px;margin-bottom:24px;text-align:left">
    <div style="font-size:11px;font-weight:700;letter-spacing:.1em;color:#B5A080;text-transform:uppercase;margin-bottom:10px">本周进度</div>
    <div class="prog-row"><span>已完成</span><span id="entrySentDone">0 / 100 句</span></div>
    <div class="prog-track"><div class="prog-fill" id="entryProgFill" style="width:0%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:13px">
      <span style="color:#6A5040">本周积分</span>
      <span style="font-weight:700" id="entryPts">0 分</span>
    </div>
  </div>
  <button class="btn" id="btnStart">开始训练 →</button>
  <button class="btn-ghost" onclick="window.location.href='programmer.html'">返回专区</button>
</div>

<!-- PRACTICE -->
<div id="p-practice" class="pane">
  <a class="back-link" href="#" id="backToEntry">← 返回</a>
  <div class="logo">JOHN CLASS · 口语</div>
  <div class="prog-row" style="width:100%"><span>本周进度</span><span id="progText">0 / 100</span></div>
  <div class="prog-track" style="width:100%"><div class="prog-fill" id="progFill" style="width:0%"></div></div>

  <div class="sent-card">
    <div class="sent-meta">
      <span class="sent-num" id="sentNum">句子 1 / 100</span>
      <span class="sent-scene" id="sentScene"></span>
    </div>
    <!-- Chinese prompt -->
    <div class="cn-text" id="cnText"></div>
    <!-- Blanked English -->
    <div class="blank-text" id="blankText"></div>
  </div>

  <div class="transcript-box empty" id="transcriptBox">按下录音，用英语说出上方句子</div>

  <div class="attempt-row">
    <span class="attempt-label">尝试</span>
    <div class="attempt-dot" id="dot1"></div>
    <div class="attempt-dot" id="dot2"></div>
    <div class="attempt-dot" id="dot3"></div>
  </div>

  <div id="resultWrap" style="display:none;width:100%">
    <div class="score-wrap">
      <div class="score-circle" id="scoreCircle"><div class="score-num" id="scoreNum">—</div><div class="score-lbl">分</div></div>
      <div class="score-msg" id="scoreMsg"></div>
    </div>
    <!-- diff of spoken vs reference -->
    <div class="diff-box" id="diffBox"></div>
    <!-- reference answer always shown after attempt -->
    <div class="ref-box">
      <div class="ref-label">参考答案</div>
      <div class="ref-text" id="refText"></div>
    </div>
  </div>

  <button class="rec-btn" id="recBtn" onclick="toggleRec()">🎤 按下开始录音</button>
  <div style="display:flex;gap:10px;width:100%">
    <button class="btn-ghost" id="btnSkip" onclick="skipSentence()" style="flex:1;margin-bottom:0">换一句</button>
    <button class="btn" id="btnRetry" onclick="retryNow()" style="flex:1;display:none;margin-bottom:0">再试 🔄</button>
    <button class="btn" id="btnNext" onclick="nextSentence()" style="flex:2;display:none;margin-bottom:0">下一句 →</button>
  </div>
</div>

<!-- DONE -->
<div id="p-done" class="pane">
  <div class="logo">JOHN CLASS · 口语</div>
  <div class="done-emoji">🏆</div>
  <div class="done-title">全部完成！</div>
  <div class="done-sub">100 句口语训练全部搞定！</div>
  <div class="stat-row">
    <div class="stat-item"><div class="stat-num" id="doneTotal">2500</div><div class="stat-lbl">本周总分</div></div>
    <div class="stat-item"><div class="stat-num" id="doneAvg">—</div><div class="stat-lbl">平均得分</div></div>
  </div>
  <button class="btn" onclick="window.location.href='programmer.html'">返回专区</button>
</div>

<div class="pts-toast" id="ptsToast">+25 分 🎯</div>

var SCENE_LABELS={meeting:'会议沟通',bug:'Bug处理',dev:'开发',qa:'QA测试',product:'需求讨论',sprint:'Sprint',opinion:'表达意见',deadline:'截止时间',everymatrix:'EveryMatrix'};
var SCENE_CSS={meeting:'scene-meeting',bug:'scene-bug',dev:'scene-dev',qa:'scene-qa',product:'scene-product',sprint:'scene-sprint',opinion:'scene-opinion',deadline:'scene-deadline',everymatrix:'scene-everymatrix'};

// ── STATE ──
var userName='',currentAttempt=0,recLocked=false,isRecording=false;
var recognition=null,sessionScores=[],orderedSents=[];
var currentIdx=0;

// ── SUPABASE ──
function sbHeaders(){return{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};}
function getWeekStart(){var d=new Date();d.setDate(d.getDate()-d.getDay());return d.toISOString().split('T')[0];}
async function sbGet(t,q){try{var r=await fetch(SB_URL+'/rest/v1/'+t+'?'+q,{headers:sbHeaders()});return r.ok?await r.json():[];}catch(e){return[];}}
async function sbUpsert(t,data){try{await fetch(SB_URL+'/rest/v1/'+t,{method:'POST',headers:Object.assign({},sbHeaders(),{'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify(data)});}catch(e){}}

// ── PROGRESS ──
function getProgressKey(){return 'jc_prog_oral_'+getWeekStart();}
function getProgress(){try{var r=localStorage.getItem(getProgressKey());return r?JSON.parse(r):{done:[],pts:0};}catch(e){return{done:[],pts:0};}}
function saveProgress(p){try{localStorage.setItem(getProgressKey(),JSON.stringify(p));}catch(e){}}
function isDone(id){return getProgress().done.indexOf(id)!==-1;}

async function addPoints(){
  if(!userName)return;
  var ws=getWeekStart();
  var rows=await sbGet('weekly_scores','user_name=eq.'+encodeURIComponent(userName)+'&week_start=eq.'+ws+'&select=id,programmer_score');
  var cur=0,eid=null;
  if(rows&&rows.length){cur=rows[0].programmer_score||0;eid=rows[0].id;}
  var payload={user_name:userName,week_start:ws,programmer_score:cur+POINTS,updated_at:new Date().toISOString()};
  if(eid)payload.id=eid;
  await sbUpsert('weekly_scores',payload);
  var oral=parseInt(localStorage.getItem('jc_prog_oral_pts')||'0')+POINTS;
  localStorage.setItem('jc_prog_oral_pts',oral);
}

// ── SHUFFLE seed 2 (different from speaking which is seed 1) ──
function shuffle(arr,seed){
  var a=arr.slice(),s=seed;
  for(var i=a.length-1;i>0;i--){
    s=(s*1664525+1013904223)&0xffffffff;
    var j=Math.abs(s)%(i+1);
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

// ── BLANK GENERATOR: remove ~70-75% of words ──
function makeBlanked(text){
  var words=text.split(/(\s+)/); // keep spaces as tokens
  var wordTokens=[]; // indices of actual word tokens
  words.forEach(function(t,i){if(t.trim())wordTokens.push(i);});
  // Keep ~25-30% of words, always keep the first word for anchoring
  var keepCount=Math.max(1,Math.floor(wordTokens.length*0.27));
  // Always keep first word
  var keepSet={};
  keepSet[wordTokens[0]]=true;
  // Randomly keep a few more (spread through sentence)
  var step=Math.floor(wordTokens.length/keepCount);
  for(var k=step;k<wordTokens.length&&Object.keys(keepSet).length<keepCount;k+=step){
    keepSet[wordTokens[k]]=true;
  }
  var result='';
  words.forEach(function(t,i){
    if(!t.trim()){result+=t;return;} // spaces
    if(keepSet[i]){result+=t;}
    else{result+='<span class="blank-slot"></span>';}
  });
  return result;
}

// ── LEVENSHTEIN + DIFF ──
function levenshtein(a,b){
  var m=a.length,n=b.length,dp=[];
  for(var i=0;i<=m;i++){dp[i]=[];for(var j=0;j<=n;j++)dp[i][j]=0;}
  for(var i=0;i<=m;i++)dp[i][0]=i;
  for(var j=0;j<=n;j++)dp[0][j]=j;
  for(var i=1;i<=m;i++)for(var j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  return dp[m][n];
}
function norm(w){return w.toLowerCase().replace(/[^a-z0-9']/g,'');}
function calcScore(ref,spoken){
  var rw=ref.split(/\s+/).map(norm).filter(Boolean);
  var sw=spoken.split(/\s+/).map(norm).filter(Boolean);
  var correct=0;
  rw.forEach(function(w){var i=sw.indexOf(w);if(i!==-1){correct++;sw.splice(i,1);}});
  return rw.length?Math.round(correct/rw.length*100):0;
}
function buildDiff(ref,spoken){
  var rw=ref.split(/\s+/),rn=rw.map(norm),sn=spoken.trim().split(/\s+/).map(norm),su=sn.slice(),html='';
  rw.forEach(function(w,i){
    var n=rn[i],idx=su.indexOf(n);
    if(idx!==-1){html+='<span class="w-correct">'+esc(w)+'</span> ';su[idx]=null;return;}
    var best=-1,bd=99;
    su.forEach(function(sw,j){if(!sw)return;var d=levenshtein(n,sw);if(d<=2&&d<bd){bd=d;best=j;}});
    if(best!==-1){html+='<span class="w-wrong">'+esc(w)+'</span> ';su[best]=null;}
    else html+='<span class="w-missing">'+esc(w)+'</span> ';
  });
  return html.trim();
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── UI ──
function showPane(id){document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('on');});document.getElementById(id).classList.add('on');}

function updateEntryUI(){
  var p=getProgress();
  var pct=Math.round(p.done.length/100*100);
  document.getElementById('entrySentDone').textContent=p.done.length+' / 100 句';
  document.getElementById('entryProgFill').style.width=pct+'%';
  document.getElementById('entryPts').textContent=p.pts+' 分';
}

function updateProgUI(){
  var p=getProgress();
  var pct=Math.round(p.done.length/100*100);
  document.getElementById('progText').textContent=p.done.length+' / 100';
  document.getElementById('progFill').style.width=pct+'%';
}

function renderSentence(){
  var s=orderedSents[currentIdx];
  document.getElementById('sentNum').textContent='句子 '+s.dispId+' / 100';
  var sc=document.getElementById('sentScene');
  sc.textContent=SCENE_LABELS[s.scene]||s.scene;
  sc.className='sent-scene '+(SCENE_CSS[s.scene]||'');
  document.getElementById('cnText').textContent=s.cn;
  document.getElementById('blankText').innerHTML=makeBlanked(s.en);
  document.getElementById('refText').textContent=s.en;
  resetUI();
}

function resetUI(){
  var tb=document.getElementById('transcriptBox');
  tb.textContent='按下录音，用英语说出上方句子';
  tb.className='transcript-box empty';
  document.getElementById('resultWrap').style.display='none';
  document.getElementById('btnNext').style.display='none';
  document.getElementById('btnRetry').style.display='none';
  document.getElementById('btnSkip').style.display='inline-block';
  currentAttempt=0;
  recLocked=false;
  updateDots();
  updateRecBtn(false);
}

function updateDots(){
  for(var i=1;i<=3;i++){
    var d=document.getElementById('dot'+i);
    if(!d)return;
    d.className='attempt-dot';
    if(i<currentAttempt)d.className='attempt-dot used-fail';
    else if(i===currentAttempt)d.className='attempt-dot current';
  }
}
function markDot(pass){var d=document.getElementById('dot'+currentAttempt);if(d)d.className='attempt-dot '+(pass?'used-pass':'used-fail');}

function updateRecBtn(rec){
  var btn=document.getElementById('recBtn');
  if(!btn)return;
  if(rec){btn.innerHTML='🔴 识别中，请稍候...';btn.className='rec-btn recording';btn.disabled=true;}
  else{btn.innerHTML='🎤 按下开始录音';btn.className='rec-btn';btn.disabled=false;}
}

function skipSentence(){currentIdx=(currentIdx+1)%orderedSents.length;renderSentence();}
function retryNow(){
  var tb=document.getElementById('transcriptBox');
  tb.textContent='按下录音，用英语说出上方句子';
  tb.className='transcript-box empty';
  document.getElementById('resultWrap').style.display='none';
  document.getElementById('btnRetry').style.display='none';
  document.getElementById('btnNext').style.display='none';
  document.getElementById('btnSkip').style.display='none';
  recLocked=false;
  document.getElementById('recBtn').disabled=false;
  updateRecBtn(false);
  updateDots();
}
function nextSentence(){currentIdx=(currentIdx+1)%orderedSents.length;renderSentence();}

var recTimer = null;
var pendingFinal = '';

function toggleRec(){
  if(recLocked||isRecording)return;
  startRec();
}

function startRec(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('请用 Safari 打开此页面'); return; }

  if(recognition){ try{ recognition.abort(); }catch(e){} recognition = null; }
  if(recTimer){ clearTimeout(recTimer); recTimer = null; }
  pendingFinal = '';

  var tb = document.getElementById('transcriptBox');
  tb.textContent = '准备中...';
  tb.className = 'transcript-box listening';

  setTimeout(function(){
    var SR2 = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR2();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onresult = function(e){
      var interim = '', final = '';
      for(var i = 0; i < e.results.length; i++){
        if(e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      var display = final || interim;
      if(display){ tb.textContent = display; tb.className = 'transcript-box'; }
      if(final) pendingFinal = final;
    };

    recognition.onend = function(){
      if(recTimer){ clearTimeout(recTimer); recTimer = null; }
      recognition = null;
      isRecording = false;
      updateRecBtn(false);
      if(pendingFinal.trim()){
        processResult(pendingFinal.trim());
      } else {
        tb.textContent = '没有识别到内容，请重新录音';
        tb.className = 'transcript-box empty';
      }
    };

    recognition.onerror = function(e){
      if(recTimer){ clearTimeout(recTimer); recTimer = null; }
      if(e.error === 'not-allowed'){
        tb.textContent = '请允许麦克风权限后重试';
        tb.className = 'transcript-box empty';
      }
    };

    try{
      recognition.start();
      isRecording = true;
      updateRecBtn(true);
      tb.textContent = '🔴 正在录音，说完后会自动识别';
      recTimer = setTimeout(function(){
        if(recognition){ try{ recognition.abort(); }catch(e){} }
      }, 15000);
    }catch(err){
      tb.textContent = '启动失败，请重试';
      tb.className = 'transcript-box empty';
      recognition = null;
    }
  }, 350);
}

function stopRec(){
  if(recTimer){ clearTimeout(recTimer); recTimer = null; }
  isRecording = false;
  updateRecBtn(false);
  var tb = document.getElementById('transcriptBox');
  if(recognition){
    // 先把回调摘掉避免 onend 再触发一次
    recognition.onend = null;
    recognition.onresult = null;
    recognition.onerror = null;
    try{ recognition.abort(); }catch(e){}
    recognition = null;
  }
  // 用已累积的文字处理结果
  if(pendingFinal.trim()){
    processResult(pendingFinal.trim());
  } else {
    tb.textContent = '没有识别到内容，请重新录音';
    tb.className = 'transcript-box empty';
  }
}

// ── PROCESS ──
function processResult(spoken){
  recLocked=true;
  currentAttempt++;
  var s=orderedSents[currentIdx];
  var pct=calcScore(s.en,spoken);
  var passed=pct>=PASS_SCORE;
  markDot(passed);

  var grade=pct>=90?'A':pct>=70?'B':pct>=55?'C':'D';
  document.getElementById('scoreCircle').className='score-circle score-'+grade;
  document.getElementById('scoreNum').textContent=pct;
  document.getElementById('diffBox').innerHTML=buildDiff(s.en,spoken);
  document.getElementById('resultWrap').style.display='block';
  document.getElementById('btnSkip').style.display='none';
  updateRecBtn(false);
  document.getElementById('recBtn').disabled=true;

  if(passed){
    document.getElementById('scoreMsg').textContent=pct>=90?'完美！🎉':'通过！👍';
    document.getElementById('btnNext').style.display='inline-block';
    if(!isDone(s.id)){
      var p=getProgress();
      p.done.push(s.id);p.pts+=POINTS;
      saveProgress(p);
      updateProgUI();
      addPoints();
      showToast('+25 分 ✅');
      if(p.done.length>=100)setTimeout(function(){showDone(p);},1800);
    } else {
      document.getElementById('scoreMsg').textContent+=' （本句本周已计分）';
    }
    sessionScores.push(pct);
  } else {
    var left=MAX_ATTEMPTS-currentAttempt;
    if(left>0){
      document.getElementById('scoreMsg').textContent=currentAttempt===1?'再试一次！参考答案在下方 💪':'最后机会，慢慢来 🎯';
      document.getElementById('btnRetry').style.display='inline-block';
    } else {
      document.getElementById('scoreMsg').textContent='没过关，看看参考答案，继续下一句';
      document.getElementById('btnNext').style.display='inline-block';
      sessionScores.push(pct);
    }
  }
}

function showDone(p){
  var avg=sessionScores.length?Math.round(sessionScores.reduce(function(a,b){return a+b;},0)/sessionScores.length):0;
  document.getElementById('doneTotal').textContent=p.pts;
  document.getElementById('doneAvg').textContent=avg||'—';
  showPane('p-done');
}

function showToast(msg){
  var t=document.getElementById('ptsToast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

// ── INIT ──
function init(){
  var name=localStorage.getItem('jc_username')||localStorage.getItem('jc_student_name');
  if(!name||name==='同学'){window.location.href='start.html';return;}
  userName=name;
  // Seed 2 = different order from speaking (seed 1)
  orderedSents=shuffle(SENTENCES,2);for(var i=0;i<orderedSents.length;i++)orderedSents[i].dispId=i+1;
  updateEntryUI();
  updateProgUI();
  document.getElementById('btnStart').addEventListener('click',function(){
    renderSentence();showPane('p-practice');
  });
  document.getElementById('backToEntry').addEventListener('click',function(e){
    e.preventDefault();
    if(isRecording&&recognition){recognition.stop();isRecording=false;}
    updateEntryUI();showPane('p-entry');
  });
}
init();
</script>
