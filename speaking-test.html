<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>录音测试 · John Class</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5EDD8;color:#2A1E08;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;text-align:center}
.back{font-size:13px;color:#B5A080;text-decoration:none;display:block;margin-bottom:32px}
.back:hover{color:#2A1E08}
h1{font-size:24px;font-weight:700;margin-bottom:6px}
.sub{font-size:13px;color:#8A7050;margin-bottom:28px}
.info-row{display:flex;justify-content:space-between;padding:12px 16px;background:rgba(255,252,245,.85);border-radius:10px;margin-bottom:8px;font-size:13px}
.info-label{color:#8A7050}
.info-val{font-weight:600}
.status{font-size:18px;font-weight:700;padding:14px;border-radius:14px;margin:20px 0}
.status.ok{background:rgba(60,150,90,.12);color:#1A4A28;border:1.5px solid rgba(60,150,90,.3)}
.status.fail{background:rgba(200,70,60,.10);color:#7A1A10;border:1.5px solid rgba(200,70,60,.25)}
.btn{display:block;width:100%;padding:16px;background:#2A1E08;color:#F5EDD8;border:none;border-radius:14px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:10px}
.btn:active{opacity:.8}
.btn:disabled{opacity:.4}
.rec-box{background:rgba(255,252,245,.9);border:1.5px solid rgba(184,149,106,.2);border-radius:14px;padding:18px;margin:16px 0;font-size:15px;line-height:1.8;min-height:60px;text-align:left}
.rec-box.empty{color:#B5A080;font-style:italic;text-align:center}
.rec-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#C94A3A;animation:pulse 1s infinite;margin-right:6px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>
<div style="background:rgba(201,169,110,.1);border-bottom:1px solid rgba(201,169,110,.25);padding:8px 16px;text-align:center;font-size:12px;color:#7A5A20">
  📋 请<strong>复制网址</strong>使用 <strong>Safari</strong> 打开，目前不支持其它浏览器
</div>
<div class="card">
  <a class="back" href="speaking.html">&larr; 返回口语</a>
  <h1>🎤 录音功能测试</h1>
  <div class="sub">检测你的设备能不能用语音识别</div>

  <div id="infoArea"></div>
  <div class="status" id="statusBar">检测中...</div>

  <button class="btn" id="recBtn" disabled onclick="toggleRec()">开始测试录音</button>
  <div class="rec-box empty" id="recBox">录音结果会显示在这里...</div>
  <button class="btn" id="retryBtn" style="display:none;background:transparent;color:#7A6040;border:1.5px solid rgba(42,30,8,.2)" onclick="location.reload()">重新检测</button>
</div>

<script>
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var isRec = false, recognition = null, transcript = '';

function detect(){
  var ua = navigator.userAgent;
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isChrome = /Chrome/i.test(ua) && !/Edge/i.test(ua);
  var isSafari = /Safari/i.test(ua) && !/Chrome/i.test(ua);
  var os = isIOS ? 'iOS' : isAndroid ? 'Android' : '桌面';
  var browser = isChrome ? 'Chrome' : isSafari ? 'Safari' : '其他';

  document.getElementById('infoArea').innerHTML =
    '<div class="info-row"><span class="info-label">系统</span><span class="info-val">'+os+'</span></div>'+
    '<div class="info-row"><span class="info-label">浏览器</span><span class="info-val">'+browser+'</span></div>'+
    '<div class="info-row"><span class="info-label">API 支持</span><span class="info-val">'+(SR?'✅ 支持':'❌ 不支持')+'</span></div>';

  var bar = document.getElementById('statusBar');
  if(!SR){
    bar.textContent = '❌ 你的浏览器不支持语音识别';
    bar.className = 'status fail';
    document.getElementById('retryBtn').style.display = 'block';
    return;
  }
  if(isIOS && isChrome){
    bar.textContent = '⚠️ iOS Chrome 受限，请用 Safari 打开';
    bar.className = 'status fail';
  } else if(isIOS){
    bar.textContent = '✅ iOS Safari 支持录音，点击下方测试';
    bar.className = 'status ok';
  } else {
    bar.textContent = '✅ 你的设备支持录音，点击下方测试';
    bar.className = 'status ok';
  }
  document.getElementById('recBtn').disabled = false;
}

function toggleRec(){ isRec ? stopRec() : startRec(); }

function startRec(){
  recognition = new SR();
  recognition.lang = 'en-US';
  var ua = navigator.userAgent;
  var isAndroid = /Android/i.test(ua);
  // Android 用单次模式（continuous 会 abort）
  recognition.continuous = !isAndroid;
  recognition.interimResults = true;
  recognition.onresult = function(e){
    var t = '';
    for(var i = e.resultIndex; i < e.results.length; i++){
      t += e.results[i][0].transcript;
    }
    transcript = t;
    var box = document.getElementById('recBox');
    box.textContent = transcript || '正在听...';
    box.className = 'rec-box';
  };
  recognition.onerror = function(e){
    document.getElementById('statusBar').textContent = '❌ 录音出错: '+e.error;
    document.getElementById('statusBar').className = 'status fail';
    stopRec();
  };
  // Android 单次模式不需要重连
  recognition.onend = function(){
    isRec = false;
    var btn = document.getElementById('recBtn');
    btn.innerHTML = '重新测试录音';
    btn.style.background = '#2A1E08';
    if(transcript){
      document.getElementById('statusBar').textContent = '✅ 录音成功！你的设备可以用语音识别';
      document.getElementById('statusBar').className = 'status ok';
    }
  };
  recognition.start();
  isRec = true;
  document.getElementById('recBtn').innerHTML = '<span class="rec-dot"></span>录音中，点击停止';
  document.getElementById('recBtn').style.background = '#A03020';
}

function stopRec(){
  if(recognition){ recognition.onend = null; recognition.stop(); recognition = null; }
  isRec = false;
  var btn = document.getElementById('recBtn');
  btn.innerHTML = '重新测试录音';
  btn.style.background = '#2A1E08';
  if(transcript){
    document.getElementById('statusBar').textContent = '✅ 录音成功！你的设备可以用语音识别';
    document.getElementById('statusBar').className = 'status ok';
  }
}

detect();
</script>
</body>
</html>
