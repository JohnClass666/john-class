<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语学习提升 · John Class</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #F5EDD8;
  color: #2A1E08;
}
.layout { display: flex; min-height: 100vh; }
.left {
  position: fixed; top: 0; left: 0;
  width: 52%; height: 100vh; overflow: hidden;
}
.left img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center top; display: block;
}
.left::after {
  content: ''; position: absolute; top: 0; right: 0;
  width: 80px; height: 100%;
  background: linear-gradient(to right, transparent, #F5EDD8);
}
.right {
  margin-left: 52%; flex: 1; background: #F5EDD8;
  min-height: 100vh; padding: 52px 44px 64px 28px; position: relative;
}
.right::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 80% 15%, rgba(201,169,110,.07) 0%, transparent 50%),
    radial-gradient(circle at 20% 85%, rgba(120,160,80,.05) 0%, transparent 40%);
  pointer-events: none;
}
.nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 44px; position: relative; z-index: 1;
}
.nav-brand {
  font-size: 13px; font-weight: 600; letter-spacing: .18em;
  text-transform: uppercase; color: #B8956A; text-decoration: none;
}
.nav-back {
  font-size: 12px; color: #9A8060; text-decoration: none;
  display: flex; align-items: center; gap: 5px; transition: color .2s;
}
.nav-back:hover { color: #2A1E08; }
.page-title {
  font-size: clamp(24px, 3vw, 32px); font-weight: 600; color: #2A1E08;
  letter-spacing: -.4px; margin-bottom: 6px; position: relative; z-index: 1;
}
.page-sub {
  font-size: 13px; color: #9A8060; margin-bottom: 40px; position: relative; z-index: 1;
}
.sec-label {
  font-size: 10px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: #B8956A;
  padding-bottom: 10px; border-bottom: 1px solid rgba(184,149,106,.2);
  margin-bottom: 6px; position: relative; z-index: 1;
}
.tool-list {
  display: flex; flex-direction: column;
  margin-bottom: 36px; position: relative; z-index: 1;
}
.tool-item {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 0; border-bottom: 1px solid rgba(184,149,106,.12);
  text-decoration: none; color: inherit; cursor: pointer; transition: transform .18s;
}
.tool-item:last-child { border-bottom: none; }
.tool-item:hover { transform: translateX(5px); }
.tool-item:active { transform: scale(.98); }
.tool-item.disabled {
  opacity: .45; cursor: default; pointer-events: none;
}
.tool-circle {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0; transition: transform .18s;
}
.tool-item:hover .tool-circle { transform: scale(1.08); }
.c-gold   { background: rgba(201,169,110,.16); border: 1.5px solid rgba(201,169,110,.3); }
.c-blue   { background: rgba(74,124,184,.12);  border: 1.5px solid rgba(74,124,184,.22); }
.c-green  { background: rgba(74,124,63,.13);   border: 1.5px solid rgba(74,124,63,.25); }
.c-orange { background: rgba(212,136,42,.12);  border: 1.5px solid rgba(212,136,42,.22); }
.c-purple { background: rgba(122,76,184,.12);  border: 1.5px solid rgba(122,76,184,.22); }
.c-dark   { background: rgba(184,149,106,.1);  border: 1.5px solid rgba(184,149,106,.2); }
.tool-text { flex: 1; }
.tool-name { font-size: 16px; font-weight: 600; color: #2A1E08; margin-bottom: 3px; letter-spacing: -.1px; }
.tool-desc { font-size: 12px; color: #9A8060; line-height: 1.5; }
.tool-badge {
  font-size: 10px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 20px; flex-shrink: 0;
}
.badge-live { background: rgba(74,124,63,.12); color: #4A7C3F; border: 1px solid rgba(74,124,63,.2); }
.badge-soon { background: rgba(184,149,106,.1); color: #B8956A; border: 1px solid rgba(184,149,106,.2); }
.tool-arrow {
  color: rgba(184,149,106,.4); flex-shrink: 0; transition: transform .18s, color .18s;
}
.tool-item:hover .tool-arrow { transform: translateX(4px); color: #B8956A; }
.wulin {
  background: rgba(80,60,30,0.72); border-radius: 20px;
  padding: 26px 26px 24px; position: relative; overflow: hidden; z-index: 1;
}
.wulin::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 15% 50%, rgba(201,169,110,.1) 0%, transparent 55%),
    radial-gradient(circle at 85% 20%, rgba(201,169,110,.07) 0%, transparent 45%);
}
.wulin-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; position: relative; z-index: 1; }
.wulin-icon {
  width: 52px; height: 52px; border-radius: 50%;
  background: rgba(201,169,110,.12); border: 1.5px solid rgba(201,169,110,.25);
  display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
}
.wulin-title { font-size: 18px; font-weight: 600; color: #C9A96E; margin-bottom: 3px; }
.wulin-sub { font-size: 12px; color: rgba(253,248,240,.45); }
.wulin-items {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: relative; z-index: 1;
}
.wi {
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
  border-radius: 12px; padding: 11px 13px; display: flex; align-items: center; gap: 9px;
}
.wi-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(201,169,110,.4); flex-shrink: 0; }
.wi-text { font-size: 12px; color: rgba(253,248,240,.5); }
.wulin-coming {
  margin-top: 14px; font-size: 11px; letter-spacing: .08em;
  text-transform: uppercase; color: rgba(201,169,110,.4); text-align: center; position: relative; z-index: 1;
}
.foot {
  margin-top: 40px; font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; color: rgba(184,149,106,.4); position: relative; z-index: 1;
}
.overlay {
  position: fixed; inset: 0; background: #F5EDD8; z-index: 999;
  opacity: 0; pointer-events: none; transition: opacity .3s ease;
}
.overlay.show { opacity: 1; pointer-events: all; }
.right > * { animation: fadeIn .6s cubic-bezier(.22,1,.36,1) both; }
.nav        { animation-delay: .05s; }
.page-title { animation-delay: .1s; }
.page-sub   { animation-delay: .12s; }
.sec-label  { animation-delay: .15s; }
.tool-list  { animation-delay: .18s; }
.wulin      { animation-delay: .22s; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateX(12px); }
  to   { opacity: 1; transform: none; }
}
@media (max-width: 680px) {
  .layout { flex-direction: column; }
  .left { position: relative; width: 100%; height: 56vw; min-height: 260px; max-height: 400px; }
  .left::after {
    top: auto; bottom: 0; left: 0; right: 0;
    width: 100%; height: 60px;
    background: linear-gradient(to bottom, transparent, #F5EDD8);
  }
  .right { margin-left: 0; padding: 32px 24px 56px; }
}
</style>
</head>
<body>

<div class="overlay" id="ov"></div>

<div class="layout">
  <div class="left"><img src="bg.png" alt="John Class"></div>

  <div class="right">
    <div class="nav">
      <a class="nav-brand" href="index.html">John Class</a>
      <a class="nav-back" href="index.html" onclick="go(event,'index.html')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        返回
      </a>
    </div>

    <div class="page-title">英语学习提升</div>
    <div class="page-sub">选择你需要的方向，系统进步。</div>

    <div class="sec-label">学习工具</div>
    <div class="tool-list">

      <a class="tool-item" href="vocab.html" onclick="go(event,'vocab.html')">
        <div class="tool-circle c-gold">📚</div>
        <div class="tool-text">
          <div class="tool-name">英语训练之路</div>
          <div class="tool-desc">分级闯关 · 错词本 · 成绩卡</div>
        </div>
        <span class="tool-badge badge-live">已上线</span>
        <svg class="tool-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>

      <a class="tool-item" href="grammar_hub.html" onclick="go(event,'grammar_hub.html')">
        <div class="tool-circle c-blue">📐</div>
        <div class="tool-text">
          <div class="tool-name">语法提升</div>
          <div class="tool-desc">学习语法 · 语法应试 · 真题训练</div>
        </div>
        <span class="tool-badge badge-live">已上线</span>
        <svg class="tool-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>

      <div class="tool-item disabled">
        <div class="tool-circle c-green">🔍</div>
        <div class="tool-text">
          <div class="tool-name">阅读理解方法论</div>
          <div class="tool-desc">三步定位 · 六大题型</div>
        </div>
        <span class="tool-badge badge-soon">即将上线</span>
      </div>

      <div class="tool-item disabled">
        <div class="tool-circle c-orange">✍️</div>
        <div class="tool-text">
          <div class="tool-name">写作框架与句型</div>
          <div class="tool-desc">三段框架 · 高分句型</div>
        </div>
        <span class="tool-badge badge-soon">即将上线</span>
      </div>

    </div>

    <div class="sec-label">武林秘籍</div>
    <div class="wulin">
      <div class="wulin-top">
        <div class="wulin-icon">🥋</div>
        <div>
          <div class="wulin-title">武林秘籍</div>
          <div class="wulin-sub">John 老师独家整理 · 内部资料</div>
        </div>
      </div>
      <div class="wulin-items">
        <div class="wi"><div class="wi-dot"></div><div class="wi-text">期末复习宝典</div></div>
        <div class="wi"><div class="wi-dot"></div><div class="wi-text">真题精讲</div></div>
        <div class="wi"><div class="wi-dot"></div><div class="wi-text">专项训练集</div></div>
        <div class="wi"><div class="wi-dot"></div><div class="wi-text">学神秘籍</div></div>
      </div>
      <div class="wulin-coming">正在整理中 · 敬请期待</div>
    </div>

    <div class="foot">Growing Skills · Shaping Futures</div>
  </div>
</div>

<script>
function go(e, href) {
  e.preventDefault();
  const ov = document.getElementById('ov');
  ov.classList.add('show');
  setTimeout(() => { window.location.href = href; }, 280);
}
</script>
</body>
</html>
