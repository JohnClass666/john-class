<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英语学习提升 · John Class</title>
<style>
:root{
  --bg:#FBF6EC;--bg2:#F0E2C4;--bg3:#F6EEDC;
  --ink:#2A1D08;--soft:#8C6B35;--faint:#C2A26C;
  --hair:#E2D0A4;--accent:#AD7A1E;--accent-deep:#7A5414;--accent-soft:#F5E8C8;
  --warn:#C2491E;--warn-soft:#FAEEE8;
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-pill:999px;
  --shadow-sm:0 1px 2px rgba(40,24,5,.10);
  --shadow-md:0 3px 10px rgba(40,24,5,.12);
  --shadow-lg:0 10px 28px rgba(40,24,5,.16);
  --fnt:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --fnt-display:Georgia,"Songti SC","STSong",serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--fnt);color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ══════ 照片：移动端在顶部，是一个真实存在的横幅，不是小角标 ══════ */
.photo{position:relative;width:100%;height:56vw;min-height:240px;max-height:380px;overflow:hidden;background:var(--bg2)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.photo::after{content:'';position:absolute;left:0;right:0;bottom:0;height:90px;
  background:linear-gradient(to bottom,transparent,var(--bg))}
.photo-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--accent-soft),var(--accent));color:#FFF8E8;
  font-family:var(--fnt-display);font-size:15px;letter-spacing:.04em}

.content{padding:22px 18px calc(48px + env(safe-area-inset-bottom));position:relative;max-width:560px;margin:0 auto}

.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.nav-brand{font-family:var(--fnt-display);font-size:16px;font-weight:600;letter-spacing:-.01em;
  color:var(--ink);text-decoration:none}
.nav-back{font-size:12px;color:var(--soft);text-decoration:none;display:flex;align-items:center;gap:4px;transition:color .2s}
.nav-back:active{opacity:.6}

.page-title{font-family:var(--fnt-display);font-size:clamp(24px,4vw,30px);font-weight:600;
  color:var(--ink);letter-spacing:-.01em;margin-bottom:6px}
.page-sub{font-size:13px;color:var(--soft);margin-bottom:28px}

/* ══════ 大神榜：唯一的强调色重点区域，放在功能格子之前 ══════ */
.crown{display:flex;align-items:center;gap:14px;padding:18px 18px 18px 16px;margin-bottom:30px;
  border-radius:var(--r-lg);text-decoration:none;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%);
  box-shadow:0 2px 4px rgba(40,20,5,.14),0 10px 22px rgba(122,84,20,.28),0 22px 44px rgba(122,84,20,.16);
  transition:transform .18s,box-shadow .18s}
.crown::after{content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);
  background-size:220% 100%;background-position:130% 0;animation:shimmer 3.6s ease-in-out infinite}
@keyframes shimmer{0%,55%{background-position:130% 0}100%{background-position:-50% 0}}
.crown:active{transform:scale(.98)}
.crown-ic{flex:0 0 auto;width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);position:relative;z-index:1}
.crown-ic svg{width:23px;height:23px}
.crown-tx{flex:1;min-width:0;position:relative;z-index:1}
.crown-tx b{display:block;font-family:var(--fnt-display);font-size:20px;font-weight:600;color:#FFF8E8;letter-spacing:-.01em}
.crown-tx span{display:block;font-size:11.5px;color:rgba(255,248,232,.82);margin-top:3px}
.crown-arrow{flex:0 0 auto;width:28px;height:28px;border-radius:50%;position:relative;z-index:1;
  background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.crown-arrow svg{width:14px;height:14px}

/* ══════ 分区标签 ══════ */
.slbl{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--faint);
  text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid var(--hair);margin-bottom:16px}

/* ══════ 功能格子：统一同一种配色，靠图标形状+文案区分，阴影做出真实的"浮起来"质感 ══════ */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.tool{display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:24px 12px 18px;border-radius:var(--r-lg);text-decoration:none;color:inherit;
  background:#FFFCF4;border:1px solid rgba(184,149,106,.16);
  box-shadow:0 1px 2px rgba(40,20,5,.05),0 6px 16px rgba(40,20,5,.08),0 16px 32px rgba(40,20,5,.06);
  transition:transform .2s cubic-bezier(.25,.9,.35,1.15),box-shadow .2s}
.tool:active{transform:scale(.96);box-shadow:0 1px 2px rgba(40,20,5,.08),0 3px 8px rgba(40,20,5,.10)}
.tool-ic{width:54px;height:54px;border-radius:50%;margin-bottom:11px;flex:0 0 auto;
  background:var(--accent-soft);border:1.5px solid rgba(173,122,30,.22);
  display:flex;align-items:center;justify-content:center}
.tool-ic svg{width:24px;height:24px;stroke:var(--accent-deep)}
.tool-name{font-family:var(--fnt-display);font-size:16.5px;font-weight:600;color:var(--ink);margin-bottom:4px}
.tool-desc{font-size:11px;color:var(--soft);line-height:1.55}

.foot{margin-top:36px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:center;display:flex;align-items:center;justify-content:center;gap:14px}
.foot span{cursor:pointer}

.jc-mute{display:inline-flex;align-items:center;justify-content:center;
  width:1em;height:1em;padding:0;margin-left:-8px;vertical-align:-1px;
  background:none;border:none;cursor:pointer;color:inherit;opacity:.55;
  transition:opacity .15s ease,transform .15s ease}
.jc-mute svg{width:100%;height:100%;display:block}
.jc-mute .jc-mute-off{display:none}
.jc-mute.muted .jc-mute-on{display:none}
.jc-mute.muted .jc-mute-off{display:block}
.jc-mute:hover{opacity:.9}
.jc-mute:active{transform:scale(.82)}

#overlay{position:fixed;inset:0;background:var(--bg);z-index:999;opacity:0;pointer-events:none;transition:opacity .26s ease}
#overlay.show{opacity:1;pointer-events:all}

html[data-incoming-slide="1"] .page-wrap{transform:translateY(100%)}
.page-wrap.enter{transition:transform .28s cubic-bezier(.32,.72,0,1);transform:translateY(0)}

@media (max-width:380px){
  .grid{gap:9px}
  .tool{padding:18px 9px 14px}
  .tool-ic{width:46px;height:46px}
  .tool-name{font-size:15px}
}

/* ══════ 公共栏 · Bulletin Board ══════ */
.bulletin{
  position:relative;margin-top:28px;margin-bottom:0;padding:12px 14px 15px;
  border-radius:var(--r-lg);cursor:default;user-select:none;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.022) 0,rgba(0,0,0,.022) 1px,transparent 1px,transparent 6px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.016) 0,rgba(0,0,0,.016) 1px,transparent 1px,transparent 9px),
    linear-gradient(148deg,#C9962A,#A87820 55%,#8A6018);
  box-shadow:
    inset 0 1px 0 rgba(255,210,110,.22),
    0 2px 0 rgba(0,0,0,.10),
    0 6px 20px rgba(80,48,8,.22);
}
.bulletin-pin{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  width:28px;height:28px;z-index:3;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.35)) drop-shadow(0 1px 2px rgba(0,0,0,.2));
}
.bulletin-paper{
  background:linear-gradient(160deg,#FFFEF7,#FFF9EC);
  border-radius:6px;
  padding:12px 14px 13px;
  transform:rotate(-0.5deg);
  transform-origin:center top;
  box-shadow:
    1px 2px 0 rgba(0,0,0,.04),
    3px 6px 12px rgba(40,20,5,.16),
    inset 0 1px 0 rgba(255,255,255,.9);
  position:relative;
}
.bulletin-paper::before{
  content:'';display:block;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(173,122,30,.18),transparent);
  margin:0 -14px 10px;
}
.bulletin-hd{
  display:flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;letter-spacing:.20em;
  color:var(--faint);text-transform:uppercase;margin-bottom:8px;
}
.bulletin-hd-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);flex:0 0 auto;
  box-shadow:0 0 0 2px rgba(173,122,30,.18);
}
.bulletin-body{
  font-size:15px;line-height:1.9;color:var(--ink);
  min-height:20px;word-break:break-word;white-space:pre-wrap;
  font-family:"STXingkai","KaiTi","楷体","STKaiti",Georgia,"Palatino Linotype","Book Antiqua",Palatino,serif;
  letter-spacing:.05em;
}
.bulletin-body.empty{
  color:var(--faint);font-style:italic;font-size:13px;
  font-family:var(--fnt);letter-spacing:0;
}
.bulletin-hint{display:none;}
/* Edit modal */
.bulletin-modal{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  padding:0 0 env(safe-area-inset-bottom);
  background:rgba(43,29,8,.5);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.bulletin-modal.show{opacity:1;pointer-events:all;}
.bulletin-box{
  background:var(--bg);border:1.5px solid var(--hair);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:28px 22px calc(28px + env(safe-area-inset-bottom));
  width:100%;max-width:480px;
  box-shadow:0 -8px 32px rgba(40,20,5,.16);
  transform:translateY(30px);transition:transform .28s cubic-bezier(.22,1,.36,1);
}
.bulletin-modal.show .bulletin-box{transform:translateY(0);}
.bulletin-box-title{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:16px;letter-spacing:-.01em;}
.bulletin-input{
  width:100%;padding:12px 14px;border:1.5px solid var(--hair);
  border-radius:var(--r-sm);font-size:16px;font-family:var(--fnt);
  color:var(--ink);background:var(--bg3);outline:none;
  transition:border-color .18s;-webkit-appearance:none;margin-bottom:8px;
}
.bulletin-input:focus{border-color:var(--accent);}
.bulletin-textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--hair);
  border-radius:var(--r-sm);font-size:14px;font-family:var(--fnt);
  color:var(--ink);background:var(--bg3);outline:none;
  transition:border-color .18s;-webkit-appearance:none;
  resize:none;height:120px;line-height:1.7;margin-bottom:8px;
}
.bulletin-textarea:focus{border-color:var(--accent);}
.bulletin-btns{display:flex;gap:10px;margin-top:4px;}
.bulletin-btn{
  flex:1;padding:14px;border:none;border-radius:var(--r-md);
  font-family:var(--fnt);font-size:16px;font-weight:600;cursor:pointer;
  transition:opacity .12s,transform .1s;
}
.bulletin-btn:active{opacity:.78;transform:scale(.98);}
.bulletin-btn.primary{background:var(--accent);color:#FFF8E8;}
.bulletin-btn.sec{background:var(--bg3);color:var(--soft);border:1.5px solid var(--hair);}
.bulletin-err{font-size:12px;color:var(--warn);min-height:18px;margin-bottom:6px;}

/* ══════ 今日战报弹窗 ══════ */
.report-modal{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  padding:18px 14px calc(18px + env(safe-area-inset-bottom));background:rgba(42,29,8,.62);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .24s ease}
.report-modal.show{opacity:1;pointer-events:all}
.report-stage{width:100%;max-width:430px;max-height:calc(100dvh - 28px);overflow-y:auto;scrollbar-width:none;
  transform:translateY(18px) scale(.96);transition:transform .36s cubic-bezier(.22,1,.36,1)}
.report-stage::-webkit-scrollbar{display:none}
.report-modal.show .report-stage{transform:none}
.report-card{position:relative;overflow:hidden;border-radius:26px;padding:24px 19px 18px;min-height:610px;
  box-shadow:0 28px 70px rgba(20,10,0,.42),0 2px 0 rgba(255,255,255,.45) inset;transform-style:preserve-3d}
.report-card:before{content:"";position:absolute;inset:10px;border-radius:19px;border:1px solid rgba(255,248,232,.36);z-index:2;pointer-events:none}
.report-card:after{content:"";position:absolute;top:-35%;left:-60%;width:60%;height:170%;
  background:linear-gradient(105deg,transparent 24%,rgba(255,255,255,.34),transparent 72%);
  transform:rotate(13deg);animation:reportShine 4.2s ease-in-out infinite;z-index:1}
@keyframes reportShine{0%,45%{left:-60%;opacity:0}58%{opacity:1}100%{left:120%;opacity:0}}
.report-card>*{position:relative;z-index:3}
.report-card.standard{background:radial-gradient(circle at 18% 7%,rgba(255,226,137,.58),transparent 30%),radial-gradient(circle at 88% 14%,rgba(196,137,42,.18),transparent 24%),linear-gradient(145deg,#FFFCF4 0%,#F7E5BD 54%,#E7C27B 100%);color:var(--ink)}
.report-card.legend{background:radial-gradient(circle at 18% 10%,rgba(255,226,100,.5),transparent 28%),radial-gradient(circle at 86% 4%,rgba(255,248,232,.24),transparent 22%),linear-gradient(145deg,#2A1D08 0%,#5A3908 45%,#0F0A04 100%);color:#FFF8E8;
  box-shadow:0 0 0 1px rgba(255,220,120,.25),0 0 48px rgba(255,196,46,.28),0 30px 80px rgba(20,10,0,.56)}
.report-card.legend:before{border-color:rgba(255,213,95,.42);box-shadow:0 0 28px rgba(255,205,80,.18) inset}
.report-glow{position:absolute;right:-70px;top:-72px;width:210px;height:210px;border-radius:50%;z-index:0;
  background:radial-gradient(circle,rgba(255,236,157,.58),rgba(255,199,67,.18) 43%,transparent 70%);animation:reportSpin 13s linear infinite}
.report-glow:before,.report-glow:after{content:"";position:absolute;inset:32px;border-radius:50%;border:1px solid rgba(255,248,232,.26)}
.report-glow:after{inset:58px;border-color:rgba(173,122,30,.24)}
@keyframes reportSpin{to{transform:rotate(360deg)}}
.sparkles{position:absolute;inset:0;z-index:2;pointer-events:none;background:
  radial-gradient(circle at 18% 18%,rgba(255,239,158,.95) 0 1.5px,transparent 2px),
  radial-gradient(circle at 72% 13%,rgba(255,239,158,.85) 0 1.5px,transparent 2px),
  radial-gradient(circle at 86% 36%,rgba(255,239,158,.8) 0 1px,transparent 2px),
  radial-gradient(circle at 25% 78%,rgba(255,239,158,.75) 0 1px,transparent 2px);
  opacity:0;animation:spark 1.8s ease-in-out infinite}
.legend .sparkles{opacity:1}
@keyframes spark{0%,100%{filter:brightness(.8);transform:scale(1)}50%{filter:brightness(1.5);transform:scale(1.015)}}
.report-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.report-eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:rgba(122,84,20,.62)}
.legend .report-eyebrow{color:rgba(255,236,157,.72)}
.report-title{font-family:var(--fnt-display);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
.report-date{font-size:11.5px;color:var(--soft);margin-top:4px}
.legend .report-date{color:rgba(255,248,232,.64)}
.report-name{display:inline-flex;align-items:center;padding:4px 11px 5px;border-radius:999px;
  background:linear-gradient(135deg,#FFF7C9 0%,#FFD45C 48%,#B97810 100%);color:#3F2704;font-weight:900;
  box-shadow:0 1px 0 rgba(255,255,255,.68) inset,0 -4px 8px rgba(92,56,7,.22) inset,0 8px 18px rgba(122,84,20,.22)}
.legend .report-name{box-shadow:0 0 26px rgba(255,211,90,.4),0 1px 0 rgba(255,255,255,.42) inset,0 -4px 8px rgba(92,56,7,.24) inset}
.report-badge{width:72px;height:72px;border-radius:50%;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#FFF3B8,#C89328 56%,#7A5414);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 -8px 14px rgba(77,45,8,.25) inset,0 14px 24px rgba(84,49,7,.26);
  color:#4B3008;text-align:center;font-family:var(--fnt-display)}
.legend .report-badge{box-shadow:0 0 0 1px rgba(255,236,157,.3),0 0 40px rgba(255,200,57,.35),0 16px 28px rgba(0,0,0,.38)}
.report-badge b{font-size:19px;line-height:1}.report-badge span{font-size:10px;margin-top:4px}
.report-hero{padding:18px 15px 16px;border-radius:18px;background:rgba(255,255,255,.32);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 12px 26px rgba(91,56,10,.12)}
.legend .report-hero{background:rgba(255,248,232,.1);box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 16px 28px rgba(0,0,0,.22)}
.report-label{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.legend .report-label{color:rgba(255,236,157,.72)}
.report-time{font-family:var(--fnt-display);font-size:56px;line-height:.95;letter-spacing:-.03em;margin-top:6px;text-shadow:0 2px 0 rgba(255,255,255,.38)}
.legend .report-time{text-shadow:0 0 26px rgba(255,211,90,.4),0 3px 0 rgba(0,0,0,.24)}
.report-note{font-size:11px;color:var(--soft);margin-top:8px}.legend .report-note{color:rgba(255,248,232,.64)}
.report-ribbon{margin:14px 0 16px;padding:12px 13px;border-radius:15px;background:linear-gradient(135deg,#AD7A1E,#7A5414);color:#FFF8E8;box-shadow:0 8px 18px rgba(122,84,20,.22),0 1px 0 rgba(255,255,255,.24) inset;display:flex;align-items:center;justify-content:space-between;gap:12px}
.legend .report-ribbon{background:linear-gradient(135deg,#F5D36C,#B77912 58%,#6C4408);box-shadow:0 0 32px rgba(255,205,80,.26),0 10px 22px rgba(0,0,0,.24)}
.report-ribbon span{font-size:12px;color:rgba(255,248,232,.78)}.report-ribbon b{font-family:var(--fnt-display);font-size:22px;white-space:nowrap}
.report-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.report-stat{border-radius:14px;padding:12px 11px;background:rgba(255,255,255,.36);box-shadow:0 1px 0 rgba(255,255,255,.46) inset,0 8px 16px rgba(91,56,10,.08)}
.legend .report-stat{background:rgba(255,248,232,.1);box-shadow:0 1px 0 rgba(255,255,255,.14) inset}
.report-stat-k{font-size:10.5px;color:var(--soft);font-weight:700}.legend .report-stat-k{color:rgba(255,248,232,.58)}
.report-stat-v{font-family:var(--fnt-display);font-size:23px;font-weight:600;margin-top:2px}.report-stat-v span{font-size:12px;font-family:var(--fnt);font-weight:600;color:var(--soft);margin-left:2px}.legend .report-stat-v span{color:rgba(255,248,232,.6)}
.report-box{border-radius:16px;padding:13px 14px;margin-bottom:12px;background:rgba(122,84,20,.09);border:1px solid rgba(173,122,30,.16)}
.legend .report-box{background:rgba(255,236,157,.09);border-color:rgba(255,236,157,.18)}
.report-box-label{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}.legend .report-box-label{color:rgba(255,236,157,.62)}
.report-box-text{font-size:14px;line-height:1.65;font-weight:600}
.report-comment{font-size:14px;line-height:1.65;color:var(--soft);margin:10px 2px 14px;font-weight:800}.legend .report-comment{color:rgba(255,248,232,.74)}
.report-footline{padding-top:12px;border-top:1px solid rgba(173,122,30,.18);text-align:center;font-size:10.5px;line-height:1.65;color:rgba(140,107,53,.72)}
.legend .report-footline{border-top-color:rgba(255,236,157,.18);color:rgba(255,248,232,.52)}
.report-actions{display:flex;gap:10px;margin-top:12px}
.report-btn{flex:1;border:0;border-radius:15px;padding:13px 10px;font-family:var(--fnt);font-size:13px;font-weight:800;cursor:pointer;color:#FFF8E8;background:linear-gradient(180deg,#C8943C,#AD7A1E);box-shadow:0 1px 0 rgba(255,255,255,.32) inset,0 -5px 10px rgba(75,48,8,.25) inset,0 10px 20px rgba(122,84,20,.22)}
.report-btn.ghost{background:rgba(255,248,232,.16);color:#FFF8E8;border:1px solid rgba(255,248,232,.22);box-shadow:none}
.standard+.report-actions .report-btn.ghost{color:var(--soft);border-color:var(--hair);background:rgba(255,255,255,.22)}

function escReport(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function dailyReportData(){
  var s=window.JCDaily?JCDaily.summary():{user:reportName(),date:reportDate(),seconds:0,minutes:0,timeText:'0秒',totalPoints:0,modules:[]};
  var hasData=(s.modules&&s.modules.length)||s.seconds||s.minutes||s.totalPoints;
  var legendary=(s.seconds||0)>=1200;
  if(!hasData){
    return {
      cls:'standard',name:s.user||reportName(),date:s.date||reportDate(),level:'尚未记录',badge:'未开始',
      time:'0秒',title:'今日学习战报',note:'还没有检测到今日有效学习记录',
      ribbonLabel:'今日有效学习时长',ribbonValue:'0秒',
      stats:[['有效学习','0','分钟'],['今日成长值','0','分']],
      high:'今日高光：开始学习后，这里会自动汇总真实学习记录。',
      comment:'John 点评：先完成一次训练，再来生成属于今天的战报。'
    };
  }
  var mods=(s.modules||[]).slice().sort(function(a,b){return (b.points||0)-(a.points||0);});
  var stats=mods.map(function(m){
    if(m.count>0&&m.unit&&m.unit!=='分')return [m.label,String(m.count),m.unit];
    return [m.label,String(m.points||0),'分'];
  });
  if(!stats.length)stats=[['有效学习',s.timeText||'0秒','']];
  if(stats.length%2===1)stats.push(['今日成长值',String(s.totalPoints||0),'分']);
  var top=mods[0];
  return {
    cls:legendary?'legend':'standard',
    name:s.user||reportName(),
    date:s.date||reportDate(),
    level:legendary?'闪耀学习':'稳定推进',
    badge:legendary?'20+' :'真实',
    time:s.timeText||'0秒',
    title:legendary?'今日闪耀战报':'今日学习战报',
    note:legendary?'有效学习超过 20 分钟，闪耀战报已解锁':'已自动过滤超过 3 分钟的空闲时间',
    ribbonLabel:'今日有效学习时长',
    ribbonValue:s.timeText||'0秒',
    stats:stats.slice(0,6),
    high:top?('今日高光：'+top.label+' +'+top.points+' 分。'):'今日高光：完成了一次有效学习。',
    comment:legendary?'John 点评：今天这张卡，值得截图留念。':'John 点评：今天不是完成任务，是悄悄变强。'
  };
}

async function saveDailyReportImage(){

  if(!card)return;
  var old=btn.textContent;btn.textContent='生成中...';
  try{

    var clone=card.cloneNode(true);
    clone.style.width=rect.width+'px';clone.style.height=rect.height+'px';clone.style.margin='0';
    var styles=Array.from(document.querySelectorAll('style')).map(function(s){return s.textContent;}).join('\n');

    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+(rect.width*scale)+'" height="'+(rect.height*scale)+'"><foreignObject width="100%" height="100%" transform="scale('+scale+')">'+html+'</foreignObject></svg>';
    var img=new Image(),url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    await new Promise(function(resolve,reject){img.onload=resolve;img.onerror=reject;img.src=url;});
    var canvas=document.createElement('canvas');canvas.width=rect.width*scale;canvas.height=rect.height*scale;
    canvas.getContext('2d').drawImage(img,0,0);
    var a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='John-Class-今日学习战报.png';a.click();
    btn.textContent='已生成图片';setTimeout(function(){btn.textContent=old;},1800);
  }catch(err){
    btn.textContent='截图失败，请直接截图';setTimeout(function(){btn.textContent=old;},2200);
  }
}

// 入场动画：仅当从 index 跳转过来（带 sessionStorage 标记）时，
// 整体从屏幕底部滑入，无缝接续 index 的上滑出场；其他入口（后退/直接访问）不播放
(function(){
  if(document.documentElement.getAttribute('data-incoming-slide')!=='1') return;
  const wrap = document.getElementById('pageWrap');
  if(!wrap){
    document.documentElement.removeAttribute('data-incoming-slide');
    return;
  }
  var cleaned = false;
  function cleanup(){
    if(cleaned) return;
    cleaned = true;
    // 注意：不移除 .enter —— 它代表的 translateY(0) 本身就是正确终态。
    // 只清掉一次性标记属性，避免下次访问（无标记）时误触发滑出初始态。
    document.documentElement.removeAttribute('data-incoming-slide');
  }
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      wrap.classList.add('enter');
    });
  });
  wrap.addEventListener('transitionend', function onEnd(e){
    if(e.propertyName==='transform'){
      cleanup();
      wrap.removeEventListener('transitionend', onEnd);
    }
  });
  // 兜底：万一 transitionend 因为任何原因（动画被打断、图片加载导致布局跳动、
  // 低端设备丢帧等）没有触发，420ms 后强制清理标记，确保页面绝不会卡在屏幕外白屏。
  setTimeout(cleanup, 420);
})();
</script>
