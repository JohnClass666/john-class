body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px}

.prog-track{width:100%;height:4px;background:rgba(42,30,8,.08);border-radius:2px;overflow:hidden;margin-bottom:16px}
.prog-fill{height:4px;background:#2A1E08;border-radius:2px;transition:width .4s}

.sent-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sent-num{font-size:11px;color:#B5A080;font-weight:600;letter-spacing:.06em}
.sent-scene{font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:10px}

.scene-bug{background:rgba(200,70,60,.1);color:#7A1A10}
.scene-dev{background:rgba(200,140,50,.12);color:#5A3000}
.scene-qa{background:rgba(60,150,90,.1);color:#1A4A28}
.scene-product{background:rgba(140,80,200,.1);color:#4A1A7A}
.scene-sprint{background:rgba(42,30,8,.07);color:#5A4A30}
.scene-opinion{background:rgba(212,136,42,.12);color:#5A3000}
.scene-deadline{background:rgba(184,149,106,.15);color:#7A5A30}
.scene-everymatrix{background:rgba(42,30,8,.1);color:#2A1E08}
.sent-text{font-family:Georgia,serif;font-size:19px;line-height:1.75;color:#2A1E08}

.attempt-dot.used-pass{background:rgba(60,150,90,.5);border-color:rgba(60,150,90,.7)}
.attempt-dot.used-fail{background:rgba(200,70,60,.4);border-color:rgba(200,70,60,.6)}
.attempt-dot.current{background:#2A1E08;border-color:#2A1E08;transform:scale(1.2)}
.attempt-label{font-size:11px;color:#B5A080;letter-spacing:.06em}

.transcript-box.empty{color:#B5A080;font-style:normal;font-family:inherit;font-size:13px;text-align:center;padding:16px}
.transcript-box.listening{border-color:rgba(200,70,60,.4)}

.score-C{background:rgba(200,140,50,.12);border-color:rgba(200,140,50,.35);color:#5A3000}
.score-D{background:rgba(200,70,60,.1);border-color:rgba(200,70,60,.3);color:#7A1A10}
.score-num{font-size:20px;line-height:1}
.score-lbl{font-size:10px;margin-top:2px}
.score-msg{font-size:14px;font-weight:600;color:#2A1E08;line-height:1.4;text-align:left;flex:1}

.w-correct{color:#1A5C28}
.w-wrong{color:#A03020;text-decoration:underline wavy rgba(200,70,60,.5);text-underline-offset:3px}
.w-missing{color:#A03020;font-style:italic;opacity:.6}

async function sbUpsert(t,data){try{await fetch(SB_URL+'/rest/v1/'+t,{method:'POST',headers:Object.assign({},sbHeaders(),{'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify(data)});}catch(e){}}

function getProgressKey(){return 'jc_prog_speak_'+getWeekStart();}
function getProgress(){
  try{var r=localStorage.getItem(getProgressKey());return r?JSON.parse(r):{done:[],pts:0};}
  catch(e){return{done:[],pts:0};}
}
function saveProgress(p){try{localStorage.setItem(getProgressKey(),JSON.stringify(p));}catch(e){}}
function isDone(id){return getProgress().done.indexOf(id)!==-1;}

async function addPoints(){
  if(!userName)return;
  var ws=getWeekStart();
  var rows=await sbGet('weekly_scores','user_name=eq.'+encodeURIComponent(userName)+'&week_start=eq.'+ws+'&select=id,programmer_score');
  var cur=0,eid=null;
  if(rows&&rows.length){cur=rows[0].programmer_score||0;eid=rows[0].id;}
  var payload={user_name:userName,week_start:ws,programmer_score:cur+POINTS,updated_at:new Date().toISOString()};
  if(eid)payload.id=eid;
  await sbUpsert('weekly_scores',payload);
  // cumulative programmer_scores (permanent, never resets)
  var cRows=await sbGet('programmer_scores','user_name=eq.'+encodeURIComponent(userName)+'&select=score');
  var cCur=cRows&&cRows.length?cRows[0].score||0:0;
  await sbUpsert('programmer_scores',{user_name:userName,score:cCur+POINTS,updated_at:new Date().toISOString()});
  // local display cache
  var spk=parseInt(localStorage.getItem('jc_prog_speak_pts')||'0')+POINTS;
  localStorage.setItem('jc_prog_speak_pts',spk);
}

// ── SHUFFLE (seeded by module name so different from oral) ──
function shuffle(arr, seed){
  var a=arr.slice(), s=seed;
  for(var i=a.length-1;i>0;i--){
    s=(s*1664525+1013904223)&0xffffffff;
    var j=Math.abs(s)%(i+1);
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

// ── LEVENSHTEIN + DIFF ──
function levenshtein(a,b){
  var m=a.length,n=b.length,dp=[];
  for(var i=0;i<=m;i++){dp[i]=[];for(var j=0;j<=n;j++)dp[i][j]=0;}
  for(var i=0;i<=m;i++)dp[i][0]=i;
  for(var j=0;j<=n;j++)dp[0][j]=j;
  for(var i=1;i<=m;i++)for(var j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  return dp[m][n];
}
function normalizeWord(w){return w.toLowerCase().replace(/[^a-z0-9']/g,'');}
function calcScore(ref,spoken){
  var rw=ref.split(/\s+/).map(normalizeWord).filter(Boolean);
  var sw=spoken.split(/\s+/).map(normalizeWord).filter(Boolean);
  var correct=0;
  rw.forEach(function(w){var i=sw.indexOf(w);if(i!==-1){correct++;sw.splice(i,1);}});
  return rw.length?Math.round(correct/rw.length*100):0;
}
function buildDiff(ref,spoken){
  var rw=ref.split(/\s+/),rn=rw.map(normalizeWord),sn=spoken.trim().split(/\s+/).map(normalizeWord),su=sn.slice(),html='';
  rw.forEach(function(w,i){
    var n=rn[i],idx=su.indexOf(n);
    if(idx!==-1){html+='<span class="w-correct">'+esc(w)+'</span> ';su[idx]=null;return;}
    var best=-1,bd=99;
    su.forEach(function(sw,j){if(!sw)return;var d=levenshtein(n,sw);if(d<=2&&d<bd){bd=d;best=j;}});
    if(best!==-1){html+='<span class="w-wrong">'+esc(w)+'</span> ';su[best]=null;}
    else html+='<span class="w-missing">'+esc(w)+'</span> ';
  });
  return html.trim();
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── UI ──
function showPane(id){document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('on');});document.getElementById(id).classList.add('on');}

function updateEntryUI(){
  var p=getProgress();
  var pct=Math.round(p.done.length/100*100);
  document.getElementById('entrySentDone').textContent=p.done.length+' / 100 句';
  document.getElementById('entryProgFill').style.width=pct+'%';
  document.getElementById('entryPts').textContent=p.pts+' 分';
}

function renderSentence(){
  var s=orderedSents[currentIdx];
  document.getElementById('sentNum').textContent='句子 '+s.dispId+' / 100';
  document.getElementById('sentText').textContent=s.text;
  var sc=document.getElementById('sentScene');
  sc.textContent=SCENE_LABELS[s.scene]||s.scene;
  sc.className='sent-scene '+(SCENE_CSS[s.scene]||'');
  resetUI();
}

function updateProgUI(){
  var p=getProgress();
  var pct=Math.round(p.done.length/100*100);
  document.getElementById('progText').textContent=p.done.length+' / 100';
  document.getElementById('progFill').style.width=pct+'%';
}

function resetUI(){
  var tb=document.getElementById('transcriptBox');
  tb.textContent='按下录音，朗读上方句子';
  tb.className='transcript-box empty';
  document.getElementById('scoreWrap').style.display='none';
  document.getElementById('btnNext').style.display='none';
  document.getElementById('btnRetry').style.display='none';
  document.getElementById('btnSkip').style.display='inline-block';
  currentAttempt=0;
  recLocked=false;
  updateDots();
  updateRecBtn(false);
}

function updateDots(){
  for(var i=1;i<=3;i++){
    var d=document.getElementById('dot'+i);
    if(!d)return;
    d.className='attempt-dot';
    if(i<currentAttempt) d.className='attempt-dot used-fail';
    else if(i===currentAttempt) d.className='attempt-dot current';
  }
}
function markDot(pass){
  var d=document.getElementById('dot'+currentAttempt);
  if(d)d.className='attempt-dot '+(pass?'used-pass':'used-fail');
}

function updateRecBtn(rec){
  var btn=document.getElementById('recBtn');
  if(!btn)return;
  if(rec){btn.innerHTML='🔴 识别中，请稍候...';btn.className='rec-btn recording';btn.disabled=true;}
  else{btn.innerHTML='🎤 按下开始录音';btn.className='rec-btn';btn.disabled=false;}
}

function skipSentence(){
  currentIdx=(currentIdx+1)%orderedSents.length;
  renderSentence();
}
function retryNow(){
  var tb=document.getElementById('transcriptBox');
  tb.textContent='按下录音，朗读上方句子';
  tb.className='transcript-box empty';
  document.getElementById('scoreWrap').style.display='none';
  document.getElementById('btnRetry').style.display='none';
  document.getElementById('btnNext').style.display='none';
  document.getElementById('btnSkip').style.display='none';
  recLocked=false;
  document.getElementById('recBtn').disabled=false;
  updateRecBtn(false);
  updateDots();
}
function nextSentence(){
  currentIdx=(currentIdx+1)%orderedSents.length;
  renderSentence();
}

// ── REC ──
var recTimer = null;
var pendingFinal = ''; // 最新识别文字，stopRec时用

function toggleRec(){
  if(recLocked||isRecording)return;
  startRec();
}

function startRec(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('请用 Safari 打开此页面'); return; }

  // 清理旧实例
  if(recognition){ try{ recognition.abort(); }catch(e){} recognition = null; }
  if(recTimer){ clearTimeout(recTimer); recTimer = null; }
  pendingFinal = '';

  var tb = document.getElementById('transcriptBox');
  tb.textContent = '准备中...';
  tb.className = 'transcript-box listening';

  setTimeout(function(){
    var SR2 = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR2();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = true; // 实时显示，让用户看到在识别
    recognition.maxAlternatives = 1;

    recognition.onresult = function(e){
      var interim = '', final = '';
      for(var i = 0; i < e.results.length; i++){
        if(e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      var display = final || interim;
      if(display){ tb.textContent = display; tb.className = 'transcript-box'; }
      if(final) pendingFinal = final;
    };

    recognition.onend = function(){
      // onend 触发时（无论是自然结束还是 abort），用 pendingFinal 处理结果
      if(recTimer){ clearTimeout(recTimer); recTimer = null; }
      recognition = null;
      isRecording = false;
      updateRecBtn(false);
      if(pendingFinal.trim()){
        processResult(pendingFinal.trim());
      } else {
        tb.textContent = '没有识别到内容，请重新录音';
        tb.className = 'transcript-box empty';
      }
    };

    recognition.onerror = function(e){
      if(recTimer){ clearTimeout(recTimer); recTimer = null; }
      // 不置 null，让 onend 自然触发处理收尾
      if(e.error === 'not-allowed'){
        tb.textContent = '请允许麦克风权限后重试';
        tb.className = 'transcript-box empty';
      }
    };

    try{
      recognition.start();
      isRecording = true;
      updateRecBtn(true);
      tb.textContent = '🔴 正在录音，说完后会自动识别';
      // 15秒自动超时兜底
      recTimer = setTimeout(function(){
        if(recognition){ try{ recognition.abort(); }catch(e){} }
      }, 15000);
    }catch(err){
      tb.textContent = '启动失败，请重试';
      tb.className = 'transcript-box empty';
      recognition = null;
    }
  }, 350);
}

function stopRec(){
  if(recTimer){ clearTimeout(recTimer); recTimer = null; }
  isRecording = false;
  updateRecBtn(false);
  var tb = document.getElementById('transcriptBox');
  if(recognition){
    recognition.onend = null;
    recognition.onresult = null;
    recognition.onerror = null;
    try{ recognition.abort(); }catch(e){}
    recognition = null;
  }
  if(pendingFinal.trim()){
    processResult(pendingFinal.trim());
  } else {
    tb.textContent = '没有识别到内容，请重新录音';
    tb.className = 'transcript-box empty';
  }
}

// ── PROCESS ──
function processResult(spoken){
  recLocked=true;
  currentAttempt++;
  var s=orderedSents[currentIdx];
  var pct=calcScore(s.text,spoken);
  var passed=pct>=PASS_SCORE;
  markDot(passed);

  var grade=pct>=90?'A':pct>=70?'B':pct>=55?'C':'D';
  document.getElementById('scoreCircle').className='score-circle score-'+grade;
  document.getElementById('scoreNum').textContent=pct;
  document.getElementById('diffBox').innerHTML=buildDiff(s.text,spoken);
  document.getElementById('scoreWrap').style.display='block';
  document.getElementById('btnSkip').style.display='none';
  updateRecBtn(false);
  document.getElementById('recBtn').disabled=true;

  if(passed){
    document.getElementById('scoreMsg').textContent=pct>=90?'完美！🎉':'通过！继续 👍';
    document.getElementById('btnNext').style.display='inline-block';
    // only award points if not already done this week
    if(!isDone(s.id)){
      var p=getProgress();
      p.done.push(s.id);
      p.pts+=POINTS;
      saveProgress(p);
      updateProgUI();
      addPoints();
      showToast('+15 分 ✅');
      if(p.done.length>=100)setTimeout(function(){showDone(p);},1800);
    } else {
      document.getElementById('scoreMsg').textContent+=' （本句本周已计分）';
      document.getElementById('btnNext').style.display='inline-block';
    }
    sessionScores.push(pct);
  } else {
    var left=MAX_ATTEMPTS-currentAttempt;
    if(left>0){
      document.getElementById('scoreMsg').textContent=currentAttempt===1?'再试一次！注意标红的词 💪':'最后机会，慢慢来 🎯';
      document.getElementById('btnRetry').style.display='inline-block';
    } else {
      document.getElementById('scoreMsg').textContent='没过关，不要灰心，继续下一句';
      document.getElementById('btnNext').style.display='inline-block';
      sessionScores.push(pct);
    }
  }
}

function showDone(p){
  var avg=sessionScores.length?Math.round(sessionScores.reduce(function(a,b){return a+b;},0)/sessionScores.length):0;
  document.getElementById('doneTotal').textContent=p.pts;
  document.getElementById('doneAvg').textContent=avg||'—';
  showPane('p-done');
}

function showToast(msg){
  var t=document.getElementById('ptsToast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

// ── INIT ──
function init(){
  var name=localStorage.getItem('jc_username')||localStorage.getItem('jc_student_name');
  if(!name||name==='同学'){window.location.href='start.html';return;}
  userName=name;

  // Seed 1 for speaking (different from oral which uses seed 2)
  orderedSents=shuffle(SENTENCES,1);for(var i=0;i<orderedSents.length;i++)orderedSents[i].dispId=i+1;

  updateEntryUI();
  updateProgUI();

  document.getElementById('btnStart').addEventListener('click',function(){
    renderSentence();
    showPane('p-practice');
  });
  document.getElementById('backToEntry').addEventListener('click',function(e){
    e.preventDefault();
    if(isRecording&&recognition){recognition.stop();isRecording=false;}
    updateEntryUI();
    showPane('p-entry');
  });
}
init();
</script>
