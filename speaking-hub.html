<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>口语训练 · John Class</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#F5EDD8;color:#2A1E08;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:28px 20px}
.wrap{width:100%;max-width:480px}
.back-link{font-size:12px;color:#B5A080;text-decoration:none;display:block;margin-bottom:24px;transition:color .2s}
.back-link:hover{color:#2A1E08}
.logo{font-size:11px;letter-spacing:.18em;color:#B5A080;font-weight:600;margin-bottom:32px}
.hero{margin-bottom:32px}
.hero-icon{font-size:44px;margin-bottom:12px}
.hero-title{font-size:26px;font-weight:700;color:#2A1E08;margin-bottom:6px}
.hero-sub{font-size:13px;color:#8A7050;line-height:1.7}
.sec-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#B8956A;padding-bottom:8px;border-bottom:1px solid rgba(184,149,106,.2);margin-bottom:4px}
.tool-list{margin-bottom:28px}
.tool-item{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid rgba(184,149,106,.1);text-decoration:none;color:#2A1E08;cursor:pointer;transition:transform .15s}
.tool-item:last-child{border-bottom:none}
.tool-item:hover{transform:translateX(4px)}
.tool-item:active{opacity:.7}
.tool-item.disabled{opacity:.45;cursor:default;pointer-events:none}
.tool-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.c-gold{background:rgba(201,169,110,.14);border:1.5px solid rgba(201,169,110,.28)}
.c-green{background:rgba(60,150,90,.12);border:1.5px solid rgba(60,150,90,.22)}
.c-blue{background:rgba(74,124,184,.12);border:1.5px solid rgba(74,124,184,.22)}
.tool-info{flex:1}
.tool-name{font-size:15px;font-weight:700;margin-bottom:2px}
.tool-desc{font-size:12px;color:#8A7050;line-height:1.5}
.tool-badge{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:10px;flex-shrink:0}
.badge-live{background:rgba(60,150,90,.12);color:#1A4A28;border:1px solid rgba(60,150,90,.2)}
.badge-new{background:rgba(200,140,50,.12);color:#7A4000;border:1px solid rgba(200,140,50,.2)}
.badge-soon{background:rgba(184,149,106,.1);color:#B8956A;border:1px solid rgba(184,149,106,.2)}
.arrow{color:rgba(184,149,106,.4);flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="study.html">← 返回学习中心</a>
  <div class="logo">JOHN CLASS · 口语训练</div>
  <div class="hero">
    <div class="hero-icon">🎙️</div>
    <div class="hero-title">口语训练</div>
    <div class="hero-sub">录音 · 评分 · 对话实战<br>打开说，别怕错</div>
  </div>

  <div class="sec-label">选择训练模式</div>
  <div class="tool-list">
    <a class="tool-item" href="speaking.html">
      <div class="tool-circle c-gold">📝</div>
      <div class="tool-info">
        <div class="tool-name">雅思口语</div>
        <div class="tool-desc">Part 1-3 话题练习 · 录音转文字 · 参考范文</div>
      </div>
      <span class="tool-badge badge-live">已上线</span>
      <span class="arrow">→</span>
    </a>

    <a class="tool-item" href="survival-english.html">
      <div class="tool-circle c-green">🌍</div>
      <div class="tool-info">
        <div class="tool-name">生存英语</div>
        <div class="tool-desc">13 个真实场景对话 · 对方说话你回应 · 场景通关 +500分</div>
      </div>
      <span class="tool-badge badge-new">新课</span>
      <span class="arrow">→</span>
    </a>

    <div class="tool-item disabled">
      <div class="tool-circle c-blue">💬</div>
      <div class="tool-info">
        <div class="tool-name">生活口语</div>
        <div class="tool-desc">日常聊天 · 购物 · 餐厅 · 电话沟通</div>
      </div>
      <span class="tool-badge badge-soon">敬请期待</span>
      <span class="arrow" style="opacity:.3">→</span>
    </div>
  </div>
</div>
</body>
</html>
