<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>口语训练 · John Class</title>
<style>
:root{
  --bg:#FBF6EC;--bg2:#F0E2C4;--bg3:#F6EEDC;
  --ink:#2A1D08;--soft:#8C6B35;--faint:#C2A26C;
  --hair:#E2D0A4;--hair2:#F0E8D0;
  --accent:#AD7A1E;--accent-deep:#7A5414;--accent-soft:#F5E8C8;
  --warn:#C2491E;--warn-soft:#FAEEE8;
  --fnt:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --shadow-sm:0 1px 2px rgba(40,24,5,.10);
  --shadow-md:0 3px 10px rgba(40,24,5,.12);
  --shadow-lg:0 10px 28px rgba(40,24,5,.16);
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-pill:999px}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--fnt);color:var(--ink);-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;overflow-x:hidden;user-select:none;letter-spacing:-.01em}

/* ── Layout ── */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;
  padding:10px 16px;min-height:52px;
  background:var(--bg);box-shadow:0 1px 0 var(--hair)}
.htitle{flex:1;text-align:center;font-size:16px;font-weight:700;color:#3A2A10;
  text-shadow:0 1px 2px rgba(40,20,5,.14);letter-spacing:-.02em}
.sp{flex:1}

.back{width:36px;height:36px;border-radius:50%;flex:0 0 auto;text-decoration:none;
  background:linear-gradient(180deg,#FDF8F0 0%,#E8D8B4 100%);
  border:1px solid #C8A860;border-bottom:3px solid #9A7830;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 2px 5px rgba(40,20,5,.12);
  font-size:20px;color:#3A2A10;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .08s,box-shadow .08s,border-bottom-width .08s}
.back:active{transform:translateY(2px);border-bottom-width:1px;
  box-shadow:inset 0 1px 3px rgba(40,20,5,.12)}

.wrap{width:100%;max-width:480px;margin:0 auto;padding:24px 20px 48px}

/* ── Hero ── */
.hero{text-align:center;padding:28px 0 24px}
.hero-icon{font-size:48px;margin-bottom:12px;
  filter:drop-shadow(0 4px 8px rgba(80,40,5,.22))}
.hero-title{font-size:28px;font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:-.03em}
.hero-sub{font-size:13px;color:var(--soft);line-height:1.75}

/* ── Section label ── */
.sec-label{font-size:10px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;
  color:var(--faint);padding-bottom:10px;
  border-bottom:1px solid var(--hair2);margin-bottom:4px}

/* ── Tool list as cards ── */
.tool-list{margin-bottom:32px;display:flex;flex-direction:column;gap:10px;padding-top:10px}

.tool-item{display:flex;align-items:center;gap:14px;padding:16px 16px;
  text-decoration:none;color:var(--ink);cursor:pointer;
  background:linear-gradient(180deg,#FFFFFF 0%,#F8F1DF 100%);
  border:1px solid #DDD0A8;border-bottom:3px solid #C0A868;
  border-radius:var(--r-md);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),var(--shadow-sm);
  transition:transform .1s,box-shadow .1s,border-bottom-width .1s}
.tool-item:active{transform:translateY(2px);border-bottom-width:1px;
  box-shadow:inset 0 1px 3px rgba(40,20,5,.10)}
.tool-item.disabled{opacity:.4;cursor:default;pointer-events:none}

.tool-circle{width:50px;height:50px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  background:var(--accent-soft);border:1.5px solid var(--hair);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),var(--shadow-sm)}

/* All circles use warm amber — no green/blue per spec */
.c-gold{background:linear-gradient(145deg,#FFF4DC,#F0E0B0);border-color:#D4B870}
.c-green{background:linear-gradient(145deg,#F0EDD8,#E4D8A8);border-color:#C8B870}
.c-blue{background:linear-gradient(145deg,#EEE8D8,#E0D4B4);border-color:#C4B068}

.tool-info{flex:1;min-width:0}
.tool-name{font-size:15px;font-weight:700;margin-bottom:3px;color:var(--ink)}
.tool-desc{font-size:12px;color:var(--soft);line-height:1.55}

.tool-badge{font-size:10px;font-weight:700;letter-spacing:.06em;padding:4px 9px;
  border-radius:var(--r-pill);flex-shrink:0}
.badge-live{background:var(--accent-soft);color:var(--accent-deep);
  border:1px solid rgba(173,122,30,.25)}
.badge-new{background:var(--warn-soft);color:var(--warn);
  border:1px solid rgba(194,73,30,.22)}
.badge-soon{background:var(--bg2);color:var(--faint);border:1px solid var(--hair)}

.arrow{color:var(--faint);flex-shrink:0;font-size:15px}

/* ── Leaderboard ── */
.board-section{margin-top:32px}
.board-sub{font-size:11px;color:var(--faint);margin-bottom:14px}
#speakBoard{}

/* Board link */
.board-link{display:inline-flex;align-items:center;gap:5px;margin-top:14px;
  font-size:12px;color:var(--accent);text-decoration:none;font-weight:700;
  padding:8px 14px;border-radius:var(--r-pill);
  background:var(--accent-soft);border:1px solid rgba(173,122,30,.2);
  transition:opacity .15s}
.board-link:active{opacity:.7}

/* logo kicker */
.kicker{font-size:10px;font-weight:700;letter-spacing:.30em;color:var(--faint);
  text-transform:uppercase;text-align:center;padding-top:8px;margin-bottom:0}
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="study.html">‹</a>
  <div class="htitle">口语训练</div>
  <div class="sp"></div>
</div>

<div class="wrap">
  <div class="kicker">JOHN CLASS · 口语训练</div>
  <div class="hero">
    <div class="hero-icon">🎙️</div>
    <div class="hero-title">口语训练</div>
    <div class="hero-sub">录音 · 评分 · 对话实战<br>打开说，别怕错</div>
  </div>

  <div class="sec-label">选择训练模式</div>
  <div class="tool-list">
    <a class="tool-item" href="speaking.html">
      <div class="tool-circle c-gold">📝</div>
      <div class="tool-info">
        <div class="tool-name">雅思口语</div>
        <div class="tool-desc">Part 1-3 话题练习 · 录音转文字 · 参考范文</div>
      </div>
      <span class="tool-badge badge-live">已上线</span>
      <span class="arrow">›</span>
    </a>

    <a class="tool-item" href="survival-english.html">
      <div class="tool-circle c-green">🌍</div>
      <div class="tool-info">
        <div class="tool-name">生存英语</div>
        <div class="tool-desc">13 个真实场景对话 · 对方说话你回应 · 场景通关 +500分</div>
      </div>
      <span class="tool-badge badge-new">新课</span>
      <span class="arrow">›</span>
    </a>

    <div class="tool-item disabled">
      <div class="tool-circle c-blue">💬</div>
      <div class="tool-info">
        <div class="tool-name">生活口语</div>
        <div class="tool-desc">日常聊天 · 购物 · 餐厅 · 电话沟通</div>
      </div>
      <span class="tool-badge badge-soon">敬请期待</span>
      <span class="arrow" style="opacity:.3">›</span>
    </div>
  </div>

  <!-- 口语累积榜 -->
  <div class="board-section">
    <div class="sec-label" style="margin-bottom:12px">🏆 口语累积榜</div>
    <div class="board-sub">生存英语 · 永久累积</div>
    <div id="speakBoard"><div style="font-size:13px;color:#B5A080;padding:20px;text-align:center">加载中...</div></div>
    <a href="weekly_stars.html" class="board-link">→ 查看每周大神榜</a>
  </div>
</div>

<script>
var SB_URL='https://ghunrrtrdgicbmixsqrc.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdodW5ycnRyZGdpY2JtaXhzcXJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Mzg3OTMsImV4cCI6MjA5NjMxNDc5M30.n3_yRr6iR0gtEo7HSxGWO1jBGs1aaALAchVhqjgnOqs';
function sbH(){return{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};}
async function loadSpeakBoard(){
  var el=document.getElementById('speakBoard');
  var name=localStorage.getItem('jc_username')||localStorage.getItem('jc_student_name')||'';
  try{
    var r=await fetch(SB_URL+'/rest/v1/speaking_scores?select=user_name,score&order=score.desc&limit=10',{headers:sbH()});
    if(!r.ok)throw new Error('HTTP '+r.status);
    var rows=await r.json();
    var valid=(rows||[]).filter(function(r){return (r.score||0)>0;});
    if(!valid.length){el.innerHTML='<div style="font-size:13px;color:#B5A080;padding:20px;text-align:center">还没有人上榜</div>';return;}
    el.innerHTML=valid.map(function(r,i){
      var m=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
      var isMe=r.user_name===name;
      return '<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(180deg,#FFFFFF,#F8F1DF);border-radius:12px;margin-bottom:8px;border:1px solid #DDD0A8;border-bottom:3px solid #C0A868;box-shadow:0 1px 4px rgba(40,24,5,.08)'+(isMe?';outline:2px solid rgba(173,122,30,.35);outline-offset:1px':'')+'">'
        +'<div style="font-size:17px;width:30px;text-align:center;flex-shrink:0">'+m+'</div>'
        +'<div style="flex:1;font-size:14px;font-weight:600;color:#2A1D08">'+r.user_name+(isMe?' （你）':'')+'</div>'
        +'<div style="font-size:15px;font-weight:700;color:#7A5414;flex-shrink:0;font-family:Georgia,serif">'+(r.score||0)+'</div>'
        +'</div>';
    }).join('');
  }catch(e){el.innerHTML='<div style="font-size:13px;color:#B5A080;padding:20px;text-align:center">加载失败</div>';}
}
loadSpeakBoard();
</script>
</body>
</html>
