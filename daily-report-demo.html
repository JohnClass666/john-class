<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今日学习战报 · John Class</title>
<style>
:root{--bg:#FBF6EC;--ink:#2A1D08;--soft:#8C6B35;--faint:#C2A26C;--accent:#AD7A1E;--deep:#7A5414;--paper:#FFF8E8;--fnt:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;--display:Georgia,"Songti SC","STSong",serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-family:var(--fnt);color:var(--ink);background:radial-gradient(circle at 50% -10%,#F2D99D,transparent 34%),var(--bg);padding:22px 14px 38px}
.wrap{max-width:560px;margin:0 auto}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);text-decoration:none}
.back{font-size:12px;color:var(--soft);text-decoration:none}
.title{font-family:var(--display);font-size:28px;font-weight:600;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--soft);line-height:1.7;margin:6px 0 18px}
.switch{display:flex;gap:8px;margin-bottom:16px;padding:4px;border-radius:999px;background:#F6EEDC;border:1px solid #E2D0A4;width:max-content}
.tab{border:0;border-radius:999px;padding:10px 16px;background:transparent;color:var(--soft);font-size:13px;font-weight:700;cursor:pointer}
.tab.on{background:var(--accent);color:var(--paper);box-shadow:0 8px 18px rgba(122,84,20,.22)}
.card{position:relative;overflow:hidden;border-radius:26px;padding:25px 20px 19px;min-height:670px;box-shadow:0 22px 48px rgba(47,28,5,.28),0 2px 0 rgba(255,255,255,.45) inset;transform-style:preserve-3d}
.card:before{content:"";position:absolute;inset:10px;border-radius:19px;border:1px solid rgba(255,248,232,.36);z-index:2;pointer-events:none}
.card:after{content:"";position:absolute;top:-35%;left:-55%;width:55%;height:170%;background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,.28),transparent 72%);transform:rotate(13deg);animation:shine 4.8s ease-in-out infinite;z-index:1}
@keyframes shine{0%,52%{left:-55%;opacity:0}62%{opacity:1}100%{left:120%;opacity:0}}
.card>*{position:relative;z-index:3}
.standard{background:radial-gradient(circle at 18% 7%,rgba(255,226,137,.58),transparent 30%),radial-gradient(circle at 88% 14%,rgba(196,137,42,.18),transparent 24%),linear-gradient(145deg,#FFFCF4 0%,#F7E5BD 54%,#E7C27B 100%);color:var(--ink)}
.legend{background:radial-gradient(circle at 18% 10%,rgba(255,213,95,.36),transparent 28%),radial-gradient(circle at 86% 4%,rgba(255,248,232,.18),transparent 22%),linear-gradient(145deg,#2A1D08 0%,#5A3908 45%,#0F0A04 100%);color:var(--paper)}
.legend:before{border-color:rgba(255,213,95,.42);box-shadow:0 0 24px rgba(255,205,80,.14) inset}
.halo{position:absolute;right:-70px;top:-72px;width:200px;height:200px;border-radius:50%;z-index:0;background:radial-gradient(circle,rgba(255,236,157,.5),rgba(255,199,67,.16) 43%,transparent 69%);animation:spin 14s linear infinite}
.halo:before,.halo:after{content:"";position:absolute;inset:32px;border-radius:50%;border:1px solid rgba(255,248,232,.24)}
.halo:after{inset:58px;border-color:rgba(173,122,30,.24)}
@keyframes spin{to{transform:rotate(360deg)}}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:rgba(122,84,20,.62)}
.legend .eyebrow{color:rgba(255,236,157,.72)}
.card-title{font-family:var(--display);font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
.date{font-size:11.5px;color:var(--soft);margin-top:4px}
.legend .date{color:rgba(255,248,232,.64)}
.title-line{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.name-mark{display:inline-flex;align-items:center;padding:4px 11px 5px;border-radius:999px;
background:linear-gradient(135deg,#FFF7C9 0%,#FFD45C 48%,#B97810 100%);color:#3F2704;font-weight:900;
box-shadow:0 1px 0 rgba(255,255,255,.68) inset,0 -4px 8px rgba(92,56,7,.22) inset,0 8px 18px rgba(122,84,20,.22)}
.legend .name-mark{box-shadow:0 0 24px rgba(255,211,90,.36),0 1px 0 rgba(255,255,255,.42) inset,0 -4px 8px rgba(92,56,7,.24) inset}
.title-dot{font-family:var(--display);font-size:18px;color:var(--accent);line-height:1}
.legend .title-dot{color:#F5D36C;text-shadow:0 0 14px rgba(255,211,90,.4)}
.badge{width:74px;height:74px;border-radius:50%;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#FFF3B8,#C89328 56%,#7A5414);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 -8px 14px rgba(77,45,8,.25) inset,0 14px 24px rgba(84,49,7,.26);color:#4B3008;text-align:center;font-family:var(--display);transform:translateZ(18px)}
.legend .badge{box-shadow:0 0 0 1px rgba(255,236,157,.3),0 0 38px rgba(255,200,57,.3),0 16px 28px rgba(0,0,0,.38)}
.badge b{font-size:20px;line-height:1}
.badge span{font-size:10px;margin-top:4px}
.hero{padding:18px 15px 16px;border-radius:18px;background:rgba(255,255,255,.32);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 12px 26px rgba(91,56,10,.12)}
.legend .hero{background:rgba(255,248,232,.1);box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 16px 28px rgba(0,0,0,.22)}
.hero-label{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.legend .hero-label{color:rgba(255,236,157,.72)}
.time{display:flex;align-items:flex-end;gap:8px;margin-top:6px}
.time b{font-family:var(--display);font-size:60px;line-height:.92;letter-spacing:-.03em;text-shadow:0 2px 0 rgba(255,255,255,.38)}
.legend .time b{text-shadow:0 0 24px rgba(255,211,90,.32),0 3px 0 rgba(0,0,0,.24)}
.time span{font-size:17px;font-weight:700;margin-bottom:7px}
.note{font-size:11px;color:var(--soft);margin-top:8px}
.legend .note{color:rgba(255,248,232,.64)}
.ribbon{margin:14px 0 16px;padding:12px 13px;border-radius:15px;background:linear-gradient(135deg,#AD7A1E,#7A5414);color:var(--paper);box-shadow:0 8px 18px rgba(122,84,20,.22),0 1px 0 rgba(255,255,255,.24) inset;display:flex;align-items:center;justify-content:space-between;gap:12px}
.legend .ribbon{background:linear-gradient(135deg,#F5D36C,#B77912 58%,#6C4408);box-shadow:0 0 30px rgba(255,205,80,.22),0 10px 22px rgba(0,0,0,.24)}
.ribbon span{font-size:12px;color:rgba(255,248,232,.78)}
.ribbon b{font-family:var(--display);font-size:23px;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.stat{border-radius:14px;padding:12px 11px;background:rgba(255,255,255,.36);box-shadow:0 1px 0 rgba(255,255,255,.46) inset,0 8px 16px rgba(91,56,10,.08)}
.legend .stat{background:rgba(255,248,232,.1);box-shadow:0 1px 0 rgba(255,255,255,.14) inset}
.stat-k{font-size:10.5px;color:var(--soft);font-weight:700}
.legend .stat-k{color:rgba(255,248,232,.58)}
.stat-v{font-family:var(--display);font-size:24px;font-weight:600;margin-top:2px}
.stat-v span{font-size:12px;font-family:var(--fnt);font-weight:600;color:var(--soft);margin-left:2px}
.legend .stat-v span{color:rgba(255,248,232,.6)}
.box{border-radius:16px;padding:13px 14px;margin-bottom:12px;background:rgba(122,84,20,.09);border:1px solid rgba(173,122,30,.16)}
.legend .box{background:rgba(255,236,157,.09);border-color:rgba(255,236,157,.18)}
.box-label{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.legend .box-label{color:rgba(255,236,157,.62)}
.box-text{font-size:14px;line-height:1.65;font-weight:600}
.comment{font-size:15px;line-height:1.65;color:var(--soft);margin:12px 2px 16px;font-weight:800}
.legend .comment{color:rgba(255,248,232,.74)}
.footline{padding-top:13px;border-top:1px solid rgba(173,122,30,.18);text-align:center;font-size:10.5px;line-height:1.7;color:rgba(140,107,53,.72)}
.legend .footline{border-top-color:rgba(255,236,157,.18);color:rgba(255,248,232,.52)}
.actions{display:flex;gap:10px;margin-top:14px}
.shot{flex:1;border:0;border-radius:16px;padding:14px 12px;font-family:var(--fnt);font-size:14px;font-weight:800;cursor:pointer;color:var(--paper);
background:linear-gradient(180deg,#C8943C,#AD7A1E);box-shadow:0 1px 0 rgba(255,255,255,.32) inset,0 -5px 10px rgba(75,48,8,.25) inset,0 10px 20px rgba(122,84,20,.22)}
.shot:active{transform:scale(.985)}
@media(max-width:390px){.card{padding:22px 17px 17px;min-height:640px}.time b{font-size:52px}.card-title{font-size:22px}.badge{width:66px;height:66px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a class="brand" href="study.html">John Class</a><a class="back" href="study.html">返回学习中心</a></div>
  <div class="title">今日学习战报</div>
  <div class="sub">结束学习后，生成适合截图发给家长或 John 的学习战报。</div>
  <div class="switch">
    <button class="tab on" id="standardBtn" onclick="render('standard')">普通战报</button>
    <button class="tab" id="legendBtn" onclick="render('legend')">闪耀战报</button>
  </div>
  <div id="host"></div>
</div>
<script src="jc-daily.js"></script>
<script>
function reportName(){return localStorage.getItem('jc_username')||localStorage.getItem('jc_student_name')||'同学';}
function reportDate(){var d=new Date();return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function liveReportData(mode){
  var s=window.JCDaily?JCDaily.summary():{user:reportName(),date:reportDate(),seconds:0,minutes:0,timeText:'0秒',totalPoints:0,modules:[],days:0};
  var hasData=(s.modules&&s.modules.length)||s.seconds||s.minutes||s.totalPoints;
  if(!hasData){
    return {
      cls:'standard',
      name:s.user||reportName(),
      date:s.date||reportDate(),
      level:'尚未记录',
      days:'0秒',
      badge:'未开始',
      minutes:'0秒',
      ribbonLabel:'今日有效学习时长',
      ribbonValue:'0秒',
      title:'今日学习战报',
      note:'还没有检测到今日有效学习记录',
      stats:[['有效学习','0','分钟'],['今日成长值','0','分']],
      high:'今日高光：开始学习后，这里会自动汇总真实学习记录。',
      comment:'John 点评：先完成一次训练，再来生成属于今天的战报。'
    };
  }
  var strong=(mode==='legend') || s.days>=2.5 || s.totalPoints>=1200 || s.minutes>=60;
  var mods=(s.modules||[]).slice().sort(function(a,b){return (b.points||0)-(a.points||0);});
  var stats=mods.map(function(m){
    if(m.count>0&&m.unit&&m.unit!=='分')return [m.label,String(m.count),m.unit];
    return [m.label,String(m.points||0),'分'];
  });
  if(!stats.length)stats=[['有效学习',s.timeText||'0秒','']];
  if(stats.length%2===1)stats.push(['今日成长值',String(s.totalPoints||0),'分']);
  var top=mods[0];
  return {
    cls:strong?'legend':'standard',
    name:s.user,
    date:s.date,
    level:strong?'爆发学习':'稳定推进',
    days:s.timeText||'0秒',
    badge:'真实',
    minutes:s.timeText||'0秒',
    ribbonLabel:'今日有效学习时长',
    ribbonValue:s.timeText||'0秒',
    title:strong?'今日大神战报':'今日学习战报',
    note:'已自动过滤超过 3 分钟的空闲时间',
    stats:stats.slice(0,6),
    high:top?('今日高光：'+top.label+' +'+top.points+' 分。'):'今日高光：完成了一次有效学习。',
    comment:strong?'John 点评：这不是努力，这是爆发。':'John 点评：今天不是完成任务，是悄悄变强。'
  };
}
function render(mode){
  var d=liveReportData(mode);
  var displayName=d.name||reportName();
  var displayDate=d.date||reportDate();
  var badge=d.badge||d.days;
  var ribbonLabel=d.ribbonLabel||'今日有效学习时长';
  var ribbonValue=d.ribbonValue||d.days;
  standardBtn.classList.toggle('on',mode==='standard');
  legendBtn.classList.toggle('on',mode==='legend');
  host.innerHTML='<div class="card '+esc(d.cls)+'" id="reportCard"><div class="halo"></div><div class="head"><div><div class="eyebrow">John Class</div><div class="title-line"><span class="name-mark">'+esc(displayName)+'</span><span class="title-dot">·</span><div class="card-title">'+esc(d.title)+'</div></div><div class="date">'+esc(displayDate)+'</div></div><div class="badge"><b>'+esc(badge)+'</b><span>'+esc(d.level)+'</span></div></div><div class="hero"><div class="hero-label">Effective Focus</div><div class="time"><b>'+esc(d.minutes)+'</b></div><div class="note">'+esc(d.note)+'</div></div><div class="ribbon"><span>'+esc(ribbonLabel)+'</span><b>'+esc(ribbonValue)+'</b></div><div class="stats">'+d.stats.map(function(s){return '<div class="stat"><div class="stat-k">'+esc(s[0])+'</div><div class="stat-v">'+esc(s[1])+'<span>'+esc(s[2])+'</span></div></div>';}).join('')+'</div><div class="box"><div class="box-label">Today Highlight</div><div class="box-text">'+esc(d.high)+'</div></div><div class="comment">'+esc(d.comment)+'</div><div class="footline">截图向家长或 John 炫耀 · 微信 JiahaoLee6666<br>Growing Skills · Shaping Futures</div></div><div class="actions"><button class="shot" onclick="saveReportImage()">保存战报图片</button></div>';
}
render('standard');
async function saveReportImage(){
  var card=document.getElementById('reportCard');
  var btn=document.querySelector('.shot');
  if(!card)return;
  var old=btn.textContent;btn.textContent='生成中...';
  try{
    var rect=card.getBoundingClientRect(),scale=2;
    var clone=card.cloneNode(true);
    clone.style.width=rect.width+'px';
    clone.style.height=rect.height+'px';
    clone.style.margin='0';
    var styles=Array.from(document.querySelectorAll('style')).map(function(s){return s.textContent;}).join('\n');
    var html='<html xmlns="http://www.w3.org/1999/xhtml"><head><style>'+styles+'</style></head><body style="margin:0;background:transparent;"><div style="width:'+rect.width+'px;height:'+rect.height+'px;">'+clone.outerHTML+'</div></body></html>';
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+(rect.width*scale)+'" height="'+(rect.height*scale)+'"><foreignObject width="100%" height="100%" transform="scale('+scale+')">'+html+'</foreignObject></svg>';
    var img=new Image();
    var url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    await new Promise(function(resolve,reject){img.onload=resolve;img.onerror=reject;img.src=url;});
    var canvas=document.createElement('canvas');
    canvas.width=rect.width*scale;canvas.height=rect.height*scale;
    var ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0);
    var a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download='John-Class-今日学习战报.png';
    a.click();
    btn.textContent='已生成图片';
    setTimeout(function(){btn.textContent=old;},1800);
  }catch(e){
    btn.textContent='截图失败，请直接截图';
    setTimeout(function(){btn.textContent=old;},2200);
  }
}
</script>
</body>
</html>
