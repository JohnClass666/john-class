<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>每周学习大神榜 · John Class</title>
<style>
:root{
  --bg:#FBF6EC;--bg2:#F0E2C4;--bg3:#F6EEDC;
  --ink:#2A1D08;--soft:#8C6B35;--faint:#C2A26C;
  --hair:#E2D0A4;--accent:#AD7A1E;--accent-deep:#7A5414;--accent-soft:#F5E8C8;
  --warn:#C2491E;--warn-soft:#FAEEE8;
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-pill:999px;
  --shadow-sm:0 1px 2px rgba(40,24,5,.10);
  --shadow-md:0 3px 10px rgba(40,24,5,.12);
  --shadow-lg:0 10px 28px rgba(40,24,5,.16);
  --fnt:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --fnt-display:Georgia,"Songti SC","STSong",serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--fnt);color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

.content{padding:22px 18px calc(48px + env(safe-area-inset-bottom));position:relative;max-width:560px;margin:0 auto}

.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.nav-brand{font-family:var(--fnt-display);font-size:16px;font-weight:600;letter-spacing:-.01em;
  color:var(--ink);text-decoration:none}
.nav-back{font-size:12px;color:var(--soft);text-decoration:none;display:flex;align-items:center;gap:4px;transition:color .2s}
.nav-back:active{opacity:.6}

.page-title{font-family:var(--fnt-display);font-size:clamp(24px,4vw,30px);font-weight:600;
  color:var(--ink);letter-spacing:-.01em;margin-bottom:6px}
.page-sub{font-size:13px;color:var(--soft);margin-bottom:4px}
.week-label{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--faint);
  text-transform:uppercase;margin-bottom:20px}

/* ══════ 7 个 tab：总榜 + 6 分类，统一胶囊样式，总榜用强调色默认选中 ══════ */
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 22px;margin:0 -18px;padding-left:18px;padding-right:18px;
  scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex:0 0 auto;padding:9px 16px;border-radius:var(--r-pill);font-size:13px;font-weight:600;
  background:var(--bg3);color:var(--soft);border:1.5px solid var(--hair);cursor:pointer;
  transition:transform .12s,background .15s,color .15s,border-color .15s;white-space:nowrap}
.cat-tab:active{transform:scale(.95)}
.cat-tab.active{background:var(--accent);color:#FFF8E8;border-color:var(--accent)}

/* ══════ 排行榜大卡片：唯一的强调色重点区域，点哪个 tab 这里就显示哪个的内容 ══════ */
.board-card{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:22px 20px 18px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%);
  box-shadow:0 2px 4px rgba(40,20,5,.14),0 10px 22px rgba(122,84,20,.28),0 22px 44px rgba(122,84,20,.16)}
.board-card::after{content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.16) 45%,transparent 60%);
  background-size:220% 100%;background-position:130% 0;animation:shimmer 4.2s ease-in-out infinite;pointer-events:none}
@keyframes shimmer{0%,55%{background-position:130% 0}100%{background-position:-50% 0}}
.board-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;position:relative;z-index:1}
.board-hd-l{display:flex;align-items:center;gap:8px}
.board-hd-ic{flex:0 0 auto;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.board-hd-ic svg{width:16px;height:16px}
.board-hd-tt{font-family:var(--fnt-display);font-size:17px;font-weight:600;color:#FFF8E8;letter-spacing:-.01em}
.board-hd-r{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:rgba(255,248,232,.7);text-transform:uppercase}

/* 条幅行：长度按分数占最高分比例缩放，第一名最长；
   不接背景轨道——条幅本身就是这个人的真实长度，不暗示存在"满分"或"未填满"。
   姓名/分数固定在条幅上方，不受条幅宽度影响，避免分数低的人名字被挤变形 */
.bar-row{position:relative;z-index:1;margin-bottom:16px}
.bar-row:last-child{margin-bottom:0}
.bar-meta{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;padding:0 2px}
.bar-rank{font-family:var(--fnt-display);font-size:14px;font-weight:600;color:rgba(255,248,232,.55);flex-shrink:0;width:16px;text-align:center}
.bar-row.first .bar-rank{color:#FFF8E8;font-size:16px}
.bar-name{flex:1;font-size:13.5px;font-weight:600;color:#FFF8E8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-score{font-family:var(--fnt-display);font-size:13px;font-weight:600;color:#FFF8E8;flex-shrink:0}
.bar-score-u{font-size:9.5px;color:rgba(255,248,232,.6);font-weight:400;margin-left:1px;font-family:var(--fnt)}
.bar-fill{height:32px;border-radius:var(--r-sm);min-width:24px;
  background:#FFF8E8;transition:width .5s cubic-bezier(.22,1,.36,1)}
.bar-vm{font-size:11px;color:rgba(255,248,232,.62);margin-top:4px;padding-left:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-empty{position:relative;z-index:1;text-align:center;padding:18px 0;font-size:13px;color:rgba(255,248,232,.7)}

/* ══════ 胜利宣言编辑 ══════ */
.edit-trigger{font-size:12.5px;color:var(--soft);cursor:pointer;margin-top:22px;display:inline-flex;
  align-items:center;gap:5px;transition:color .15s}
.edit-trigger:active{color:var(--accent-deep)}
.edit-box{display:none;margin-top:14px;padding:16px;background:var(--bg3);border-radius:var(--r-md);border:1px solid var(--hair)}
.edit-box.on{display:block}
.edit-inp{width:100%;padding:12px 14px;background:#FFFCF4;border:1.5px solid var(--hair);
  border-radius:var(--r-sm);font-size:15px;font-family:inherit;color:var(--ink);outline:none;
  text-align:center;margin-bottom:10px;transition:border-color .15s}
.edit-inp:focus{border-color:var(--accent)}
.edit-btn-row{display:flex;gap:8px}
.edit-btn{flex:1;padding:11px;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;border:none;transition:transform .12s}
.edit-btn:active{transform:scale(.97)}
.edit-btn-save{background:var(--accent);color:#FFF8E8}
.edit-btn-cancel{background:transparent;color:var(--soft);border:1.5px solid var(--hair)}

.foot{margin-top:34px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:center}
</style>
</head>
<body>

<div class="content">
  <div class="nav">
    <a class="nav-brand" href="study.html">John Class</a>
    <a class="nav-back" href="study.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回
    </a>
  </div>

  <div class="page-title">每周学习大神榜</div>
  <div class="page-sub">TOP 6 · 每周六晚 12 点重置</div>
  <div class="week-label" id="week-label">本周</div>

  <!-- 7 个 tab：总榜 + 6 分类 -->
  <div class="cat-tabs" id="catTabs">
    <div class="cat-tab active" data-cat="total">总榜</div>
    <div class="cat-tab" data-cat="vocab">词汇</div>
    <div class="cat-tab" data-cat="reading">阅读</div>
    <div class="cat-tab" data-cat="speaking">口语</div>
    <div class="cat-tab" data-cat="programmer">码神</div>
    <div class="cat-tab" data-cat="grammar">语法</div>
    <div class="cat-tab" data-cat="writing">写作</div>
  </div>

  <!-- 唯一的大卡片：点哪个 tab 就显示哪个的榜单 -->
  <div class="board-card">
    <div class="board-hd">
      <div class="board-hd-l">
        <div class="board-hd-ic" id="boardIcon"><svg viewBox="0 0 24 24" fill="none" stroke="#FFF8E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l2-9 4 4 3-7 3 7 4-4 2 9z"/><path d="M5 20h14"/></svg></div>
        <div class="board-hd-tt" id="boardTitle">总榜</div>
      </div>
      <div class="board-hd-r">TOP 6</div>
    </div>
    <div id="boardBody"><div class="board-empty">加载中…</div></div>
  </div>

  <span class="edit-trigger" id="editTrigger" style="display:none" onclick="showEdit()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
    修改我的胜利宣言
  </span>
  <div class="edit-box" id="editBox">
    <input class="edit-inp" id="editInp" placeholder="你想对手下败将说什么？" maxlength="40">
    <div class="edit-btn-row">
      <button class="edit-btn edit-btn-cancel" onclick="hideEdit()">取消</button>
      <button class="edit-btn edit-btn-save" onclick="saveEdit()">保存宣言</button>
    </div>
  </div>

  <div class="foot">Growing Skills · Shaping Futures</div>
</div>

<script>
var SB_URL = 'https://ghunrrtrdgicbmixsqrc.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdodW5ycnRyZGdpY2JtaXhzcXJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Mzg3OTMsImV4cCI6MjA5NjMxNDc5M30.n3_yRr6iR0gtEo7HSxGWO1jBGs1aaALAchVhqjgnOqs';

var CAT_META = {
  total:      {title:'总榜',  icon:'<path d="M3 17l2-9 4 4 3-7 3 7 4-4 2 9z"/><path d="M5 20h14"/>'},
  vocab:      {title:'词汇榜',icon:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'},
  reading:    {title:'阅读榜',icon:'<path d="M12 7c-2-2-5-2-8-1v13c3-1 6-1 8 1 2-2 5-2 8-1V6c-3-1-6-1-8 1z"/><path d="M12 7v13"/>'},
  speaking:   {title:'口语榜',icon:'<path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/>'},
  programmer: {title:'码神榜',icon:'<path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/>'},
  grammar:    {title:'语法榜',icon:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>'},
  writing:    {title:'写作榜',icon:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'}
};
var SCORE_KEY = {vocab:'vocab_score',reading:'reading_score',speaking:'survival_score',
  programmer:'programmer_score',grammar:'grammar_score',writing:'writing_score'};

var _data = null; // 本周全量原始数据，tab 切换时本地重新排序，不重新请求
var _curCat = 'total';

function getWeekStart(){
  // 周日为每周第一天（周六晚12点一过自动重置）
  var d=new Date();
  d.setDate(d.getDate()-d.getDay());
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function formatWeek(s){
  var d=new Date(s),end=new Date(d);
  end.setDate(d.getDate()+6);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 — '+(end.getMonth()+1)+'月'+end.getDate()+'日';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function totalOf(r){
  return (r.reading_score||0)+(r.vocab_score||0)+(r.survival_score||0)+(r.programmer_score||0)+(r.grammar_score||0)+(r.writing_score||0);
}

/* 条幅式排行榜渲染：长度按分数占最高分比例缩放，第一名条幅最长。
   不接背景轨道——每根条幅就是它本身该有的实际长度，不暗示存在"未填满"。 */
function renderBars(rows, scoreFn){
  if(!rows||rows.length===0){
    return '<div class="board-empty">本周还没有人上榜，快去练习吧</div>';
  }
  var top6 = rows.slice(0,6);
  var maxScore = scoreFn(top6[0]) || 1;
  return top6.map(function(r,i){
    var v = scoreFn(r);
    var pct = Math.max(6, Math.round(v/maxScore*100)); // 最小宽度只保证色块本身可见，不再需要塞文字
    var vm = r.victory_msg ? '<div class="bar-vm">\u201c'+esc(r.victory_msg)+'\u201d</div>' : '';
    return '<div class="bar-row '+(i===0?'first':'')+'">'+
      '<div class="bar-meta">'+
        '<div class="bar-rank">'+(i+1)+'</div>'+
        '<div class="bar-name">'+esc(r.user_name)+(_curCat==='vocab'&&r.vocab_round>1?' <span style="font-size:10px;background:rgba(255,248,232,.25);padding:1px 6px;border-radius:99px;vertical-align:middle">'+['','一','二','三','四','五','六','七'][r.vocab_round]+'刷</span>':'')+'</div>'+
        '<div class="bar-score">'+v+'<span class="bar-score-u">分</span></div>'+
      '</div>'+
      '<div class="bar-fill" style="width:'+pct+'%"></div>'+
      vm+
      '</div>';
  }).join('');
}

/* 根据当前选中分类，从原始数据里筛选/排序后渲染 */
function renderCurrentCat(){
  var meta = CAT_META[_curCat];
  document.getElementById('boardTitle').textContent = meta.title;
  document.getElementById('boardIcon').innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="#FFF8E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+meta.icon+'</svg>';

  if(!_data || _data.length===0){
    document.getElementById('boardBody').innerHTML = '<div class="board-empty">本周还没有人上榜，快去练习吧</div>';
    return;
  }

  var html;
  if(_curCat==='total'){
    var byTotal = _data.slice().sort(function(a,b){return totalOf(b)-totalOf(a);});
    html = renderBars(byTotal, totalOf);
  } else {
    var key = SCORE_KEY[_curCat];
    var filtered = _data.slice().filter(function(r){return (r[key]||0)>0;})
                    .sort(function(a,b){return (b[key]||0)-(a[key]||0);});
    html = renderBars(filtered, function(r){return r[key]||0;});
  }
  document.getElementById('boardBody').innerHTML = html;
}

// tab 切换：本地重新渲染，不重新请求接口
document.getElementById('catTabs').addEventListener('click', function(e){
  var tab = e.target.closest('.cat-tab');
  if(!tab) return;
  document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('active');});
  tab.classList.add('active');
  _curCat = tab.dataset.cat;
  renderCurrentCat();
});

// 胜利宣言编辑
var myName = localStorage.getItem('jc_username')||'';
if(myName){
  document.getElementById('editTrigger').style.display = 'inline-flex';
}
function showEdit(){
  document.getElementById('editBox').classList.add('on');
  document.getElementById('editTrigger').style.display = 'none';
  var cur = localStorage.getItem('jc_victory_msg')||'';
  document.getElementById('editInp').value = cur;
}
function hideEdit(){
  document.getElementById('editBox').classList.remove('on');
  document.getElementById('editTrigger').style.display = 'inline-flex';
}
async function saveEdit(){
  var msg = document.getElementById('editInp').value.trim();
  localStorage.setItem('jc_victory_msg', msg);
  if(myName){
    var ws = getWeekStart();
    try{
      var ck = await fetch(SB_URL+'/rest/v1/weekly_scores?user_name=eq.'+encodeURIComponent(myName)+'&week_start=eq.'+ws+'&select=id&limit=1',
        {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
      if(ck.ok){
        var rows = await ck.json();
        var payload = {user_name:myName, week_start:ws, victory_msg:msg, updated_at:new Date().toISOString()};
        if(rows&&rows.length>0) payload.id = rows[0].id;
        await fetch(SB_URL+'/rest/v1/weekly_scores', {
          method:'POST',
          headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
          body:JSON.stringify(payload)
        });
      }
    }catch(e){}
  }
  hideEdit();
  load();
}

async function load(){
  var ws = getWeekStart();
  document.getElementById('week-label').textContent = '本周（'+formatWeek(ws)+'）';

  try{
    var r = await fetch(SB_URL+'/rest/v1/weekly_scores?week_start=eq.'+ws+'&select=user_name,reading_score,vocab_score,vocab_round,survival_score,programmer_score,grammar_score,writing_score,victory_msg&limit=100',
      {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    _data = await r.json();
    renderCurrentCat();
  }catch(e){
    console.error('weekly_stars 加载失败:', e);
    _data = null;
    document.getElementById('boardBody').innerHTML = '<div class="board-empty">加载失败，请检查网络</div>';
  }
}
load();
</script>
  <script src="audio.js"></script>
  <script src="bgm-cross.js"></script>
</body>
</html>
