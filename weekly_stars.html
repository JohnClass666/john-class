<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>每周学习大神榜 · John Class</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F5EDD8;color:#2A1E08;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;min-height:100%}
.wrap{max-width:480px;margin:0 auto;padding:40px 24px 80px}
.back{font-size:13px;color:#B5A080;text-decoration:none;display:block;margin-bottom:28px}
.back:hover{color:#2A1E08}
.page-title{font-size:26px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:#8A7050;margin-bottom:6px;line-height:1.6}
.week-label{font-size:11px;letter-spacing:.14em;color:#B5A080;font-weight:600;margin-bottom:32px}
/* board section */
.board-section{margin-bottom:32px}
.board-title{font-size:15px;font-weight:700;color:#2A1E08;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.board-title .bt-icon{font-size:18px}
.board-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,252,245,.88);border-radius:12px;margin-bottom:6px}
.rank{font-size:17px;font-weight:700;width:28px;flex-shrink:0;color:#B5A080;text-align:center}
.rank.r1{color:#C9A96E;font-size:20px}
.rank.r2{color:#A0A0A0;font-size:20px}
.rank.r3{color:#C88C32;font-size:20px}
.name{flex:1;font-size:15px;font-weight:500}
.score{font-size:16px;font-weight:700;color:#2A1E08}
.score-sm{font-size:11px;color:#B5A080;font-weight:400;margin-left:4px}
.empty{font-size:13px;color:#B5A080;text-align:center;padding:20px 0}
.divider{height:1px;background:rgba(184,149,106,.15);margin:24px 0}
.legend{display:flex;gap:16px;margin-top:28px;padding:14px 16px;background:rgba(42,30,8,.04);border-radius:10px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#8A7050}
.dot-read{width:8px;height:8px;border-radius:50%;background:rgba(61,107,46,.6);flex-shrink:0}
.dot-vocab{width:8px;height:8px;border-radius:50%;background:rgba(80,120,200,.6);flex-shrink:0}
.edit-box{display:none;margin-top:24px;padding:16px;background:rgba(255,252,245,.8);border-radius:12px;border:1px solid rgba(184,149,106,.18)}
.edit-box.on{display:block}
.edit-inp{width:100%;padding:12px 14px;background:rgba(255,252,245,.9);border:1.5px solid rgba(42,30,8,.2);border-radius:10px;font-size:15px;font-family:inherit;color:#2A1E08;outline:none;text-align:center;margin-bottom:8px}
.edit-inp:focus{border-color:#2A1E08}
.edit-btn-row{display:flex;gap:8px}
.edit-btn{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none}
.edit-btn-save{background:#2A1E08;color:#F5EDD8}
.edit-btn-cancel{background:transparent;color:#9A8060;border:1.5px solid rgba(184,149,106,.25)}
.edit-trigger{font-size:12px;color:#B5A080;cursor:pointer;text-decoration:underline;margin-top:20px;display:inline-block}
.edit-trigger:hover{color:#2A1E08}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="study.html">&larr; 返回学习中心</a>
  <div class="page-title">&#127942; 每周学习大神榜</div>
  <div class="page-sub">TOP 6 · 每周一重置</div>
  <div class="week-label" id="week-label">本周</div>

  <!-- 总榜 -->
  <div class="board-section">
    <div class="board-title"><span class="bt-icon">&#127942;</span>总榜 TOP 6</div>
    <div id="board-total"><div class="empty">加载中...</div></div>
  </div>

  <div class="divider"></div>

  <!-- 词汇榜 -->
  <div class="board-section">
    <div class="board-title"><span class="bt-icon">&#128214;</span>词汇榜 TOP 6</div>
    <div id="board-vocab"><div class="empty">加载中...</div></div>
  </div>

  <div class="divider"></div>

  <!-- 阅读榜 -->
  <div class="board-section">
    <div class="board-title"><span class="bt-icon">&#128218;</span>阅读榜 TOP 6</div>
    <div id="board-reading"><div class="empty">加载中...</div></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="dot-read"></div>阅读得分（上限 1000/周）</div>
    <div class="legend-item"><div class="dot-vocab"></div>词汇得分</div>
  </div>

  <span class="edit-trigger" id="editTrigger" style="display:none" onclick="showEdit()">&#9998; 修改我的胜利宣言</span>
  <div class="edit-box" id="editBox">
    <input class="edit-inp" id="editInp" placeholder="你想对手下败将说什么？" maxlength="40">
    <div class="edit-btn-row">
      <button class="edit-btn edit-btn-cancel" onclick="hideEdit()">取消</button>
      <button class="edit-btn edit-btn-save" onclick="saveEdit()">保存宣言</button>
    </div>
  </div>
</div>

<script>
var SB_URL = 'https://ghunrrtrdgicbmixsqrc.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdodW5ycnRyZGdpY2JtaXhzcXJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Mzg3OTMsImV4cCI6MjA5NjMxNDc5M30.n3_yRr6iR0gtEo7HSxGWO1jBGs1aaALAchVhqjgnOqs';

function getWeekStart(){
  var d=new Date(),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);
  d.setDate(diff);
  return d.toISOString().split('T')[0];
}
function formatWeek(s){
  var d=new Date(s),end=new Date(d);
  end.setDate(d.getDate()+6);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 — '+(end.getMonth()+1)+'月'+end.getDate()+'日';
}

var MEDALS = ['&#129351;','&#129352;','&#129353;']; // gold, silver, bronze

function renderBoard(el, rows, scoreKey, isTotal){
  if(!rows||rows.length===0){
    el.innerHTML='<div class="empty">暂无数据，快去练习吧</div>';
    return;
  }
  var top6 = rows.slice(0, 6);
  el.innerHTML = top6.map(function(r, i){
    var rank = i<3 ? '<span class="rank r'+(i+1)+'">'+MEDALS[i]+'</span>'
                   : '<span class="rank">'+(i+1)+'</span>';
    var sc;
    if(isTotal){
      var t = (r.reading_score||0) + (r.vocab_score||0);
      sc = t+' <span class="score-sm">分</span>';
    } else {
      var v = r[scoreKey]||0;
      sc = v+' <span class="score-sm">分</span>';
    }
    var vm = r.victory_msg ? ' <span style="font-size:10px;color:#B5A080;display:block">'+esc(r.victory_msg)+'</span>' : '';
    return '<div class="board-row">'+rank+'<span class="name">'+esc(r.user_name)+vm+'</span><span class="score">'+sc+'</span></div>';
  }).join('');
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 胜利宣言编辑
var myName = localStorage.getItem('jc_username')||'';
if(myName){
  document.getElementById('editTrigger').style.display = 'inline-block';
}
function showEdit(){
  document.getElementById('editBox').classList.add('on');
  document.getElementById('editTrigger').style.display = 'none';
  var cur = localStorage.getItem('jc_victory_msg')||'';
  document.getElementById('editInp').value = cur;
}
function hideEdit(){
  document.getElementById('editBox').classList.remove('on');
  document.getElementById('editTrigger').style.display = 'inline-block';
}
async function saveEdit(){
  var msg = document.getElementById('editInp').value.trim();
  localStorage.setItem('jc_victory_msg', msg);
  // 同步到 Supabase
  if(myName){
    var ws = getWeekStart();
    try{
      var ck = await fetch(SB_URL+'/rest/v1/weekly_scores?user_name=eq.'+encodeURIComponent(myName)+'&week_start=eq.'+ws+'&select=id&limit=1',
        {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
      if(ck.ok){
        var rows = await ck.json();
        var payload = {user_name:myName, week_start:ws, victory_msg:msg, updated_at:new Date().toISOString()};
        if(rows&&rows.length>0) payload.id = rows[0].id;
        await fetch(SB_URL+'/rest/v1/weekly_scores', {
          method:'POST',
          headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
          body:JSON.stringify(payload)
        });
      }
    }catch(e){}
  }
  hideEdit();
  load();
}

async function load(){
  var ws = getWeekStart();
  document.getElementById('week-label').textContent = '本周（'+formatWeek(ws)+'）';

  try{
    // Fetch ALL entries for this week
    var r = await fetch(SB_URL+'/rest/v1/weekly_scores?week_start=eq.'+ws+'&select=user_name,reading_score,vocab_score,victory_msg&limit=100',
      {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var data = await r.json();

    if(!data||data.length===0){
      ['board-total','board-vocab','board-reading'].forEach(function(id){
        document.getElementById(id).innerHTML='<div class="empty">本周还没有人上榜！快去练习吧 &#128170;</div>';
      });
      return;
    }

    // Total board: sort by reading+vacab desc
    var byTotal = data.slice().sort(function(a,b){
      return ((b.reading_score||0)+(b.vocab_score||0)) - ((a.reading_score||0)+(a.vocab_score||0));
    });
    renderBoard(document.getElementById('board-total'), byTotal, null, true);

    // Vocab board: sort by vocab_score desc, only those with vocab>0
    var byVocab = data.slice().filter(function(r){return (r.vocab_score||0)>0;})
                  .sort(function(a,b){return (b.vocab_score||0)-(a.vocab_score||0);});
    renderBoard(document.getElementById('board-vocab'), byVocab, 'vocab_score', false);

    // Reading board: sort by reading_score desc, only those with reading>0
    var byReading = data.slice().filter(function(r){return (r.reading_score||0)>0;})
                     .sort(function(a,b){return (b.reading_score||0)-(a.reading_score||0);});
    renderBoard(document.getElementById('board-reading'), byReading, 'reading_score', false);

  }catch(e){
    console.error('weekly_stars 加载失败:', e);
    ['board-total','board-vocab','board-reading'].forEach(function(id){
      document.getElementById(id).innerHTML='<div class="empty">加载失败，请检查网络</div>';
    });
  }
}
load();
</script>
  <script src="audio.js"></script>
  <script src="bgm-cross.js"></script>
</body>
</html>
