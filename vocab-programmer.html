<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>码神词库 · John Class</title>
<style>
:root{
  --bg:#FBF6EC;--bg2:#F0E2C4;--bg3:#F6EEDC;
  --ink:#2A1D08;--soft:#8C6B35;--faint:#C2A26C;
  --hair:#E2D0A4;--hair2:#F0E8D0;
  --accent:#AD7A1E;--accent-deep:#7A5414;--accent-soft:#F5E8C8;
  --warn:#C2491E;--warn-soft:#FAEEE8;
  --fnt:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --fnt-display:Georgia,"Times New Roman",serif;
  --shadow-sm:0 1px 2px rgba(40,24,5,.10);
  --shadow-md:0 3px 10px rgba(40,24,5,.12);
  --shadow-lg:0 10px 28px rgba(40,24,5,.16);
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:var(--fnt);
  color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.view{display:none;min-height:100vh;padding-bottom:88px}.view.on{display:block}

/* ── HEADER (home) ── */
.jc-hd{padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top))}
.jc-hd-row{display:flex;align-items:center;justify-content:space-between}
.jc-logo{font-size:22px;font-weight:700;letter-spacing:-.04em;color:var(--ink);
  text-shadow:0 2px 4px rgba(40,20,5,.18),0 5px 14px rgba(40,20,5,.09);text-decoration:none}
.jc-chips{display:flex;gap:8px;margin-top:10px}
.jk{display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--fnt);cursor:pointer;font-size:11.5px;font-weight:600;
  letter-spacing:-.01em;white-space:nowrap;-webkit-user-select:none;
  background:linear-gradient(180deg,#F5E8C8 0%,#EDD8A0 100%);
  border:1px solid #C8A860;border-bottom:3px solid #9A7830;border-radius:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,200,.5),0 2px 5px rgba(40,20,5,.09);
  color:#5A3800;transition:transform .08s,box-shadow .08s,border-bottom-width .08s}
.jk:active{transform:translateY(2px);border-bottom-width:1px}

/* ── SCORE ── */
.sc-block{padding:16px 20px 6px;display:flex;align-items:baseline}
.sc-num{font-size:44px;font-weight:200;letter-spacing:-.07em;color:var(--ink);
  font-family:var(--fnt-display);
  text-shadow:0 3px 6px rgba(40,20,5,.12),0 6px 18px rgba(40,20,5,.07);line-height:1}
.sc-unit{font-size:15px;color:var(--soft);margin-left:4px}
.sc-pills{margin-left:auto;display:flex;gap:7px;align-items:center;align-self:center}
.sc-pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:10px;white-space:nowrap;
  background:linear-gradient(180deg,var(--accent-soft),#EDD898);
  border:1px solid #C8A040;border-bottom:2.5px solid #9A7820;
  box-shadow:inset 0 1px 0 rgba(255,255,200,.6),0 2px 4px rgba(40,20,5,.10);color:var(--accent-deep)}
.sc-pw{padding:6px 20px 14px}
.sc-pt{height:3px;background:rgba(58,42,16,.12);border-radius:99px;overflow:hidden}
.sc-pf{height:100%;background:linear-gradient(90deg,var(--accent),#C89828);border-radius:99px}

/* ── SHELF ── */
.jc-shelf{margin-bottom:0}
.jc-sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.jc-sbar{height:14px;background:linear-gradient(180deg,#B07030,#8A4E18);
  box-shadow:0 5px 16px rgba(80,40,10,.25);position:relative}
.jc-sbar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,220,120,.7) 50%,transparent)}
.jc-sgap{height:28px}

/* ── CARDS ── */
.jc-card{border-radius:20px;overflow:hidden;aspect-ratio:3/4;position:relative;cursor:pointer;
  box-shadow:0 1px 2px rgba(40,20,5,.08),0 4px 10px rgba(40,20,5,.10),
    0 12px 26px rgba(40,20,5,.08),0 20px 40px rgba(40,20,5,.05);
  transition:transform .18s cubic-bezier(.34,1.4,.64,1)}
.jc-card:active{transform:scale(.96) translateY(2px)}
.jc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,235,180,.18),transparent);
  border-radius:20px 20px 0 0;pointer-events:none;z-index:5}
.jc-ci{position:absolute;inset:0;padding:14px 13px;
  display:flex;flex-direction:column;justify-content:space-between;z-index:6}
.jc-eye{font-size:8px;font-weight:700;letter-spacing:.14em;
  color:rgba(255,255,255,.65);text-transform:uppercase;margin-bottom:2px}
.jc-bigname{font-size:24px;font-weight:700;color:#fff;line-height:1.2;
  letter-spacing:-.02em;text-shadow:0 2px 8px rgba(0,0,0,.22);
  flex:1;display:flex;align-items:center;word-break:break-all}
.jc-cpct{font-size:9px;font-weight:700;color:rgba(255,255,255,.75)}
.jcg1{background:linear-gradient(145deg,#EEA080,#E86248)}
.jcg2{background:linear-gradient(145deg,#EED068,#E8A020)}
.jcg3{background:linear-gradient(145deg,#EEC888,#E89040)}
.jcg4{background:linear-gradient(145deg,#E8A870,#D07840)}
.jcg5{background:linear-gradient(145deg,#EED870,#E8C428)}
.jcg6{background:linear-gradient(145deg,#EE9280,#E85838)}
.jcg7{background:linear-gradient(145deg,#EEB878,#E89038)}

/* ── BOTTOM BAR ── */
.jc-btm{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(251,246,236,.95);
  backdrop-filter:saturate(160%) blur(20px);-webkit-backdrop-filter:saturate(160%) blur(20px);
  border-top:.5px solid var(--hair);padding:12px 20px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.jc-keys{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.jc-keys::-webkit-scrollbar{display:none}
.jc-key{flex:0 0 auto;font-family:var(--fnt);cursor:pointer;padding:9px 14px;border-radius:10px;
  font-size:11.5px;font-weight:600;white-space:nowrap;position:relative;
  background:linear-gradient(180deg,#FFFFFF,#F8F0E0);
  border:1px solid #D8C090;border-bottom:3px solid #B09050;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 5px rgba(40,20,5,.08);
  color:var(--ink);transition:transform .08s,box-shadow .08s,border-bottom-width .08s}
.jc-key:active{transform:translateY(2px);border-bottom-width:1px}
.jc-key-gold{background:linear-gradient(180deg,var(--accent-soft),#E8D060);
  border-color:#C89010;border-bottom-color:#9A7010;color:var(--accent-deep);
  box-shadow:inset 0 1px 0 rgba(255,255,200,.5),0 2px 6px rgba(40,20,5,.12)}
.jc-key-gold:active{background:linear-gradient(180deg,#E8D060,#D8B820)}
.jc-key-red{background:linear-gradient(180deg,#F5D8C8,#EBA888);
  border-color:#C07050;border-bottom-color:#9A4828;color:#5A1808;
  box-shadow:inset 0 1px 0 rgba(255,255,210,.4),0 2px 5px rgba(40,20,5,.10)}
.jc-key-red:active{background:linear-gradient(180deg,#EBA888,#E09060)}
.jc-key-badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;
  background:var(--warn);color:#FBF6EC;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bg)}

/* ── BAR (二级页面) ── */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;padding:10px 16px;
  min-height:52px;background:var(--bg);box-shadow:0 1px 0 var(--hair)}
.back-btn{width:36px;height:36px;border-radius:50%;flex:0 0 auto;cursor:pointer;
  background:linear-gradient(180deg,#FDF8F0 0%,#E8D8B4 100%);
  border:1px solid #C8A860;border-bottom:3px solid #9A7830;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 2px 5px rgba(40,20,5,.12);
  font-size:20px;color:var(--ink);display:flex;align-items:center;justify-content:center;
  transition:transform .08s,box-shadow .08s,border-bottom-width .08s;font-family:var(--fnt)}
.back-btn:active{transform:translateY(2px);border-bottom-width:1px}
.bar-title{flex:1;text-align:center;font-size:16px;font-weight:700;color:var(--ink);
  text-shadow:0 1px 2px rgba(40,20,5,.14),0 3px 8px rgba(40,20,5,.08);
  letter-spacing:-.02em;margin:0 8px}
.bar-right{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}

/* ── PROGRESS HUD ── */
.dhud{padding:0 20px 10px;display:flex;align-items:center;gap:12px}
.dhud-track{flex:1;height:3px;background:rgba(42,29,8,.1);border-radius:99px;overflow:hidden}
.dhud-fill{height:100%;background:linear-gradient(90deg,var(--accent),#C89828);
  border-radius:99px;transition:width .3s}
.dhud-lbl{font-size:11px;font-weight:700;color:var(--soft);letter-spacing:.04em;white-space:nowrap}

/* ── MODE CARDS ── */
.mode-list{display:flex;flex-direction:column;gap:10px;padding:12px 20px 20px}
.mode-card{display:flex;align-items:center;gap:16px;padding:18px 16px;border-radius:18px;cursor:pointer;
  background:linear-gradient(180deg,#FFFFFF,#F8F1DF);
  border:1px solid #DDD0A8;border-bottom:3px solid #C0A868;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 6px rgba(40,20,5,.08),0 6px 18px rgba(40,20,5,.04);
  transition:transform .1s,box-shadow .1s,border-bottom-width .1s}
.mode-card:active{transform:translateY(2px);border-bottom-width:1px}
.mode-dot{width:42px;height:42px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;
  color:#FBF6EC;box-shadow:0 2px 6px rgba(40,20,5,.16),inset 0 1px 0 rgba(255,240,160,.35)}
.mode-tx{flex:1}
.mode-name{font-size:16px;font-weight:600;color:var(--ink);display:block;letter-spacing:-.02em}
.mode-desc{font-size:12px;color:var(--soft);margin-top:3px}
.mode-pts{font-size:10px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;
  background:linear-gradient(180deg,var(--accent-soft),#E8D060);
  border:1px solid #C8A010;border-bottom:2px solid #9A7808;color:var(--accent-deep);
  box-shadow:inset 0 1px 0 rgba(255,255,200,.5)}

/* ── QUIZ WORD CARD ── */
.qcard{margin:8px 20px;background:#FFFFFF;border:1px solid #DDD0A8;
  border-bottom:3px solid #C0A868;border-radius:20px;padding:24px 20px 20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 8px rgba(40,20,5,.08);text-align:center}
.qcard-pos{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-bottom:10px}
.qcard-en{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.04em;
  line-height:1.2;word-break:break-word;font-family:var(--fnt-display)}
.qcard-zh{font-size:22px;font-weight:700;color:var(--ink);line-height:1.3}
.qcard-sub{font-size:13px;color:var(--soft);margin-top:6px}
.qcard-hint{font-size:11px;color:var(--faint);margin-top:8px;font-weight:600}

/* ── FLIP ── */
.flip-wrap{perspective:700px;cursor:pointer;margin:8px 20px 0;min-height:158px}
.flip-inner{position:relative;width:100%;min-height:158px;
  transition:transform .42s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;width:100%;min-height:158px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:#FFFFFF;border:1px solid #DDD0A8;border-bottom:3px solid #C0A868;
  border-radius:20px;padding:24px 20px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 8px rgba(40,20,5,.08)}
.flip-back{transform:rotateY(180deg)}
.flip-spacer{min-height:158px;visibility:hidden;margin:8px 20px 0}
.flip-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 20px 0}
.flip-btn{padding:14px 10px;border-radius:14px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:var(--fnt);text-align:center;
  transition:transform .08s,box-shadow .08s,border-bottom-width .08s}
.flip-btn:active{transform:translateY(2px);border-bottom-width:1px}
.flip-btn.know{background:linear-gradient(180deg,var(--accent-soft),#E8D060);
  border:1px solid #C89010;border-bottom:3px solid #9A7010;color:var(--accent-deep);
  box-shadow:inset 0 1px 0 rgba(255,255,200,.5),0 2px 5px rgba(40,20,5,.10)}
.flip-btn.nope{background:linear-gradient(180deg,#FFFFFF,#F8F1DF);
  border:1px solid #DDD0A8;border-bottom:3px solid #C0A868;color:var(--soft);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 5px rgba(40,20,5,.08)}

/* ── OPTIONS (MCQ) ── */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px 20px 16px}
.opt{padding:13px 10px;font-size:13px;font-weight:600;color:var(--ink);
  background:linear-gradient(180deg,#FFFFFF,#F8F1DF);
  border:1px solid #DDD0A8;border-bottom:3px solid #C0A868;border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 6px rgba(40,20,5,.07);
  font-family:var(--fnt);cursor:pointer;text-align:center;line-height:1.35;
  transition:transform .08s,box-shadow .08s,border-bottom-width .08s;
  min-height:50px;display:flex;align-items:center;justify-content:center}
.opt:active{transform:translateY(2px);border-bottom-width:1px}
.opt.right{background:linear-gradient(180deg,var(--accent-soft),#E8D060);
  border-color:#C89010;border-bottom-color:#9A7010;color:var(--accent-deep)}
.opt.wrong{background:linear-gradient(180deg,var(--warn-soft),#EDB898);
  border-color:#C07050;border-bottom-color:#9A4828;color:#5A1808}
.opt.dim{opacity:.2;pointer-events:none}

/* ── SPELL ── */
.spell-row{display:flex;gap:8px;padding:10px 20px 0}
.spell-in{flex:1;font-size:16px;padding:11px 14px;
  background:var(--bg2);border:1px solid var(--hair);
  border-bottom:2.5px solid #C8A870;border-radius:12px;
  color:var(--ink);font-family:var(--fnt);outline:none;transition:border-color .2s}
.spell-in:focus{border-color:var(--accent);background:#FFFBF0}
.spell-in:disabled{opacity:.55}
.spell-sub{padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:var(--fnt);
  background:linear-gradient(180deg,var(--accent-soft),#E8D060);
  border:1px solid #C89010;border-bottom:3px solid #9A7010;color:var(--accent-deep);
  box-shadow:inset 0 1px 0 rgba(255,255,200,.5);
  transition:transform .08s,box-shadow .08s,border-bottom-width .08s}
.spell-sub:active{transform:translateY(2px);border-bottom-width:1px}
.spell-sub:disabled{background:linear-gradient(180deg,#EEE2C4,#D8C8A0);
  border-color:#C0A870;border-bottom-color:#C0A870;color:rgba(42,29,8,.3);cursor:default}

/* ── FEEDBACK ── */
.fbk{margin:10px 20px 0;border-radius:14px;padding:11px 14px;display:none}
.fbk.ok{background:linear-gradient(180deg,var(--accent-soft),#EED060);
  border:1px solid #C89010;border-bottom:2px solid #9A7010}
.fbk.no{background:linear-gradient(180deg,var(--warn-soft),#EDB898);
  border:1px solid #C07050;border-bottom:2px solid #9A4828}
.fbk-row{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.fbk-icon{font-size:13px;font-weight:900;width:22px;height:22px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center}
.fbk.ok .fbk-icon{background:var(--accent);color:#FBF6EC}
.fbk.no .fbk-icon{background:var(--warn);color:#FBF6EC}
.fbk-txt{font-size:14px;font-weight:700;color:var(--ink)}
.fbk-sub{font-size:12px;color:var(--soft)}

/* ── RESULT ── */
.res-card{margin:20px;background:#FFFFFF;border:1px solid #DDD0A8;
  border-bottom:4px solid #C0A868;border-radius:24px;padding:30px 22px;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 4px 16px rgba(40,20,5,.08)}
.res-badge{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;
  background:linear-gradient(145deg,var(--accent-soft),#E8D060);
  border:1px solid #C89010;border-bottom:4px solid #9A7010;
  box-shadow:0 4px 14px rgba(40,20,5,.14),inset 0 1px 0 rgba(255,255,200,.6);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;animation:popIn .5s cubic-bezier(.34,1.4,.64,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.res-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:6px}
.res-score{font-size:52px;font-weight:200;letter-spacing:-.07em;color:var(--ink);
  text-shadow:0 3px 8px rgba(40,20,5,.12);margin:4px 0;line-height:1;
  font-family:var(--fnt-display)}
.res-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--soft);margin-bottom:18px}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.res-st{text-align:center;padding:12px 6px;
  background:linear-gradient(180deg,#FFFFFF,#F8F1DF);
  border:1px solid #DDD0A8;border-bottom:2px solid #C0A868;border-radius:12px}
.res-st-n{display:block;font-size:20px;font-weight:300;letter-spacing:-.04em;color:var(--ink);
  font-family:var(--fnt-display)}
.res-st-l{display:block;font-size:9px;color:var(--soft);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.res-msg{font-size:13px;font-weight:600;color:var(--accent-deep);padding:10px 14px;border-radius:12px;
  margin-bottom:16px;background:linear-gradient(180deg,#FFF8D0,var(--accent-soft));
  border:1px solid #C89010;border-bottom:2px solid #9A7010;line-height:1.5}
.res-btns{display:flex;flex-direction:column;gap:9px}
.rbtn{padding:14px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:var(--fnt);width:100%;transition:transform .08s,border-bottom-width .08s}
.rbtn:active{transform:translateY(2px)}
.rbtn-p{background:linear-gradient(180deg,var(--accent-soft),#E8D060);
  border:1px solid #C89010;border-bottom:3px solid #9A7010;color:var(--accent-deep);
  box-shadow:inset 0 1px 0 rgba(255,255,200,.5),0 2px 6px rgba(40,20,5,.12)}
.rbtn-s{background:linear-gradient(180deg,#FFFFFF,#F8F1DF);
  border:1px solid #DDD0A8;border-bottom:3px solid #C0A868;color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 5px rgba(40,20,5,.07)}

/* ── ERROR BANK ── */
.eitem{background:#FFFFFF;border:1px solid #DDD0A8;border-bottom:3px solid #C0A868;
  border-radius:18px;padding:16px;margin-bottom:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 8px rgba(40,20,5,.07)}
.ecat{font-size:9.5px;color:var(--faint);font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;margin-bottom:6px}
.eword{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.03em;margin-bottom:3px;
  font-family:var(--fnt-display)}
.ezh{font-size:13px;color:var(--soft);margin-bottom:3px}
.ewrong{font-size:12px;color:var(--warn);font-weight:500}
.retrybtn{margin-top:11px;padding:7px 16px;border-radius:10px;
  background:linear-gradient(180deg,#FFFFFF,#F8F1DF);
  border:1px solid #DDD0A8;border-bottom:2.5px solid #C0A868;
  font-size:12px;font-weight:700;cursor:pointer;font-family:var(--fnt);color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 4px rgba(40,20,5,.07);
  transition:transform .08s,border-bottom-width .08s}
.retrybtn:active{transform:translateY(1px);border-bottom-width:1px}

/* ── MILESTONES ── */
.ms-card{display:flex;align-items:center;gap:14px;padding:16px;
  background:linear-gradient(180deg,#FFFFFF,#F8F1DF);
  border:1px solid #DDD0A8;border-bottom:3px solid #C0A868;border-radius:16px;
  margin-bottom:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 6px rgba(40,20,5,.07)}
.ms-card.done{background:linear-gradient(180deg,#FFF8D0,var(--accent-soft));
  border-color:#C89010;border-bottom-color:#9A7010}

.lb-rank.r1{background:linear-gradient(145deg,var(--accent-soft),#C09010);border-color:#9A7010}
.lb-rank.r2{background:linear-gradient(145deg,#D8D8D0,#909088);border-color:#707068}
.lb-rank.r3{background:linear-gradient(145deg,#D08830,#8A4810);border-color:#7A4010}
.lb-name{flex:1;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.lb-pts{font-size:15px;font-weight:300;color:var(--accent);letter-spacing:-.04em;

/* ── COMBO TOAST ── */
#combo-toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) scale(.85);
  background:linear-gradient(180deg,var(--accent-soft),#E8D060);
  border:1px solid #C89010;border-bottom:2px solid #9A7010;
  color:var(--accent-deep);padding:7px 20px;border-radius:20px;
  font-size:13px;font-weight:700;pointer-events:none;opacity:0;
  transition:all .25s;z-index:999;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,200,.5),0 2px 8px rgba(40,20,5,.14)}
#combo-toast.show{opacity:1;transform:translateX(-50%) scale(1)}

.ret-ov{position:fixed;inset:0;z-index:400;

.ret-box{background:var(--bg);border-radius:24px 24px 18px 18px;

.ret-cat{font-size:9px;color:var(--faint);font-weight:700;text-transform:uppercase;

.ret-in:focus{border-color:var(--accent)}
.ret-in:disabled{opacity:.55}
.ret-btns{display:flex;gap:8px}
.ret-sub{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:var(--fnt);
  background:linear-gradient(180deg,var(--accent-soft),#E8D060);

.ret-sub:active{transform:translateY(2px);border-bottom-width:1px}

.ret-can{padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;

  background:linear-gradient(180deg,#FFFFFF,#F8F1DF);
  border:1px solid #DDD0A8;border-bottom:3px solid #C0A868;color:var(--soft);
  transition:transform .08s,border-bottom-width .08s}
.ret-can:active{transform:translateY(2px);border-bottom-width:1px}
.ret-fbk{display:none;margin-top:12px;padding:11px 14px;font-size:13px;font-weight:600;border-radius:12px}
.ret-fbk.ok{background:linear-gradient(180deg,#FFF8D0,var(--accent-soft));

.ret-nxt{display:none;margin-top:10px;width:100%;padding:12px;border-radius:12px;
  font-size:14px;font-weight:700;cursor:pointer;font-family:var(--fnt);
  background:linear-gradient(180deg,#3A2A14 0%,#2A1D08 100%);

.ret-nxt:active{transform:translateY(2px);border-bottom-width:1px}

.page-wrap{padding:0 20px 20px}

const nextLv=p=>LEVELS.find(l=>l.min>p)||null;
const getErrors=()=>JSON.parse(localStorage.getItem(namedKey('jc_prog_errors'))||localStorage.getItem('jc_prog_errors')||'[]');
const saveErrors=arr=>{localStorage.setItem(namedKey('jc_prog_errors'),JSON.stringify(arr));syncVocabProgress();};
const todayKey=()=>namedKey('jc_prog_daily_'+(function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})());
const dailyDone=()=>!!localStorage.getItem(todayKey());
function getWeekStart(){var d=new Date();d.setDate(d.getDate()-d.getDay());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getProgWeekKey(){return 'jc_programmer_week_'+getWeekStart();}
function getProgWeekScore(){return parseInt(localStorage.getItem(getProgWeekKey())||'0')||0;}
function addProgWeekScore(n){localStorage.setItem(getProgWeekKey(),getProgWeekScore()+n);}
function parseCloudProgress(raw){if(!raw)return {};if(typeof raw==='string'){try{return JSON.parse(raw)||{};}catch(e){return {};}}return raw||{};}
async function fetchUserProgress(nm){try{var r=await fetch(SB+'/rest/v1/user_progress?user_name=eq.'+encodeURIComponent(nm)+'&select=progress_data&limit=1',{headers:SH});var rows=r.ok?await r.json():[];return rows&&rows[0]?parseCloudProgress(rows[0].progress_data):{};}catch(e){return {};}}
async function syncVocabProgress(){const nm=progName();if(!nm)return;try{var root=await fetchUserProgress(nm);if(!root.programmer)root.programmer={};root.programmer.vocab={pts:pts(),plays:plays(),errors:getErrors(),updated_at:new Date().toISOString()};await fetch(SB+'/rest/v1/user_progress?on_conflict=user_name',{method:'POST',headers:{...SH,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_name:nm,progress_data:root,updated_at:new Date().toISOString()})});}catch(e){}}
async function restoreVocabProgress(){const nm=progName();if(!nm)return;try{var root=await fetchUserProgress(nm);var v=root.programmer&&root.programmer.vocab;if(!v)return;if((v.pts||0)>=pts()){localStorage.setItem(namedKey('jc_prog_vocab_pts'),v.pts||0);localStorage.setItem(namedKey('jc_prog_vocab_plays'),v.plays||0);localStorage.setItem(namedKey('jc_prog_errors'),JSON.stringify(v.errors||[]));buildHome();}else syncVocabProgress();}catch(e){}}

// ── AUDIO ──
let ac;
function _beep(f,t,v){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.frequency.value=f;g.gain.setValueAtTime(v||.18,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);
  o.start();o.stop(ac.currentTime+t);}catch(e){}}
const sfx={ok:()=>{_beep(660,.07);setTimeout(()=>_beep(880,.1),80)},
  err:()=>{_beep(200,.28,.15)},flip:()=>{_beep(440,.06,.1)},
  combo:n=>{_beep(440+n*80,.1);setTimeout(()=>_beep(600+n*60,.12),90)},
  win:()=>{[523,659,784].forEach((f,i)=>setTimeout(()=>_beep(f,.15),i*110))}};

// ── UTILS ──
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=Array(n+1);for(let j=0;j<=n;j++)d[i][j]=i?j?0:i:j;}for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);return d[m][n];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function seededShuf(arr,seed){const a=[...arr];let s=seed;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)&0xFFFFFFFF;const j=Math.abs(s)%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function showV(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  var hash='#'+id;
  if(location.hash!==hash)location.hash=hash;
}
function _handleVPHash(){
  var h=location.hash.slice(1);
  var el=h?document.getElementById(h):null;
  if(el){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));el.classList.add('on');}
}

async function syncScore(add){
  const nm=localStorage.getItem('jc_username')||localStorage.getItem('jc_student_name');
  if(!nm||add<=0)return;
  const nv=pts()+add;
  localStorage.setItem(namedKey('jc_prog_vocab_pts'),nv);
  localStorage.setItem(namedKey('jc_prog_vocab_plays'),plays()+1);
  syncVocabProgress();
  addProgWeekScore(add);
  const spk=parseInt(localStorage.getItem(namedKey('jc_prog_speak_pts'))||localStorage.getItem('jc_prog_speak_pts')||'0');
  const oral=parseInt(localStorage.getItem(namedKey('jc_prog_oral_pts'))||localStorage.getItem('jc_prog_oral_pts')||'0');
  try{
    var cr=await fetch(SB+'/rest/v1/programmer_scores?user_name=eq.'+encodeURIComponent(nm)+'&select=score,vocab_score&limit=1',{headers:SH});
    var rows=cr.ok?await cr.json():[],cur=rows&&rows.length?rows[0]:{};
    await fetch(SB+'/rest/v1/programmer_scores?on_conflict=user_name',{method:'POST',
    headers:{...SH,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},
    body:JSON.stringify({user_name:nm,score:Math.max(cur.score||0,spk+oral+nv),vocab_score:Math.max(cur.vocab_score||0,nv),updated_at:new Date().toISOString()})});
  }catch(e){}
  // weekly_scores
  try{var ws=getWeekStart();
  var wr=await fetch(SB+'/rest/v1/weekly_scores?user_name=eq.'+encodeURIComponent(nm)+'&week_start=eq.'+ws+'&select=id,programmer_score',{headers:SH});
  var wRows=wr.ok?await wr.json():[];var wCur=0,wEid=null;
  if(wRows&&wRows.length){wCur=wRows[0].programmer_score||0;wEid=wRows[0].id;}
  var wPayload={user_name:nm,week_start:ws,programmer_score:Math.max(wCur+add,getProgWeekScore()),updated_at:new Date().toISOString()};
  if(wEid)wPayload.id=wEid;
  await fetch(SB+'/rest/v1/weekly_scores',{method:'POST',headers:{...SH,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(wPayload)});}catch(e){}
}
async function loadLB(){
  const w=document.getElementById('lb-wrap');
  w.innerHTML='<div class="foot">加载中…</div>';
  const nm=localStorage.getItem('jc_username')||localStorage.getItem('jc_student_name')||'';
  try{
    const r=await fetch(SB+'/rest/v1/programmer_scores?select=user_name,vocab_score&order=vocab_score.desc&limit=20',{headers:SH});
    const d=await r.json();
    if(!Array.isArray(d)||!d.length){w.innerHTML='<div class="empty">还没人上榜，抢第一！</div>';return;}
    const valid=d.filter(row=>(row.vocab_score||0)>0);
    if(!valid.length){w.innerHTML='<div class="empty">还没有词汇分，快去练习！</div>';return;}
    const rk=['r1','r2','r3'];

  document.getElementById('h-pts').textContent=p;
  document.getElementById('h-level').textContent=lv.name;
  document.getElementById('h-prog').style.width=pct+'%';
  // 错词本 badge
  const ec=getErrors().length;
  const errBtn=document.getElementById('btn-errors');

// ── QUIZ ──
function startQuiz(catId,modeId){
  const raw=catId==='all'?[...WORDS]:WORDS.filter(w=>w.cat===catId);
  const pool=shuf(raw);
  G={...G,pool,cur:0,score:0,combo:0,maxCombo:0,got:0,wrong:0,
     mode:modeId,cat:catId,flipped:false,answered:false};
  const mn=MODES.find(m=>m.id===modeId)?.name||'';
  const cn=catId==='all'?'全部':CATS.find(c=>c.id===catId)?.name||'';
  document.getElementById('q-title').textContent=cn+' · '+mn;
  showV('v-quiz');renderQ();
}
function retryQuiz(){startQuiz(G.cat,G.mode);}
function exitQuiz(){goMode(G.cat);}

function updateBar(){
  const tot=G.pool.length;
  document.getElementById('q-prog').textContent=(G.cur+1)+'/'+tot;
  document.getElementById('q-score').textContent=G.score+' 分';
  document.getElementById('q-fill').style.width=Math.round(G.cur/tot*100)+'%';
}
function renderQ(){
  if(G.cur>=G.pool.length){endQuiz();return;}
  G.flipped=false;G.answered=false;
  updateBar();
  const w=G.pool[G.cur],body=document.getElementById('q-body');
  if(G.mode==='flash')renderFlash(w,body);
  else if(G.mode==='mcq')renderMCQ(w,body);
  else renderSpell(w,body);
}
function addError(w,wrong){
  const errs=getErrors();
  const ex=errs.find(e=>e.id===w.id);
  if(ex){ex.wrong=wrong;}
  else errs.unshift({id:w.id,en:w.en,zh:w.zh,pos:w.pos,cat:w.cat,wrong});
  saveErrors(errs);
}

// ── MCQ ──
function renderMCQ(w,body){
  const wrongs=shuf(WORDS.filter(x=>x.id!==w.id)).slice(0,3);
  const opts=shuf([{w,ok:true},...wrongs.map(x=>({w:x,ok:false}))]);
  body.innerHTML=`
    <div class="qcard">
      <div class="qcard-pos">${w.pos}</div>
      <div class="qcard-zh">${w.zh}</div>
    </div>
    <div class="opts">${opts.map(o=>`<button class="opt" onclick="doMCQ(this,${o.ok},'${esc(w.en)}')">${esc(o.w.en)}</button>`).join('')}</div>
    <div class="fbk" id="fbk">
      <div class="fbk-row"><span class="fbk-icon" id="fbk-ic"></span><span class="fbk-txt" id="fbk-tx"></span></div>
      <div class="fbk-sub" id="fbk-sub"></div>
    </div>`;

function doMCQ(btn,isOk,correct){if(G.answered)return;G.answered=true;
  document.querySelectorAll('.opt').forEach(b=>{
    if(b===btn)b.classList.add(isOk?'right':'wrong');
    else if(b.textContent.trim()===correct)b.classList.add('right');
    else b.classList.add('dim');
  });
  const fbk=document.getElementById('fbk');
  fbk.className='fbk '+(isOk?'ok':'no');fbk.style.display='block';
  document.getElementById('fbk-ic').textContent=isOk?'✓':'✗';
  document.getElementById('fbk-tx').textContent=isOk?'正确！+10 分':'答案不对';
  document.getElementById('fbk-sub').textContent=isOk?'':'正确答案：'+correct;
  if(isOk){G.score+=10;G.got++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);sfx.ok();if(G.combo>=3)showCombo(G.combo);}
  else{const w=G.pool[G.cur];addError(w,'（选错）');G.combo=0;G.wrong++;sfx.err();}
  setTimeout(adv,1100);}

// ── SPELL ──
function renderSpell(w,body){
  body.innerHTML=`
    <div class="qcard">
      <div class="qcard-pos">${w.pos}</div>
      <div class="qcard-zh">${w.zh}</div>
    </div>
    <div class="spell-row">
      <input class="spell-in" id="si" type="text" placeholder="输入英文…"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="spell-sub" id="ss" onclick="doSpell()">提交</button>
    </div>
    <div class="fbk" id="fbk">
      <div class="fbk-row"><span class="fbk-icon" id="fbk-ic"></span><span class="fbk-txt" id="fbk-tx"></span></div>
      <div class="fbk-sub" id="fbk-sub"></div>
    </div>`;
  setTimeout(()=>{const el=document.getElementById('si');if(el)el.focus();},80);
  document.getElementById('si').addEventListener('keydown',e=>{if(e.key==='Enter')doSpell();});
}
function chkSpell(v,w){
  const u=v.trim().toLowerCase().replace(/[^a-z0-9\s\/\-\.]/g,'');
  const a=w.en.toLowerCase().trim();
  if(u===a)return true;
  if(/^[A-Z0-9\/]+$/.test(w.en))return false;
  if(a.length>=6&&lev(u,a)<=1)return true;
  return false;
}
function doSpell(){if(G.answered)return;
  const inp=document.getElementById('si'),ss=document.getElementById('ss');
  if(!inp.value.trim())return;
  G.answered=true;inp.disabled=true;ss.disabled=true;
  const w=G.pool[G.cur],isOk=chkSpell(inp.value,w);
  const fbk=document.getElementById('fbk');
  fbk.className='fbk '+(isOk?'ok':'no');fbk.style.display='block';
  document.getElementById('fbk-ic').textContent=isOk?'✓':'✗';
  document.getElementById('fbk-tx').textContent=isOk?'正确！+20 分':'拼写有误';
  document.getElementById('fbk-sub').textContent=isOk?'':'正确答案：'+w.en;
  if(isOk){G.score+=20;G.got++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);sfx.ok();if(G.combo>=3)showCombo(G.combo);}
  else{addError(w,inp.value||'（空）');G.combo=0;G.wrong++;sfx.err();}
  setTimeout(adv,isOk?700:1400);}

  el.textContent=n+'连击！';el.classList.add('show');sfx.combo(n);

// ── END ──
function endQuiz(){
  const tot=G.pool.length,pct=Math.round(G.got/tot*100);
  sfx.win();syncScore(G.score);
  const isDaily=G._daily;
  if(isDaily){localStorage.setItem(todayKey(),'1');}
  let badge,msg;
  if(pct>=90){badge='★';msg='码神级！外方同事都要服你！';}
  else if(pct>=70){badge='✓';msg='不错！再刷两遍就彻底稳了！';}
  else if(pct>=50){badge='→';msg='有进步！这批词值得继续磨！';}
  else{badge='↑';msg='刚起步没关系，多刷几遍见效快！';}
  document.getElementById('r-badge').textContent=badge;
  document.getElementById('r-title').textContent=isDaily?'今日挑战完成！':'本轮结束！';
  document.getElementById('r-score').textContent=G.score;
  document.getElementById('r-got').textContent=G.got+'/'+tot;
  document.getElementById('r-combo').textContent=G.maxCombo+'连';
  document.getElementById('r-total').textContent=tot+'词';
  document.getElementById('r-msg').textContent=msg;
  showV('v-result');
}

function openRetry(idx){
  retryIdx=idx;const e=getErrors()[idx];
  document.getElementById('ret-cat').textContent=CATS.find(c=>c.id===e.cat)?.name||e.cat;
  document.getElementById('ret-word').textContent=e.zh;
  document.getElementById('ret-zh').textContent=e.pos;
  const inp=document.getElementById('ret-in');
  inp.value='';inp.disabled=false;
  document.getElementById('ret-sub').disabled=false;
  document.getElementById('ret-fbk').style.display='none';
  document.getElementById('ret-fbk').className='ret-fbk';
  document.getElementById('ret-nxt').style.display='none';
  document.getElementById('ret-ov').classList.add('on');
  setTimeout(()=>inp.focus(),200);
}
function submitRetry(){
  const errs=getErrors(),e=errs[retryIdx];
  const val=document.getElementById('ret-in').value;
  const isOk=chkSpell(val,e);
  document.getElementById('ret-sub').disabled=true;
  document.getElementById('ret-in').disabled=true;
  const fbk=document.getElementById('ret-fbk');
  fbk.style.display='block';
  if(isOk){
    fbk.className='ret-fbk ok';fbk.textContent='正确！已从错词本移除';
    errs.splice(retryIdx,1);saveErrors(errs);sfx.ok();
    syncScore(10);
  }else{
    fbk.className='ret-fbk no';fbk.textContent='还不对，正确答案：'+e.en;sfx.err();
    errs[retryIdx].wrong=val||'（空）';saveErrors(errs);
    setTimeout(()=>{
      document.getElementById('ret-in').disabled=false;
      document.getElementById('ret-sub').disabled=false;
      document.getElementById('ret-in').value='';
      document.getElementById('ret-in').focus();
    },1800);
  }
  document.getElementById('ret-nxt').style.display='block';
}
function closeRetry(){document.getElementById('ret-ov').classList.remove('on');showErrors();}
document.getElementById('ret-in').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!document.getElementById('ret-sub').disabled)submitRetry();});

}
