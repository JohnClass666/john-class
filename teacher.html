<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和 John 说说 · John Class</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;background:#F5EDD8;color:#2A1E08}
.layout{display:flex;min-height:100vh}
.left{position:fixed;top:0;left:0;width:52%;height:100vh;overflow:hidden}
.left img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.left::after{content:'';position:absolute;top:0;right:0;width:80px;height:100%;background:linear-gradient(to right,transparent,#F5EDD8)}
.right{margin-left:52%;flex:1;background:#F5EDD8;min-height:100vh;padding:52px 44px 64px 28px;position:relative;display:flex;flex-direction:column;justify-content:center}
.right::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(201,169,110,.07) 0%,transparent 50%),radial-gradient(circle at 20% 85%,rgba(120,160,80,.05) 0%,transparent 40%);pointer-events:none}

.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px;position:relative;z-index:1}
.nav-brand{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#B8956A;text-decoration:none;font-family:'Noto Serif SC',Georgia,serif}
.nav-back{font-size:12px;color:#9A8060;text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .2s}
.nav-back:hover{color:#2A1E08}

/* 主体内容区 */
.main{position:relative;z-index:1;max-width:380px}

.page-title{font-family:'Noto Serif SC',Georgia,serif;font-size:clamp(26px,3vw,34px);font-weight:700;color:#2A1E08;letter-spacing:-.2px;margin-bottom:8px}
.page-sub{font-size:13px;color:#9A8060;margin-bottom:32px;line-height:1.6}

/* 对话框区域 */
.chat-card{background:rgba(255,255,255,.6);border:1px solid rgba(184,149,106,.2);border-radius:20px;padding:20px;margin-bottom:16px;backdrop-filter:blur(4px)}

/* John的头像+气泡 */
.j-bubble-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:16px}
.j-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2A1E08 0%,#5A3E18 100%);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#F5EDD8;flex-shrink:0;font-family:'Noto Serif SC',Georgia,serif}
.j-bubble{background:#2A1E08;color:#F5EDD8;border-radius:16px 16px 16px 4px;padding:11px 15px;font-size:13.5px;line-height:1.65;max-width:240px}
.j-bubble b{color:#C9A96E}

/* 学生输入 */
.s-input-area{display:flex;flex-direction:column;gap:10px}
.msg-input{width:100%;padding:13px 16px;font-family:inherit;font-size:14px;color:#2A1E08;background:rgba(255,255,255,.8);border:1.5px solid rgba(184,149,106,.25);border-radius:14px;outline:none;resize:none;min-height:90px;line-height:1.6;transition:border-color .2s,box-shadow .2s}
.msg-input::placeholder{color:rgba(160,120,70,.45)}
.msg-input:focus{border-color:#B8956A;box-shadow:0 0 0 3px rgba(184,149,106,.1)}

/* 回复气泡（发送后出现） */
.reply-row{display:none;align-items:flex-end;gap:10px;margin-top:12px}
.reply-row.show{display:flex}
.reply-bubble{background:rgba(184,149,106,.12);border:1px solid rgba(184,149,106,.2);color:#5A3E18;border-radius:16px 16px 4px 16px;padding:11px 15px;font-size:13px;line-height:1.6;max-width:240px;margin-left:auto}

/* 两个等大按钮 */
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:1}
.btn{padding:14px 12px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;letter-spacing:.02em;font-family:inherit;border:none;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-send{background:#2A1E08;color:#F5EDD8}
.btn-send:hover{background:#3D2E14;transform:translateY(-1px);box-shadow:0 6px 20px rgba(42,30,8,.18)}
.btn-send:active{transform:scale(.97)}
.btn-send.sent{background:#4A7C3F;pointer-events:none}
.btn-about{background:rgba(255,255,255,.6);color:#2A1E08;border:1.5px solid rgba(184,149,106,.3)}
.btn-about:hover{background:rgba(255,255,255,.85);border-color:#B8956A;transform:translateY(-1px);box-shadow:0 6px 20px rgba(42,30,8,.08)}
.btn-about:active{transform:scale(.97)}

.foot{margin-top:40px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(184,149,106,.4);position:relative;z-index:1}

.overlay{position:fixed;inset:0;background:#F5EDD8;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s ease}
.overlay.show{opacity:1;pointer-events:all}

/* 入场 */
.right>*{animation:fi .6s cubic-bezier(.22,1,.36,1) both}
.nav{animation-delay:.04s}.main{animation-delay:.12s}.btn-row{animation-delay:.22s}
@keyframes fi{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

@media(max-width:680px){
  .layout{flex-direction:column}
  .left{position:relative;width:100%;height:56vw;min-height:200px;max-height:340px}
  .left::after{top:auto;bottom:0;left:0;right:0;width:100%;height:60px;background:linear-gradient(to bottom,transparent,#F5EDD8)}
  .right{margin-left:0;padding:28px 20px 56px;justify-content:flex-start}
  .main{max-width:100%}
}
</style>
</head>
<body>
<div class="overlay" id="ov"></div>
<div class="layout">
  <div class="left"><img src="bg.png" alt="John Class"></div>
  <div class="right">

    <div class="nav">
      <a class="nav-brand" href="index.html">John Class</a>
      <a class="nav-back" href="index.html" onclick="pg(event,'index.html')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回
      </a>
    </div>

    <div class="main">
      <div class="page-title">和 John 说说</div>
      <div class="page-sub">提问、炫耀、反馈都可以，John 会看到的。</div>

      <div class="chat-card">
        <!-- John 的提示气泡 -->
        <div class="j-bubble-row">
          <div class="j-avatar">J</div>
          <div class="j-bubble">有什么想说的？<br>提问、炫耀成绩、说说反馈——<br>都欢迎。<b>我会看的。</b></div>
        </div>

        <!-- 输入区 -->
        <div class="s-input-area">
          <textarea class="msg-input" id="msgInput" placeholder="说点什么…" maxlength="300"></textarea>
        </div>

        <!-- John 的回复气泡（发送后显示） -->
        <div class="reply-row" id="replyRow">
          <div class="reply-bubble" id="replyBubble"></div>
          <div class="j-avatar" style="margin-left:0">J</div>
        </div>
      </div>

      <!-- 两个等大按钮 -->
      <div class="btn-row">
        <button class="btn btn-send" id="sendBtn" onclick="sendMsg()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
          发送
        </button>
        <a class="btn btn-about" href="about.html" onclick="pg(event,'about.html')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          了解 John
        </a>
      </div>
    </div>

    <div class="foot">Growing Skills · Shaping Futures</div>
  </div>
</div>

<script>
const REPLIES = [
  '收到了！谢谢你说这些，我会认真看的。🙏',
  '嗯，看到了。有什么需要随时来找我。',
  '好的，我记下来了！继续加油 💪',
  '谢谢你告诉我这些，很有意义。',
  '哈哈，看到了！你很棒 ⭐',
  '收到！有问题随时加我微信：JiahaoLee6666',
];

function sendMsg() {
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  if (!msg) {
    input.style.borderColor = '#C0392B';
    input.focus();
    setTimeout(() => { input.style.borderColor = ''; }, 1200);
    return;
  }

  const btn = document.getElementById('sendBtn');
  btn.classList.add('sent');
  btn.innerHTML = '✓ 已发送';

  // 存到 localStorage（模拟留言）
  const msgs = JSON.parse(localStorage.getItem('jc_messages') || '[]');
  msgs.push({ text: msg, time: new Date().toISOString() });
  localStorage.setItem('jc_messages', JSON.stringify(msgs));

  // 随机回复
  const reply = REPLIES[Math.floor(Math.random() * REPLIES.length)];
  setTimeout(() => {
    const row = document.getElementById('replyRow');
    document.getElementById('replyBubble').textContent = reply;
    row.classList.add('show');
    input.value = '';
    input.disabled = true;
  }, 600);
}

function pg(e, href) {
  if (e) e.preventDefault();
  document.getElementById('ov').classList.add('show');
  setTimeout(() => { window.location.href = href; }, 280);
}

// 读取学生名字问候
const name = localStorage.getItem('jc_student_name');
if (name) {
  document.querySelector('.j-bubble').innerHTML =
    `${name}，有什么想说的？<br>提问、炫耀成绩、说说反馈——<br>都欢迎。<b>我会看的。</b>`;
}
</script>
</body>
</html>
