<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和 John 说说 · John Class</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;background:#F5EDD8;color:#2A1E08}
.layout{display:flex;min-height:100vh}
.left{position:fixed;top:0;left:0;width:52%;height:100vh;overflow:hidden}
.left img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.left::after{content:'';position:absolute;top:0;right:0;width:80px;height:100%;background:linear-gradient(to right,transparent,#F5EDD8)}
.right{margin-left:52%;flex:1;background:#F5EDD8;min-height:100vh;padding:52px 44px 64px 28px;position:relative;display:flex;flex-direction:column;justify-content:center}
.right::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(201,169,110,.07) 0%,transparent 50%),radial-gradient(circle at 20% 85%,rgba(120,160,80,.05) 0%,transparent 40%);pointer-events:none}

.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px;position:relative;z-index:1}
.nav-brand{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#B8956A;text-decoration:none;font-family:'Noto Serif SC',Georgia,serif}
.nav-back{font-size:12px;color:#9A8060;text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .2s}
.nav-back:hover{color:#2A1E08}

.main{position:relative;z-index:1;max-width:380px}
.page-title{font-family:'Noto Serif SC',Georgia,serif;font-size:clamp(26px,3vw,34px);font-weight:700;color:#2A1E08;letter-spacing:-.2px;margin-bottom:8px}
.page-sub{font-size:13px;color:#9A8060;margin-bottom:32px;line-height:1.6}

/* 对话框区域 */
.chat-card{background:rgba(255,255,255,.6);border:1px solid rgba(184,149,106,.2);border-radius:20px;padding:20px;margin-bottom:16px;backdrop-filter:blur(4px)}

.j-bubble-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:16px}
.j-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2A1E08 0%,#5A3E18 100%);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#F5EDD8;flex-shrink:0;font-family:'Noto Serif SC',Georgia,serif}
.j-bubble{background:#2A1E08;color:#F5EDD8;border-radius:16px 16px 16px 4px;padding:11px 15px;font-size:13.5px;line-height:1.65;max-width:240px}
.j-bubble b{color:#C9A96E}

.s-input-area{display:flex;flex-direction:column;gap:10px}
.name-row{display:flex;gap:8px;overflow:hidden}
.name-input{flex:1;padding:10px 14px;font-family:inherit;font-size:14px;color:#2A1E08;background:rgba(255,255,255,.8);border:1.5px solid rgba(184,149,106,.25);border-radius:12px;outline:none;transition:border-color .2s}
.name-input::placeholder{color:rgba(160,120,70,.45)}
.name-input:focus{border-color:#B8956A;box-shadow:0 0 0 3px rgba(184,149,106,.1)}
.msg-input{width:100%;padding:13px 16px;font-family:inherit;font-size:14px;color:#2A1E08;background:rgba(255,255,255,.8);border:1.5px solid rgba(184,149,106,.25);border-radius:14px;outline:none;resize:none;min-height:90px;line-height:1.6;transition:border-color .2s,box-shadow .2s}
.msg-input::placeholder{color:rgba(160,120,70,.45)}
.msg-input:focus{border-color:#B8956A;box-shadow:0 0 0 3px rgba(184,149,106,.1)}
.char-count{font-size:11px;color:rgba(160,120,70,.6);text-align:right}

.reply-row{display:none;align-items:flex-end;gap:10px;margin-top:12px}
.reply-row.show{display:flex}
.reply-bubble{background:rgba(184,149,106,.12);border:1px solid rgba(184,149,106,.2);color:#5A3E18;border-radius:16px 16px 4px 16px;padding:11px 15px;font-size:13px;line-height:1.6;max-width:240px;margin-left:auto}

.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:1}
.btn{padding:14px 12px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;letter-spacing:.02em;font-family:inherit;border:none;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-send{background:#2A1E08;color:#F5EDD8}
.btn-send:hover{background:#3D2E14;transform:translateY(-1px);box-shadow:0 6px 20px rgba(42,30,8,.18)}
.btn-send:active{transform:scale(.97)}
.btn-send.sending{opacity:.6;pointer-events:none}
.btn-send.sent{background:#4A7C3F;pointer-events:none}
.btn-about{background:rgba(255,255,255,.6);color:#2A1E08;border:1.5px solid rgba(184,149,106,.3)}
.btn-about:hover{background:rgba(255,255,255,.85);border-color:#B8956A;transform:translateY(-1px);box-shadow:0 6px 20px rgba(42,30,8,.08)}
.btn-about:active{transform:scale(.97)}

/* 留言列表 */
.msg-list-section{position:relative;z-index:1;max-width:380px;margin-top:32px}
.msg-list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.msg-list-title{font-size:13px;font-weight:600;color:#9A8060;letter-spacing:.06em}
.refresh-btn{font-size:11px;color:#B8956A;background:none;border:1px solid rgba(184,149,106,.3);border-radius:99px;padding:4px 12px;cursor:pointer;font-family:inherit;transition:all .15s}
.refresh-btn:hover{background:rgba(184,149,106,.1)}
.msg-item{background:rgba(255,255,255,.55);border:1px solid rgba(184,149,106,.18);border-radius:16px;padding:14px 16px;margin-bottom:10px;backdrop-filter:blur(4px)}
.msg-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.msg-item-name{font-size:13px;font-weight:600;color:#2A1E08}
.msg-item-grade{font-size:11px;color:#B8956A;margin-left:6px}
.msg-item-time{font-size:11px;color:rgba(154,128,96,.6)}
.msg-item-text{font-size:13.5px;color:#3A2A10;line-height:1.7}
.msg-reply-btn{font-size:11px;color:#B8956A;cursor:pointer;background:none;border:none;padding:4px 0;font-family:inherit;margin-top:8px;display:inline-block}
.msg-reply-btn:hover{color:#2A1E08;text-decoration:underline}
.reply-inline{display:none;margin-top:8px;padding-left:12px;border-left:2px solid rgba(184,149,106,.25)}
.reply-inline.show{display:block}
.reply-inline textarea{width:100%;padding:10px 12px;font-family:inherit;font-size:13px;color:#2A1E08;background:rgba(255,255,255,.7);border:1.5px solid rgba(184,149,106,.25);border-radius:10px;outline:none;resize:none;min-height:56px;line-height:1.5;margin-bottom:6px}
.reply-inline textarea:focus{border-color:#B8956A}
.reply-inline .reply-actions{display:flex;gap:8px;align-items:center}
.reply-inline .reply-submit{padding:6px 14px;background:#2A1E08;color:#F5EDD8;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.reply-inline .reply-cancel{padding:6px 12px;background:transparent;color:#9A8060;border:1px solid rgba(184,149,106,.3);border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}
.reply-item{margin-top:8px;padding:8px 12px;background:rgba(255,252,245,.7);border-radius:10px;font-size:13px;line-height:1.6;border-left:3px solid rgba(184,149,106,.25)}
.reply-item-name{font-weight:600;color:#2A1E08;font-size:12px}
.reply-item-time{font-size:10px;color:rgba(154,128,96,.6);margin-left:6px}
.msg-item-text{font-size:13.5px;color:#3A2A10;line-height:1.7;white-space:pre-wrap}
.msg-empty{text-align:center;padding:32px;font-size:13px;color:rgba(154,128,96,.6)}
.msg-loading{opacity:.4}
.skel{background:rgba(184,149,106,.15);border-radius:8px;height:14px;margin-bottom:8px}

.foot{margin-top:40px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(184,149,106,.4);position:relative;z-index:1}
.overlay{position:fixed;inset:0;background:#F5EDD8;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s ease}
.overlay.show{opacity:1;pointer-events:all}

.right>*{animation:fi .6s cubic-bezier(.22,1,.36,1) both}
.nav{animation-delay:.04s}.main{animation-delay:.12s}.btn-row{animation-delay:.22s}
@keyframes fi{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

@media(max-width:680px){
  .layout{flex-direction:column}
  .left{position:relative;width:100%;height:56vw;min-height:200px;max-height:340px}
  .left::after{top:auto;bottom:0;left:0;right:0;width:100%;height:60px;background:linear-gradient(to bottom,transparent,#F5EDD8)}
  .right{margin-left:0;padding:28px 20px 56px;justify-content:flex-start}
  .main,.msg-list-section{max-width:100%}
}
</style>
</head>
<body>
<div class="overlay" id="ov"></div>
<div class="layout">
  <div class="left"><img src="bg.png" alt="John Class"></div>
  <div class="right">

    <div class="nav">
      <a class="nav-brand" href="index.html">John Class</a>
      <a class="nav-back" href="index.html" onclick="pg(event,'index.html')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回
      </a>
    </div>

    <div class="main">
      <div class="page-title">和 John 说说</div>
      <div class="page-sub">提问、炫耀成绩、说说反馈——都可以，John 会看到的。</div>

      <div class="chat-card">
        <div class="j-bubble-row">
          <div class="j-avatar">J</div>
          <div class="j-bubble" id="jBubble">有什么想说的？<br>提问、炫耀成绩、说说反馈——<br>都欢迎。<b>我会看的。</b></div>
        </div>

        <div class="s-input-area">
          <div class="name-row">
            <input class="name-input" id="msgName" placeholder="你的名字" maxlength="20">
            <input class="name-input" id="msgGrade" placeholder="年级（选填）" maxlength="10" style="flex:.8;min-width:0;max-width:120px">
          </div>
          <textarea class="msg-input" id="msgInput" placeholder="说点什么…" maxlength="300"></textarea>
          <div class="char-count" id="charCount">0 / 300</div>
        </div>

        <div class="reply-row" id="replyRow">
          <div class="reply-bubble" id="replyBubble"></div>
          <div class="j-avatar" style="margin-left:0">J</div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-send" id="sendBtn" onclick="sendMsg()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
          发送
        </button>
        <a class="btn btn-about" href="about.html" onclick="pg(event,'about.html')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          了解 John
        </a>
      </div>
    </div>

    <!-- 留言列表 -->
    <div class="msg-list-section">
      <div class="msg-list-header">
        <span class="msg-list-title">大家都说了什么</span>
        <button class="refresh-btn" onclick="loadMsgs()">↻ 刷新</button>
      </div>
      <div id="msgList">
        <!-- 骨架屏 -->
        <div class="msg-item msg-loading">
          <div class="skel" style="width:40%"></div>
          <div class="skel" style="width:90%"></div>
          <div class="skel" style="width:70%"></div>
        </div>
        <div class="msg-item msg-loading">
          <div class="skel" style="width:35%"></div>
          <div class="skel" style="width:80%"></div>
        </div>
      </div>
    </div>

    <div class="foot">Growing Skills · Shaping Futures</div>
  </div>
</div>

<script>
/* ── Supabase 配置 ── */
const SB_URL = "https://ghunrrtrdgicbmixsqrc.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdodW5ycnRyZGdpY2JtaXhzcXJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Mzg3OTMsImV4cCI6MjA5NjMxNDc5M30.n3_yRr6iR0gtEo7HSxGWO1jBGs1aaALAchVhqjgnOqs";

const REPLIES = [
  '收到了！谢谢你说这些，我会认真看的。🙏',
  '嗯，看到了。有什么需要随时来找我。',
  '好的，我记下来了！继续加油 💪',
  '谢谢你告诉我这些，很有意义。',
  '哈哈，看到了！你很棒 ⭐',
  '收到！有问题随时加我微信：JiahaoLee6666',
];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* 字数统计 */
document.getElementById('msgInput').addEventListener('input',function(){
  document.getElementById('charCount').textContent=this.value.length+' / 300';
});

/* 读取学生名字预填 */
const savedName=localStorage.getItem('jc_username')||localStorage.getItem('jc_student_name');
if(savedName){
  document.getElementById('msgName').value=savedName;
  document.getElementById('jBubble').innerHTML=`${esc(savedName)}，有什么想说的？<br>提问、炫耀成绩、说说反馈——<br>都欢迎。<b>我会看的。</b>`;
}

/* 发送留言 */
async function sendMsg(){
  const name=document.getElementById('msgName').value.trim();
  const grade=document.getElementById('msgGrade').value.trim();
  const content=document.getElementById('msgInput').value.trim();
  const btn=document.getElementById('sendBtn');

  if(!name){
    document.getElementById('msgName').style.borderColor='#C0392B';
    document.getElementById('msgName').focus();
    setTimeout(()=>{document.getElementById('msgName').style.borderColor='';},1200);
    return;
  }
  if(!content){
    document.getElementById('msgInput').style.borderColor='#C0392B';
    document.getElementById('msgInput').focus();
    setTimeout(()=>{document.getElementById('msgInput').style.borderColor='';},1200);
    return;
  }

  btn.classList.add('sending');
  btn.innerHTML='发送中…';

  try{
    const res=await fetch(`${SB_URL}/rest/v1/messages`,{
      method:'POST',
      headers:{
        'apikey':SB_KEY,
        'Authorization':`Bearer ${SB_KEY}`,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify({name,grade,content})
    });
    if(!res.ok)throw new Error(res.status);

    // 保存名字供下次使用
    localStorage.setItem('jc_student_name',name);

    // 锁定名字（发送后不可修改）
    const nameEl=document.getElementById('msgName');
    nameEl.readOnly=true;
    nameEl.style.background='rgba(245,237,216,.5)';
    nameEl.style.color='#9A8060';

    btn.classList.remove('sending');
    btn.classList.add('sent');
    btn.innerHTML='✓ 已发送';

    // 显示随机回复气泡
    const reply=REPLIES[Math.floor(Math.random()*REPLIES.length)];
    setTimeout(()=>{
      document.getElementById('replyBubble').textContent=reply;
      document.getElementById('replyRow').classList.add('show');
      document.getElementById('msgInput').value='';
      document.getElementById('charCount').textContent='0 / 300';
      document.getElementById('msgInput').disabled=true;
      loadMsgs();
    },600);

  }catch(e){
    btn.classList.remove('sending');
    btn.innerHTML='发送失败，重试';
    btn.style.background='#C0392B';
    setTimeout(()=>{btn.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>发送';btn.style.background='';btn.classList.remove('sending');},2000);
  }
}

/* 加载留言列表 */
async function loadMsgs(){
  const list=document.getElementById('msgList');
  try{
    // 查所有留言和回复
    const res=await fetch(
      `${SB_URL}/rest/v1/messages?select=id,name,grade,content,reply_to,created_at&order=created_at.desc&limit=100`,
      {headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}}
    );
    if(!res.ok)throw new Error(res.status);
    const data=await res.json();

    if(!data.length){
      list.innerHTML='<div class="msg-empty">还没有留言，来第一个说说吧 ✨</div>';
      return;
    }

    // 分离主留言和回复
    const mains = data.filter(m=>!m.reply_to);
    const replies = data.filter(m=>m.reply_to);

    list.innerHTML=mains.map(m=>{
      const dt=new Date(m.created_at);
      const t=`${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      const childReplies = replies.filter(r=>r.reply_to===m.id);
      let replyHTML = '';
      if(childReplies.length>0){
        replyHTML = childReplies.map(r=>{
          const rd=new Date(r.created_at);
          const rt=`${rd.getMonth()+1}/${rd.getDate()} ${String(rd.getHours()).padStart(2,'0')}:${String(rd.getMinutes()).padStart(2,'0')}`;
          return `<div class="reply-item"><span class="reply-item-name">${esc(r.name)}</span><span class="reply-item-time">${rt}</span><br>${esc(r.content)}</div>`;
        }).join('');
      }
      return `<div class="msg-item" id="msg${m.id}">
        <div class="msg-item-head">
          <span><span class="msg-item-name">${esc(m.name)}</span>${m.grade?`<span class="msg-item-grade">${esc(m.grade)}</span>`:''}</span>
          <span class="msg-item-time">${t}</span>
        </div>
        <div class="msg-item-text">${esc(m.content)}</div>
        ${replyHTML}
        <button class="msg-reply-btn" onclick="toggleReply(${m.id})">💬 回复</button>
        <div class="reply-inline" id="replyBox${m.id}">
          <textarea id="replyInput${m.id}" placeholder="写下你的回复…" maxlength="200"></textarea>
          <div class="reply-actions">
            <button class="reply-submit" onclick="sendReply(${m.id})">发送回复</button>
            <button class="reply-cancel" onclick="toggleReply(${m.id})">取消</button>
          </div>
        </div>
      </div>`;
    }).join('');

  }catch(e){
    list.innerHTML='<div class="msg-empty" style="color:#C0392B">加载失败，点刷新重试</div>';
  }
}

/* 切换回复框 */
function toggleReply(id){
  const box=document.getElementById('replyBox'+id);
  if(!box)return;
  const show=!box.classList.contains('show');
  box.classList.toggle('show');
  if(show){
    const inp=document.getElementById('replyInput'+id);
    const saved=localStorage.getItem('jc_username')||'';
    inp.placeholder = saved ? '以 '+saved+' 的身份回复…' : '写下你的回复…';
    inp.focus();
  }
}

/* 发送回复 */
async function sendReply(parentId){
  const inp=document.getElementById('replyInput'+parentId);
  const content=inp.value.trim();
  if(!content){inp.style.borderColor='#C0392B';setTimeout(()=>{inp.style.borderColor='';},1200);return;}

  const name=localStorage.getItem('jc_username')||'同学';
  const btn=document.querySelector('#replyBox'+parentId+' .reply-submit');
  btn.disabled=true; btn.textContent='发送中…';

  try{
    const res=await fetch(`${SB_URL}/rest/v1/messages`,{
      method:'POST',
      headers:{
        'apikey':SB_KEY,
        'Authorization':`Bearer ${SB_KEY}`,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify({name,content,reply_to:parentId})
    });
    if(!res.ok)throw new Error(res.status);
    inp.value='';
    document.getElementById('replyBox'+parentId).classList.remove('show');
    loadMsgs();
  }catch(e){
    btn.disabled=false; btn.textContent='失败，重试';
  }
}

function pg(e,href){
  if(e)e.preventDefault();
  document.getElementById('ov').classList.add('show');
  setTimeout(()=>{window.location.href=href;},280);
}

/* 页面加载时拉取留言 */
loadMsgs();
</script>
  <script src="audio.js"></script>
  <script src="bgm-cross.js"></script>
</body>
</html>
