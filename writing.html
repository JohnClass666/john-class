<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文写作批改 · John Class</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;background:#F5EDD8;color:#2A1E08}
.container{max-width:900px;margin:0 auto;padding:28px 20px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.nav-brand{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#B8956A;text-decoration:none;font-family:'Noto Serif SC',Georgia,serif}
.nav-back{font-size:12px;color:#9A8060;text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .2s;cursor:pointer}
.nav-back:hover{color:#2A1E08}

.page{display:none}
.page.active{display:block}

.page-title{font-family:'Noto Serif SC',Georgia,serif;font-size:28px;font-weight:700;color:#2A1E08;letter-spacing:-.2px;margin-bottom:8px}
.page-sub{font-size:13px;color:#9A8060;margin-bottom:24px;line-height:1.6}

.card{background:rgba(255,255,255,.6);border:1px solid rgba(184,149,106,.2);border-radius:16px;padding:24px;margin-bottom:16px;backdrop-filter:blur(4px)}

.input-group{margin-bottom:16px}
.label{display:block;font-size:13px;font-weight:600;color:#2A1E08;margin-bottom:8px}
input[type="password"],input[type="text"],textarea{width:100%;padding:12px 14px;font-family:inherit;font-size:14px;color:#2A1E08;background:rgba(255,255,255,.8);border:1.5px solid rgba(184,149,106,.25);border-radius:12px;outline:none;transition:border-color .2s}
input[type="password"]:focus,input[type="text"]:focus,textarea:focus{border-color:#B8956A;box-shadow:0 0 0 3px rgba(184,149,106,.1)}
textarea{resize:vertical;min-height:120px;line-height:1.6}

.btn{padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;border:none;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:#2A1E08;color:#F5EDD8}
.btn-primary:hover{background:#3D2E14;transform:translateY(-1px);box-shadow:0 6px 20px rgba(42,30,8,.18)}
.btn-primary:active{transform:scale(.97)}
.btn-secondary{background:rgba(255,255,255,.6);color:#2A1E08;border:1.5px solid rgba(184,149,106,.3)}
.btn-secondary:hover{background:rgba(255,255,255,.85);border-color:#B8956A;transform:translateY(-1px)}

.tabs{display:flex;gap:12px;margin-bottom:16px}
.tab{padding:10px 18px;border-radius:10px;background:rgba(184,149,106,.1);color:#9A8060;cursor:pointer;border:none;font-family:inherit;font-size:14px;transition:all .2s}
.tab.active{background:#2A1E08;color:#F5EDD8}

.quota-info{background:rgba(184,149,106,.08);border:1px solid rgba(184,149,106,.2);border-radius:12px;padding:14px;margin-bottom:16px;font-size:13px;color:#5A3E18}
.quota-info b{color:#2A1E08}

.loading{text-align:center;padding:20px;color:#9A8060;font-size:14px}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(184,149,106,.2);border-top-color:#B8956A;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.result-card{background:rgba(255,255,255,.6);border:1px solid rgba(184,149,106,.2);border-radius:14px;padding:16px;min-height:300px;overflow-y:auto}
.result-card-title{font-size:13px;font-weight:700;color:#2A1E08;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.result-item{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(184,149,106,.1);font-size:13px;line-height:1.6}
.result-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.error-text{color:#C0392B;font-weight:600}
.correct-text{color:#4A7C3F}
.suggestion{background:rgba(184,149,106,.06);padding:8px;border-radius:8px;margin-top:4px}

.text-preview{background:rgba(255,255,255,.8);border:1px solid rgba(184,149,106,.15);border-radius:12px;padding:14px;margin-bottom:16px;line-height:1.8;font-size:14px;color:#2A1E08}

.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}

@media(max-width:768px){
  .result-grid{grid-template-columns:1fr}
  .container{padding:20px}
}
</style>
</head>
<body>

<div class="container">
  <div class="nav">
    <a class="nav-brand" href="index.html">John Class</a>
    <a class="nav-back" href="index.html">← 返回主页</a>
  </div>

  <!-- 密码页 -->
  <div class="page active" id="loginPage">
    <div class="card" style="max-width:400px;margin:80px auto">
      <div class="page-title">写作批改</div>
      <div class="page-sub">输入班级密码进入</div>
      <div class="input-group">
        <input type="password" id="pwdInput" placeholder="班级密码" autocomplete="off">
      </div>
      <button class="btn btn-primary" onclick="checkPassword()" style="width:100%">进入</button>
    </div>
  </div>

  <!-- 主页 -->
  <div class="page" id="mainPage">
    <div class="page-title">英文短文批改</div>
    <div class="page-sub">拍照上传手写作业，或直接输入英文文本。AI 会帮你检查语法、流畅度和表达，三栏批改一目了然。</div>

    <div class="quota-info">
      <span id="quotaText">📋 本周已用 0 / 2 次额度</span>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('photo')">📷 拍照上传</button>
      <button class="tab" onclick="switchTab('text')">✏️ 直接输入</button>
    </div>

    <!-- 拍照模式 -->
    <div id="photoTab" class="tab-content">
      <div class="card">
        <div class="label">上传作业照片</div>
        <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoUpload()">
        <div id="photoPreview" style="margin-top:12px;display:none">
          <div class="label" style="margin-top:12px">识别的文本</div>
          <div class="text-preview" id="recognizedText"></div>
          <textarea id="editedText" style="margin-top:12px" placeholder="可以在这里编辑识别出的文本"></textarea>
          <div style="margin-top:12px;display:flex;gap:12px">
            <button class="btn btn-primary" onclick="startReview()">开始批改</button>
            <button class="btn btn-secondary" onclick="resetPhoto()">重新上传</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 文本模式 -->
    <div id="textTab" class="tab-content" style="display:none">
      <div class="card">
        <div class="label">输入英文短文（50-200 字）</div>
        <textarea id="essayInput" placeholder="粘贴或输入你的英文作文..."></textarea>
        <div style="margin-top:12px;text-align:right;font-size:12px;color:#9A8060">
          <span id="charCount">0</span> / 300
        </div>
        <div style="margin-top:16px;display:flex;gap:12px;justify-content:flex-end">
          <button class="btn btn-primary" onclick="startReview()">开始批改</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 识别文字页 -->
  <div class="page" id="recognizePage">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:24px">
      <button class="nav-back" onclick="goBack()" style="margin:0">← 返回</button>
    </div>
    <div class="page-title">识别文本</div>
    <div class="card">
      <div class="label" style="margin-bottom:12px">AI 识别到的文字：</div>
      <div class="text-preview" id="recogDisplay"></div>
      <textarea id="recogEdit" style="margin-top:12px" placeholder="可以编辑识别结果"></textarea>
      <div class="actions">
        <button class="btn btn-secondary" onclick="goBack()">返回修改</button>
        <button class="btn btn-primary" onclick="confirmRecognized()">确认并批改</button>
      </div>
    </div>
  </div>

  <!-- 批改页 -->
  <div class="page" id="resultPage">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:24px">
      <button class="nav-back" onclick="goHome()" style="margin:0">← 返回</button>
    </div>
    <div class="page-title">批改结果</div>

    <div id="loadingDiv" class="loading">
      <div class="spinner"></div>正在批改中...
    </div>

    <div id="resultDiv" style="display:none">
      <div class="result-grid">
        <div class="result-card">
          <div class="result-card-title">✅ 准确性</div>
          <div id="accuracyResult"></div>
        </div>
        <div class="result-card">
          <div class="result-card-title">🔗 连贯性</div>
          <div id="coherenceResult"></div>
        </div>
        <div class="result-card">
          <div class="result-card-title">✨ 表达升级</div>
          <div id="enrichmentResult"></div>
        </div>
      </div>

      <div class="card">
        <button class="btn btn-primary" onclick="goHome()" style="width:100%">新建批改</button>
      </div>
    </div>

    <div id="errorDiv" style="display:none">
      <div class="card">
        <div style="color:#C0392B;margin-bottom:12px" id="errorMsg"></div>
        <button class="btn btn-secondary" onclick="goHome()">返回重试</button>
      </div>
    </div>
  </div>
</div>

<script>
const DEEPSEEK_API_KEY='sk-911d49088c9f411bb73d78f1a2f1861d';
const PASSWORD='JiahaoLee6666';
const WEEKLY_LIMIT=2;

let currentMode='photo';
let uploadedImage=null;
let recognizedContent='';
let essayToReview='';
let deviceId=getOrCreateDeviceId();

function getOrCreateDeviceId(){
  let id=localStorage.getItem('writing_device_id');
  if(!id){
    id='dev_'+Math.random().toString(36).substr(2,12);
    localStorage.setItem('writing_device_id',id);
  }
  return id;
}

function getQuotaInfo(){
  const now=new Date();
  const weekStart=getWeekMonday();
  const lastWeekStr=localStorage.getItem(`writing_week_${deviceId}`);
  const lastCount=parseInt(localStorage.getItem(`writing_count_${deviceId}`)||'0');
  
  if(lastWeekStr!==weekStart.toISOString()){
    localStorage.setItem(`writing_count_${deviceId}`,'0');
    localStorage.setItem(`writing_week_${deviceId}`,weekStart.toISOString());
    return 0;
  }
  return lastCount;
}

function getWeekMonday(){
  const d=new Date();
  const day=d.getDay();
  const diff=d.getDate()-(day||7)+1;
  const monday=new Date(d.setDate(diff));
  monday.setHours(0,0,0,0);
  return monday;
}

function updateQuota(){
  const count=getQuotaInfo();
  document.getElementById('quotaText').textContent=`📋 本周已用 ${count} / ${WEEKLY_LIMIT} 次额度`;
}

function canUseQuota(){
  return getQuotaInfo()<WEEKLY_LIMIT;
}

function consumeQuota(){
  const count=getQuotaInfo()+1;
  localStorage.setItem(`writing_count_${deviceId}`,count.toString());
  updateQuota();
}

function checkPassword(){
  const pwd=document.getElementById('pwdInput').value;
  if(pwd===PASSWORD){
    localStorage.setItem('writing_unlocked','1');
    showPage('mainPage');
    updateQuota();
  }else{
    alert('密码错误');
    document.getElementById('pwdInput').value='';
  }
}

function showPage(pageName){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(pageName).classList.add('active');
}

function switchTab(tab){
  currentMode=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.style.display='none');
  event.target.classList.add('active');
  document.getElementById(tab+'Tab').style.display='block';
}

function handlePhotoUpload(){
  const input=document.getElementById('photoInput');
  const file=input.files[0];
  if(!file)return;
  
  const reader=new FileReader();
  reader.onload=function(e){
    uploadedImage=e.target.result;
    recognizePhoto();
  };
  reader.readAsDataURL(file);
}

async function recognizePhoto(){
  document.getElementById('photoPreview').innerHTML='<div class="loading"><div class="spinner"></div>识别中...</div>';
  
  try{
    const response=await fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':`Bearer ${DEEPSEEK_API_KEY}`
      },
      body:JSON.stringify({
        model:'deepseek-vision',
        messages:[{
          role:'user',
          content:[
            {type:'text',text:'请识别这张图片中的英文文本，只返回识别出的文本内容，不要加任何其他说明。'},
            {type:'image_url',image_url:{url:uploadedImage}}
          ]
        }],
        max_tokens:1000
      })
    });

    if(!response.ok)throw new Error(`API error: ${response.status}`);
    const data=await response.json();
    recognizedContent=data.choices[0].message.content;
    
    document.getElementById('photoPreview').innerHTML=`
      <div class="label" style="margin-top:12px">识别的文本</div>
      <div class="text-preview">${escapeHtml(recognizedContent)}</div>
      <textarea id="editedText" style="margin-top:12px" placeholder="可以编辑识别出的文本">${recognizedContent}</textarea>
      <div style="margin-top:12px;display:flex;gap:12px">
        <button class="btn btn-primary" onclick="startReview()">开始批改</button>
        <button class="btn btn-secondary" onclick="resetPhoto()">重新上传</button>
      </div>
    `;
  }catch(e){
    document.getElementById('photoPreview').innerHTML=`<div style="color:#C0392B">识别失败：${e.message}</div><button class="btn btn-secondary" onclick="resetPhoto()" style="margin-top:12px">重新上传</button>`;
  }
}

function resetPhoto(){
  document.getElementById('photoInput').value='';
  document.getElementById('photoPreview').style.display='none';
  uploadedImage=null;
}

function startReview(){
  if(!canUseQuota()){
    alert('本周额度已用完！每周最多2次，请下周再来。');
    return;
  }

  if(currentMode==='photo'){
    essayToReview=document.getElementById('editedText')?.value || recognizedContent;
  }else{
    essayToReview=document.getElementById('essayInput').value;
  }

  if(!essayToReview.trim()){
    alert('请输入或上传文本');
    return;
  }

  consumeQuota();
  showPage('resultPage');
  reviewEssay();
}

async function reviewEssay(){
  document.getElementById('loadingDiv').style.display='block';
  document.getElementById('resultDiv').style.display='none';
  document.getElementById('errorDiv').style.display='none';

  try{
    const prompt=`请对以下英文短文进行批改，返回 JSON 格式的结果：
{
  "accuracy": {
    "errors": [{"type": "语法/拼写/标点", "wrong": "原句子或短语", "correct": "改正后"}],
    "summary": "总体准确度评价（1-2句）"
  },
  "coherence": {
    "points": ["连贯性评价点1", "评价点2"],
    "summary": "整体逻辑和流畅度评价（2-3句）"
  },
  "enrichment": {
    "suggestions": [{"common": "普通表达", "better": "更好的表达", "explanation": "为什么更好"}],
    "summary": "词汇和表达丰富度总体评价（1-2句）"
  }
}

短文内容：
${essayToReview}

只返回有效的 JSON，不要有其他说明。`;

    const response=await fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':`Bearer ${DEEPSEEK_API_KEY}`
      },
      body:JSON.stringify({
        model:'deepseek-chat',
        messages:[{role:'user',content:prompt}],
        max_tokens:2000,
        temperature:0.7
      })
    });

    if(!response.ok)throw new Error(`API error: ${response.status}`);
    const data=await response.json();
    let result=data.choices[0].message.content;
    
    const jsonMatch=result.match(/\{[\s\S]*\}/);
    if(!jsonMatch)throw new Error('无效的 JSON 返回');
    result=JSON.parse(jsonMatch[0]);

    displayResult(result);
  }catch(e){
    document.getElementById('loadingDiv').style.display='none';
    document.getElementById('errorDiv').style.display='block';
    document.getElementById('errorMsg').textContent=`批改失败：${e.message}`;
  }
}

function displayResult(result){
  document.getElementById('loadingDiv').style.display='none';
  document.getElementById('resultDiv').style.display='block';

  let accuracy='';
  if(result.accuracy.errors.length>0){
    accuracy+=result.accuracy.errors.map(e=>
      `<div class="result-item"><span class="error-text">${e.type}</span><br><div style="margin-top:4px">❌ ${escapeHtml(e.wrong)}</div><div style="margin-top:4px">✓ <span class="correct-text">${escapeHtml(e.correct)}</span></div></div>`
    ).join('');
  }else{
    accuracy='<div class="result-item"><span class="correct-text">✨ 完美！没有找到错误</span></div>';
  }
  accuracy+=`<div class="result-item" style="border:none"><em style="font-size:12px;color:#9A8060">${escapeHtml(result.accuracy.summary)}</em></div>`;
  document.getElementById('accuracyResult').innerHTML=accuracy;

  let coherence=`<div class="result-item">`;
  result.coherence.points.forEach(p=>{
    coherence+=`<div style="margin-bottom:8px">• ${escapeHtml(p)}</div>`;
  });
  coherence+=`</div><div class="result-item" style="border:none"><em style="font-size:12px;color:#9A8060">${escapeHtml(result.coherence.summary)}</em></div>`;
  document.getElementById('coherenceResult').innerHTML=coherence;

  let enrichment='';
  if(result.enrichment.suggestions.length>0){
    enrichment+=result.enrichment.suggestions.map(s=>
      `<div class="result-item"><div class="error-text">${escapeHtml(s.common)}</div><div class="suggestion">➜ <span class="correct-text">${escapeHtml(s.better)}</span><br><em style="font-size:12px;color:#9A8060">${escapeHtml(s.explanation)}</em></div></div>`
    ).join('');
  }else{
    enrichment='<div class="result-item"><span class="correct-text">表达已经很不错了！</span></div>';
  }
  enrichment+=`<div class="result-item" style="border:none"><em style="font-size:12px;color:#9A8060">${escapeHtml(result.enrichment.summary)}</em></div>`;
  document.getElementById('enrichmentResult').innerHTML=enrichment;
}

function goHome(){
  resetPhoto();
  document.getElementById('essayInput').value='';
  document.getElementById('charCount').textContent='0';
  showPage('mainPage');
}

function goBack(){
  showPage('mainPage');
}

function escapeHtml(text){
  const map={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
  return text.replace(/[&<>"']/g,m=>map[m]);
}

document.getElementById('essayInput')?.addEventListener('input',function(){
  document.getElementById('charCount').textContent=this.value.length;
});

window.addEventListener('load',function(){
  if(localStorage.getItem('writing_unlocked')==='1'){
    showPage('mainPage');
    updateQuota();
  }
});
</script>
</body>
</html>
