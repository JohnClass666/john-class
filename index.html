<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Class</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #F5EDD8;
  -webkit-font-smoothing: antialiased;
}

.page {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ── 左：图片铺满 ── */
.left {
  flex: 0 0 58%;
  height: 100vh;
  position: relative;
  overflow: hidden;
}
.left img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}
/* 右侧自然过渡 */
.left::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 100px; height: 100%;
  background: linear-gradient(to right, transparent, #F5EDD8);
}

/* ── 右：纯文字 ── */
.right {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 52px 0 20px;
  background: #F5EDD8;
  position: relative;
}

/* 品牌小字 */
.brand {
  position: absolute;
  top: 42px; left: 20px;
  font-family: 'Noto Serif SC', 'STKaiti', 'KaiTi', '楷体', 'SimKai', Georgia, serif;
  font-size: 15px;
  font-weight: 400;
  letter-spacing: .06em;
  color: rgba(160,120,70,.5);
}

/* 内容 */
.inner {
  animation: fadeIn .8s cubic-bezier(.22,1,.36,1) .1s both;
}

/* 小分割标签 */
.divider {
  width: 32px;
  height: 1px;
  background: rgba(160,120,70,.3);
  margin-bottom: 32px;
}

/* 可点击文字入口 */
.entry {
  display: block;
  text-decoration: none;
  margin-bottom: 36px;
  cursor: pointer;
  position: relative;
}
.entry:last-of-type { margin-bottom: 0; }

.entry-title {
  font-family: 'Noto Serif SC', 'STKaiti', 'KaiTi', '楷体', 'SimKai', Georgia, serif;
  font-size: clamp(32px, 3.5vw, 46px);
  font-weight: 700;
  color: #2A1E08;
  line-height: 1.1;
  letter-spacing: .01em;
  transition: color .2s, transform .2s;
  display: inline-block;
}
.entry:hover .entry-title {
  color: #8A6030;
  transform: translateX(6px);
}

.entry-sub {
  font-family: 'Noto Serif SC', 'STKaiti', 'KaiTi', '楷体', 'SimKai', Georgia, serif;
  font-size: clamp(14px, 1.6vw, 18px);
  font-weight: 400;
  color: rgba(140,100,50,.55);
  margin-top: 4px;
  letter-spacing: .02em;
  transition: color .2s;
}
.entry:hover .entry-sub { color: rgba(140,100,50,.8); }

/* hover时左边出现小线 */
.entry::before {
  content: '';
  position: absolute;
  left: -16px;
  top: 50%;
  transform: translateY(-50%) scaleX(0);
  transform-origin: left;
  width: 8px; height: 2px;
  background: #8A6030;
  border-radius: 1px;
  transition: transform .2s;
}
.entry:hover::before { transform: translateY(-50%) scaleX(1); }

/* 底部小字 */
.foot {
  position: absolute;
  bottom: 40px; left: 20px;
  font-family: 'Noto Serif SC', 'STKaiti', 'KaiTi', '楷体', 'SimKai', Georgia, serif;
  font-size: 13px;
  color: rgba(160,120,70,.35);
  letter-spacing: .06em;
}

/* 遮罩 */
.overlay {
  position: fixed; inset: 0;
  background: #F5EDD8; z-index: 999;
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease;
}
.overlay.show { opacity: 1; pointer-events: all; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: none; }
}

/* 移동단 */
@media (max-width: 640px) {
  html, body { overflow-y: auto; }
  .page { flex-direction: column; height: auto; min-height: 100vh; }
  .left {
    flex: none;
    width: 100%;
    height: 100vw;
    max-height: 480px;
  }
  .left::after {
    top: auto; bottom: 0; left: 0; right: 0;
    width: 100%; height: 80px;
    background: linear-gradient(to bottom, transparent, #F5EDD8);
  }
  .right {
    flex: none;
    padding: 32px 36px 64px;
  }
  .brand { position: static; margin-bottom: 24px; display: block; }
  .foot  { position: static; margin-top: 40px; display: block; }
  .entry::before { display: none; }
}
</style>
</head>
<body>
<div class="overlay" id="ov"></div>

<div class="page">
  <div class="left">
    <img src="bg.png" alt="John Class">
  </div>

  <div class="right">
    <div class="brand">John Class</div>

    <div class="inner">
      <div class="divider"></div>

      <a class="entry" href="study.html" onclick="go(event,'study.html')">
        <div class="entry-title">英语学习提升</div>
        <div class="entry-sub">词汇 · 语法 · 阅读 · 武林秘籍</div>
      </a>

      <a class="entry" href="teacher.html" onclick="go(event,'teacher.html')">
        <div class="entry-title">和 John 说说</div>
        <div class="entry-sub">提问 · 炫耀 · 反馈 · 了解</div>
      </a>
    </div>

    <div class="foot">Changsha · 2026</div>
  </div>
</div>

<script>
function go(e, href) {
  e.preventDefault();
  document.getElementById('ov').classList.add('show');
  setTimeout(() => { window.location.href = href; }, 280);
}
</script>
</body>
</html>
