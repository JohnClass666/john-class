══════════════════════════════════════════════════════════════
 John Class 3D 主页「John 的书桌」（设计/建模/工程：Claude）
 暖灯书桌一角：城堡沙盘（→ study.html，镜头俯冲入模型世界）、
 火漆信件（→ teacher.html，信封起飞）、bg.png 立式相框、
 黄铜台灯、书堆、鹅毛笔、热气马克杯。

 ▶ 部署：先把现有 index.html 改名 index-classic.html 上传（降级保底），
   再把本文件改名 index.html 上传覆盖。bg.png 保持在仓库根目录不动。
 ▶ 名字逻辑与原版一致：无名字 → start.html；老用户无宣言 → start.html 补宣言。
 ▶ WebGL 不可用 / 引擎加载失败 → 自动落回 index-classic.html。
══════════════════════════════════════════════════════════════
-->

<script>
// ── 守卫脚本（不依赖 3D 引擎）──
(function(){
  if(localStorage.getItem('jc_home_mode')==='classic'){ location.replace('index-classic.html'); return; }
  try{
    var c = document.createElement('canvas');
    if(!(window.WebGLRenderingContext && (c.getContext('webgl')||c.getContext('experimental-webgl'))))
      throw 0;
  }catch(e){ location.replace('index-classic.html'); return; }
  setTimeout(function(){
    if(!window.__deskReady) location.replace('index-classic.html');
  }, 22000);
})();
document.getElementById('classicLink').addEventListener('click', function(){
  localStorage.setItem('jc_home_mode','classic');
});
// ── 名字门卫（与原 index.html 逻辑一致；命名/三问流程由 start.html 负责）──
(function(){
  var isLocal = location.protocol === 'file:';   // 本地双击调试：跳过门卫，直接进书桌
  var saved = localStorage.getItem('jc_username')
    || localStorage.getItem('jc_student_name')
    || localStorage.getItem('jc_reading_name');
  if(saved && saved !== '同学'){
    localStorage.setItem('jc_username', saved);
    if(!localStorage.getItem('jc_victory_msg') && !isLocal){ location.href = 'start.html'; return; }
    document.getElementById('greeting').textContent = saved + ' 欢迎 👋';
  } else if(isLocal){
    document.getElementById('greeting').textContent = '调试模式 🔧';
  } else {
    location.href = 'start.html';
  }
})();
function changeName(){
  if(confirm('要切换成另一个名字吗？\n\n进度和分数不会丢失——换设备输入同一个名字就能找回来。')){
    localStorage.removeItem('jc_username');
    window.location.href = 'start.html';
  }
}
</script>

<script>
"use strict";
window.__bootDesk = function(){
const THREE = window.THREE;

/* ── 内置兼容层：颜色空间 / 轨道控制 / 标签投射（零插件依赖，任意 three 版本可用）── */
const SRGB = t => { if('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace;
  else t.encoding = THREE.sRGBEncoding; return t; };
function OrbitLite(camera, dom){
  const self = this;
  this.target = new THREE.Vector3();
  this.enabled = true; this.enablePan = false;
  this.enableDamping = true; this.dampingFactor = .08;
  this.minDistance = 1; this.maxDistance = 100;
  this.minPolarAngle = .05; this.maxPolarAngle = Math.PI - .05;
  this.minAzimuthAngle = -Infinity; this.maxAzimuthAngle = Infinity;
  this.autoRotate = false; this.autoRotateSpeed = .4;
  this.onStart = null; this.onEnd = null;
  let drag = false, pinching = false, px = 0, py = 0, pd = 0;
  let pdx = 0, pdy = 0, lz = 0;
  dom.addEventListener('pointerdown', e => { if(!self.enabled) return;
    drag = true; px = e.clientX; py = e.clientY; if(self.onStart) self.onStart(); });
  addEventListener('pointermove', e => { if(!drag || !self.enabled || pinching) return;
    pdx += e.clientX - px; pdy += e.clientY - py; px = e.clientX; py = e.clientY; });
  addEventListener('pointerup', () => { if(drag){ drag = false; if(self.onEnd) self.onEnd(); } });
  dom.addEventListener('wheel', e => { if(!self.enabled) return; e.preventDefault();
    lz += e.deltaY > 0 ? .25 : -.25; }, { passive:false });
  dom.addEventListener('touchstart', e => { if(e.touches.length === 2){ pinching = true;
    pd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); } }, { passive:true });
  dom.addEventListener('touchmove', e => { if(!self.enabled || !pinching) return;
    if(e.touches.length === 2){ e.preventDefault();
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if(pd) lz += (pd - d) * .01; pd = d; } }, { passive:false });
  dom.addEventListener('touchend', e => { if(e.touches.length < 2) pinching = false; }, { passive:true });
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  this.update = function(){
    if(!self.enabled) return;
    const o = camera.position.clone().sub(self.target);
    let r = o.length() || 1;
    let th = Math.atan2(o.x, o.z);
    let ph = Math.acos(clamp(o.y / r, -1, 1));
    if(self.autoRotate && !drag) th += self.autoRotateSpeed * .00175;
    const ux = pdx * .2, uy = pdy * .2, uz = lz * .18;
    pdx -= ux; pdy -= uy; lz -= uz;
    th -= ux * .005; ph -= uy * .005; r *= Math.exp(uz * .35);
    th = clamp(th, self.minAzimuthAngle, self.maxAzimuthAngle);
    ph = clamp(ph, self.minPolarAngle, self.maxPolarAngle);
    r = clamp(r, self.minDistance, self.maxDistance);
    camera.position.set(
      self.target.x + r * Math.sin(ph) * Math.sin(th),
      self.target.y + r * Math.cos(ph),
      self.target.z + r * Math.sin(ph) * Math.cos(th));
    camera.lookAt(self.target);
  };
}
function LabelLayer(container){
  const items = [], v = new THREE.Vector3();
  this.add = function(host, x, y, z, el){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;left:0;top:0;will-change:transform';
    wrap.appendChild(el); container.appendChild(wrap);
    items.push({ host, off:new THREE.Vector3(x, y, z), wrap });
    return wrap;
  };
  this.render = function(camera){
    for(const it of items){
      v.copy(it.off).applyMatrix4(it.host.matrixWorld).project(camera);
      if(v.z >= 1){ it.wrap.style.visibility = 'hidden'; continue; }
      it.wrap.style.visibility = 'visible';
      it.wrap.style.transform = 'translate(-50%,-50%) translate('
        + ((v.x * .5 + .5) * innerWidth).toFixed(1) + 'px,'
        + ((-v.y * .5 + .5) * innerHeight).toFixed(1) + 'px)';
    }
  };
}

/* ═══════════ 程序化贴图（John Class 同一套画笔）═══════════ */
function canvasTex(w, h, painter){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  painter(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  SRGB(t);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function jitter(base, amt){
  const [h,s,l] = base;
  return `hsl(${h + (Math.random()-.5)*amt*2},${s + (Math.random()-.5)*8}%,${l + (Math.random()-.5)*amt}%)`;
}
function speckle(ctx,w,h,n,col,a){
  ctx.globalAlpha = a;
  for(let i=0;i<n;i++){ ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(Math.random()*w, Math.random()*h, 1+Math.random()*2.5, 1+Math.random()*1.5, Math.random()*3, 0, 7);
    ctx.fill(); }
  ctx.globalAlpha = 1;
}
// 桌面原木：宽板拼接 + 木纹曲线 + 暖色压光
function deskWoodTexture(){
  return canvasTex(512,512,(ctx,w,h)=>{
    ctx.fillStyle = 'hsl(30,40%,52%)'; ctx.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=86){
      ctx.fillStyle = jitter([30,40,50],5);
      ctx.fillRect(0,y+2,w,82);
      ctx.strokeStyle='rgba(70,42,16,.45)'; ctx.lineWidth=3;
      ctx.strokeRect(-4,y+2,w+8,82);
      for(let i=0;i<7;i++){
        ctx.strokeStyle='rgba(70,42,16,.18)'; ctx.lineWidth=1.4;
        const yy=y+12+Math.random()*64;
        ctx.beginPath(); ctx.moveTo(0,yy);
        ctx.bezierCurveTo(w*.25,yy+5,w*.55,yy-5,w,yy+2); ctx.stroke();
      }
      if(Math.random()<.7){                                  // 木节
        const kx=Math.random()*w, ky=y+20+Math.random()*46;
        ctx.strokeStyle='rgba(70,42,16,.35)';
        for(let r=3;r<11;r+=3.5){ ctx.beginPath(); ctx.ellipse(kx,ky,r*1.5,r,0,0,7); ctx.stroke(); }
      }
    }
    speckle(ctx,w,h,160,'#FFE8C0',.07);
    const g = ctx.createRadialGradient(w*.4,h*.35,60,w*.5,h*.5,w*.75);
    g.addColorStop(0,'rgba(255,220,160,.10)'); g.addColorStop(1,'rgba(60,36,12,.16)');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  });
}
// 深色底座木
function darkWoodTexture(){
  return canvasTex(256,256,(ctx,w,h)=>{
    ctx.fillStyle = 'hsl(26,38%,30%)'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<10;i++){
      ctx.strokeStyle='rgba(20,10,2,.3)'; ctx.lineWidth=1.5;
      const yy=Math.random()*h;
      ctx.beginPath(); ctx.moveTo(0,yy);
      ctx.bezierCurveTo(w*.3,yy+4,w*.6,yy-4,w,yy); ctx.stroke();
    }
    speckle(ctx,w,h,90,'#D9A86A',.06);
  });
}
// 迷你岛草地 / 岩石（沙盘用）
function grassTexture(){
  return canvasTex(128,128,(ctx,w,h)=>{
    ctx.fillStyle = 'hsl(82,42%,56%)'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<24;i++){ ctx.globalAlpha=.18; ctx.fillStyle = jitter([82,46,52],14);
      ctx.beginPath(); ctx.ellipse(Math.random()*w,Math.random()*h,8+Math.random()*16,6+Math.random()*10,Math.random()*3,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    speckle(ctx,w,h,90,'hsl(75,55%,70%)',.3);
  });
}
function rockTexture(){
  return canvasTex(128,128,(ctx,w,h)=>{
    ctx.fillStyle = 'hsl(33,30%,52%)'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<26;i++){ ctx.globalAlpha=.22; ctx.fillStyle = jitter([33,28,46],12);
      ctx.beginPath();
      const x=Math.random()*w, y=Math.random()*h, r=6+Math.random()*14;
      ctx.moveTo(x+r,y);
      for(let a=0;a<6.3;a+=1.05) ctx.lineTo(x+Math.cos(a)*r*(0.7+Math.random()*.5), y+Math.sin(a)*r*(0.7+Math.random()*.5));
      ctx.closePath(); ctx.fill(); }
    ctx.globalAlpha=1;
  });
}
// 迷你城堡石墙（沙盘比例的细密砖）
function miniStoneTexture(){
  return canvasTex(128,128,(ctx,w,h)=>{
    ctx.fillStyle = 'hsl(42,38%,82%)'; ctx.fillRect(0,0,w,h);
    const bh=14;
    for(let row=0; row*bh<h+bh; row++){
      const off = row%2 ? 17 : 0;
      for(let x=-34+off; x<w; x+=34){
        ctx.fillStyle = jitter([42,38,82],5);
        ctx.beginPath(); ctx.roundRect(x+1,row*bh+1,30,bh-2,2); ctx.fill();
        ctx.strokeStyle='hsla(42,30%,40%,.3)'; ctx.lineWidth=1; ctx.stroke();
      }
    }
  });
}
// 信封表面：折线 + 邮票 + 火漆位
function envelopeTexture(stamp){
  return canvasTex(256,170,(ctx,w,h)=>{
    ctx.fillStyle='#FBF3E0'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(184,149,106,.55)'; ctx.lineWidth=3;
    ctx.strokeRect(4,4,w-8,h-8);
    ctx.beginPath(); ctx.moveTo(6,6); ctx.lineTo(w/2,h*.56); ctx.lineTo(w-6,6); ctx.stroke();
    if(stamp){
      ctx.fillStyle='#E8D8B8'; ctx.fillRect(w-58,14,42,32);
      ctx.strokeStyle='#B8956A'; ctx.lineWidth=2; ctx.strokeRect(w-58,14,42,32);
      ctx.fillStyle='#C85A2A'; ctx.font='700 20px Georgia';
      ctx.textAlign='center'; ctx.fillText('J', w-37, 37);
    }
    speckle(ctx,w,h,30,'#C8A870',.12);
  });
}

/* ═══════════ 基础设施 ═══════════ */
const app = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias:true });
const isMobile = matchMedia('(max-width:680px)').matches || 'ontouchstart' in window;
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile?1.5:2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !isMobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
if('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
else renderer.outputEncoding = THREE.sRGBEncoding;
if('useLegacyLights' in renderer) renderer.useLegacyLights = false;
else if('physicallyCorrectLights' in renderer) renderer.physicallyCorrectLights = true;
app.appendChild(renderer.domElement);
const labelLayer = new LabelLayer(document.getElementById('labels'));

const scene = new THREE.Scene();
scene.background = new THREE.Color('#F5EDD8');
scene.fog = new THREE.Fog('#F5EDD8', 22, 48);

const camera = new THREE.PerspectiveCamera(44, innerWidth/innerHeight, .1, 80);
camera.position.set(0, isMobile?6.4:5.3, isMobile?12.6:10.2);

const controls = new OrbitLite(camera, renderer.domElement);
controls.target.set(0, 1.4, -.8);
controls.enableDamping = true; controls.dampingFactor = .07;
controls.enablePan = false;
controls.minDistance = 7.5; controls.maxDistance = 13.5;
controls.minPolarAngle = .85; controls.maxPolarAngle = 1.32;
controls.minAzimuthAngle = -.55; controls.maxAzimuthAngle = .55;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// 暖光：环境 + 黄昏侧光 + 台灯光池
scene.add(new THREE.HemisphereLight('#FFF1D6', '#B89A6A', 1.05));
const dirL = new THREE.DirectionalLight('#FFE6B8', 1.9);   // 晨光：从窗户上方斜射，正面洒在桌面
dirL.position.set(-4, 12, 8);
dirL.target.position.set(0, 0, -1); scene.add(dirL.target);
dirL.castShadow = !isMobile;
dirL.shadow.mapSize.set(1024,1024);
dirL.shadow.camera.left=-14; dirL.shadow.camera.right=14;
dirL.shadow.camera.top=14; dirL.shadow.camera.bottom=-14;
dirL.shadow.bias=-0.0004;
scene.add(dirL);

const mat = (c,r=.9,m=0)=>new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m });
const brass = mat('#B8915A', .38, .5);
function texMat(tex, rx, ry){ const t=tex(); t.repeat.set(rx,ry);
  return new THREE.MeshStandardMaterial({ map:t, roughness:.92 }); }
function M(geo, m, x=0,y=0,z=0){
  const o = new THREE.Mesh(geo, m);
  o.position.set(x,y,z); o.castShadow = true; o.receiveShadow = true;
  return o;
}
function addLabel(g, text, y){
  const div = document.createElement('div');
  div.className='b-label'; div.textContent = text;
  g.userData.label = div;
  g.userData.labelWrap = labelLayer.add(g, 0, y, 0, div);
}

/* ═══════════ 书桌 ═══════════ */
const deskTop = M(new THREE.BoxGeometry(17, .5, 10), texMat(deskWoodTexture, 2, 1.2));
deskTop.position.y = 0; scene.add(deskTop);
scene.add(M(new THREE.BoxGeometry(17, .7, .4), texMat(darkWoodTexture,3,.4), 0, -.55, 4.85));
[[-7.6],[7.6]].forEach(([x])=> scene.add(M(new THREE.BoxGeometry(.55,2.6,.55), texMat(darkWoodTexture,.6,1.6), x,-1.7,4.5)));

/* ═══════════ 房间：背墙 · 大窗 · 窗帘 · 洒进来的阳光 ═══════════ */
const backWall = M(new THREE.BoxGeometry(44, 24, .5), mat('#EFE3C8', 1), 0, 9, -7.3);
backWall.castShadow = false;
scene.add(backWall);
scene.add(M(new THREE.BoxGeometry(44, .2, .56), mat('#D9C8A4', 1), 0, 3.1, -7.28)); // 护墙线
// 大窗（窗外：暖阳天空）

// 用一圈竖直「圆柱褶」拼成有体积、不穿模的窗帘（每根半圆柱即一道褶）
function curtain(x, side){
  const grp = new THREE.Group();
  const W = 2.6, H = 6.9, sx = 36, sy = 24;
  const geo = new THREE.PlaneGeometry(W, H, sx, sy);
  const pos = geo.attributes.position;
  for(let i = 0; i < pos.count; i++){
    const px = pos.getX(i), py = pos.getY(i);
    const u = px / W + .5, v = py / H + .5;            // u:0左→1右  v:0底→1顶
    const gather = .35 + .65 * v;                      // 顶部褶深、底部展开
    // 竖向布褶（多频正弦）
    let zz = (Math.sin(u * Math.PI * 8) * .14 + Math.sin(u * Math.PI * 19) * .04) * gather;
    // 被风轻拂：整幅向内侧鼓出 + 底摆自然飘起，靠窗内侧吹得更开
    const windDir = -side;                             // 朝画面中央(窗内)吹
    zz += windDir * Math.pow(1 - v, 1.6) * .55 * (.5 + .5*u*windDir);
    pos.setZ(i, zz);
    // 底部边缘随风轻摆出弧线
    pos.setX(i, px + windDir * Math.pow(1 - v, 2) * .35);
  }
  geo.computeVertexNormals();
  const mt = curtainMat.clone(); mt.side = THREE.DoubleSide;
  const cloth = new THREE.Mesh(geo, mt);
  cloth.castShadow = true; cloth.receiveShadow = true;
  grp.add(cloth);
  // 顶帘头 + 黄铜挂环
  grp.add(M(new THREE.BoxGeometry(W+.2, .5, .34), mt, 0, H/2+.2, .05));
  for(let r = 0; r <= 8; r++)
    grp.add(M(new THREE.TorusGeometry(.1, .032, 8, 14), brass, -W/2 + r*(W/8), H/2+.42, 0));
  grp.position.set(x, 4.6, -5.8); grp.rotation.y = side * .03;  // z=-5.8 距窗框逾1米，绝无穿模
  scene.add(grp);
}

function buildFrame(tex){
  const img = tex.image;
  const aspect = img && img.width ? img.width/img.height : .72;
  const H = 2.5, W = Math.min(Math.max(H*aspect, 1.5), 2.6);
  const frame = new THREE.Group();
  frame.position.set(4.6, .25, -2.8);
  frame.rotation.y = -.5;
  const body = M(new THREE.BoxGeometry(W+.26, H+.26, .1), texMat(darkWoodTexture,1.2,1.6), 0,(H+.26)/2,0);
  body.rotation.x = -.09; frame.add(body);
  const photo = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshBasicMaterial({ map:tex }));
  photo.position.set(0,(H+.26)/2, .056); photo.rotation.x = -.09; frame.add(photo);
  const stand = M(new THREE.BoxGeometry(.12, H*.75, .06), texMat(darkWoodTexture,.4,1), 0,H*.36,-.42);
  stand.rotation.x = .42; frame.add(stand);
  scene.add(frame);
}

const featherTex = canvasTex(256, 512, (c, w, h) => {
  c.clearRect(0,0,w,h);
  const cx = w/2;
  // 羽毛轮廓内逐行画羽枝（中间宽两端窄，纺锤形）
  for(let y=20; y<h-30; y+=2){
    const f = (y-20)/(h-50);
    const half = Math.sin(f*Math.PI)*w*0.42 + 4;     // 羽毛宽度包络
    const tone = 220 + Math.sin(f*9)*22;
    for(let side of [-1,1]){
      c.strokeStyle = `rgba(${tone|0},${(tone-30)|0},${(tone-90)|0},.9)`;
      c.lineWidth = 1.1;
      c.beginPath(); c.moveTo(cx, y);
      // 羽枝斜向上扫出，末端略带分叉的蓬松感
      const ex = cx + side*half, ey = y - half*0.5;
      c.quadraticCurveTo(cx + side*half*0.5, y - half*0.18, ex, ey);
      c.stroke();
    }
  }
  // 中轴（羽根）
  const g = c.createLinearGradient(cx-3,0,cx+3,0);
  g.addColorStop(0,'#C9A86A'); g.addColorStop(.5,'#F3E6C4'); g.addColorStop(1,'#C9A86A');
  c.strokeStyle = g; c.lineWidth = 5; c.lineCap='round';
  c.beginPath(); c.moveTo(cx, 8); c.lineTo(cx, h-16); c.stroke();
});

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const clickables = [diorama, letters];
const entryStudy = document.getElementById('entryStudy');
const entryTalk = document.getElementById('entryTalk');
let hotG = null, downXY = null, cine = null;
function entryOf(g){ return g===diorama ? entryStudy : entryTalk; }
function pick(e){
  const x = e.clientX ?? e.changedTouches?.[0]?.clientX;
  const y = e.clientY ?? e.changedTouches?.[0]?.clientY;
  ptr.x = (x/innerWidth)*2-1; ptr.y = -(y/innerHeight)*2+1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(clickables, true)[0];
  if(!hit) return null;
  let o = hit.object;
  while(o && !o.userData.kind) o = o.parent;
  return o;
}
function setHot(g){
  if(hotG === g) return;
  if(hotG){ hotG.userData.targetS = 1; hotG.userData.label.classList.remove('hot');
    entryOf(hotG).classList.remove('hot'); }
  hotG = g;
  if(g){ g.userData.targetS = 1.05; g.userData.label.classList.add('hot');
    entryOf(g).classList.add('hot'); }
  document.body.style.cursor = g ? 'pointer' : '';
}
if(matchMedia('(hover:hover)').matches)
  addEventListener('pointermove', e=>{ if(!cine) setHot(pick(e)); });
entryStudy.addEventListener('mouseenter', ()=>{ if(!cine) setHot(diorama); });
entryTalk.addEventListener('mouseenter', ()=>{ if(!cine) setHot(letters); });
entryStudy.addEventListener('mouseleave', ()=>{ if(!cine) setHot(null); });
entryTalk.addEventListener('mouseleave', ()=>{ if(!cine) setHot(null); });
function navigate(href){
  document.getElementById('overlay').classList.add('show');
  setTimeout(()=>location.href = href, 290);
}
const easeIO = t => t*t*(3-2*t);
const tmpV = new THREE.Vector3();
function startCine(kind){
  if(reduceMotion){ navigate(kind==='study' ? 'study.html' : 'teacher.html'); return; }
  controls.enabled = false; setHot(null);
  cine = { kind, t0: clock.getElapsedTime(), fading:false, done:false,
    fromP: camera.position.clone(), fromT: controls.target.clone() };
}
entryStudy.addEventListener('click', e=>{ e.preventDefault(); if(!cine) startCine('study'); });
entryTalk.addEventListener('click', e=>{ e.preventDefault(); if(!cine) startCine('talk'); });
addEventListener('pointerdown', e=>{ if(cine) return; downXY=[e.clientX,e.clientY]; });
addEventListener('pointerup', e=>{
  if(cine || !downXY) return;
  const moved = Math.hypot(e.clientX-downXY[0], e.clientY-downXY[1]);
  downXY = null;
  if(moved > 7) return;
  if(e.target.closest('.entries,.foot,.classic-link,.brand')) return;
  const g = pick(e);
  if(g) startCine(g.userData.kind);
});

/* ═══════════ 渲染循环 ═══════════ */
const clock = new THREE.Clock();
let fr = 0, spinBoost = 0;
function loop(){
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  if(!cine) controls.update();
  // 八音盒自转 + 悬停物件呼吸
  world.rotation.y = t*.14 + spinBoost;
  if(!reduceMotion && window.__feather){ window.__feather.rotation.z = -.5 + Math.sin(t*1.3)*.03; }
  clickables.forEach(g=>{
    const s = g.scale.x + (g.userData.targetS - g.scale.x)*.14;
    g.scale.setScalar(s);
  });
  // 热气
  if(!reduceMotion) steam.forEach(s=>{
    const p = (t*.35 + s.userData.ph) % 1;
    s.position.set(Math.sin((t+s.userData.ph*9)*2)*.05, .42 + p*.55, 0);
    s.material.opacity = .42*(1-p);
    s.scale.setScalar(.7 + p*.9);
  });
  // 入口过场
  if(cine){
    const e = clock.getElapsedTime() - cine.t0;
    if(cine.kind === 'study'){                          // 俯冲扎进沙盘世界
      const k = easeIO(Math.min(e/1.35, 1));
      spinBoost += .012*k;                              // 模型越转越快
      camera.position.lerpVectors(cine.fromP, tmpV.set(-1.7, 2.0, 1.3), k);
      camera.lookAt(-1.7, 1.0, -.7);
      if(k>.7 && !cine.fading){ cine.fading=true;
        document.getElementById('overlay').classList.add('show'); }
      if(e>1.45 && !cine.done){ cine.done=true;
        setTimeout(()=>location.href='study.html', 50); }
    } else {                                            // 信封起飞
      const k = easeIO(Math.min(e/1.05, 1));
      flyer.position.y = k*2.0;
      flyer.position.x = k*.4;
      flyer.rotation.x = -k*.55;
      flyer.rotation.z = k*.3;
      if(k>.62 && !cine.fading){ cine.fading=true;
        document.getElementById('overlay').classList.add('show'); }
      if(e>1.15 && !cine.done){ cine.done=true;
        setTimeout(()=>location.href='teacher.html', 50); }
    }
  }
  if(isMobile && (fr++ & 1)) return;                    // 移动端 30fps
  renderer.render(scene, camera);
  labelLayer.render(camera);
}
loop();
window.__deskReady = true;
setTimeout(()=>{ const l=document.getElementById('loading');
  l.style.opacity=0; setTimeout(()=>l.remove(), 500); }, 350);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
};
</script>
<script>
// ── 引擎加载器 v3：本地优先 → 实测验证过的 CDN；全程可视进度 + 逃生入口 ──
(function(){
  var urls = [
    'libs/three/three.min.js',
    'https://registry.npmmirror.com/three/0.149.0/files/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js',
    'https://cdn.bootcdn.net/ajax/libs/three.js/0.149.0/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js',
    'https://unpkg.com/three@0.149.0/build/three.min.js'
  ];
  var i = 0, st = document.querySelector('#loading .ls');
  function fail(){ location.replace('index-classic.html'); }
  function boot(){ try{ window.__bootDesk(); }catch(e){ console.error(e); fail(); } }
  function next(){
    if(window.THREE){ boot(); return; }
    if(i >= urls.length){ fail(); return; }
    var u = urls[i++];
    if(st) st.textContent = '正在点亮台灯 · 线路 ' + i + '/' + urls.length + ' · v3';
    var s = document.createElement('script'), done = false;
    var tm = setTimeout(function(){ if(done) return; done = true; next(); }, 4000);
    s.onload = function(){ if(done) return; done = true; clearTimeout(tm);
      window.THREE ? boot() : next(); };
    s.onerror = function(){ if(done) return; done = true; clearTimeout(tm); next(); };
    s.src = u; document.head.appendChild(s);
  }
  setTimeout(function(){
    if(!window.THREE && st && !document.getElementById('escGo')){
      var a = document.createElement('div'); a.style.marginTop = '10px';
      a.innerHTML = '<a id="escGo" href="index-classic.html" style="color:#C85A2A;font-weight:600;font-size:12px;text-decoration:none">加载偏慢？点此直接进入 →</a>';
      st.parentNode.appendChild(a);
    }
  }, 6000);
  next();
})();
</script>
