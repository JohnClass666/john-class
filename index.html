<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>John Class</title>
<style>
:root{
  --bg:#FBF6EC;--bg2:#F0E2C4;--bg3:#F6EEDC;
  --ink:#2A1D08;--soft:#8C6B35;--faint:#C2A26C;
  --hair:#E2D0A4;--accent:#AD7A1E;--accent-deep:#7A5414;--accent-soft:#F5E8C8;
  --r-sm:10px;--r-md:16px;--r-lg:22px;
  --fnt:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --fnt-display:Georgia,"Songti SC","STSong",serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);-webkit-font-smoothing:antialiased}

.page{position:relative;height:100vh;height:100dvh;width:100vw;opacity:0;transition:opacity .5s ease;overflow:hidden}
.page.show{opacity:1}
.page.slide-up{transition:transform .28s cubic-bezier(.32,.72,0,1);transform:translateY(-100%)}

/* ── 全屏大图背景：桌面/移动统一 ── */
.bgphoto{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:var(--bg2)}
.bgphoto img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.bgphoto::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(20,12,3,0) 0%,rgba(20,12,3,.02) 50%,rgba(20,12,3,.16) 80%,rgba(20,12,3,.26) 100%)}
.bg-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--accent-soft),var(--accent));color:#FFF8E8;
  font-family:var(--fnt-display);font-size:16px;letter-spacing:.04em}

.panel{position:absolute;inset:0;z-index:1}

/* ── 毛玻璃渐变面：贴着底部，由透明到暖白磨砂，承载所有文字内容，和暖色调照片融在一起 ── */
.glass{position:absolute;left:0;right:0;bottom:0;height:42%;pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(255,250,238,0) 0%,
    rgba(255,250,238,.45) 38%,
    rgba(255,250,238,.78) 68%,
    rgba(255,250,238,.94) 100%)}

/* ── 内容统一收在底部一个紧凑信息条里 ── */
.stage{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  max-width:420px;margin:0 auto;padding:0 24px max(30px,env(safe-area-inset-bottom));z-index:1}

.brand{opacity:0;animation:fadeUp .7s cubic-bezier(.22,1,.36,1) .1s forwards;
  font-family:var(--fnt-display);font-size:14.5px;font-weight:600;letter-spacing:-.005em;
  color:var(--ink);margin-bottom:12px}

.meta-row{opacity:0;animation:fadeUp .7s cubic-bezier(.22,1,.36,1) .2s forwards;
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}

/* 分数：纯文字+图标，不做按钮底 */
.score-text{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--soft)}
.score-text svg{width:14px;height:14px;stroke:var(--accent-deep);flex:0 0 auto}
.score-text b{font-family:var(--fnt-display);font-weight:600;font-size:13.5px;color:var(--ink)}

.right-group{display:flex;align-items:center;gap:12px}

/* John 论坛：纸飞机图标 + 下划线文字，纯链接质感，不是按钮 */
.forum-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-size:12.5px;font-weight:500;color:var(--ink);letter-spacing:.01em;
  -webkit-tap-highlight-color:transparent;transition:opacity .15s ease}
.forum-link svg{width:14px;height:14px;stroke:var(--accent-deep);flex:0 0 auto}
.forum-link span{text-decoration:underline;text-decoration-color:rgba(173,122,30,.45);text-underline-offset:2px}
.forum-link:active{opacity:.6}

/* ── 3D 质感主按钮：全站唯一的按钮，沿用站点原本的棕金渐变 ── */
.cta{opacity:0;animation:fadeUp .7s cubic-bezier(.22,1,.36,1) .3s forwards;
  display:flex;align-items:center;justify-content:center;gap:10px;
  height:58px;border-radius:999px;text-decoration:none;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#C8943C 0%,var(--accent) 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.35) inset,
    0 -6px 12px rgba(75,48,8,.28) inset,
    0 10px 22px rgba(15,9,2,.28),
    0 2px 5px rgba(15,9,2,.22);
  font-family:var(--fnt-display);font-size:17px;font-weight:600;letter-spacing:.01em;
  color:#FFF8E8;transition:transform .16s cubic-bezier(.22,1,.36,1),box-shadow .16s ease;
  -webkit-tap-highlight-color:transparent}
.cta::after{content:'';position:absolute;top:-60%;left:-10%;width:120%;height:80%;
  background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 60%);transform:rotate(-6deg)}
.cta svg{width:19px;height:19px;stroke:#FFF8E8;position:relative;z-index:1}
.cta span{position:relative;z-index:1}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:translateY(1px) scale(.98);
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 -3px 8px rgba(75,48,8,.25) inset,0 4px 10px rgba(15,9,2,.24)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.overlay{position:fixed;inset:0;background:var(--bg);z-index:999;opacity:0;pointer-events:none;transition:opacity .3s ease}
.overlay.show{opacity:1;pointer-events:all}

/* ── 欢迎彩花瞬间（只在「亲学生」首次回归时播放一次） ── */
.splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--bg);animation:wFadeIn .3s ease both}
.splash.out{animation:wFadeOut .6s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
@keyframes wFadeIn{from{opacity:0}to{opacity:1}}
@keyframes wFadeOut{from{opacity:1}to{opacity:0}}
.splash-mark{width:64px;height:64px;border-radius:50%;margin-bottom:22px;
  background:linear-gradient(160deg,var(--accent-soft),var(--accent));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 4px rgba(40,20,5,.1),0 10px 24px rgba(122,84,20,.26);
  animation:splashPop .5s cubic-bezier(.22,1,.36,1) .1s both}
.splash-mark svg{width:30px;height:30px;stroke:#FFF8E8}
.splash-text{font-family:var(--fnt-display);font-size:clamp(22px,4vw,30px);font-weight:600;
  color:var(--ink);text-align:center;line-height:1.5;animation:splashPop .5s cubic-bezier(.22,1,.36,1) .2s both}
.splash-sub{font-size:14px;color:var(--soft);margin-top:10px;text-align:center;
  animation:splashPop .5s cubic-bezier(.22,1,.36,1) .3s both}
@keyframes splashPop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
.splash-stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ss{position:absolute;animation:ssFly 1.2s ease-out forwards}
.ss svg{width:18px;height:18px}
@keyframes ssFly{
  0%{opacity:0;transform:translate(0,0) scale(0) rotate(0deg)}
  30%{opacity:1}
  100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(1.15) rotate(var(--sr))}
}
</style>
</head>
<body>
<div class="overlay" id="ov"></div>

<div class="page" id="mainPage">
  <div class="bgphoto">
    <img src="bg.png" alt="John Class" onerror="this.style.display='none';this.parentElement.innerHTML+='&lt;div class=&quot;bg-ph&quot;&gt;替换为 bg.png&lt;/div&gt;'">
  </div>
  <div class="glass"></div>

  <div class="panel">
    <div class="glass"></div>

    <div class="stage">
      <div class="brand">John Class</div>

      <div class="meta-row">
        <div class="score-text" id="scoreChip" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.2H22l-6 4.4 2.4 7.2L12 16.4 5.6 20.8 8 13.6 2 9.2h7.6z"/></svg>
          <b id="scoreVal">0</b><span>分</span>
        </div>
        <div class="right-group">
          <a class="forum-link" href="teacher.html" onclick="go(event,'teacher.html')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            <span>论坛</span>
          </a>
        </div>
      </div>

      <a class="cta" href="study.html" onclick="go(event,'study.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>开始学习</span>
      </a>
    </div>
  </div>
</div>

<script>
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsRemove(k){try{localStorage.removeItem(k);}catch(e){}}

const NAME_KEY = 'jc_username';

function init() {
  var saved = lsGet(NAME_KEY);
  if(!saved) saved = lsGet('jc_student_name');
  if(!saved) saved = lsGet('jc_reading_name');
  if (saved && saved!=='同学') {
    lsSet(NAME_KEY, saved);
    var showWelcome = lsGet('jc_show_welcome');
    if(showWelcome === '1'){ lsRemove('jc_show_welcome'); }
    showMain(saved, showWelcome === '1');
  } else {
    // 没名字 → 跳到门卫页统一走三问流程
    window.location.href = 'start.html';
  }
}

const STUDENTS = [
  {full:'David', name:'David', en:'David'},
  {full:'Mandy', name:'Mandy', en:'Mandy'},
  {full:'Lisa', name:'Lisa', en:'Lisa'},
  {full:'Simon', name:'Simon', en:'Simon'},
  {full:'Leo', name:'Leo', en:'Leo'},
  {full:'Ethan', name:'Ethan', en:'Ethan'},
  {full:'Daniel',name:'Daniel',en:'Daniel'},
  {full:'夏嘉琦', name:'嘉琦'},
  {full:'谢政勋', name:'政勋'},
  {full:'毛子骁', name:'子骁'},
  {full:'何芷昕', name:'芷昕'},
  {full:'黄颖', name:'黄颖'},
  {full:'易敬桡', name:'敬桡'},
  {full:'雅琪', name:'雅琪'},
  {full:'陈星阁', name:'星阁'},
  {full:'诸葛名丰', name:'名丰'},
  {full:'曹琳茜', name:'琳茜'},
  {full:'张晨露', name:'晨露'},
  {full:'段沐晨', name:'沐晨'},
  {full:'周千皓', name:'千皓'},
  {full:'张艺轩', name:'艺轩'},
  {full:'智皓', name:'智皓'},
  {full:'周宇博', name:'宇博'},
  {full:'高嘉泽', name:'嘉泽'},
  {full:'蒋泽楠', name:'泽楠'},
  {full:'赵昱铭', name:'昱铭'},
  {full:'俊铮', name:'俊铮'},
  {full:'梓熙', name:'梓熙'},
];

function isStudent(input) {
  const s = input.trim();
  return STUDENTS.find(st =>
    s === st.full || s === st.name || (st.en && s.toLowerCase() === st.en.toLowerCase())
  );
}

// 后台同步检测：换设备时从 Supabase 恢复进度
var _syncChecked = false;
function backgroundSync(name){
  if(_syncChecked) return; _syncChecked = true;
  if(lsGet('jc_synced')===name) return;
  var hasLocal = lsGet('grammar_dual_mode') || lsGet('jc_daily_state');
  if(hasLocal){ lsSet('jc_synced', name); return; }
  var SB_URL='https://ghunrrtrdgicbmixsqrc.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdodW5ycnRyZGdpY2JtaXhzcXJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Mzg3OTMsImV4cCI6MjA5NjMxNDc5M30.n3_yRr6iR0gtEo7HSxGWO1jBGs1aaALAchVhqjgnOqs';
  var sbH={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
  setTimeout(async function(){
    try{
      var resp = await Promise.race([
        Promise.all([
          fetch(SB_URL+'/rest/v1/leaderboard?name=eq.'+encodeURIComponent(name)+'&select=score&limit=1', {headers:sbH}),
          fetch(SB_URL+'/rest/v1/reading_progress?user_name=eq.'+encodeURIComponent(name)+'&select=total_completed,saved_ids&limit=1', {headers:sbH}),
          fetch(SB_URL+'/rest/v1/vocab_progress?user_name=eq.'+encodeURIComponent(name)+'&select=progress_data&limit=1', {headers:sbH})
        ]),
        new Promise(function(_, reject){ setTimeout(function(){ reject(new Error('timeout')); }, 4000); })
      ]);
      var data = await Promise.all(resp.map(function(r){ return r.ok ? r.json() : Promise.resolve([]); }));
      var hasData = (data[0].length>0 && data[0][0].score>0) ||
                     (data[1].length>0 && data[1][0].total_completed>0) ||
                     (data[2].length>0 && data[2][0].progress_data);
      if(hasData && confirm(name+'，检测到你在其他设备上有学习记录。\n\n要同步到这个设备吗？')){
        if(data[1].length>0){
          var rp = data[1][0];
          if(rp.saved_ids && rp.saved_ids.length>0) lsSet('jc_reading_saved', JSON.stringify(rp.saved_ids));
          if(rp.total_completed) lsSet('jc_reading_total', rp.total_completed);
        }
        if(data[2].length>0 && data[2][0].progress_data){
          lsSet('jc_vocab_progress_sync', JSON.stringify(data[2][0].progress_data));
        }
        lsSet('jc_synced', name);
        alert('同步完成！欢迎回来 🎉');
      }
      lsSet('jc_synced', name);
    }catch(e){}
  }, 500);
}

function showMain(name, animate) {
  const matched = isStudent(name);
  renderScore();
  // 后台同步检测，不阻塞进入
  backgroundSync(name);
  if (animate) {
    showSplash(name, matched, () => {
      document.getElementById('mainPage').classList.add('show');
    });
  } else {
    document.getElementById('mainPage').classList.add('show');
  }
}

// 分数目前从本地缓存的 vocab 同步数据里试探读取；摸不到就隐藏这一块，
// 不展示编造的 0 分——等接上 vocab.html 真实算分字段后再精确显示。
function renderScore(){
  try{
    var raw = lsGet('jc_vocab_progress_sync');
    if(!raw) return;
    var data = JSON.parse(raw);
    var val = data && (data.points ?? data.score ?? data.totalPoints ?? data.total_points);
    if(typeof val === 'number'){
      document.getElementById('scoreVal').textContent = val;
      document.getElementById('scoreChip').style.display = '';
    }
  }catch(e){}
}

// 简单线性图标星花，配色统一用强调色系，不再是随机多色 emoji
function sparkleIcon(){
  const shapes = [
    '<path d="M12 2l2.4 7.2H22l-6 4.4 2.4 7.2L12 16.4 5.6 20.8 8 13.6 2 9.2h7.6z"/>',
    '<path d="M12 3v18M3 12h18"/>',
    '<circle cx="12" cy="12" r="3"/>',
  ];
  return shapes[Math.floor(Math.random()*shapes.length)];
}

function showSplash(name, isKnown, then) {
  const splash = document.createElement('div');
  splash.className = 'splash';
  if (isKnown) {
    const starsHtml = Array.from({length: 14}, (_, i) => {
      const angle = (i / 14) * 360;
      const dist = 120 + Math.random() * 100;
      const sx = Math.cos(angle * Math.PI/180) * dist + 'px';
      const sy = Math.sin(angle * Math.PI/180) * dist + 'px';
      const sr = (Math.random() * 360) + 'deg';
      const delay = (Math.random() * 0.4).toFixed(2);
      return `<div class="ss" style="left:50%;top:50%;--sx:${sx};--sy:${sy};--sr:${sr};animation-delay:${delay}s">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${sparkleIcon()}</svg>
      </div>`;
    }).join('');
    splash.innerHTML = `
      <div class="splash-stars">${starsHtml}</div>
      <div class="splash-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="splash-text">哇塞，是我的亲学生<br>${name}！</div>
      <div class="splash-sub">欢迎回来，继续加油 💪</div>`;
  } else {
    splash.innerHTML = `
      <div class="splash-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h8M12 8v8"/><circle cx="12" cy="12" r="9"/></svg></div>
      <div class="splash-text">欢迎你，${name}</div>
      <div class="splash-sub">同样欢迎你来学习和分享</div>`;
  }
  document.body.appendChild(splash);
  setTimeout(() => {
    splash.classList.add('out');
    setTimeout(() => {
      splash.remove();
      then();
    }, 600);
  }, 1800);
}

function changeName(){
  if(confirm('要切换成另一个名字吗？\n\n进度和分数不会丢失——换设备输入同一个名字就能找回来。')){
    lsRemove('jc_username');
    window.location.href='start.html';
  }
}
function go(e, href) {
  if(e)e.preventDefault();
  if(href==='study.html'){
    var pg=document.getElementById('mainPage');
    if(pg){
      try{ sessionStorage.setItem('jc_transition','slide-up'); }catch(err){}
      pg.classList.add('slide-up');
      setTimeout(function(){window.location.href=href;},280);
      return;
    }
  }
  var ov=document.getElementById('ov')||document.getElementById('overlay');
  if(!ov){window.location.href=href;return;}
  ov.classList.add('show');
  setTimeout(function(){window.location.href=href;},280);
}

// 最后一道保险：不管上面哪一步出了没预料到的错，都不能让整页空白卡死——
// 至少把主页面显示出来，让访客能正常进站，个性化问候/云同步缺失不影响使用
try{
  init();
}catch(e){
  try{document.getElementById('mainPage').classList.add('show');}catch(e2){}
}
</script>
  <script src="audio.js"></script>
  <script src="bgm-cross.js"></script>
</body>
</html>
