<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Class</title>
<!-- Google Fonts 已移除：大陆被墙导致加载阻塞，改用系统衬线字体 -->
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
height: 100%; overflow: hidden;
background: #F5EDD8; -webkit-font-smoothing: antialiased;
}
.welcome {
position: fixed; inset: 0; z-index: 50;
background: #F5EDD8;
display: flex; align-items: center; justify-content: center;
animation: wFadeIn .6s ease both;
}
.welcome.hide {
animation: wFadeOut .5s cubic-bezier(.4,0,1,1) forwards;
pointer-events: none;
}
@keyframes wFadeIn { from { opacity:0 } to { opacity:1 } }
@keyframes wFadeOut { from { opacity:1 } to { opacity:0 } }
.wc-box {
width: min(420px, 88vw);
text-align: center;
animation: wBoxIn .7s cubic-bezier(.22,1,.36,1) .15s both;
}
@keyframes wBoxIn {
from { opacity:0; transform: translateY(24px) }
to { opacity:1; transform: none }
}
.wc-logo {
font-family: Georgia, "PingFang SC", serif;
font-size: 13px; font-weight: 400;
letter-spacing: .18em; text-transform: uppercase;
color: rgba(160,120,70,.5);
margin-bottom: 48px;
}
.wc-question {
font-family: Georgia, "PingFang SC", serif;
font-size: clamp(22px, 4vw, 30px);
font-weight: 700; color: #2A1E08;
line-height: 1.5; letter-spacing: .01em;
margin-bottom: 8px;
}
.wc-sub {
font-family: Georgia, "PingFang SC", serif;
font-size: 15px; color: rgba(140,100,50,.6);
margin-bottom: 36px; letter-spacing: .02em;
}
.wc-input-wrap { position: relative; margin-bottom: 20px; }
.wc-input {
width: 100%; padding: 16px 20px;
font-family: Georgia, "PingFang SC", serif;
font-size: 17px; color: #2A1E08;
background: rgba(255,255,255,.7);
border: 1.5px solid rgba(184,149,106,.35);
border-radius: 14px; outline: none;
transition: border-color .2s, box-shadow .2s;
text-align: center; letter-spacing: .04em;
}
.wc-input::placeholder { color: rgba(160,120,70,.4); }
.wc-input:focus {
border-color: #B8956A;
box-shadow: 0 0 0 3px rgba(184,149,106,.12);
}
.wc-btn {
width: 100%; padding: 15px;
font-family: Georgia, "PingFang SC", serif;
font-size: 16px; font-weight: 700;
color: #F5EDD8; background: #2A1E08;
border: none; border-radius: 14px;
cursor: pointer; letter-spacing: .06em;
transition: background .2s, transform .15s;
}
.wc-btn:hover { background: #3D2E14; }
.wc-btn:active { transform: scale(.97); }
.wc-btn:disabled { opacity: .4; cursor: default; transform: none; }
.wc-hint {
margin-top: 14px;
font-size: 12px; color: rgba(160,120,70,.45);
font-family: Georgia, "PingFang SC", serif;
letter-spacing: .04em;
}
.welcome-splash {
position: fixed; inset: 0; z-index: 60;
display: flex; flex-direction: column;
align-items: center; justify-content: center;
background: #F5EDD8;
animation: wFadeIn .3s ease both;
}
.welcome-splash.out {
animation: wFadeOut .6s cubic-bezier(.4,0,1,1) forwards;
pointer-events: none;
}
.splash-emoji { font-size: 64px; margin-bottom: 24px; animation: splashPop .5s cubic-bezier(.22,1,.36,1) .1s both; }
.splash-text {
font-family: Georgia, "PingFang SC", serif;
font-size: clamp(22px, 4vw, 32px); font-weight: 700;
color: #2A1E08; text-align: center; line-height: 1.5;
animation: splashPop .5s cubic-bezier(.22,1,.36,1) .2s both;
}
.splash-sub {
font-family: Georgia, "PingFang SC", serif;
font-size: 15px; color: rgba(140,100,50,.6);
margin-top: 10px; text-align: center;
animation: splashPop .5s cubic-bezier(.22,1,.36,1) .3s both;
}
.splash-stars { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.ss { position: absolute; font-size: 20px; animation: ssFly 1.2s ease-out forwards; }
@keyframes ssFly {
0% { opacity: 0; transform: translate(0,0) scale(0) rotate(0deg); }
30% { opacity: 1; }
100% { opacity: 0; transform: translate(var(--sx),var(--sy)) scale(1.2) rotate(var(--sr)); }
}
@keyframes splashPop {
from { opacity: 0; transform: scale(.85) translateY(10px); }
to { opacity: 1; transform: none; }
}
@keyframes shake {
0%,100% { transform: translateX(0) }
20% { transform: translateX(-8px) }
40% { transform: translateX(8px) }
60% { transform: translateX(-5px) }
80% { transform: translateX(5px) }
}
.wc-input.shake { animation: shake .4s ease; border-color: #C0392B; }
.page {
display: flex; height: 100vh; width: 100vw;
opacity: 0; transition: opacity .5s ease;
}
.page.show { opacity: 1; }
.left {
flex: 0 0 58%; height: 100vh;
position: relative; overflow: hidden;
}
.left img {
width: 100%; height: 100%;
object-fit: cover; object-position: center top; display: block;
}
.left::after {
content: ''; position: absolute; top: 0; right: 0;
width: 100px; height: 100%;
background: linear-gradient(to right, transparent, #F5EDD8);
}
.right {
flex: 1; display: flex; flex-direction: column;
justify-content: center;
padding: 0 52px 0 20px;
background: #F5EDD8; position: relative;
}
.brand {
position: absolute; top: 42px; left: 20px;
font-family: Georgia, "PingFang SC", serif;
font-size: 15px; font-weight: 400;
letter-spacing: .06em; color: rgba(160,120,70,.5);
}
.greeting {
position: absolute; top: 42px; right: 52px;
font-family: Georgia, "PingFang SC", serif;
font-size: 13px; color: rgba(160,120,70,.55);
letter-spacing: .04em;
}
.inner { animation: fadeIn .8s cubic-bezier(.22,1,.36,1) .1s both; }
.divider {
width: 32px; height: 1px;
background: rgba(160,120,70,.3); margin-bottom: 32px;
}
.entry {
display: block; text-decoration: none;
margin-bottom: 36px; cursor: pointer; position: relative;
}
.entry:last-of-type { margin-bottom: 0; }
.entry-title {
font-family: Georgia, "PingFang SC", serif;
font-size: clamp(32px, 3.5vw, 46px);
font-weight: 700; color: #2A1E08;
line-height: 1.1; letter-spacing: .01em;
transition: color .2s, transform .2s; display: inline-block;
}
.entry:hover .entry-title { color: #8A6030; transform: translateX(6px); }
.entry-sub {
font-family: Georgia, "PingFang SC", serif;
font-size: clamp(14px, 1.6vw, 18px); font-weight: 400;
color: rgba(140,100,50,.55); margin-top: 4px;
letter-spacing: .02em; transition: color .2s;
}
.entry:hover .entry-sub { color: rgba(140,100,50,.8); }
.entry::before {
content: ''; position: absolute; left: -16px; top: 50%;
transform: translateY(-50%) scaleX(0); transform-origin: left;
width: 8px; height: 2px; background: #8A6030;
border-radius: 1px; transition: transform .2s;
}
.entry:hover::before { transform: translateY(-50%) scaleX(1); }
.foot {
position: absolute; bottom: 40px; left: 20px;
font-family: Georgia, "PingFang SC", serif;
font-size: 13px; color: rgba(160,120,70,.35); letter-spacing: .06em;
}
.overlay {
position: fixed; inset: 0; background: #F5EDD8; z-index: 999;
opacity: 0; pointer-events: none; transition: opacity .3s ease;
}
.overlay.show { opacity: 1; pointer-events: all; }
@keyframes fadeIn {
from { opacity: 0; transform: translateX(20px); }
to { opacity: 1; transform: none; }
}
@media (max-width: 640px) {
html, body { overflow-y: auto; }
.page { flex-direction: column; height: auto; min-height: 100vh; }
.left { flex: none; width: 100%; height: 100vw; max-height: 480px; }
.left::after {
top: auto; bottom: 0; left: 0; right: 0;
width: 100%; height: 80px;
background: linear-gradient(to bottom, transparent, #F5EDD8);
}
.right { flex: none; padding: 32px 36px 64px; }
.brand { position: static; margin-bottom: 8px; display: block; }
.greeting { position: static; display: block; margin-bottom: 24px; }
.foot { position: static; margin-top: 40px; display: block; }
.entry::before { display: none; }
.wc-question { font-size: 22px; }
}
</style>
</head>
<body>
<div class="overlay" id="ov"></div>

<!-- 欢迎屏 -->
<div class="welcome" id="welcome">
  <div class="wc-box">
    <div class="wc-logo">John Class</div>
    <div class="wc-question">你是 John 的亲学生吗？</div>
    <div class="wc-sub">你的名字是什么？</div>
    <div class="wc-input-wrap">
      <input class="wc-input" id="nameInput" type="text"
        placeholder="输入你的名字"
        maxlength="20"
        onkeydown="if(event.key==='Enter')submitName()">
    </div>
    <button class="wc-btn" id="enterBtn" onclick="submitName()">进入 →</button>
    <div class="wc-hint">你的名字只保存在这台设备上</div>
  </div>
</div>

<!-- 主页 -->
<div class="page" id="mainPage">
  <div class="left">
    <img src="bg.png" alt="John Class">
  </div>
  <div class="right">
    <div class="brand">John Class</div>
    <div class="greeting" id="greeting"></div>
    <div class="inner">
      <div class="divider"></div>
      <a class="entry" href="study.html" onclick="go(event,'study.html')">
        <div class="entry-title">英语学习提升</div>
        <div class="entry-sub">单词训练 · 语法冒险</div>
      </a>
      <a class="entry" href="teacher.html" onclick="go(event,'teacher.html')">
        <div class="entry-title">和 John 说说</div>
        <div class="entry-sub">提问 · 炫耀 · 反馈 · 了解</div>
      </a>
    </div>
    <div class="foot">Changsha · 2026　<span onclick="changeName()" style="text-decoration:underline;cursor:pointer;font-size:11px;color:rgba(160,120,70,.5)">切换名字</span></div>
<a href="index-3d.html" onclick="localStorage.setItem('jc_home_mode','3d')" style="position:fixed;right:18px;bottom:18px;z-index:11;font-size:11px;color:#9A8060;text-decoration:none;background:rgba(255,252,245,.7);padding:5px 10px;border-radius:10px;border:1px solid rgba(184,149,106,.25)">🏰 切换3D书房</a>
  </div>
</div>

<script>
const NAME_KEY = 'jc_username';

function init() {
  var saved = localStorage.getItem(NAME_KEY);
  if(!saved) saved = localStorage.getItem('jc_student_name');
  if(!saved) saved = localStorage.getItem('jc_reading_name');
  if (saved && saved!=='同学') {
    localStorage.setItem(NAME_KEY, saved);
    var showWelcome = localStorage.getItem('jc_show_welcome');
    if(showWelcome === '1'){ localStorage.removeItem('jc_show_welcome'); }
    showMain(saved, showWelcome === '1');
  } else {
    // 没名字 → 跳到门卫页统一走三问流程
    window.location.href = 'start.html';
  }
}

const STUDENTS = [
  {full:'David', name:'David', en:'David'},
  {full:'Mandy', name:'Mandy', en:'Mandy'},
  {full:'Lisa', name:'Lisa', en:'Lisa'},
  {full:'Simon', name:'Simon', en:'Simon'},
  {full:'Leo', name:'Leo', en:'Leo'},
  {full:'Ethan', name:'Ethan', en:'Ethan'},
  {full:'Daniel',name:'Daniel',en:'Daniel'},
  {full:'夏嘉琦', name:'嘉琦'},
  {full:'谢政勋', name:'政勋'},
  {full:'毛子骁', name:'子骁'},
  {full:'何芷昕', name:'芷昕'},
  {full:'黄颖', name:'黄颖'},
  {full:'易敬桡', name:'敬桡'},
  {full:'雅琪', name:'雅琪'},
  {full:'陈星阁', name:'星阁'},
  {full:'诸葛名丰', name:'名丰'},
  {full:'曹琳茜', name:'琳茜'},
  {full:'张晨露', name:'晨露'},
  {full:'段沐晨', name:'沐晨'},
  {full:'周千皓', name:'千皓'},
  {full:'张艺轩', name:'艺轩'},
  {full:'智皓', name:'智皓'},
  {full:'周宇博', name:'宇博'},
  {full:'高嘉泽', name:'嘉泽'},
  {full:'蒋泽楠', name:'泽楠'},
  {full:'赵昱铭', name:'昱铭'},
  {full:'俊铮', name:'俊铮'},
  {full:'梓熙', name:'梓熙'},
];

function isStudent(input) {
  const s = input.trim();
  return STUDENTS.find(st =>
    s === st.full || s === st.name || (st.en && s.toLowerCase() === st.en.toLowerCase())
  );
}

function submitName() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name) {
    input.classList.remove('shake');
    void input.offsetWidth;
    input.classList.add('shake');
    setTimeout(() => input.classList.remove('shake'), 400);
    input.focus();
    return;
  }
  localStorage.setItem(NAME_KEY, name);
  showMain(name, true);
}

// 后台同步检测：换设备时从 Supabase 恢复进度
var _syncChecked = false;
function backgroundSync(name){
  if(_syncChecked) return; _syncChecked = true;
  if(localStorage.getItem('jc_synced')===name) return;
  var hasLocal = localStorage.getItem('grammar_dual_mode') || localStorage.getItem('jc_daily_state');
  if(hasLocal){ localStorage.setItem('jc_synced', name); return; }
  var SB_URL='https://ghunrrtrdgicbmixsqrc.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdodW5ycnRyZGdpY2JtaXhzcXJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ2MDYyMTAsImV4cCI6MjA2MDE4MjIxMH0.P5ixZCEYtAkEtFjnHDweVHClLIrFcE2CxHt1eTMyNuQ';
  var sbH={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
  setTimeout(async function(){
    try{
      var resp = await Promise.race([
        Promise.all([
          fetch(SB_URL+'/rest/v1/leaderboard?name=eq.'+encodeURIComponent(name)+'&select=score&limit=1', {headers:sbH}),
          fetch(SB_URL+'/rest/v1/reading_progress?user_name=eq.'+encodeURIComponent(name)+'&select=total_completed,saved_ids&limit=1', {headers:sbH}),
          fetch(SB_URL+'/rest/v1/vocab_progress?user_name=eq.'+encodeURIComponent(name)+'&select=progress_data&limit=1', {headers:sbH})
        ]),
        new Promise(function(_, reject){ setTimeout(function(){ reject(new Error('timeout')); }, 4000); })
      ]);
      var data = await Promise.all(resp.map(function(r){ return r.ok ? r.json() : Promise.resolve([]); }));
      var hasData = (data[0].length>0 && data[0][0].score>0) ||
                     (data[1].length>0 && data[1][0].total_completed>0) ||
                     (data[2].length>0 && data[2][0].progress_data);
      if(hasData && confirm(name+'，检测到你在其他设备上有学习记录。\n\n要同步到这个设备吗？')){
        if(data[1].length>0){
          var rp = data[1][0];
          if(rp.saved_ids && rp.saved_ids.length>0) localStorage.setItem('jc_reading_saved', JSON.stringify(rp.saved_ids));
          if(rp.total_completed) localStorage.setItem('jc_reading_total', rp.total_completed);
        }
        if(data[2].length>0 && data[2][0].progress_data){
          localStorage.setItem('jc_vocab_progress_sync', JSON.stringify(data[2][0].progress_data));
        }
        localStorage.setItem('jc_synced', name);
        alert('同步完成！欢迎回来 🎉');
      }
      localStorage.setItem('jc_synced', name);
    }catch(e){}
  }, 500);
}

function showMain(name, animate) {
  const matched = isStudent(name);
  document.getElementById('greeting').textContent = name + ' 欢迎 👋';
  // 后台同步检测，不阻塞进入
  backgroundSync(name);
  if (animate) {
    showSplash(name, matched, () => {
      document.getElementById('welcome').classList.add('hide');
      setTimeout(() => {
        document.getElementById('welcome').style.display = 'none';
        document.getElementById('mainPage').classList.add('show');
      }, 500);
    });
  } else {
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('mainPage').classList.add('show');
  }
}

function showSplash(name, isKnown, then) {
  const splash = document.createElement('div');
  splash.className = 'welcome-splash';
  if (isKnown) {
    const starsHtml = Array.from({length: 18}, (_, i) => {
      const angle = (i / 18) * 360;
      const dist = 120 + Math.random() * 100;
      const sx = Math.cos(angle * Math.PI/180) * dist + 'px';
      const sy = Math.sin(angle * Math.PI/180) * dist + 'px';
      const sr = (Math.random() * 360) + 'deg';
      const delay = (Math.random() * 0.4).toFixed(2);
      const emojis = ['⭐','✨','🌟','💫','🎉','🎊'];
      const e = emojis[Math.floor(Math.random()*emojis.length)];
      return `<div class="ss" style="left:50%;top:50%;--sx:${sx};--sy:${sy};--sr:${sr};animation-delay:${delay}s">${e}</div>`;
    }).join('');
    splash.innerHTML = `
      <div class="splash-stars">${starsHtml}</div>
      <div class="splash-emoji">🎉</div>
      <div class="splash-text">哇塞，是我的亲学生<br>${name}！</div>
      <div class="splash-sub">欢迎回来，继续加油 💪</div>`;
  } else {
    splash.innerHTML = `
      <div class="splash-emoji">👋</div>
      <div class="splash-text">欢迎你，${name}</div>
      <div class="splash-sub">同样欢迎你来学习和分享</div>`;
  }
  document.body.appendChild(splash);
  setTimeout(() => {
    splash.classList.add('out');
    document.getElementById('welcome').classList.add('hide');
    setTimeout(() => {
      splash.remove();
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('mainPage').classList.add('show');
    }, 600);
  }, 1800);
}

function changeName(){
  if(confirm('要切换成另一个名字吗？\n\n进度和分数不会丢失——换设备输入同一个名字就能找回来。')){
    localStorage.removeItem('jc_username');
    window.location.href='start.html';
  }
}
function go(e, href) {
  if(e)e.preventDefault();
  var ov=document.getElementById('ov')||document.getElementById('overlay');
  if(!ov){window.location.href=href;return;}
  ov.classList.add('show');
  setTimeout(function(){window.location.href=href;},280);
}

init();
</script>
  <script src="audio.js"></script>
  <script src="bgm-cross.js"></script>
</body>
</html>
