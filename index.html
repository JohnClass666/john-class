<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sky:    #87CEEB;
  --gold:   #C9A96E;
  --cream:  #FDF8F0;
  --ink:    #2A1E08;
  --ink2:   #4A3A1A;
  --mid:    #8A7050;
  --white:  #FFFFFF;
  --green:  #4A7C3F;
  --warm:   #E8A030;
  --serif:  'Playfair Display', Georgia, serif;
  --script: 'Caveat', cursive;
  --sans:   'DM Sans', -apple-system, sans-serif;
}

html, body {
  height: 100%;
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── FULL BLEED CANVAS ─────────────────────────────── */
.page {
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow: hidden;
}

/* Layered background — sky gradient + field gradient */
.page::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    /* clouds hint */
    radial-gradient(ellipse 60% 30% at 25% 15%, rgba(255,255,255,.7) 0%, transparent 60%),
    radial-gradient(ellipse 40% 20% at 70% 8%, rgba(255,255,255,.5) 0%, transparent 50%),
    /* sky */
    linear-gradient(180deg,
      #6BB8D4 0%,
      #8ECDE8 18%,
      #AEE0F0 35%,
      #D4F0F8 50%,
      /* horizon glow */
      #F0E8C8 58%,
      /* field */
      #C8DC70 65%,
      #A0C040 75%,
      #78A828 88%,
      #5A8A20 100%
    );
  z-index: 0;
}

/* Mountain silhouette */
.mountain {
  position: fixed;
  bottom: 32%;
  left: 50%;
  transform: translateX(-50%);
  width: 120%;
  height: 300px;
  z-index: 1;
  pointer-events: none;
}
.mountain svg { width: 100%; height: 100%; }

/* Flower field overlay */
.flowers {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  height: 38%;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(circle 4px at 8% 85%, #FF9EC4 0%, transparent 4px),
    radial-gradient(circle 3px at 12% 70%, #FFE066 0%, transparent 3px),
    radial-gradient(circle 5px at 18% 90%, #FF9EC4 0%, transparent 5px),
    radial-gradient(circle 3px at 22% 80%, #FFFFFF 0%, transparent 3px),
    radial-gradient(circle 4px at 28% 95%, #FFD6E8 0%, transparent 4px),
    radial-gradient(circle 6px at 35% 88%, #FF9EC4 0%, transparent 6px),
    radial-gradient(circle 3px at 42% 75%, #FFE066 0%, transparent 3px),
    radial-gradient(circle 5px at 50% 92%, #FFFFFF 0%, transparent 5px),
    radial-gradient(circle 4px at 58% 82%, #FF9EC4 0%, transparent 4px),
    radial-gradient(circle 3px at 65% 70%, #FFD6E8 0%, transparent 3px),
    radial-gradient(circle 5px at 72% 88%, #FFE066 0%, transparent 5px),
    radial-gradient(circle 4px at 80% 78%, #FF9EC4 0%, transparent 4px),
    radial-gradient(circle 6px at 88% 92%, #FFFFFF 0%, transparent 6px),
    radial-gradient(circle 3px at 94% 82%, #FFD6E8 0%, transparent 3px);
}

/* Blossom branch top-right */
.blossom {
  position: fixed;
  top: -20px;
  right: -20px;
  width: 280px;
  height: 220px;
  z-index: 3;
  pointer-events: none;
  opacity: .85;
}

/* Birds */
.birds {
  position: fixed;
  top: 8%;
  left: 15%;
  z-index: 3;
  pointer-events: none;
}
.bird {
  display: inline-block;
  font-size: 14px;
  opacity: .7;
  animation: flutter 4s ease-in-out infinite;
}
.bird:nth-child(2) { margin-left: 12px; animation-delay: .5s; font-size: 10px; }
.bird:nth-child(3) { margin-left: 8px; animation-delay: 1s; font-size: 12px; }
@keyframes flutter {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-8px) rotate(5deg); }
}

/* ── CONTENT ───────────────────────────────────────── */
.content {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 520px;
  padding: 52px 32px 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

/* Top brand */
.brand {
  font-family: var(--script);
  font-size: 22px;
  color: rgba(255,255,255,.9);
  letter-spacing: .04em;
  margin-bottom: 36px;
  text-shadow: 0 1px 8px rgba(0,0,0,.2);
  align-self: flex-start;
}

/* Hero text */
.hero-block {
  text-align: center;
  margin-bottom: 48px;
  margin-top: 8px;
}
.hero-title {
  font-family: var(--script);
  font-size: clamp(36px, 9vw, 52px);
  color: var(--white);
  line-height: 1.2;
  letter-spacing: .01em;
  text-shadow:
    0 2px 12px rgba(0,0,0,.25),
    0 0 40px rgba(255,255,255,.3);
  margin-bottom: 12px;
}
.hero-sub {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 400;
  color: rgba(255,255,255,.82);
  letter-spacing: .12em;
  text-transform: uppercase;
  text-shadow: 0 1px 6px rgba(0,0,0,.2);
}

/* ── MAIN CARD ─────────────────────────────────────── */
.main-card {
  width: 100%;
  background: rgba(255,255,255,.22);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 28px;
  padding: 28px 28px 24px;
  margin-bottom: 16px;
  cursor: pointer;
  text-decoration: none;
  display: block;
  transition: transform .22s, background .22s, box-shadow .22s;
  box-shadow: 0 8px 32px rgba(0,0,0,.08);
}
.main-card:hover {
  transform: translateY(-3px);
  background: rgba(255,255,255,.30);
  box-shadow: 0 16px 48px rgba(0,0,0,.12);
}
.main-card:active { transform: scale(.985); }

.main-card-eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(255,255,255,.7);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.main-card-eyebrow::before {
  content: '';
  display: inline-block;
  width: 24px; height: 1px;
  background: rgba(255,255,255,.6);
}
.main-card-title {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 700;
  color: var(--white);
  line-height: 1.2;
  margin-bottom: 8px;
  text-shadow: 0 1px 8px rgba(0,0,0,.15);
}
.main-card-desc {
  font-size: 13px;
  font-weight: 300;
  color: rgba(255,255,255,.82);
  line-height: 1.6;
  margin-bottom: 18px;
}
.main-card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 18px;
}
.tag {
  font-size: 11px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(255,255,255,.2);
  color: rgba(255,255,255,.9);
  border: 1px solid rgba(255,255,255,.3);
}
.main-card-arrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.arrow-text {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,.9);
}
.arrow-icon {
  width: 36px; height: 36px;
  background: rgba(255,255,255,.25);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .2s, transform .2s;
}
.main-card:hover .arrow-icon {
  background: rgba(255,255,255,.4);
  transform: translateX(3px);
}

/* Featured card (larger) */
.main-card.featured {
  background: rgba(255,255,255,.28);
  border: 1.5px solid rgba(255,255,255,.55);
}

/* ── BETTER CALL JOHN ──────────────────────────────── */
.bcj-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--ink);
  color: var(--cream);
  border: none;
  border-radius: 20px;
  padding: 18px 22px;
  cursor: pointer;
  text-decoration: none;
  margin-top: 8px;
  transition: transform .2s, box-shadow .2s;
  box-shadow: 0 6px 24px rgba(42,30,8,.3);
}
.bcj-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(42,30,8,.35); }
.bcj-btn:active { transform: scale(.985); }

.bcj-left {}
.bcj-title {
  font-family: var(--script);
  font-size: 24px;
  color: var(--gold);
  line-height: 1;
  margin-bottom: 4px;
}
.bcj-desc {
  font-size: 12px;
  font-weight: 300;
  color: rgba(253,248,240,.65);
  line-height: 1.5;
}
.bcj-icon {
  width: 44px; height: 44px;
  background: rgba(201,169,110,.15);
  border: 1px solid rgba(201,169,110,.3);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  transition: background .2s;
}
.bcj-btn:hover .bcj-icon { background: rgba(201,169,110,.25); }

/* ── FOOTER TAG ────────────────────────────────────── */
.foot-tag {
  margin-top: 32px;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.5);
  text-shadow: 0 1px 4px rgba(0,0,0,.15);
}

/* ── PAGE TRANSITION ───────────────────────────────── */
.overlay {
  position: fixed;
  inset: 0;
  background: #FDF8F0;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity .38s ease;
}
.overlay.show { opacity: 1; pointer-events: all; }

/* ── MOBILE ────────────────────────────────────────── */
@media (max-width: 480px) {
  .content { padding: 44px 22px 100px; }
  .hero-title { font-size: 38px; }
  .blossom { width: 200px; height: 160px; }
}

/* Entry animation */
.content > * {
  animation: rise .7s cubic-bezier(.22,1,.36,1) both;
}
.brand          { animation-delay: .05s; }
.hero-block     { animation-delay: .15s; }
.main-card      { animation-delay: .25s; }
.main-card + .main-card { animation-delay: .32s; }
.bcj-btn        { animation-delay: .4s; }
.foot-tag       { animation-delay: .48s; }
@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: none; }
}
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<!-- Sky / nature layers -->
<div class="birds">
  <span class="bird">🐦</span>
  <span class="bird">🐦</span>
  <span class="bird">🐦</span>
</div>

<!-- Mountain -->
<div class="mountain">
  <svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#DDEEF8"/>
        <stop offset="40%" stop-color="#B8D4E8"/>
        <stop offset="100%" stop-color="#8AB8D0"/>
      </linearGradient>
      <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#EEF6FC"/>
      </linearGradient>
    </defs>
    <!-- back mountains -->
    <polygon points="300,300 550,60 800,300" fill="url(#mtn)" opacity=".6"/>
    <polygon points="500,300 700,80 900,300" fill="url(#mtn)" opacity=".8"/>
    <!-- main peak -->
    <polygon points="400,300 650,20 900,300" fill="url(#mtn)"/>
    <!-- snow cap -->
    <polygon points="590,20 650,20 690,80 620,100 580,80" fill="url(#snow)" opacity=".9"/>
    <!-- lake reflection -->
    <ellipse cx="600" cy="290" rx="280" ry="18" fill="rgba(100,180,220,.25)"/>
  </svg>
</div>

<!-- Cherry blossom branch -->
<div class="blossom">
  <svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg">
    <!-- branches -->
    <path d="M280,0 Q220,40 180,80 Q140,120 100,140 Q60,160 20,180" stroke="#8B5E3C" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M180,80 Q200,100 210,130" stroke="#8B5E3C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M140,120 Q110,110 90,90" stroke="#8B5E3C" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M220,40 Q240,60 255,90" stroke="#8B5E3C" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- blossoms -->
    <g opacity=".9">
      <!-- blossom macro helper: 5-petal -->
      <circle cx="165" cy="72" r="14" fill="#FFB7C5" opacity=".8"/>
      <circle cx="165" cy="72" r="5" fill="#FF8FAB"/>
      <circle cx="155" cy="62" r="10" fill="#FFC8D3" opacity=".7"/>
      <circle cx="175" cy="62" r="10" fill="#FFB7C5" opacity=".7"/>

      <circle cx="200" cy="55" r="12" fill="#FFB7C5" opacity=".85"/>
      <circle cx="200" cy="55" r="4" fill="#FF8FAB"/>

      <circle cx="135" cy="108" r="11" fill="#FFC8D3" opacity=".8"/>
      <circle cx="148" cy="100" r="9" fill="#FFB7C5" opacity=".75"/>

      <circle cx="218" cy="42" r="10" fill="#FFC8D3" opacity=".8"/>
      <circle cx="230" cy="32" r="8" fill="#FFB7C5" opacity=".7"/>

      <circle cx="105" cy="132" r="9" fill="#FFC8D3" opacity=".75"/>
      <circle cx="92" cy="125" r="7" fill="#FFB7C5" opacity=".7"/>

      <circle cx="258" cy="85" r="8" fill="#FFC8D3" opacity=".7"/>
      <circle cx="248" cy="75" r="6" fill="#FFB7C5" opacity=".65"/>

      <!-- buds -->
      <ellipse cx="178" cy="128" rx="4" ry="7" fill="#FF8FAB" opacity=".8" transform="rotate(-20,178,128)"/>
      <ellipse cx="122" cy="150" rx="4" ry="7" fill="#FFB7C5" opacity=".7" transform="rotate(10,122,150)"/>
      <ellipse cx="240" cy="50" rx="3" ry="6" fill="#FF8FAB" opacity=".7" transform="rotate(-35,240,50)"/>
    </g>
    <!-- falling petals -->
    <ellipse cx="50" cy="100" rx="5" ry="3" fill="#FFB7C5" opacity=".5" transform="rotate(-30,50,100)"/>
    <ellipse cx="240" cy="160" rx="4" ry="2.5" fill="#FFC8D3" opacity=".45" transform="rotate(20,240,160)"/>
    <ellipse cx="120" cy="200" rx="4" ry="2.5" fill="#FFB7C5" opacity=".4" transform="rotate(-15,120,200)"/>
  </svg>
</div>

<div class="flowers"></div>

<!-- ── MAIN CONTENT ── -->
<div class="content">

  <div class="brand">John Class</div>

  <div class="hero-block">
    <div class="hero-title">Growing Skills<br>Shaping Futures</div>
    <div class="hero-sub">长沙 · 初中英语 · 方法论驱动</div>
  </div>

  <!-- 英语学习提升 -->
  <a class="main-card featured" href="study.html" onclick="transit(event,'study.html')">
    <div class="main-card-eyebrow">核心入口</div>
    <div class="main-card-title">英语学习提升</div>
    <div class="main-card-desc">从词汇到写作，从方法到备考。系统化工具与资料，按自己的节奏进步。</div>
    <div class="main-card-tags">
      <span class="tag">📚 学习工具</span>
      <span class="tag">📖 武林秘籍</span>
      <span class="tag">🎯 期末备考</span>
    </div>
    <div class="main-card-arrow">
      <span class="arrow-text">进入学习 →</span>
      <div class="arrow-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>
    </div>
  </a>

  <!-- Better Call John -->
  <a class="bcj-btn" href="teacher.html" onclick="transit(event,'teacher.html')">
    <div class="bcj-left">
      <div class="bcj-title">Better Call John</div>
      <div class="bcj-desc">联系 John · 学习咨询 · 反馈意见 · 了解课程</div>
    </div>
    <div class="bcj-icon">📞</div>
  </a>

  <div class="foot-tag">John Class · Changsha · 2025</div>

</div>

<script>
function transit(e, href) {
  e.preventDefault();
  const ov = document.getElementById('overlay');
  ov.classList.add('show');
  setTimeout(() => { window.location.href = href; }, 360);
}
</script>
</body>
</html>
