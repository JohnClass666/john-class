<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Class</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── 全屏背景图 ── */
.bg {
  position: fixed;
  inset: 0;
  background: url('bg.png') center center / cover no-repeat;
  z-index: 0;
}

/* 底部渐变遮罩，让按钮区域更清晰 */
.bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    transparent 0%,
    transparent 52%,
    rgba(0,0,0,.18) 70%,
    rgba(0,0,0,.52) 88%,
    rgba(0,0,0,.68) 100%
  );
}

/* ── 内容层 ── */
.page {
  position: relative;
  z-index: 10;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding: 0 28px 52px;
}

/* ── 按钮组 ── */
.btn-group {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* 主按钮 — 英语学习提升 */
.btn-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  background: rgba(255, 255, 255, 0.22);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 22px;
  text-decoration: none;
  cursor: pointer;
  transition: background .2s, transform .18s;
  animation: slideUp .6s cubic-bezier(.22,1,.36,1) both;
  animation-delay: .1s;
}
.btn-main:hover {
  background: rgba(255,255,255,.32);
  transform: translateY(-2px);
}
.btn-main:active { transform: scale(.98); }

.btn-main-left {}
.btn-main-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.75);
  margin-bottom: 5px;
}
.btn-main-title {
  font-size: 22px;
  font-weight: 600;
  color: #ffffff;
  letter-spacing: -.3px;
  text-shadow: 0 1px 8px rgba(0,0,0,.2);
}
.btn-main-sub {
  font-size: 12px;
  font-weight: 400;
  color: rgba(255,255,255,.65);
  margin-top: 4px;
}
.btn-main-arrow {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,.25);
  border: 1px solid rgba(255,255,255,.4);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .2s, transform .2s;
}
.btn-main:hover .btn-main-arrow {
  background: rgba(255,255,255,.4);
  transform: translateX(3px);
}

/* 次按钮 — Better Call John */
.btn-bcj {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 22px;
  background: rgba(20, 14, 6, 0.62);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(201,169,110,.35);
  border-radius: 18px;
  text-decoration: none;
  cursor: pointer;
  transition: background .2s, transform .18s;
  animation: slideUp .6s cubic-bezier(.22,1,.36,1) both;
  animation-delay: .22s;
}
.btn-bcj:hover {
  background: rgba(20,14,6,.78);
  transform: translateY(-2px);
}
.btn-bcj:active { transform: scale(.98); }

.bcj-title {
  font-size: 19px;
  font-weight: 600;
  color: #C9A96E;
  letter-spacing: .01em;
}
.bcj-sub {
  font-size: 12px;
  color: rgba(253,248,240,.5);
  margin-top: 3px;
  font-weight: 300;
}
.bcj-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(201,169,110,.15);
  border: 1px solid rgba(201,169,110,.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
}

/* 底部署名 */
.foot {
  margin-top: 20px;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.38);
  text-align: center;
  animation: slideUp .6s cubic-bezier(.22,1,.36,1) .35s both;
}

/* 页面跳转遮罩 */
.overlay {
  position: fixed;
  inset: 0;
  background: #FDF8F0;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease;
}
.overlay.show { opacity: 1; pointer-events: all; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: none; }
}

/* 手机适配 */
@media (max-width: 430px) {
  .page { padding: 0 20px 44px; }
  .btn-main-title { font-size: 20px; }
  .bcj-title { font-size: 17px; }
}
</style>
</head>
<body>

<div class="overlay" id="ov"></div>
<div class="bg"></div>

<div class="page">
  <div class="btn-group">

    <!-- 英语学习提升 -->
    <a class="btn-main" href="study.html" onclick="go(event,'study.html')">
      <div class="btn-main-left">
        <div class="btn-main-label">核心入口</div>
        <div class="btn-main-title">英语学习提升</div>
        <div class="btn-main-sub">学习工具 · 武林秘籍 · 期末备考</div>
      </div>
      <div class="btn-main-arrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="white" stroke-width="2.5" stroke-linecap="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </div>
    </a>

    <!-- Better Call John -->
    <a class="btn-bcj" href="teacher.html" onclick="go(event,'teacher.html')">
      <div>
        <div class="bcj-title">Better Call John</div>
        <div class="bcj-sub">联系 John · 学习咨询 · 了解课程</div>
      </div>
      <div class="bcj-icon">📞</div>
    </a>

  </div>
  <div class="foot">John Class · Changsha · 2025</div>
</div>

<script>
function go(e, href) {
  e.preventDefault();
  const ov = document.getElementById('ov');
  ov.classList.add('show');
  setTimeout(() => { window.location.href = href; }, 320);
}
</script>
</body>
</html>
