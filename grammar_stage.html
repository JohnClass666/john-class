<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>语法应试 · John Class</title>
<style>
:root{
  --bg:#FBF6EC;--bg2:#F0E2C4;--bg3:#F6EEDC;
  --ink:#2A1D08;--soft:#8C6B35;--faint:#C2A26C;
  --hair:#E2D0A4;--accent:#AD7A1E;--accent-deep:#7A5414;--accent-soft:#F5E8C8;
  --warn:#C2491E;--warn-soft:#FAEEE8;
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-pill:999px;
  --shadow-sm:0 1px 2px rgba(40,24,5,.10);
  --shadow-md:0 3px 10px rgba(40,24,5,.12);
  --shadow-lg:0 10px 28px rgba(40,24,5,.16);
  --fnt:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --fnt-display:Georgia,"Songti SC","STSong",serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--fnt);color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

.photo{position:relative;width:100%;height:56vw;min-height:240px;max-height:380px;overflow:hidden;background:var(--bg2)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.photo::after{content:'';position:absolute;left:0;right:0;bottom:0;height:90px;
  background:linear-gradient(to bottom,transparent,var(--bg))}
.photo-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--accent-soft),var(--accent));color:#FFF8E8;
  font-family:var(--fnt-display);font-size:15px;letter-spacing:.04em}

.content{padding:22px 18px calc(48px + env(safe-area-inset-bottom));position:relative;max-width:560px;margin:0 auto}

.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.nav-brand{font-family:var(--fnt-display);font-size:16px;font-weight:600;letter-spacing:-.01em;
  color:var(--ink);text-decoration:none}
.nav-back{font-size:12px;color:var(--soft);text-decoration:none;display:flex;align-items:center;gap:4px;
  transition:color .2s;background:none;border:none;cursor:pointer;font-family:inherit}
.nav-back:active{opacity:.6}

.page-title{font-family:var(--fnt-display);font-size:clamp(24px,4vw,30px);font-weight:600;
  color:var(--ink);letter-spacing:-.01em;margin-bottom:6px}
.page-sub{font-size:13px;color:var(--soft);margin-bottom:28px}

.slbl{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--faint);
  text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid var(--hair);margin-bottom:18px}

/* ══════ 书架：年级选择卡片，跟 vocab.html 完全一样的"立体精装书"插画 ══════ */
.grd-sgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 2px}
.grd-card{border-radius:20px;overflow:hidden;aspect-ratio:162/228;position:relative;cursor:pointer;
  box-shadow:0 1px 2px rgba(40,20,5,.08),0 4px 10px rgba(40,20,5,.10),
    0 12px 26px rgba(40,20,5,.08),0 20px 40px rgba(40,20,5,.05);
  transition:transform .18s cubic-bezier(.34,1.4,.64,1),box-shadow .18s}
.grd-card svg{position:absolute;inset:0;width:100%;height:100%}
.grd-card:active{transform:scale(.96) translateY(2px);box-shadow:0 2px 6px rgba(40,20,5,.12)}
.jc-sbar{height:14px;background:linear-gradient(180deg,#B07030 0%,#8A4E18 100%);
  box-shadow:0 5px 16px rgba(80,40,10,.25),0 2px 4px rgba(80,40,10,.15);position:relative;margin:0 -2px}
.jc-sbar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,220,120,.55) 30%,rgba(255,220,120,.7) 50%,rgba(255,220,120,.55) 70%,transparent)}
.jc-sgap{height:28px}

/* ══════ 年级列表（点击初中后展开） ══════ */
.stage-detail{display:none}
.stage-detail.show{display:block}
.stage-back{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--soft);
  background:none;border:none;cursor:pointer;font-family:inherit;margin-bottom:18px;padding:0}
.stage-back:active{opacity:.6}
.stage-back svg{width:13px;height:13px}

.sub-list{background:#FFFCF4;border:1px solid rgba(184,149,106,.16);border-radius:var(--r-lg);
  box-shadow:0 1px 2px rgba(40,20,5,.05),0 6px 16px rgba(40,20,5,.08);padding:6px}
.sub-item{display:flex;align-items:center;gap:13px;padding:13px 12px;border-radius:var(--r-md);
  cursor:pointer;transition:background .15s}
.sub-item:active{background:var(--accent-soft)}
.sub-circle{flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  background:var(--bg3);border:1.5px solid var(--hair);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fnt-display);font-size:14px;font-weight:600;color:var(--soft)}
.sub-text{flex:1;min-width:0}
.sub-name{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:2px}
.sub-desc{font-size:11px;color:var(--soft);line-height:1.5}
.badge-live{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:var(--r-sm);flex-shrink:0;
  background:var(--accent-soft);color:var(--accent-deep)}
.badge-soon{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:var(--r-sm);flex-shrink:0;
  background:var(--bg3);color:var(--faint);border:1px solid var(--hair)}
.sub-arrow{flex:0 0 auto;width:14px;height:14px;color:var(--faint)}

/* ══════ 反馈弹窗 ══════ */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(40,24,5,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.show{opacity:1;pointer-events:all}
.modal-box{background:var(--bg);border:1px solid var(--hair);border-radius:var(--r-lg);
  padding:28px 26px;width:min(340px,88vw);box-shadow:var(--shadow-lg);
  animation:mboxIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes mboxIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.modal-ic{width:48px;height:48px;border-radius:50%;margin:0 auto 16px;
  background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
.modal-ic svg{width:22px;height:22px;stroke:var(--accent-deep)}
.modal-title{font-family:var(--fnt-display);font-size:18px;font-weight:600;color:var(--ink);
  text-align:center;margin-bottom:8px}
.modal-body{font-size:13px;color:var(--soft);line-height:1.7;text-align:center;margin-bottom:20px}
.modal-wechat{background:var(--bg3);border:1px solid var(--hair);
  border-radius:var(--r-md);padding:12px 16px;text-align:center;margin-bottom:18px}
.modal-wechat-label{font-size:10px;color:var(--faint);margin-bottom:4px;letter-spacing:.08em;text-transform:uppercase}
.modal-wechat-id{font-family:var(--fnt-display);font-size:17px;font-weight:600;color:var(--accent-deep);letter-spacing:.02em}
.copy-btn{display:block;width:100%;padding:11px;border-radius:var(--r-md);background:var(--accent);
  color:#FFF8E8;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  margin-bottom:8px;transition:transform .12s}
.copy-btn:active{transform:scale(.97)}
.close-btn{display:block;width:100%;padding:10px;border-radius:var(--r-md);background:transparent;
  color:var(--soft);border:1.5px solid var(--hair);font-size:13px;cursor:pointer;font-family:inherit}

#overlay{position:fixed;inset:0;background:var(--bg);z-index:999;opacity:0;pointer-events:none;transition:opacity .26s ease}
#overlay.show{opacity:1;pointer-events:all}

html[data-incoming-slide="1"] .page-wrap{transform:translateY(100%)}
.page-wrap.enter{transition:transform .28s cubic-bezier(.32,.72,0,1);transform:translateY(0)}

.foot{margin-top:36px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:center}

@media (min-width:680px){
  .photo{position:fixed;top:0;left:0;width:42%;height:100vh;min-height:0;max-height:none}
  .photo::after{top:0;bottom:0;left:auto;right:0;width:110px;height:auto;
    background:linear-gradient(to right,transparent,var(--bg))}
  .content{margin-left:42%;max-width:560px;padding:48px 48px calc(60px + env(safe-area-inset-bottom)) 36px}
}
</style>
</head>
<body>

<script>
(function(){
  try{
    if(sessionStorage.getItem('jc_transition')==='slide-up'){
      sessionStorage.removeItem('jc_transition');
      document.documentElement.setAttribute('data-incoming-slide','1');
    }
  }catch(e){}
})();
</script>

<div id="overlay"></div>

<!-- 反馈弹窗：小学/高中/大学/八九年级 共用同一个"建设中"提示 -->
<div class="modal" id="feedbackModal">
  <div class="modal-box">
    <div class="modal-ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M3 7h18M8 21h8M12 17v4"/></svg></div>
    <div class="modal-title">题目还在建设中</div>
    <div class="modal-body" id="modalBody">这个学段的语法真题正在整理中。<br>截图发给 John 老师，告诉他你需要这部分题目！</div>
    <div class="modal-wechat">
      <div class="modal-wechat-label">WeChat · 微信号</div>
      <div class="modal-wechat-id">JiahaoLee6666</div>
    </div>
    <button class="copy-btn" id="copyBtn" onclick="copyWechat()">复制微信号</button>
    <button class="close-btn" onclick="closeModal()">关闭</button>
  </div>
</div>

<div class="page-wrap" id="pageWrap">
<div class="photo">
  <img src="bg.png" alt="John" onerror="this.style.display='none';this.parentElement.innerHTML+='&lt;div class=&quot;photo-ph&quot;&gt;替换为 bg.png&lt;/div&gt;'">
</div>

<div class="content">
  <div class="nav">
    <a class="nav-brand" href="index.html">John Class</a>
    <a class="nav-back" href="grammar_hub.html" onclick="go(event,'grammar_hub.html')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回
    </a>
  </div>

  <!-- 书架视图：四个学段 -->
  <div id="shelfView">
    <div class="page-title">语法应试</div>
    <div class="page-sub">选择学段，开始历年真题专项训练。</div>
    <div class="slbl">选择学段</div>
    <div id="shelves"></div>
  </div>

  <!-- 年级详情视图：初中下的七/八/九年级（点击初中后切换显示） -->
  <div class="stage-detail" id="stageDetail">
    <button class="stage-back" onclick="backToShelf()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回学段选择
    </button>
    <div class="page-title" id="stageDetailTitle">初中</div>
    <div class="page-sub">历年期末真题 · 语境填词专项训练</div>
    <div class="sub-list">
      <div class="sub-item" onclick="go(null,'grammar.html')">
        <div class="sub-circle">7</div>
        <div class="sub-text">
          <div class="sub-name">七年级真题集</div>
          <div class="sub-desc">9套期末语法填空 · 自动批改 · 知识点讲解</div>
        </div>
        <span class="badge-live">已上线</span>
        <svg class="sub-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="sub-item" onclick="showFeedback('八年级')">
        <div class="sub-circle">8</div>
        <div class="sub-text">
          <div class="sub-name">八年级真题集</div>
          <div class="sub-desc">题目整理中 · 截图告知 John 老师</div>
        </div>
        <span class="badge-soon">即将上线</span>
      </div>
      <div class="sub-item" onclick="showFeedback('九年级')">
        <div class="sub-circle">9</div>
        <div class="sub-text">
          <div class="sub-name">九年级真题集</div>
          <div class="sub-desc">题目整理中 · 截图告知 John 老师</div>
        </div>
        <span class="badge-soon">即将上线</span>
      </div>
    </div>
  </div>

  <div class="foot">Growing Skills · Shaping Futures</div>
</div>
</div>

<script>
const WECHAT = 'JiahaoLee6666';

/* ── 学段数据：跟 vocab.html 的 STAGES 概念一致；目前只有初中有内容，
   其余三个学段先以"未开放"状态展示，等内容到位后把 ready 改 true 即可 ── */
const STAGES=[
  {id:"primary",  label:"小学", ready:false},
  {id:"middle",   label:"初中", ready:true},
  {id:"high",     label:"高中", ready:false},
  {id:"college",  label:"大学", ready:false},
];
const stageLabelEn={primary:'PRIMARY',middle:'MIDDLE',high:'HIGH',college:'COLLEGE'};
const stageDesc={primary:'小学语法应试',middle:'初中语法应试',high:'高中语法应试',college:'大学语法应试'};

/* ── 学段书本插画：跟 vocab.html 的 stageBookSVG 完全一致的"立体精装书"手法 ── */
const STAGE_BOOK_COLORS={
 primary:{c0:"#E2C078",c1:"#C99A4E",c2:"#8A5E22"},
 middle: {c0:"#E8C888",c1:"#D9B36A",c2:"#A8763A"},
 high:   {c0:"#C8924A",c1:"#B07A38",c2:"#74481A"},
 college:{c0:"#A0703A",c1:"#8A5E22",c2:"#5A3812"},
};
function stageBookSVG(d){
 const uid="sbk"+Math.floor(Math.random()*1e6);
 const col=STAGE_BOOK_COLORS[d.stageId]||STAGE_BOOK_COLORS.primary;
 return `<svg viewBox="60 46 162 228" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
   <clipPath id="sbkClip_${uid}"><rect x="60" y="58" width="144" height="216" rx="16"/></clipPath>
   <linearGradient id="sbkCover_${uid}" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="${col.c0}"/><stop offset="45%" stop-color="${col.c1}"/><stop offset="100%" stop-color="${col.c2}"/>
   </linearGradient>
   <linearGradient id="sbkSpine_${uid}" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="${col.c2}"/><stop offset="100%" stop-color="${col.c1}"/>
   </linearGradient>
  </defs>
  <rect x="60" y="46" width="162" height="228" fill="${col.c2}"/>
  <rect x="78" y="46" width="144" height="216" rx="16" fill="${col.c2}"/>
  <rect x="72.6" y="49.6" width="144" height="216" rx="16" fill="#D8C794"/>
  <rect x="68.1" y="52.6" width="144" height="216" rx="16" fill="#EDE0BE"/>
  <rect x="63.6" y="55.6" width="144" height="216" rx="16" fill="#FBF3E2"/>
  <rect x="60" y="58" width="144" height="216" rx="16" fill="url(#sbkCover_${uid})"/>
  <rect x="60" y="58" width="144" height="216" rx="16" fill="none" stroke="#6B4812" stroke-width="0.7" opacity="0.4"/>
  <rect x="60" y="58" width="13" height="216" fill="url(#sbkSpine_${uid})" opacity="0.85" clip-path="url(#sbkClip_${uid})"/>
  <rect x="77" y="76" width="108" height="180" rx="6" fill="none" stroke="#FFE9B0" stroke-width="1" opacity="0.4"/>
  <rect x="81" y="80" width="100" height="172" rx="5" fill="none" stroke="#FFE9B0" stroke-width="0.5" opacity="0.3"/>
  <path d="M76,58 L188,58 Q204,58 204,74 L204,90 L76,90 Z" fill="#FFFFFF" opacity="0.10"/>
  <text x="86" y="92" font-family="-apple-system,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.5" fill="#FFE9B0" opacity="0.85">${(d.labelEn||"").toUpperCase()}</text>
  <text x="86" y="200" font-family="Georgia, serif" font-size="44" font-weight="600" fill="#FFF8E8" opacity="0.97">${d.labelCn||""}</text>
  <text x="86" y="248" font-family="-apple-system,sans-serif" font-size="9.5" fill="#FFF8E8" opacity="0.55">${d.subText||""}</text>
 </svg>`;
}

/* 渲染书架：每排 2 本，撑满两排 */
function renderShelves(){
  let shelves='';
  for(let i=0;i<STAGES.length;i+=2){
    const pair=STAGES.slice(i,i+2);
    let cards='';
    pair.forEach(st=>{
      cards+=`<div class="grd-card" data-st="${st.id}">${stageBookSVG({
        labelEn:stageLabelEn[st.id]||'',labelCn:st.label,subText:stageDesc[st.id]||'',stageId:st.id
      })}</div>`;
    });
    shelves+=`<div class="grd-sgrid">${cards}</div><div class="jc-sbar"></div>${i+2<STAGES.length?'<div class="jc-sgap"></div>':''}`;
  }
  document.getElementById('shelves').innerHTML = shelves;
  document.querySelectorAll('.grd-card[data-st]').forEach(c=>{
    c.onclick=()=>{
      const st = STAGES.find(s=>s.id===c.dataset.st);
      if(st.ready){ openStage(st); }
      else{ showFeedback(st.label); }
    };
  });
}

/* 点击已开放学段（初中）：书架整体隐藏，切换到年级详情视图 */
function openStage(st){
  document.getElementById('stageDetailTitle').textContent = st.label;
  document.getElementById('shelfView').style.display = 'none';
  document.getElementById('stageDetail').classList.add('show');
}
function backToShelf(){
  document.getElementById('stageDetail').classList.remove('show');
  document.getElementById('shelfView').style.display = '';
}

function showFeedback(label){
  document.getElementById('modalBody').innerHTML = `${label}的语法真题正在整理中。<br>截图发给 John 老师，告诉他你需要这部分题目！`;
  document.getElementById('feedbackModal').classList.add('show');
}
function closeModal(){
  document.getElementById('feedbackModal').classList.remove('show');
}
function copyWechat(){
  navigator.clipboard.writeText(WECHAT).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ 已复制！';
    setTimeout(() => { btn.textContent = '复制微信号'; }, 2000);
  }).catch(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = WECHAT;
  });
}

function go(e, href) {
  if(e)e.preventDefault();
  var ov = document.getElementById('overlay');
  ov.classList.add('show');
  setTimeout(function(){ window.location.href = href; }, 260);
}

renderShelves();

(function(){
  if(document.documentElement.getAttribute('data-incoming-slide')!=='1') return;
  const wrap = document.getElementById('pageWrap');
  if(!wrap){
    document.documentElement.removeAttribute('data-incoming-slide');
    return;
  }
  var cleaned = false;
  function cleanup(){
    if(cleaned) return;
    cleaned = true;
    document.documentElement.removeAttribute('data-incoming-slide');
  }
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      wrap.classList.add('enter');
    });
  });
  wrap.addEventListener('transitionend', function onEnd(e){
    if(e.propertyName==='transform'){
      cleanup();
      wrap.removeEventListener('transitionend', onEnd);
    }
  });
  setTimeout(cleanup, 420);
})();
</script>
  <script src="audio.js"></script>
  <script src="bgm-cross.js"></script>
</body>
</html>
