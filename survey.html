<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>问卷调查 · John Class</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5EDD8;--paper:#FFFDF6;--ink:#2A1E08;--soft:#9A8060;--gold:#B8956A;--line:rgba(184,149,106,.24);--deep:#2A1E08;--green:#4A7C3F}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.layout{display:flex;min-height:100vh}
.left{position:fixed;top:0;left:0;width:42%;height:100vh;overflow:hidden}
.left img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.left::after{content:'';position:absolute;top:0;right:0;width:90px;height:100%;background:linear-gradient(to right,transparent,var(--bg))}
.right{margin-left:42%;flex:1;min-height:100vh;padding:44px 42px 56px 24px;position:relative}
.right::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 86% 10%,rgba(201,169,110,.08),transparent 42%),radial-gradient(circle at 18% 82%,rgba(120,160,80,.05),transparent 38%);pointer-events:none}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;position:relative;z-index:1}
.brand{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-decoration:none;font-family:'Noto Serif SC',Georgia,serif}
.back{font-size:12px;color:var(--soft);text-decoration:none;display:flex;align-items:center;gap:5px}
.wrap{position:relative;z-index:1;max-width:760px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
h1{font-family:'Noto Serif SC',Georgia,serif;font-size:clamp(28px,4vw,42px);line-height:1.16;font-weight:700;letter-spacing:-.03em;margin-bottom:10px}
.sub{font-size:14px;color:var(--soft);line-height:1.8;max-width:620px;margin-bottom:24px}
.card{background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px;backdrop-filter:blur(5px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:12px;color:var(--soft);margin-bottom:7px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.86);border:1.5px solid rgba(184,149,106,.28);border-radius:12px;outline:none;transition:border-color .18s,box-shadow .18s}
input,select{height:44px;padding:0 12px}
textarea{min-height:92px;resize:vertical;padding:12px 14px;line-height:1.7}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,149,106,.12)}
.q{padding:18px 0;border-top:1px solid rgba(184,149,106,.18)}
.q:first-child{border-top:none;padding-top:0}
.q-title{font-size:15px;font-weight:650;line-height:1.55;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid rgba(184,149,106,.2);border-radius:12px;background:rgba(255,253,246,.62);cursor:pointer;transition:border-color .16s,background .16s}
.opt:hover{border-color:rgba(184,149,106,.45);background:rgba(255,253,246,.9)}
.opt input{width:17px;height:17px;margin-top:1px;accent-color:#7A5414;flex:0 0 auto}
.opt span{font-size:13.5px;line-height:1.55}
.actions{display:flex;gap:10px;align-items:center;margin-top:18px}
.btn{border:none;border-radius:14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;height:48px;padding:0 22px;letter-spacing:.02em;transition:all .18s;display:flex;align-items:center;justify-content:center}
.primary{background:var(--deep);color:#F5EDD8;box-shadow:0 6px 20px rgba(42,30,8,.18)}
.primary:hover{background:#3D2E14;transform:translateY(-1px)}
.ghost{background:rgba(255,255,255,.62);color:var(--ink);border:1.5px solid rgba(184,149,106,.3)}
.ghost:hover{background:rgba(255,255,255,.86);border-color:var(--gold);transform:translateY(-1px);box-shadow:0 6px 20px rgba(42,30,8,.08)}
.btn:active{transform:scale(.97)}
.status{font-size:13px;color:var(--soft);line-height:1.6}
.done{display:none;text-align:center;padding:38px 24px}
.done.on{display:block}
.done-mark{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4A7C3F,#7AA56C);color:#FFFDF6;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.done h2{font-family:'Noto Serif SC',Georgia,serif;font-size:26px;margin-bottom:8px}
.hidden{display:none}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.pill{font-size:12px;color:#7A5414;background:rgba(184,149,106,.12);border:1px solid rgba(184,149,106,.22);border-radius:999px;padding:6px 10px}
.warn{color:#C0392B}
.right>*{animation:fi .6s cubic-bezier(.22,1,.36,1) both}
.nav{animation-delay:.04s}.wrap{animation-delay:.12s}
@keyframes fi{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@media(max-width:760px){.layout{display:block}.left{position:relative;width:100%;height:46vw;min-height:170px;max-height:300px}.left::after{top:auto;bottom:0;left:0;width:100%;height:70px;background:linear-gradient(to bottom,transparent,var(--bg))}.right{margin-left:0;padding:28px 18px 46px}.grid{grid-template-columns:1fr}.card{border-radius:16px;padding:16px}.actions{flex-direction:column;align-items:stretch}.btn{width:100%}}
</style>
</head>
<body>
<div class="layout">
  <div class="left"><img src="bg.png" alt="John Class"></div>
  <main class="right">
    <div class="nav">
      <a class="brand" href="index.html">John Class</a>
      <a class="back" href="index.html" onclick="go(event,'index.html')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回
      </a>
    </div>
    <section class="wrap" id="formWrap">
      <div class="eyebrow">Course Reflection</div>
      <h1>问卷调查</h1>
      <p class="sub">这份问卷用来帮助 John 更了解你的学习目标、课堂感受和下一步需要。选择最接近你的答案就好，没有标准答案。</p>

      <div class="card">
        <div class="grid">
          <div class="field">
            <label for="studentName">你的名字</label>
            <input id="studentName" maxlength="40" placeholder="例如：A / David / 小王">
          </div>
          <div class="field">
            <label for="className">班级或备注</label>
            <input id="className" maxlength="60">
          </div>
          <div class="field">
            <label for="courseType">课程类型</label>
            <select id="courseType" onchange="renderSurvey()">
              <option value="programmer_english">程序员英语小班</option>
              <option value="k12_exam">K12 应试提升</option>
              <option value="oral_growth">能力提升 / 口语表达</option>
            </select>
          </div>
          <div class="field">
            <label for="surveyStage">问卷阶段</label>
            <select id="surveyStage" onchange="renderSurvey()">
              <option value="start">开课第一天</option>
              <option value="finish">结课最后一天</option>
            </select>
          </div>
        </div>
      </div>

      <div class="pill-row" id="surveyTags"></div>
      <form class="card" id="surveyForm"></form>
      <div class="actions">
        <button class="btn primary" id="submitBtn" onclick="submitSurvey(event)">提交问卷</button>
        <button class="btn ghost" onclick="resetSurvey(event)">重新选择</button>
        <div class="status" id="statusText"></div>
      </div>
    </section>

    <section class="wrap done" id="doneWrap">
      <div class="card">
        <div class="done-mark">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h2>已经收到</h2>
        <p class="sub" id="doneText">谢谢你认真填写。John 会根据这些内容调整课程。</p>
        <button class="btn primary" onclick="go(null,'index.html')">回到首页</button>
      </div>
    </section>
  </main>
</div>

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function currentQuestions(){return SURVEYS[courseType.value][surveyStage.value];}
function renderSurvey(){
  var type=courseType.value, stage=surveyStage.value, qs=currentQuestions();
  surveyTags.innerHTML=SURVEYS[type].tags.concat([STAGE_LABELS[stage]]).map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('');
  surveyForm.innerHTML=qs.map(function(q,i){
    var title='<div class="q-title">'+(i+1)+'. '+esc(q[0])+'</div>';
    if(q[2]==='open') return '<div class="q">'+title+'<textarea id="q'+i+'" maxlength="500" placeholder="写一两句话就好，John 会认真看。"></textarea></div>';
    return '<div class="q">'+title+'<div class="opts">'+q[1].map(function(opt,j){
      return '<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"><span>'+esc(opt)+'</span></label>';
    }).join('')+'</div></div>';
  }).join('');
  statusText.textContent='';
  try{localStorage.setItem('jc_survey_type',type);localStorage.setItem('jc_survey_stage',stage);}catch(e){}
}
function restore(){
  var saved=localStorage.getItem('jc_username')||localStorage.getItem('jc_student_name')||localStorage.getItem('jc_reading_name')||'';
  studentName.value=saved&&saved!=='同学'?saved:'';
  var t=localStorage.getItem('jc_survey_type'), s=localStorage.getItem('jc_survey_stage');
  if(t&&SURVEYS[t]) courseType.value=t;
  if(s&&(s==='start'||s==='finish')) surveyStage.value=s;
  renderSurvey();
}
function collectAnswers(){
  var qs=currentQuestions();
  return qs.map(function(q,i){
    if(q[2]==='open') return {question:q[0],dimension:q[2],text:document.getElementById('q'+i).value.trim()};
    var picked=document.querySelector('input[name="q'+i+'"]:checked');
    if(!picked) return null;
    var idx=Number(picked.value);
    return {question:q[0],dimension:q[2],score:idx+1,choice:q[1][idx],choice_index:idx};
  });
}
function validate(answers){
  if(!studentName.value.trim()) return '请先填写你的名字。';
  for(var i=0;i<answers.length;i++){ if(!answers[i]) return '第 '+(i+1)+' 题还没有选择。'; }
  return '';
}
async function submitSurvey(e){
  if(e)e.preventDefault();
  var answers=collectAnswers();
  var msg=validate(answers);
  if(msg){statusText.innerHTML='<span class="warn">'+msg+'</span>';return;}
  var btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='提交中...';statusText.textContent='正在保存你的问卷。';
  var payload={
    student_name:studentName.value.trim(),
    class_name:className.value.trim(),
    course_type:courseType.value,
    survey_stage:surveyStage.value,
    answers:answers,
    open_answer:(answers.find(function(a){return a.dimension==='open';})||{}).text||'',
    created_at:new Date().toISOString()
  };
  try{
    var res=await fetch(SB_URL+'/rest/v1/survey_responses',{
      method:'POST',
      headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify(payload)
    });
    if(!res.ok) throw new Error(res.status);
    localStorage.setItem('jc_username',payload.student_name);
    formWrap.classList.add('hidden');
    doneWrap.classList.add('on');
    doneText.textContent=surveyStage.value==='finish'?'谢谢你完成这次阶段复盘。下一步不是从零开始，而是在已经做到的基础上继续提高。':'谢谢你认真填写。John 会根据这些内容安排更适合你的课堂。';
  }catch(err){
    statusText.innerHTML='<span class="warn">保存失败。可能是 Supabase 还没有创建 survey_responses 表。</span>';
    btn.disabled=false;btn.textContent='提交问卷';
  }
}
function resetSurvey(e){if(e)e.preventDefault();surveyForm.reset();statusText.textContent='已清空当前选择。';}
function go(e,href){if(e)e.preventDefault();window.location.href=href;}
restore();
</script>
