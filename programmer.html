<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>程序员专区 · John Class</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#F5EDD8;color:#2A1E08;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px}
.wrap{width:100%;max-width:480px}
.back-link{font-size:12px;color:#B5A080;text-decoration:none;display:block;margin-bottom:24px}
.back-link:hover{color:#2A1E08}
.logo{font-size:11px;letter-spacing:.18em;color:#B5A080;font-weight:600;margin-bottom:32px}
.hero{margin-bottom:32px}
.hero-icon{font-size:44px;margin-bottom:12px}
.hero-title{font-size:26px;font-weight:700;color:#2A1E08;margin-bottom:6px}
.hero-sub{font-size:13px;color:#8A7050;line-height:1.7}
.sec-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#B8956A;padding-bottom:8px;border-bottom:1px solid rgba(184,149,106,.2);margin-bottom:4px}
.tool-list{margin-bottom:28px}
.tool-item{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid rgba(184,149,106,.1);text-decoration:none;color:#2A1E08;cursor:pointer;transition:transform .15s}
.tool-item:last-child{border-bottom:none}
.tool-item:hover{transform:translateX(4px)}
.tool-item:active{opacity:.7}
.tool-item.disabled{opacity:.45;cursor:default;pointer-events:none}
.tool-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.c-green{background:rgba(60,150,90,.12);border:1.5px solid rgba(60,150,90,.22)}
.c-blue{background:rgba(74,124,184,.12);border:1.5px solid rgba(74,124,184,.22)}
.c-orange{background:rgba(200,140,50,.12);border:1.5px solid rgba(200,140,50,.22)}
.c-gold{background:rgba(201,169,110,.14);border:1.5px solid rgba(201,169,110,.28)}
.tool-info{flex:1}
.tool-name{font-size:15px;font-weight:700;margin-bottom:2px}
.tool-desc{font-size:12px;color:#8A7050;line-height:1.5}
.tool-badge{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:10px;flex-shrink:0}
.badge-live{background:rgba(60,150,90,.12);color:#1A4A28;border:1px solid rgba(60,150,90,.2)}
.badge-soon{background:rgba(184,149,106,.1);color:#B8956A;border:1px solid rgba(184,149,106,.2)}
.arrow{color:rgba(184,149,106,.4);flex-shrink:0}
/* score card */
.score-card{background:rgba(255,252,245,.9);border:1.5px solid rgba(184,149,106,.2);border-radius:14px;padding:18px 20px;margin-bottom:28px}
.score-card-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:#B5A080;text-transform:uppercase;margin-bottom:12px}
.score-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.score-row:last-child{margin-bottom:0}
.score-name{font-size:13px;color:#6A5040}
.score-val{font-size:15px;font-weight:700;color:#2A1E08}
.score-total{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid rgba(184,149,106,.15);margin-top:4px}
.score-total-lbl{font-size:12px;font-weight:700;color:#2A1E08}
.score-total-val{font-size:20px;font-weight:700;color:#C85A2A}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="study.html">← 返回学习中心</a>
  <div class="logo">JOHN CLASS · 程序员专区</div>
  <div class="hero">
    <div class="hero-icon">💻</div>
    <div class="hero-title">码神训练营</div>
    <div class="hero-sub">针对 EveryMatrix 职场英语<br>发音 · 口语 · 闯关拿分</div>
  </div>

  <!-- 个人积分 -->
  <div class="score-card" id="scoreCard">
    <div class="score-card-title">⚡ 我的码神积分</div>
    <div class="score-row">
      <span class="score-name">🎤 发音跟读</span>
      <span class="score-val" id="speakScore">—</span>
    </div>
    <div class="score-row">
      <span class="score-name">💬 口语填空</span>
      <span class="score-val" id="oralScore">—</span>
    </div>
    <div class="score-total">
      <span class="score-total-lbl">本周总分</span>
      <span class="score-total-val" id="totalScore">—</span>
    </div>
  </div>

  <div class="sec-label">训练模块</div>
  <div class="tool-list">
    <a class="tool-item" href="programmer-pronunciation.html">
      <div class="tool-circle c-green">🎤</div>
      <div class="tool-info">
        <div class="tool-name">发音跟读</div>
        <div class="tool-desc">朗读职场句子 · 词级评分 · 闯关100句</div>
      </div>
      <span class="tool-badge badge-live">已上线</span>
      <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
    <a class="tool-item" href="programmer-oral.html">
      <div class="tool-circle c-blue">💬</div>
      <div class="tool-info">
        <div class="tool-name">口语填空</div>
        <div class="tool-desc">看中文说英文 · 挖空70%+ · 闯关100句</div>
      </div>
      <span class="tool-badge badge-live">已上线</span>
      <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
    <div class="tool-item disabled">
      <div class="tool-circle c-gold">📚</div>
      <div class="tool-info">
        <div class="tool-name">词汇训练</div>
        <div class="tool-desc">程序员高频词 · 分级闯关</div>
      </div>
      <span class="tool-badge badge-soon">即将上线</span>
    </div>
    <a class="tool-item" href="#" onclick="showBoard();return false">
      <div class="tool-circle c-orange">🏆</div>
      <div class="tool-info">
        <div class="tool-name">码神排行榜</div>
        <div class="tool-desc">本周码神 · 联动学神总榜</div>
      </div>
      <span class="tool-badge badge-live">本周榜</span>
      <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
</div>

<!-- 排行榜 overlay -->
<div id="boardOverlay" style="display:none;position:fixed;inset:0;background:#F5EDD8;z-index:50;overflow-y:auto;padding:28px 20px">
  <div style="max-width:480px;margin:0 auto">
    <a href="#" onclick="hideBoard();return false" style="font-size:12px;color:#B5A080;text-decoration:none;display:block;margin-bottom:24px">← 返回</a>
    <div style="font-size:11px;letter-spacing:.18em;color:#B5A080;font-weight:600;margin-bottom:28px">JOHN CLASS · 码神排行榜</div>
    <div style="font-size:22px;font-weight:700;margin-bottom:4px">🏆 本周码神</div>
    <div style="font-size:12px;color:#B5A080;margin-bottom:20px">发音 + 口语 · 每句 25 分 · 满分 5000</div>
    <div id="boardList"><div style="font-size:13px;color:#B5A080;padding:20px;text-align:center">加载中...</div></div>
  </div>
</div>

<script>
var SB_URL = 'https://ghunrrtrdgicbmixsqrc.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdodW5ycnRyZGdpY2JtaXhzcXJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ2MDYyMTAsImV4cCI6MjA2MDE4MjIxMH0.P5ixZCEYtAkEtFjnHDweVHClLIrFcE2CxHt1eTMyNuQ';

function sbHeaders(){ return {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'}; }
function getWeekStart(){ var d=new Date(); d.setDate(d.getDate()-d.getDay()); return d.toISOString().split('T')[0]; }

async function sbGet(table,qs){
  try{ var r=await fetch(SB_URL+'/rest/v1/'+table+'?'+qs,{headers:sbHeaders()}); return r.ok?await r.json():[]; }catch(e){ return []; }
}

async function loadMyScore(){
  var name = localStorage.getItem('jc_username')||localStorage.getItem('jc_student_name');
  if(!name) return;
  var rows = await sbGet('weekly_scores','user_name=eq.'+encodeURIComponent(name)+'&week_start=eq.'+getWeekStart()+'&select=programmer_score');
  var ps = rows&&rows.length ? (rows[0].programmer_score||0) : 0;
  // speaking and oral each tracked via separate localStorage keys for display
  var spk = parseInt(localStorage.getItem('jc_prog_speak_pts')||'0');
  var oral = parseInt(localStorage.getItem('jc_prog_oral_pts')||'0');
  document.getElementById('speakScore').textContent = spk + ' 分';
  document.getElementById('oralScore').textContent = oral + ' 分';
  document.getElementById('totalScore').textContent = ps + ' 分';
}

async function loadBoard(){
  var rows = await sbGet('weekly_scores','week_start=eq.'+getWeekStart()+'&select=user_name,programmer_score&order=programmer_score.desc&limit=15');
  var el = document.getElementById('boardList');
  var valid = (rows||[]).filter(function(r){ return (r.programmer_score||0)>0; });
  if(!valid.length){ el.innerHTML='<div style="font-size:13px;color:#B5A080;padding:20px;text-align:center">本周还没有人上榜，快去练习！</div>'; return; }
  el.innerHTML = valid.map(function(r,i){
    var medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
    var pct = Math.round((r.programmer_score||0)/5000*100);
    return '<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(255,252,245,.88);border-radius:10px;margin-bottom:8px">'
      +'<div style="font-size:16px;width:28px;text-align:center;flex-shrink:0">'+medal+'</div>'
      +'<div style="flex:1"><div style="font-size:15px;font-weight:600">'+r.user_name+'</div>'
      +'<div style="margin-top:4px;height:4px;background:rgba(42,30,8,.08);border-radius:2px;overflow:hidden"><div style="height:4px;background:#C85A2A;border-radius:2px;width:'+pct+'%"></div></div></div>'
      +'<div style="font-size:14px;font-weight:700;color:#C85A2A;flex-shrink:0">'+(r.programmer_score||0)+'</div>'
      +'</div>';
  }).join('');
}

function showBoard(){ document.getElementById('boardOverlay').style.display='block'; loadBoard(); }
function hideBoard(){ document.getElementById('boardOverlay').style.display='none'; }

loadMyScore();
</script>
</body>
</html>
