<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>欢迎 · John Class</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#F5EDD8;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;color:#2A1E08}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:28px 20px}
.card{width:100%;max-width:420px;text-align:center}
.logo{font-size:11px;letter-spacing:.18em;color:#B5A080;font-weight:600;margin-bottom:40px}
.emoji{font-size:48px;margin-bottom:12px;line-height:1}
.title{font-size:22px;font-weight:700;margin-bottom:8px;color:#2A1E08}
.sub{font-size:13px;color:#8A7050;line-height:1.7;margin-bottom:24px}
.inp{width:100%;padding:14px 16px;background:rgba(255,252,245,.9);border:1.5px solid rgba(42,30,8,.2);border-radius:14px;font-size:17px;font-family:inherit;color:#2A1E08;outline:none;text-align:center;margin-bottom:16px}
.inp:focus{border-color:#2A1E08}
.btn{display:block;width:100%;padding:16px;background:#2A1E08;color:#F5EDD8;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:10px}
.btn:active{opacity:.8}
.btn-ghost{display:block;width:100%;padding:14px;background:transparent;color:#7A6040;border:1.5px solid rgba(42,30,8,.2);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-ghost:active{opacity:.7}
</style>
</head>
<body>
<div class="card">
  <div class="logo">JOHN CLASS</div>
  <div class="emoji">🤔</div>
  <div class="title">你是 John 的亲学生吗？</div>
  <div class="sub">请输入你的名字</div>
  <input class="inp" id="nameInp" type="text" placeholder="输入你的名字" maxlength="20" autocomplete="off">
  <button class="btn" onclick="enter()">开始学习 →</button>
</div>

<script>
(function(){
  var prefill = '';
  var oldKeys = ['jc_reading_name','jc_username','vocab_name','jc_name'];
  for(var i=0; i<oldKeys.length; i++){
    var v = localStorage.getItem(oldKeys[i]);
    if(v && v.trim() && v!=='同学'){ prefill = v.trim(); break; }
  }
  if(prefill){ document.getElementById('nameInp').value = prefill; }
})();

function enter(){
  var name = document.getElementById('nameInp').value.trim();
  if(!name){ alert('请输入你的名字'); return; }
  localStorage.setItem('jc_username', name);
  window.location.href = 'index.html';
}

document.getElementById('nameInp').addEventListener('keydown',function(e){
  if(e.key==='Enter') enter();
});
</script>
  <script src="audio.js"></script>
  <script src="bgm-cross.js"></script>
</body>
</html>
